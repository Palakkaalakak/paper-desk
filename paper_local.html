 the portfolio.\r\n- Names: **Monster Beverage** (high growth exception), **Celsius** (up-and-coming energy drink in the health niche — an exception with high growth), **PepsiCo** (very low growth), **Coca-Cola** (very low growth), **Walmart**, **Costco**, **Hershey's**, **McDonald's**.\r\n\r\n##### Utilities — ETF **XLU**\r\n- Electricity, gas and utilities to residential homes and organisations.\r\n- **Generally he does not touch utilities.** Demand for electricity grows **less than 2% per year** — very low growth. People buy them for **dividends, not growth**. Fairly defensive.\r\n- **Underperforms the S&P 500** long run → avoided.\r\n- **AI-driven exception:** demand for energy to drive **data centres** means some utilities are now growing **double digits** — specifically **IPPs (Independent Power Producers)** which can set their own market price.\r\n  - IPP names: **Constellation Energy, Vistra, Talen Energy, NRG Energy.**\r\n  - Problem: at time of recording many are **quite overvalued** and lack a consistent profit track record → **he doesn't own them individually; he owns them via an ETF, ticker AIPO.**\r\n- **Regulated utilities** — price set by the state government → very low growth → **avoids these**: **NextEra Energy, Southern Company.**\r\n\r\n**Defensive summary:** buys a lot of **healthcare**, some **consumer staples**, generally **no utilities**.\r\n\r\n#### 7.2 CYCLICAL SECTORS (5)\r\n\r\n##### Basic Materials / Commodities\r\n- Chemicals, building materials, paper; commodity exploration and processing — gold, silver, steel, aluminium, fertilizer.\r\n- Names: **Steel Dynamics, Nucor, Alcoa, DuPont, Freeport, Linde.**\r\n- **Avoids the sector.** Reasons:\r\n  1. Revenue and profits are **tied to commodity prices** → very unpredictable, very cyclical. He wants **consistency and predictability**.\r\n  2. **Very low profit margins** (heavy competition).\r\n  3. **Lower return on equity.**\r\n  4. **High debt / highly leveraged.**\r\n- Underperforms the S&P long run.\r\n- **Exception he owns: Linde PLC (LIN)** — industrial gas. They **do not mine** the gas; they **produce industrial gas in a factory**, so the price is **not affected by normal commodity cyclicality** → the company is predictable despite the sector label.\r\n\r\n##### Energy\r\n- Oil and gas, oil field services and equipment, coal.\r\n- Names: **ConocoPhillips, Chevron, British Petroleum, ExxonMobil.**\r\n- **Stays away.** Share prices are very up and down over the long run and very unpredictable — e.g. big years when Middle East conflict pushes oil prices up; collapse when oil prices fall (COVID).\r\n- Verdict: **good for speculation / swing trading / short-term momentum trading — not for long-term investing.** Underperforms S&P long run.\r\n\r\n##### Financials — *the one cyclical sector he focuses on*\r\n- Includes banks, savings & loans, asset management, credit services, brokerage firms, financial ratings and analytics firms, payment technology companies, insurance companies.\r\n- Sector is cyclical overall; growth generally **high single digits**, not double digits — **but** some **fintech** names do have high growth rates, and some companies within it are far less cyclical.\r\n- **Banks — be careful.** Banks are **very highly leveraged** and **could easily go to zero** if they carry toxic assets on the balance sheet, which is very hard to detect unless you are a professional bank analyst.\r\n  - Avoids **regional banks**.\r\n  - Would only consider **top global banks** at a good price: **JP Morgan, Goldman Sachs**.\r\n  - **Big fan of the three Singapore banks** — very conservative, very good dividends: **DBS, UOB, OCBC**.\r\n- **Asset managers:** \"okay, not bad investments\" — high single digit, worth buying when undervalued. Two main ones: **Blackstone** and **BlackRock**. He used to own them; **currently owns neither.**\r\n- **His favourite financial sub-group: financial ratings & analytics companies and companies that own stock exchanges** — these are **\"toll-booth\" companies**, monopolistic, little or no competition in their region.\r\n  - Favourites: **S&P Global**, **MSCI**.\r\n- **Payment technology favourites: Visa and MasterCard.**\r\n- **Insurance:** likes the strong ones. One of the strongest insurers in the world: **Chubb**. Also **Arch Capital (ACGL)**.\r\n\r\n##### Real Estate — *avoids the entire sector*\r\n- Includes mortgage companies, property management companies, and **REITs**.\r\n- Why avoided: **high debt, low profit margins, no strong economic moats, weak return on equity** (very competitive sector). Worst long-run underperformer versus S&P among the sectors shown.\r\n- Names: **Regency Centers Corp, Extra Space Storage, Iron Mountain, SL Green/\"SX\" Property Trust.**\r\n- **REIT exception — dividends only, never capital gain**, and **only Singapore-listed REITs**:\r\n  - Singapore REITs have among the **highest dividend yields in the world** and the **dividend is tax free**.\r\n  - **US-listed REITs: 30% withholding tax on dividends** → doesn't make sense after tax; they also carry much **higher leverage/debt**.\r\n\r\n##### Industrials\r\n- Machinery, tools, industrial products; includes **aerospace & defense**, transportation, logistics services.\r\n- Generally avoided/underweighted: **higher debt, lower profit margins, weaker economic moats.** Only **2%** of his portfolio.\r\n- Big names, but too cyclical with inconsistent profits → he doesn't like to hold: **Deere (DE), Honeywell (HON), Caterpillar (CAT).**\r\n- **The rare industrials he DOES own:**\r\n  - **Waste Management** — clears waste; very predictable, very consistent profits and revenues.\r\n  - **Pool Corporation** — largest manufacturer and wholesale distributor of swimming pools and pool maintenance in the US.\r\n  - **Copart (CPRT)** — leading vehicle auction / salvage company.\r\n  - **Lockheed Martin** named as a leading military defense company (also **Raytheon**, **General Dynamics**) — but **he does not own them right now**.\r\n\r\n**Cyclical summary:** of the 5 cyclical sectors he focuses mainly on **Financials**; buys a bit of the rest, but not much.\r\n\r\n#### 7.3 GROWTH / MODERATELY CYCLICAL SECTORS (3) — the majority of his buying\r\n\r\n> \"The majority of stocks that I buy are not from the defensive sector, not from the cyclical sector, but from the growth sectors.\" Revenues and profits stay more consistent whether in recession or boom.\r\n\r\n##### Technology — ETF **XLK** — **highest long-run growth of all sectors; his biggest holding at 27%**\r\n- Design, development and support of computer applications; manufacture of computer equipment and components.\r\n- Names he owns: **Apple, Microsoft, ServiceNow, Palo Alto Networks** (cybersecurity), **NVIDIA** (semiconductors), **Palantir** (AI enterprise), **Salesforce**, **Veeva Systems**, \"and a couple more.\"\r\n- Industry ETFs owned: **SOXX** (semiconductors); cybersecurity ETFs named: **IHAK**, **HACK**.\r\n\r\n##### Consumer Discretionary — ETF **XLY** — **second-highest long-run growth; 22% of portfolio**\r\n- Retail stores, auto and auto-parts manufacturers, residential construction (**this part he does not buy**), lodging facilities, restaurants, entertainment companies.\r\n- Definition vs. staples: **higher-priced branded goods you have to think about before buying**, versus staples which are low-priced and bought without thinking.\r\n- Favourites owned: **Booking.com** (world's biggest online travel agent), **MercadoLibre** (\"the Amazon of Latin America\"), **Amazon** (biggest e-commerce company in the US and the world — note Amazon is also big in **digital advertising** and **AWS**, which is really technology), **Lowe's**, **Home Depot**, **Nike**.\r\n\r\n##### Communication Services — **12% of portfolio**\r\n- Old-style telcos (**AT&T**, phone lines) — **does not invest** in these.\r\n- What he does invest in: **social media**.\r\n  - **Meta Platforms** — owns Facebook, WhatsApp, Instagram, Messenger.\r\n  - **Alphabet / Google** — owns YouTube.\r\n  - **Netflix** — added recently; he never owned it in the past and regrets it, so bought once it got cheap again.\r\n\r\n#### 7.4 Long-run sector performance vs. S&P 500 (as presented)\r\n| Rank / verdict | Sectors |\r\n|---|---|\r\n| **Beat the S&P clearly** | **Technology** (highest), then **Consumer Discretionary (XLY)** |\r\n| **On par with the S&P** | **Healthcare** |\r\n| **Underperform — avoided** | **Real Estate, Energy, Utilities, Materials** |\r\n| **Underperforms but held anyway** | **Consumer Staples** — kept because they are defensive and useful in a bear market/recession |\r\n\r\n---\r\n\r\n### 8. The 8 Stock Investment Categories (Investment Thesis Framework)\r\n\r\n> Before you buy any stock you must state **why** you are buying it. It has to fit into one of these eight categories. **If it doesn't fit, don't buy it.**\r\n\r\n**Balanced-diet analogy:**\r\n- **Protein / meat** = growth stocks (build the portfolio, great when younger; too much when older can be unhealthy).\r\n- **Carbohydrates** = predictable stocks (balance the growth stocks).\r\n- **Spice / chilli** = speculative growth stocks (great in small amounts; too much = indigestion).\r\n- **Vegetables / fibre** = dividend stocks (consistent income).\r\n\r\n#### Category comparison table\r\n| # | Category | Mascot / label | Defining criteria | Growth / return profile | Risk | Position size |\r\n|---|---|---|---|---|---|---|\r\n| 1 | **Dividend Cash Cows (Income stocks)** | — | Yield ≥5% (SG), rising DPS 5 yrs, defensive sector | Low capital appreciation; income | Low | Separate portfolio |\r\n| 2 | **Predictable Companies** | Loyal **dog** | Wide moat, predictable earnings & CFO, product never obsolete | **5–10%** (single/high-single digit); can still deliver double-digit EPS via buybacks | Low | Full allocation |\r\n| 3 | **Large Growth Companies** | **Cheetah** | Big companies still growing **above 20–25% p.a.**; profitable ≥5 years | Highest long-run compounding | Moderate | Full allocation (narrow-moat → smaller, esp. initially) |\r\n| 4 | **Speculative Growth** | — | Revenue growth often **>100%**; **not yet consistently profitable** | 5–10× potential; can also lose big | **Very high** | **½ or ⅓ of normal** |\r\n| 5 | **Deep Cyclicals** | — | Capital-intensive, highly economy-sensitive, can't respond to demand fast | Roller coaster; must trade the cycle | High | Rarely/never used by Adam |\r\n| 6 | **Deep Value (\"cigar butts\")** | Cigar butt | Price below net-net liquidation value; lousy companies | Slow, multi-year | High + long dead money | Not used by Adam |\r\n| 7 | **Turnaround Companies** | — | Great company, profits **−25% in one year** OR **declining 2 consecutive years**, moat intact | Stock can be **40–50% below intrinsic value** | Higher than growth/predictable | **Smaller than usual** |\r\n| 8 | **ETFs** | — | Basket — index, country, sector or industry | Market-like | Low (no company-specific risk) | — |\r\n\r\n---\r\n\r\n#### 8.1 Category 1 — Dividend Cash Cows / Income Stocks\r\n\r\n**Who it's for:** older investors, near-retirees, retirees. Younger investors may skip the category entirely — dividend stocks \"don't really grow your wealth very much\" (low capital appreciation). Adam (age 50 at recording) keeps a **separate portfolio just for dividends.**\r\n\r\n**Selection criteria — same \"great company\" criteria PLUS these additional metrics:**\r\n1. **Dividend yield ≥ 5%** (rule of thumb given today's interest-rate environment; may change over time).\r\n   - `Dividend yield = dividend per share (trailing 12 months) ÷ current share price`\r\n   - Example: $2.50 DPS ÷ $50 share price = **5% yield**.\r\n2. **Consistently INCREASING dividend per share for at least the last 5 years.**\r\n3. **Consistently increasing net income AND cash flow from operations for the last 5 years.**\r\n4. **Stable share price over the last 5 years** — either trending upward or ranging. It must not be consistently declining. (Sideways is fine; you're collecting 5%.)\r\n5. **Avoid very cyclical companies** — airlines, commodity companies, shipping companies, property companies — because in a downturn their profits drop and **they cut dividends**. Buy **defensive** companies that can keep increasing dividends through recessions.\r\n6. **Conservative debt:** debt servicing ratio **\u003c 30%**; current ratio **> 1**.\r\n7. **Dividend payout ratio between 20% and 100% — never above 100%.**\r\n   - `Payout ratio = dividend per share ÷ earnings per share`\r\n   - $1.00 EPS paying $0.50 dividends = **50% payout — very good.**\r\n   - $1.00 EPS paying $1.20 dividends = **>100% — bad**: the dividend isn't coming from profit, it's coming from somewhere else and is **not sustainable**.\r\n\r\n**The yield trap warning:** A high dividend yield can coexist with a **falling** dividend per share — this happens when DPS drops but the **share price drops even more**. Never look at yield alone; DPS must be rising consistently for 5+ years.\r\n\r\n**Market choice — why Singapore, not the US, for dividends:**\r\n| | US-listed | Singapore-listed |\r\n|---|---|---|\r\n| Typical high-quality yield | Very low; **3% is already considered pretty good**; you cannot get 5% on quality names | **4%, 5%, 6%** |\r\n| Dividend tax (for foreigners/Singaporeans) | **30% withholding tax** | **Tax free** |\r\n| Capital gains tax | Tax free (for Singaporeans) | — |\r\n| Verdict | Best market for **capital gain**, not dividends | Used exclusively for dividends |\r\n\r\n- His Singapore dividend universe is deliberately narrow: **the 3 banks (DBS, UOB, OCBC)** plus **selected high-quality REITs**.\r\n\r\n**Screening for US dividend stocks (Finviz — free screener), if you want them anyway:**\r\n- *Descriptive* tab → **Dividend yield over 3%**\r\n- *Descriptive* tab → market cap **mid to large** (companies **over $2 billion**)\r\n- *Fundamental* tab → **EPS growth positive past 5 years**\r\n- *Fundamental* tab → **Sales growth positive past 5 years**\r\n- *Fundamental* tab → **EPS growth next 5 years ≥ 5%**\r\n- *Fundamental* tab → **Current ratio over 1**\r\n- Result: out of **~6,000 US stocks, only 49 stocks** pass.\r\n- Then manually **exclude the very cyclical sectors** — real estate, commodities, energy.\r\n- Names surfaced by the screen in the demo: **Bank of America, Cisco, Gilead Sciences.**\r\n- **Yahoo Finance → Statistics tab** shows dividend info; Cisco example: **trailing dividend yield 3%**, **forward dividend yield 3%**.\r\n- **Stock Oracle** (his tool) → Overview page for standard dividend info; dedicated **Dividends tab** shows payout ratio, current & forward yield, **dividend growth rate over 3, 5 and 10 years**, next pay date and ex-dividend date, charts of yield history over 10 years, DPS (purple line), EPS supporting the rising dividend, payout ratio and full dividend history table.\r\n  - PepsiCo example shown: next pay date **31 March 2026**, ex-dividend date **6 March 2026**. Rule: hold the shares **before the ex-dividend date (6 Mar)** to receive the dividend on the pay date (31 Mar).\r\n\r\n**Higher-yield alternatives beyond dividend stocks (for income investors):**\r\n| Instrument | Yield stated |\r\n|---|---|\r\n| Corporate bonds | **~4.4%** |\r\n| Treasury bonds | **~4%** |\r\n| High-yield bond funds | **5.77%** quoted; the one he just bought yields **~8–9%** |\r\n| **Private credit BDCs** (Business Development Companies) | **8–9%** normally; **~12% at time of recording** due to bad news in the private credit market |\r\n| Other income funds | — |\r\n\r\n- **BDCs are the ONLY kind of US-listed security he buys for dividends.**\r\n  - They are **not analysed like normal companies** — unique structure.\r\n  - **Legally required to pay out 90%** of profits / net investment income as dividends.\r\n  - Because of that structure they are **not subject to the 30% withholding tax**. (Interactive Brokers does withhold 30% but **refunds it the following year**.)\r\n  - He buys only the **highest-quality private credit BDCs** — that's how he gets very high yield with long-term safety.\r\n\r\n---\r\n\r\n#### 8.2 Category 2 — Predictable Companies (mascot: the loyal dog)\r\n\r\n**Definition:** companies selling a product or service **you use regularly**, so revenue and profits are very predictable.\r\n\r\n**Criteria:**\r\n- **Large** companies with **wide economic moats**.\r\n- **Predictable earnings and cash flow from operations.**\r\n- Sell a product/service that **never goes obsolete** — hamburgers, soft drinks, chocolate.\r\n- **Very low uncertainty** in net income and cash flow.\r\n- **Slow but steady capital appreciation.**\r\n\r\n**Growth profile:** **NOT** 20–30%. Typically **single digit to high single digit — 5% to 10%.**\r\n\r\n**Two sub-types:**\r\n| Sub-type | Sectors | Examples given |\r\n|---|---|---|\r\n| **Defensive predictables** | Healthcare, Consumer Staples | **PepsiCo (PEP)** — beverage & snacks; **McDonald's** (fairly defensive); **Waste Management** (very defensive); **Monster Beverage**; **Thermo Fisher** (healthcare medical devices & instruments) |\r\n| **Moderately cyclical predictables** | Finance, Consumer Discretionary (also predictable Technology) | **Chubb** (insurance); **S&P Global** (global ratings & data analytics); **MasterCard** (payment technology); **Visa**; **Apple** (predictable technology) |\r\n\r\n**Why they still work as investments despite low revenue growth:**\r\n- Heavy **share buybacks** let them grow **EPS by double digits** even with low revenue growth.\r\n- You can still get **high double-digit returns and beat the market** by buying them **at big discounts during temporary crises**.\r\n- When the price gets **way overextended or overvalued**, he combines the holding with **selling covered call options** to create extra income and boost returns (covered in Lesson 12 — \"turbocharging my portfolio using options\").\r\n\r\n---\r\n\r\n#### 8.3 Category 3 — Large Growth Companies (mascot: the cheetah) — *most of his stocks*\r\n\r\n**Criteria:**\r\n- **Big companies that still have huge growth potential — growing above 20% to 25% a year.**\r\n- **Profitable for at least 5 years** (this is the dividing line vs. speculative growth).\r\n- Majority are **technology-related**, plus companies in **secular / long-term growth industries**: **cybersecurity, e-commerce, software**.\r\n- Usually the stock is **overvalued** — you must be **patient**; they become undervalued during **corrections, pullbacks and bear markets**, and those are the times to **build a strong position**.\r\n\r\n**Two moat grades:**\r\n| Moat | Definition | Position sizing | Names |\r\n|---|---|---|---|\r\n| **Wide moat** | Brand monopoly, high switching cost, network effect lasting **at least 20 years** | Full allocation | **Microsoft, NVIDIA, Google/Alphabet, Meta Platforms, Amazon, Adobe, MercadoLibre, Veeva Systems, Salesforce, ServiceNow** |\r\n| **Narrow moat** | Competitive advantage lasting **at least 10 years** | **Smaller positions, especially initially** — a bit more risky | **Booking.com, IDEXX, Tesla** |\r\n\r\n- **Tesla is explicitly NOT owned** despite being a high-quality narrow-moat growth company: they had to **cut prices to fend off competition**, which signals **damaged pricing power — a red flag**.\r\n\r\n**Capital-return behaviour:** in early growth stages they usually **don't pay dividends** and may **not do buybacks** — in fact they may **issue more shares** and hand out heavy **stock-based compensation**. That's acceptable because high growth in revenue, profit and free cash flow outruns the share-count dilution, so **FCF per share and EPS still grow double digits**. At maturity (e.g. Microsoft) they start buybacks and dividends.\r\n\r\n---\r\n\r\n#### 8.4 Category 4 — Speculative Growth Stocks\r\n\r\n**Criteria:**\r\n- Relatively **new** growth companies with the potential to become **wide-moat industry dominators**, but **currently only a narrow moat — or no moat yet** (still building it).\r\n- **Revenue growing at very high rates, usually over 100%.**\r\n- **Not yet generating consistent net profit and cash flow from operations** — often still loss-making due to high investment costs and lack of economies of scale.\r\n- **Difference vs. large growth stocks:** large growth stocks are **already profitable for at least 5 years**; these are not. Adam's own entry rule: **buy them once they can turn a profit for at least the first year** (he does not require the 5-year track record) — but acknowledges they are **a lot more risky**.\r\n- **They do not yet pass all the steps of a great business.**\r\n\r\n**Valuation method:** since there's no consistent profit/cash flow, use the **Price-to-Sales-Growth (PSG) ratio**:\r\n> **PSG = Price-to-Sales ratio ÷ projected revenue growth rate**\r\n- **0.2 to 0.3 = fair value.**\r\n- **Above 0.3 = overvalued.**\r\n- **Below 0.3, and especially below 0.2 = really undervalued.**\r\n- Pre-calculated on Stock Oracle, or compute manually.\r\n- **Worked example — AST SpaceMobile:** projected revenue growth **127.66%**; price-to-sales ratio **324**; 324 ÷ 127.66 ≈ **PSG 2.54 → way overvalued** → he has **not entered a position**.\r\n\r\n**Position sizing (critical):** **half or one third of the usual position.** 5% normal → **2.5%**; 2% normal → **1%**.\r\n- **Downside math:** worst case (goes to zero) on a 1% position = **−1% of portfolio**. Realistically, failures lose about **half** and never come back → **−0.5% of portfolio**, which is acceptable.\r\n- **Upside math:** winners can go up **5× to 10×** the money invested.\r\n- Verdict: **super high risk, very high return → keep a small allocation.**\r\n\r\n**Cautionary base rate:** *\"For every one Amazon that made it, 99 others didn't make it.\"*\r\n- Amazon itself was speculative: it **did not make any money for its first 7 years** after listing, but revenue grew like crazy and the **share price rose 15-fold** during that period.\r\n\r\n**His actual speculative positions:**\r\n| Stock | Story |\r\n|---|---|\r\n| **Palantir** | Bought **2022**, before it had one year of net profits or free cash flow — entered **the moment it had one quarter of profits**. Bought before ChatGPT/AI hype; one of the first **AI enterprise** companies transforming other businesses (e.g. Airbus). Invested **just 1% of portfolio**. After ~4 years it went up **~20×** (also stated as \"24\"). He **sold some** when it got really overvalued but still holds a sizable position. |\r\n| **Celsius** | Bought about a year ago, before the 5-year consistent profit/cash-flow track record. Up \"quite a bit\" but not yet double/triple; he expects it will be. |\r\n| **Uber** | Speculative growth stock he **did NOT buy** — lacked the same conviction, though he thinks it's not a bad company. |\r\n| **AST SpaceMobile** | Interesting; potential huge winner in the **new space economy** — **not bought: way overvalued** on PSG (2.54). Will consider if fairly priced or undervalued. |\r\n| **Rocket Lab** | Same as above — new space economy, **not bought yet, overvalued**. |\r\n\r\n---\r\n\r\n#### 8.5 Category 5 — Deep Cyclical Stocks\r\n\r\n**Criteria:** capital-intensive industries — **shipping, real estate, property development, commodities, oil and gas** (also offshore & marine, industrial companies). Highly sensitive to the economic cycle and **unable to respond to demand changes quickly**.\r\n- Big profits in booms; smaller profits or **losses** in recessions. Revenue and profit charts zig-zag; share price is a roller coaster.\r\n- **Every drop can be as much as 50%.**\r\n- **He very rarely invests here** and avoids them — but covers it because many investors focus on them.\r\n- **You cannot hold these long term.** Holding through the ups and downs produces poor returns because of the size of the drawdowns. You must **get in and get out fast** — the opposite of predictable/growth companies which he holds for the long run to compound.\r\n\r\n**How to trade them (the inverted rules):**\r\n| | Deep cyclicals | Normal VMI stocks |\r\n|---|---|---|\r\n| **Buy when** | Profits are **low or in temporary loss**, and the stock is **very undervalued** | Profits growing, price below intrinsic value |\r\n| **Sell when** | They are **making a lot of money** and are **overvalued** | Only on exit rules |\r\n| **Chart timing** | Use **weekly and monthly** charts; draw support and resistance; buy near **support**, sell near **resistance**. Buy after a **40–50% drop** into a very strong support level — in the Caterpillar example, the **200 moving average on monthly candles** | Daily/weekly support levels |\r\n\r\n- **Example used: Caterpillar (CAT)** — revenue and profit visibly cycle down/up/down/up, share price mirrors it, and every decline can be ~50%.\r\n\r\n---\r\n\r\n#### 8.6 Category 6 — Deep Value Stocks (\"cigar butts\")\r\n\r\n**Origin:** made popular by **Benjamin Graham**, the father of value investing, and used by **Warren Buffett when he first started.**\r\n**Adam does not use this style and owns nothing in this category** — included only for completeness.\r\n\r\n**The concept:** deliberately buying **mediocre or lousy companies** — but so cheap that the **share price is below the liquidation value of the company**. You are effectively hoping the company liquidates and what's left over exceeds what you paid. Often **distressed assets**. Buying below net cash means **you get the business for free**.\r\n\r\n**The core metric:**\r\n> **(Current assets − Current liabilities − Long-term debt) ÷ Shares outstanding**\r\n>\r\n> (Current assets − current liabilities = **net working capital**; then subtract long-term debt.)\r\n>\r\n> **This figure must be HIGHER than the current share price.**\r\n\r\n**Additional criteria if you do use it:**\r\n- **Positive cash flow from operations for the last 12 months** — still profitable.\r\n- **Low debt: current ratio > 1**, **debt-to-equity ratio \u003c 1**, debt servicing ratio (stated in transcript as \"more than 30%\" — read alongside the standard VMI rule of **\u003c 30%**).\r\n- Balance sheet **not deteriorating**.\r\n- **Avoid sunset industries** and companies whose products are becoming obsolete, no matter how cheap — the value of the company will keep eroding.\r\n- Note that most deep value companies have **no economic moat at all**.\r\n\r\n**Entry / exit timing:**\r\n- **Entry:** buy at a **support level in a consolidation**, or when it is **reversing into a new uptrend** — defined as the **50 MA above the 150 MA**. Never buy in a downtrend.\r\n- **Exit:** when the **50 MA crosses back below the 150 MA**, or when the company **starts to report a loss**.\r\n\r\n**Why he dislikes it:** recovery is not immediate; it requires **long-term patience** and may take **several years** for the company and the share price to recover — money is tied up too long.\r\n\r\n---\r\n\r\n#### 8.7 Category 7 — Turnaround Companies\r\n\r\n**Definition:** **great businesses** hit by **temporary bad news** — a lawsuit, boycott, scandal, mismanagement, recession — that causes profits to fall temporarily.\r\n\r\n**The formal trigger (either one qualifies):**\r\n- **Profits drop more than 25% in one year**, **OR**\r\n- **Profits decline for two consecutive years.**\r\n\r\n**Key requirement:** the **economic moat / competitive advantage must remain intact.**\r\n\r\n**Opportunity size:** in such cases the stock price can fall **40% to 50% below intrinsic value** — the time to buy the great company.\r\n\r\n**Risk warning:** turnarounds are **more risky than usual growth or predictable stocks** because:\r\n- Some take a **long time** to turn around.\r\n- Some **never** turn around — the short-term problem becomes a long-term problem, or the moat deteriorates because of the problem.\r\n\r\n**Position sizing:** **smaller than usual allocation** (grouped with speculative growth as ½ or ⅓ of a normal position).\r\n\r\n**Case studies:**\r\n| Stock | Problem | Outcome |\r\n|---|---|---|\r\n| **Meta Platforms** | 2021–2022: Apple's **privacy changes** broke ad targeting + heavy **metaverse** spending → **profits dropped ~40%**, panic, **share price dropped 70%** | Bought more at the discount, roughly **$70–$80 per share**; now near **$400 per share**. **Now one of his biggest positions and his most profitable stock.** Successful turnaround; reclassified back to a growth stock |\r\n| **Boeing** | 2020: plane crashes, groundings, pandemic order cancellations, profits went negative; stock **−70/−80%** | Already owned it, **added more**. Sold on the rebound for a **small profit** and **will not buy it back**: since the crashes there have been more problems (doors falling off), the **brand image has been punished by execution problems** and **the moat is deteriorating** → **no longer a great company** |\r\n| **Estee Lauder** | COVID **supply chain** problems + **weak Chinese consumer**; **profits down two years in a row** | **Still holding**; has **not yet turned around**; expects a turn in **1–2 years** |\r\n| **Boston Beer** | Over-projected demand for **hard seltzer**, built too much capacity, demand dropped → short-term profit losses; **share price −60%+** | **Still holding**; believes it is **beginning to turn around now** |\r\n| **Disney** | Struggling transition from **cable TV to streaming TV** | Judged a **long-term structural problem, not short-term** → **sold at a loss**. Down 26% in the 10-stock sample |\r\n\r\n---\r\n\r\n#### 8.8 Category 8 — ETFs\r\n\r\n**Types:**\r\n- **Index ETFs** tracking an entire market — e.g. **S&P 500 ETF**, **China ETF**.\r\n- **Sector ETFs** — **XLV** (healthcare), **XLK** (technology), **XLY** (consumer discretionary), **XLP** (consumer staples), **XLU** (utilities).\r\n- **Industry ETFs** — cybersecurity: **IHAK**, **HACK**; medical devices: **IHI**; semiconductors: **SOXX**; AI-power/IPP: **AIPO**.\r\n- **Bond ETFs** and **commodity ETFs** — commodity ETFs are for **short-term speculative trades only, never long-term investments**.\r\n\r\n**Why they're useful:**\r\n- You buy a **basket of many companies** → **no need to calculate intrinsic value** and **no company-specific risk**.\r\n\r\n**How to buy them:** **purely on technical analysis** — trends, moving averages, support and resistance.\r\n- Some ETFs publish a P/E and growth rate, giving a rough valuation: **PEG = P/E ÷ earnings growth rate**; **PEG below about 2 = reasonably priced.**\r\n\r\n**ETFs he owns:** **IHI** (healthcare medical devices), **SOXX** (semiconductors), **AIPO** (AI/IPP power), **China ETFs (3% of portfolio)**.\r\n\r\n---\r\n\r\n### 9. Category Migration — Stocks Move Between Buckets\r\n\r\nA stock can transition from one category to another; the thesis must be updated.\r\n\r\n| Stock | From → To | Trigger |\r\n|---|---|---|\r\n| **Apple** | Growth → **Predictable** | Grew >20% p.a. for years; growth has now slowed below 20%, but sales/profits became more predictable thanks to **recurring revenue from the services business** |\r\n| **Meta** | Growth → **Turnaround** (2021–22) → **Growth again** | Temporary bad news, then problems solved |\r\n| **Palantir** | **Speculative growth** → will upgrade to **Growth** | Once it achieves **5 years of consistent sales and profits** |\r\n\r\n---\r\n\r\n### 10. The Pre-Purchase Checklist (Four Questions)\r\n\r\nDifferent investors have different **account sizes, risk profiles, objectives and portfolio strategies** — so run every candidate through this:\r\n\r\n1. **Is this a great business?** Put it through the fundamental criteria — must pass the **5 steps of a great business**.\r\n2. **Is the stock undervalued?** Share price **below intrinsic value** AND price has **retraced to a level of support**.\r\n3. **What type of stock is this — which of the 8 investment categories, and which sector?** Then ask: **is this the kind of stock I want in my portfolio**, given my strategy? (If you only want growth, you don't buy DBS Bank. If you want dividends, you don't buy NVIDIA or ServiceNow — they don't pay dividends.)\r\n4. **Do I already have a full allocation for this stock?** If you plan 20 stocks, the maximum is **5%**. Once 5% is bought — **do not buy more.**\r\n\r\n**The comparison rule:** never compare across categories. *\"You can't compare a steak with an apple.\"*\r\n- NVIDIA (growth) must be compared to **ServiceNow, Salesforce, Microsoft** — other growth stocks.\r\n- DBS (dividend) must be compared to **OCBC, UOB, CapitaLand Ascendas Trust** and other high-dividend stocks.\r\n\r\n**Mixed strategies are fine** — e.g. \"50% growth, 20% dividend, 20% [other]\" — but you must **know your strategy first**, then pick stocks that fit it.\r\n\r\n---\r\n\r\n### 11. Adam's Own Category Allocation\r\n\r\n| Category | His holding |\r\n|---|---|\r\n| **Large growth** | **Almost half of his stocks** — the reason the portfolio beats the S&P 500 |\r\n| **Predictable** | \"Quite a number\" — both defensive (healthcare, consumer staples) and moderately cyclical (predictable tech like **Apple**; financials like **Visa, MasterCard**). Held because they are **resilient in a recession/bear market and balance the portfolio** |\r\n| **ETFs** | Some industry ETFs — **IHI** (healthcare medical devices), **SOXX** (semiconductors), plus **3% China ETFs** |\r\n| **Speculative growth** | **Only one — Palantir** |\r\n| **Turnaround** | \"A few\" — **Estee Lauder, Boston Beer**. Deliberately keeps these few because they are riskier |\r\n| **Deep value** | **None** |\r\n| **Deep cyclical** | **None** |\r\n| **Dividend** | **Entirely separate portfolio** — Singapore-listed banks + high-quality REITs, purely for dividend collection |\r\n\r\n---\r\n\r\n### 12. Maximizing Portfolio Returns — The 5% / 95% Rule\r\n\r\n> **Over time, 95% of your profits will come from only 5% of the companies that you buy.**\r\n\r\n#### 12.1 Buffett's evidence\r\n- Berkshire Hathaway run for **over 58 years**.\r\n- Berkshire grew **170,000%** vs. the **S&P 500's 3,900%** — **outperformance of 43×**.\r\n- From his shareholder letter, he describes his collection of businesses as: **a few with truly extraordinary economics; many with very good economic characteristics; and a large group that are marginal.**\r\n- Translation: most of what he owns is so-so; **the few account for all the profits.**\r\n- Over 58 years Buffett bought and owned **over 210 stocks and businesses**. Only **5% — \"about a dozen\" (12 of 200+) — contributed 90% of all his gains.**\r\n\r\n**Buffett's 5-year holding performance as presented (Apple, HPQ, AXP, CVX, Bank of America, Coca-Cola, Occidental Petroleum, NU, KHC, PARA):**\r\n- Only **Apple** did very well.\r\n- **HPQ** and **AXP** did slightly better than the S&P 500.\r\n- **CVX, Bank of America, Coca-Cola, Occidental** made positive gains but **underperformed** the S&P 500.\r\n- **Three stocks made negative returns: −30%, −35%, −69%.**\r\n\r\n#### 12.2 The same distribution in Adam's own portfolio\r\n**Expected outcome per 10 stocks bought:**\r\n| Bucket | Count out of 10 |\r\n|---|---|\r\n| **Exceptional outperformers** | **2 to 3** |\r\n| **Do well** | **4 to 6** |\r\n| **Suck (at least in the short term)** | **2 to 3** |\r\n\r\n**Real 5-year sample of 10 of his ~40 holdings:**\r\n| Stock | 5-year return | Bucket |\r\n|---|---|---|\r\n| **NVIDIA** | **+700%** | Way outperformed S&P |\r\n| **ASML** | **+281%** | Way outperformed S&P |\r\n| **Apple** | **+257%** | Way outperformed S&P |\r\n| **Microsoft** | **+237%** | Way outperformed S&P |\r\n| **Lowe's** | pretty good, slightly above S&P | Did well |\r\n| **Meta** | pretty good, slightly above S&P | Did well |\r\n| **Amazon** | just slightly below S&P | Did well |\r\n| **Estee Lauder** | **−15%** | Underperformer |\r\n| **Disney** | **−26%** (already sold) | Underperformer |\r\n| **Alibaba** | **−41%** | Underperformer |\r\n\r\n#### 12.3 The operating conclusion\r\n- **When you buy the 10 stocks you will never know which ones will outperform** and which will underperform. You only know after it happens — often after 5 years.\r\n- Therefore: **keep all of them**, so the **massive gains from the winners more than offset the temporary drops from the losers.**\r\n- Net-net the portfolio still grows and beats the S&P 500.\r\n- This is the mathematical justification for **not rebalancing**, **not cutting winners**, and **not averaging into losers**.\r\n\r\n---\r\n\r\n### 13. Key Takeaways\r\n\r\n1. **Never go all-in on one stock** — no matter how great the business. Boeing was a great company and lost 80% on events nobody could predict.\r\n2. **Minimum 8 stocks, comfortably 8–30, hard ceiling 60** (top 1% of 6,000 US stocks). Adam runs ~40 only because he invests full time.\r\n3. **Full allocation = 100% ÷ number of stocks.** 10 stocks → 10%; 20 → 5%; 30 → 3.33%; 40 → 2.5%.\r\n4. **Speculative growth and turnaround positions get ½ or ⅓ of a normal position** — 1% instead of 2%, 2.5% instead of 5%.\r\n5. **Three conditions to add shares:** undervalued + at support + not yet at full allocation. Once full, stop buying.\r\n6. **Buy in 3–4 tranches** (quarters) at successive support levels, never all at once.\r\n7. **Never rebalance in either direction.** Don't trim winners that grew organically (Meta 2.5% → 6.9% stays); don't top up losers back to target weight. *\"Do not cut your flowers… don't water the weeds.\"*\r\n8. **Diversify across sectors, industries and markets**, not just across tickers. ~90% US, 3% China/HK, remainder Europe.\r\n9. **The objective is never losing money over 2–4 years**, not maximum gain. A portfolio of undervalued great companies held over time makes losing money effectively impossible.\r\n10. **Win rate matters more than perfection:** aim to be right **80–90%** of the time and cap losses on the failing 10–20%.\r\n11. **Three stock types:** defensive (5–10% growth, protects in recessions), cyclical (boom/bust), growth/moderately cyclical (the core engine).\r\n12. **Favourite sectors: Technology, Consumer Discretionary, Healthcare, and Financials** (the one cyclical sector he leans into, via toll-booth companies, payment networks and strong insurers).\r\n13. **Avoided sectors: Real Estate, Energy, Basic Materials, Utilities** — all underperform the S&P long run, with high debt, low margins, low ROE and unpredictable profits. Consumer staples underperform too but are kept as recession ballast.\r\n14. **Every purchase needs a thesis** that fits one of the **8 investment categories**. If it doesn't fit, don't buy it. Only ever compare stocks within the same category.\r\n15. **Dividends: Singapore, not the US.** US dividends are taxed **30%** for foreigners and quality yields max out near 3%; Singapore yields 4–6% and are **tax free**. The exception is **BDCs**, the only US-listed income vehicle he buys (8–12% yields, exempt from the 30% withholding).\r\n16. **Dividend selection metrics:** yield ≥5% (SG), rising DPS 5 years, rising net income and CFO 5 years, stable/rising price, payout ratio 20–100%, current ratio >1, debt servicing \u003c30%, avoid cyclicals.\r\n17. **Speculative growth valuation: PSG = P/S ÷ projected revenue growth. 0.2–0.3 = fair; >0.3 = overvalued.**\r\n18. **Turnaround trigger: profits −25% in one year, or two consecutive years of decline**, with the moat intact; stock can be 40–50% below intrinsic value.\r\n19. **The 5%/95% rule:** 95% of profits come from 5% of holdings. Buffett: 12 of 210+ stocks produced 90% of gains over 58 years. Expect 2–3 winners, 4–6 decent, 2–3 duds per 10 stocks — and you can't know in advance which is which, so hold them all.\r\n20. **Categories are not permanent** — Apple went growth → predictable, Meta went growth → turnaround → growth, Palantir will go speculative → growth once it has 5 years of consistent profits.\r\n\r\n---\r\n\r\n### 14. Model Portfolio Blueprint\r\n\r\n#### 14.1 Structure\r\n| Parameter | Value |\r\n|---|---|\r\n| Minimum number of holdings | **8** |\r\n| Recommended range (part-time investor) | **8 – 30** |\r\n| Maximum (full-time investor) | **~40** |\r\n| Absolute ceiling (top 1% of 6,000 US stocks) | **60** |\r\n| Full position size | **100% ÷ number of holdings** |\r\n| Full position at 10 / 20 / 30 / 40 holdings | **10% / 5% / 3.33% / 2.5%** |\r\n| Position size for speculative growth & turnarounds | **½ or ⅓ of full** (e.g. 5% → 2.5%; 2% → 1%) |\r\n| Entry tranches per position | **3–4** (quarter positions at successive support levels) |\r\n| Maximum position ever purchased | **The full allocation — never more** |\r\n| Rebalancing (up or down) | **None** |\r\n| Number of separate portfolios | **2** — a capital-gain portfolio and a **separate dividend portfolio** |\r\n\r\n#### 14.2 Sector allocation target (Adam's live capital-gain portfolio)\r\n| Sector | Weight | Role |\r\n|---|---|---|\r\n| Technology | **27%** | Highest long-run growth; biggest holding |\r\n| Consumer Discretionary | **22%** | 2nd highest long-run growth |\r\n| Healthcare | **15%** | Growth + defensive; aging-population mega-trend |\r\n| Financials | **13%** | The favoured cyclical sector (toll-booths, payments, insurance) |\r\n| Communication Services | **12%** | Social media (Meta, Alphabet, Netflix) |\r\n| Consumer Staples | **7%** | Recession ballast despite underperforming the S&P |\r\n| China ETFs | **3%** | Geographic diversification |\r\n| Industrials | **2%** | Minimal — only the predictable exceptions |\r\n| **Utilities / Energy / Real Estate / Basic Materials** | **~0%** | Avoided — underperform, high debt, low margins, unpredictable |\r\n\r\n#### 14.3 Geographic allocation\r\n| Market | Weight |\r\n|---|---|\r\n| US-listed | **~90%** |\r\n| China / Hong Kong | **3%** |\r\n| Europe | remainder (~7%) |\r\n| *Dividend portfolio (separate)* | **100% Singapore-listed** — DBS, UOB, OCBC + selected high-quality REITs |\r\n\r\n#### 14.4 Category allocation\r\n| Category | Target weight / count |\r\n|---|---|\r\n| **Large growth** | **~50% of holdings** (almost half) — the return engine |\r\n| **Predictable** | \"Quite a number\" — defensive + moderately cyclical ballast |\r\n| **ETFs** | Small satellite positions (IHI, SOXX, AIPO, China ETFs ~3%) |\r\n| **Speculative growth** | **Rare — currently 1 name (Palantir)**, at ½–⅓ position size |\r\n| **Turnaround** | **A few, deliberately limited** (Estee Lauder, Boston Beer), at reduced size |\r\n| **Deep value** | **0%** |\r\n| **Deep cyclical** | **0%** |\r\n| **Dividend** | **0% in the capital-gain portfolio** — housed in a fully separate SG portfolio |\r\n\r\n#### 14.5 Expected outcome (per 10 holdings)\r\n| Outcome | Count |\r\n|---|---|\r\n| Exceptional outperformers | **2–3** |\r\n| Solid performers | **4–6** |\r\n| Losers (at least short term) | **2–3** |\r\n| Target win rate | **80–90%** |\r\n| Share of profits from the top holdings | **95% of profits from 5% of stocks** |\r\n\r\n#### 14.6 Track record this blueprint produced\r\n| Period | Portfolio | S&P 500 |\r\n|---|---|---|\r\n| 2020 | **+44%** / **+41%** (two portfolios) | — |\r\n| 2023 | **+48%** / **+43%** (also quoted as +45%) — **US$2m profit** | **~+24%** |\r\n| Last 5 years | **+145%** | **+83%** |\r\n\r\n---\r\n\r\n*Next lesson: portfolio management — exit rules and how to consistently monitor the portfolio to beat the market.*\r\n\r\n---\r\n\r\n# Part IX — Finding Stocks, Monitoring, Drawdowns & Exit Rules\r\n\r\n## Section 09 — Finding Stocks, Monitoring, Drawdowns & Exit Rules\r\n\r\n*Source: Whale Investor / Value Momentum Investing (VMI), Lesson 9 — videos 66–72*\r\n*(66 Finding Great Stocks · 67 Stock Screeners · 68 Monitor Your Portfolio · 69 Dealing with Drawdowns · 70 When to Sell Pt.1 · 71 When to Sell Pt.2 · 72 Reasons Not to Sell)*\r\n\r\nLesson 9 has three parts: (1) where to source investment ideas, (2) portfolio management / monitoring, (3) exit rules. Everything sourced here still has to be pushed through the **7-step criteria** before it can be bought — sourcing only generates candidates, it never generates a buy.\r\n\r\n---\r\n\r\n### PART 1 — SOURCING: WHERE GREAT STOCKS COME FROM\r\n\r\n#### 1.1 The core principle — buy what you use (\"consumer monopolies\")\r\n\r\nThe best-performing stocks he owns did **not** come from insider tips or expensive paid reports. They came from **businesses he patronises himself** — where he uses the products and services regularly and pays for them all the time.\r\n\r\nGuiding question: *\"What products or services do I use regularly, and what do I pay for all the time?\"* Companies that answer that question repeatedly across millions of people are **consumer monopolies**.\r\n\r\nHis own portfolio, mapped to his own usage:\r\n\r\n| Stock owned | Why (personal usage) |\r\n|---|---|\r\n| Microsoft | Uses Excel and Word every single day |\r\n| Meta | Uses Facebook, Instagram, WhatsApp every day |\r\n| Amazon | Orders on Amazon, watches Prime Video |\r\n| Alphabet | Google search, Google Maps, Google Docs, Gmail, YouTube — \"can't live without Google\" |\r\n| Visa & Mastercard | Uses both cards every day when buying things |\r\n| Adobe | Uses Adobe heavily for design; daughter uses it in college for design |\r\n| Apple | iPhone, Apple Watch, whole family on MacBooks and iPads |\r\n\r\n**The Buffett precedent.** He learned this from a Buffett interview many years ago. Asked how he found his greatest investments, Buffett's answer: he buys businesses he patronises all the time.\r\n- **Coca-Cola** — Buffett loves drinking Coke; admits to **4–6 cans a day**.\r\n- **Gillette** — he shaves with Gillette blades.\r\n- **American Express** — he uses their credit cards and used to use their travellers' cheques.\r\n- **Apple** — Buffett's biggest investment, and the trigger was not an analyst research paper. His **granddaughter** told him she couldn't live without her iPhone; Buffett realised how many people can't live without Apple products.\r\n- Buffett's fortune also built on Coca-Cola, American Express, Visa, Mastercard, McDonald's, Bank of America.\r\n\r\nBuffett's logic, as restated: *if I use these products every day, so do millions of people worldwide* → proves **brand monopoly** and **market leadership** → these are the companies you want to own → they have **very predictable future revenue and cash flow**.\r\n\r\n#### 1.2 The daily-life inventory exercise\r\n\r\nWalk through your own day from waking to sleeping and list every listed company you touch:\r\n1. You wake up and bathe — **which soap? which shampoo?** Research those brands if listed.\r\n2. **What toothpaste** do you use?\r\n3. Breakfast — **where does it come from? Where do you buy your groceries?**\r\n4. **What car do you drive?**\r\n5. Lunch and dinner — McDonald's, KFC, a restaurant chain — many are listed companies.\r\n6. **What tools/software do you use every day** for work — Microsoft, Google, other software?\r\n\r\nThat inventory *is* your candidate list to analyse.\r\n\r\n#### 1.3 Critical caveat — usage ≠ automatic buy\r\n\r\nUsing a product does **not** make it a great company. It still has to pass the **7-step criteria**.\r\n\r\n**Netflix counter-example.** He watches Netflix occasionally and his family subscribes, but he does **not** own the stock. After the 7-step research he concluded Netflix is a *good* business, **not a great** one. Reasons:\r\n- Netflix must spend **hundreds of millions of dollars generating its own content** → huge **maintenance capex**, continuous spend just to maintain content and retain customers.\r\n- Content is a **hit-and-miss** business: some movies are hits, some flop and lose millions → **not predictable**.\r\n- He prefers **Alphabet (YouTube)** instead: YouTube does **not** generate its own content — users generate it → **very low maintenance capex**.\r\n\r\n#### 1.4 Source #2 — Great companies hit by temporary bad news\r\n\r\nNo matter how great a stock is, bad news will at some point knock the share price down **20%, 30%, 40%, 50%** — and that can be a chance to buy a great company at a big discount.\r\n\r\nTwo sub-cases:\r\n- Bad news that **genuinely dents short-term profits** for one, two, three quarters or even a year.\r\n- Bad news where **profits and revenue don't drop at all** — only sentiment/emotion drops. *This is the best kind*, because the business is untouched and the fall is purely irrational selling.\r\n\r\n**The test that must be satisfied:** the bad news must be **temporary**. The **business model** and the **competitive advantage / economic moat must remain intact**, so that over the medium-to-long term the company keeps growing revenue and profits and makes back the short-term damage.\r\n\r\n**Example A — Meta (2022), stock down ~70%.** Two pieces of bad news:\r\n1. Zuckerberg started spending on the **metaverse**, not yet profitable → expenses up, profits temporarily down.\r\n2. **Apple changed its privacy settings** (app tracking opt-out) → blocked Facebook's ad targeting → advertising ROI dropped.\r\n\r\nHe held his shares and **bought more at a 60–70% discount**. His confidence came from:\r\n- Research showing Meta still had its competitive advantage and was building an **AI engine to circumvent Apple's privacy changes** — i.e. a short-term problem.\r\n- **He was still using Facebook/Instagram/WhatsApp just as much** — no reduction in his own usage.\r\n- **He was himself an advertiser** — his company spends **millions of dollars a year** on Facebook ads. He asked: is there an alternative? *Not really* — Facebook gave the best return on ad dollars. Was he planning to spend less next year? *No — more.*\r\n\r\nBecause he was a customer AND an advertiser, he understood the business well enough to keep adding shares while others panic-sold. Meta is now one of his biggest positions and one of his highest-returning.\r\n> Lesson: **your biggest positions should be the businesses you understand best — and you only truly understand a business if you are a customer of it.** Buy what you know.\r\n\r\n**Example B — Ozempic scare (2023).** News about the weight-loss/diabetes injectable (publicised via Kim Kardashian and Elon Musk) triggered irrational sector-wide selling:\r\n- **Food stocks −20% to −30%**: Pepsi, Hershey's, McDonald's, Yum Brands — on the fear people would eat fewer chocolates, cookies, potato chips.\r\n- **Healthcare stocks −10% to −30%**: Thermo Fisher, HCA Healthcare, Abbott Laboratories — on the fear that thinner people get less heart disease and fewer medical problems.\r\n- Revenue and profits **did not actually drop**. He used it to buy more **McDonald's**, plus **Hershey's** and **Pepsi**, and the marked-down healthcare names.\r\n\r\n**Example C — Booking Holdings / Booking.com (2020 COVID).** Largest online travel agent in the world (owns Priceline, Agoda and other travel brands). Global borders shut, **revenue dropped ~90%, profits ~90%**, share price plunged. He **bought aggressively at huge discounts** while everyone panicked, because (a) it passed all his criteria, (b) the profit collapse was from an external cause, not the company's fault, and (c) the pandemic would not last forever.\r\n- Note what he did **not** buy: hotels, airlines, cruise ships — they **did not meet his investment criteria**. Booking did, because it is an **online business with a very strong balance sheet**.\r\n\r\n**Rules attached to the bad-news source:**\r\n1. Do **not** buy blindly just because you read bad news — the company may not be a good business in the first place. It must pass the investment criteria.\r\n2. The **news only points you to the opportunity**. The actual buy decision comes from **fundamentals + technicals**: Is it undervalued? Has price retraced to a strong support level? Is there a reversal pattern? Entry criteria must be met before pulling the trigger.\r\n3. **Exception — financial fraud or financial irregularity: don't touch it.** \"Where there's smoke, there's a big fire.\" Every other type of short-term bad news is an opportunity.\r\n\r\n#### 1.5 Source #3 — Stock screeners\r\n\r\n- Best **free** screener: **finviz.com**\r\n- Best **paid** screener: **gurufocus.com**\r\n(Full setups in Part 2 below.)\r\n\r\n#### 1.6 Source #4 — Following super investors (13F filings)\r\n\r\n**Website: dataroma.com** — free; tracks the **13F filings** of well-known US hedge-fund managers and super investors managing billions.\r\n\r\nWhat you can see there:\r\n- A list of tracked **super investors**: Bill Ackman, Warren Buffett, Li Lu, Chase Coleman, and others.\r\n- Each investor's **top-10 holdings** and their **most recent purchases**.\r\n- Example cited — **Bill Ackman, Q3 2023**: added **Google, Hilton, Howard Hughes**. (He describes Ackman as one of the few fund managers he actually respects.)\r\n- Example cited — **Warren Buffett / Berkshire Hathaway**: largest holding **Apple at ~50% of the portfolio**; Q3 buys included **LLYVK (Liberty Media), Sirius holdings, Atlanta Braves Holdings**; prior quarter **Capital One Financial, Occidental Petroleum**.\r\n\r\n**More useful than any single investor: the aggregate.** Look at the stocks that many super investors are buying — the \"most popular stocks among super investors\" — on the Dataroma home page, right-hand side:\r\n- **Top 10 most-owned stocks by super investors** (as shown): Google, Microsoft, Meta Platforms, Amazon, Visa, Berkshire Hathaway, Wells Fargo, UnitedHealth, Mastercard. *He owns 8 of the 10* — but bought them from his own analysis, not because they did.\r\n- **Top 10 buys last quarter** (as shown): Alphabet, Meta, Amazon, Disney, Microsoft, UnitedHealth, CVS Health, Thermo Fisher, Dollar General, Charter Communications.\r\n\r\n**Hard warnings on this source:**\r\n1. **Never follow blindly.** Respecting an investor doesn't mean copying their picks.\r\n2. He respects Buffett tremendously but would **never buy Occidental Petroleum (OXY)** — doesn't meet his criteria and he doesn't like energy stocks; it fell significantly after Buffett bought.\r\n3. Buffett famously bought **airline stocks in 2019**, then cut the loss in the 2020 COVID crash. Airlines are something Adam would **never** buy.\r\n4. Even the aggregate can be wrong — **they could all be wrong together**.\r\n5. Illustrative divergence: **Disney** was one of the most-bought stocks by super investors that quarter — and he **sold his Disney shares** in the same period because it no longer met his criteria. Sometimes he sells what they buy, buys what they don't.\r\n6. Every idea from this source must still go through the **7-step analysis**.\r\n\r\n#### 1.7 Source #5 — Subscription research (UIP)\r\n\r\n**Ultimate Investor's Playbook (UIP)**, managed by Adam Khoo — subscribe at **insight.piranaprofits.com**. What it provides:\r\n- **Two stocks presented every month**: one picked by him personally, one **voted on by the community**.\r\n- Each gets an **in-depth 7-step deep dive**: investment thesis (market potential, why it beats the S&P 500), business overview (products/services), revenue growth history, net profit, cash from operations, gross profit margins, ROE, ROIC, revenue rising faster than accounts receivable, economic moat (wide vs narrow) and its sources (market leadership, network effect, high switching costs), direct competitor study with 10-year and 5-year relative performance, growth drivers, debt structure, intrinsic value via the intrinsic value calculator, and investment risks.\r\n  - *Example given*: **Intuit**, presented May 2022, competitor-compared against **Sage Group, Xero, H&R Block**; presented when price dropped to a strong support level inside the buy zone; later at **$594**.\r\n- **Monthly updates of intrinsic value and buy levels** for every stock.\r\n  - *Example given*: **Fortinet (FTNT)** — intrinsic value range **$73 conservative to $90 base case**, share price **$55** (still quite undervalued), with **four buy levels: $61, $56, $52, $47**, updated monthly off strong support levels.\r\n- A **Discord notification channel** where he screenshots every transaction the day he makes it.\r\n  - *Examples*: 24 Oct — added **Capital(and) DC REIT at $1.80, 5,600 shares**; 25 Oct — added **Thermo Fisher at $427**, showing the allocation increase and transaction screenshots.\r\n\r\n---\r\n\r\n### PART 2 — SCREENERS: EXACT SETUPS\r\n\r\n#### 2.1 Finviz (free) — finviz.com → Screener\r\n\r\nUniverse: **~9,500 stocks and ETFs** in the database (not all US-listed; some non-US names included). Three tabs of criteria: **Descriptive, Fundamental, Technical**.\r\n\r\n**On P/E — deliberately left as \"Any\".** P/E by itself is completely meaningless. A high-P/E stock can be cheap and good; a low-P/E stock can be expensive and lousy. **P/E and Forward P/E → Any** (not used).\r\n\r\n**Fundamental filters, in the order he sets them:**\r\n\r\n| # | Filter | Setting used | Notes / rationale |\r\n|---|---|---|---|\r\n| 1 | P/E | **Any** | P/E alone is meaningless |\r\n| 2 | Forward P/E | **Any** | same |\r\n| 3 | EPS growth next 5 years | **Over 10%** (demonstrated **Over 20%** first → cut 9,000 to **492 stocks**; then relaxed to **Over 10%**) | Use **Over 20%** if you specifically want high-growth names; lower if you want steadier/predictable names |\r\n| 4 | Return on Equity (ROE) | **Over 10%** | He wants **12% or higher**, but Finviz only offers Over 10 / Over 15 → picks **Over 10**. After criteria 3+4: **550 stocks** |\r\n| 5 | Sales growth past 5 years | **Over 5%** | Wants a consistent revenue track record; can use Over 10% or Over 20% for stricter growth screens |\r\n| 6 | PEG ratio | **Under 2** | PEG is only a rough valuation gauge; theoretically >1 = overvalued, but many great companies run above 1, so he is deliberately lenient at **under 2** |\r\n| 7 | Current ratio | **Over 1** | |\r\n| 8 | EPS growth next year | **Over 5%** | Can raise to Over 10% depending on the stock type sought |\r\n| 9 | EPS growth past 5 years | **Over 5%**, then tightened to **Over 10%** | |\r\n| 10 | Return on Investment (ROI) | **Over 10%** | Similar to ROIC |\r\n\r\n**Result counts as demonstrated:** all fundamental criteria at the looser settings → **69 stocks**. Tightening EPS growth past 5 years to **Over 10%** → **55 stocks**.\r\n\r\nNames that surfaced in the demo: **Applied Materials, Arista Networks, Copart, Alphabet, Mastercard, MercadoLibre, Netflix, Winnebago (mid-cap), ZTO Express**; in chart view also **Booking.com, JBL**.\r\n\r\n**Technical filter added:**\r\n\r\n| # | Filter | Setting | Effect |\r\n|---|---|---|---|\r\n| 11 | Price vs 200-day SMA | **Price above SMA200** | Confirms overall trend is up. **55 → 37 stocks** |\r\n\r\n**Descriptive filters added:**\r\n\r\n| # | Filter | Setting | Effect |\r\n|---|---|---|---|\r\n| 12 | Market cap | **Large (over $10bn)** — optional | **37 → 15 stocks**. Leave open (small-cap and above) to keep the full **37** |\r\n| 13 | Dividend yield | **Over 2%** — only if hunting dividends | Collapsed the list to **2 stocks**; US stocks are not known for dividends, so normally leave it **Any** |\r\n\r\n**Operating principle:** the stricter you are, the fewer candidates; the more lenient, the more candidates. Set strictness according to whether you want **growth stocks** or **predictable stocks**.\r\n**Output use:** take the surviving list and run each name through the **7-step investment analysis**. The screener does not qualify a company — it only shortlists.\r\n**Extra view:** the \"Charts\" view lets you eyeball all survivors' charts quickly.\r\n\r\n**Finviz limitations (why he also pays for GuruFocus):**\r\n- **US-centric** — you can't sort for India, China or European stocks.\r\n- **You cannot set exact thresholds** — e.g. you cannot ask for ROE of exactly 12%, only the preset buckets.\r\n\r\n#### 2.2 GuruFocus (paid) — gurufocus.com → Screener → All-in-One Screener\r\n\r\nGuruFocus ships many **preset screeners** (e.g. Ben Graham's lost-formula / deep-value screen, fast growers, high-quality companies). But he builds his own custom screen, saved as **\"Adam VMI\"**.\r\n\r\n**Step 1 — Region.** Select the regions to hunt in: US only (uncheck Asia, Europe, etc.), or check **US + Asia + Europe** together; Canada, UK, Oceania also available.\r\n\r\n**Step 2 — The 12 criteria (11 fundamental + 1 valuation).** He deliberately keeps it simple:\r\n\r\n**Fundamental (11):**\r\n1. **Current ratio ≥ 1**\r\n2. **Interest coverage ratio ≥ 3**\r\n3. **Debt / EBITDA ≤ 3**\r\n4. **Return on Equity (ROE) ≥ 12%**\r\n5. **Return on Invested Capital (ROIC) ≥ 12%**\r\n6. **5-year average ROIC ≥ 12%**\r\n7. **Share buyback ratio ≥ 1%** — focuses on companies buying back shares. *Not a must, but a great-to-have.*\r\n8. **Financial Strength rank ≥ 7** (GuruFocus proprietary 1–10 ranking)\r\n9. **Profitability rank ≥ 7** (GuruFocus proprietary 1–10 ranking)\r\n10. **Predictability rank = 4 to 5 stars** (GuruFocus ranks predictability from past revenue, profits and cash flow)\r\n11. *(the above 8–10 are GuruFocus's own internal ranking metrics, which he deliberately piggybacks on)*\r\n\r\n**Valuation ratio (1):**\r\n12. **Price-to-GuruFocus-Value ratio: 0 to 1** — i.e. only stocks **not overvalued** on GuruFocus's own valuation.\r\n   - Caveat he states: he doesn't always agree with GuruFocus's intrinsic value — he finds them **sometimes too optimistic / too aggressive**, and **his own intrinsic value is always below theirs**. He uses it for screening only and **still does his own valuation** to confirm.\r\n\r\n**Result:** these 12 criteria filtered down to **21 stocks**. Names shown: **Alphabet, Visa, Johnson & Johnson, ASML, Cisco, Nike, Infosys, Agilent, Wipro**, and (transcript unclear) a life-sciences name — many of which he already owned.\r\n\r\n**Screening cadence: he screens at least ONCE A MONTH**, because new stocks appear and old ones drop out.\r\n\r\n**Screener output is never a buy signal.** Everything that survives still goes through the full **7-step analysis**.\r\n\r\n---\r\n\r\n### PART 3 — MONITORING: WATCH LIST AND PORTFOLIO ROUTINE\r\n\r\n#### 3.1 The watch list\r\n\r\n**When a stock goes on the watch list:** once it passes the **first five steps** of the 7-step analysis — i.e. it is confirmed a great business but the *price* is not yet right.\r\n\r\n**Watch list size: roughly 20–30 great companies.**\r\n\r\n**Daily routine: spend ~5 minutes a day** running through the watch list, waiting for the right entry.\r\n\r\n**The entry condition being waited for (both must be true):**\r\n1. Price drops **below intrinsic value** (undervalued), **AND**\r\n2. Price waves down to a **level of support you have already identified**.\r\n\r\nThe whole point is **patience** — wait for the right point to pull the trigger.\r\n\r\n#### 3.2 Platforms for building watch lists\r\n\r\n**TradingView.com** (his charting software)\r\n- Right-hand panel → open the watch-list icon → \"Create new list\" → name it → save → click **+** to add tickers.\r\n- You can run **multiple watch lists**, either by market (US Stocks Watchlist / Asian Stocks Watchlist / European Stocks Watchlist) or by **investment category** (dividend stocks / growth stocks / more speculative growth stocks).\r\n- Demo tickers added: **Abbott Laboratories, BlackRock, Accenture, Pepsi, Procter & Gamble, Fortinet, Microsoft** — deliberately a mix of technology, consumer staples and financials.\r\n\r\n**Thinkorswim (TD Ameritrade)** — both a broker and a charting platform. His watch list sits on the left.\r\n\r\n**Interactive Brokers** — New Window → Watch List; the panel can be dragged/docked anywhere on the workstation (he keeps it on the right, chart on the left, then locks the layout).\r\n- **Free TradingView charts inside IBKR**: New Window → Chart → **Advanced Chart**. Functions are somewhat limited versus standalone TradingView, **but you can add all the moving averages for free** — whereas standalone TradingView requires a paid subscription for many of those moving averages.\r\n\r\n#### 3.3 How the chart is marked up (the actual monitoring template)\r\n\r\nFor every stock on the list he draws:\r\n- **A green line at the intrinsic value.**\r\n- **Three to four buy levels per stock**, each placed at a **significant support level below the intrinsic value**.\r\n\r\nWorked examples:\r\n- **Abbott Laboratories** — intrinsic value **$111**; buy levels **$104, $101, $96, $88**. Price recently dropped through level 1, level 2, level 3 and almost to level 4 → shares could have been added at each; it then reversed back up. Still undervalued at the time of recording.\r\n- **Accenture** — intrinsic value **$314**; buy levels **$301, $282, $262, $242**. Price fell all the way to **$242** (the last buy level) last year — a great time to add.\r\n\r\n**How the levels are used:** buy **in tranches**, roughly a quarter at each level; by the last support level you should hold a **full position**. Never buy all at once — average into the position. A great business will always rebound once market sentiment shifts.\r\n\r\n**Once bought**, the stock moves from watch list → portfolio. His own portfolio holds **40 stocks**; a normal target is **10–40 stocks**.\r\n\r\n#### 3.4 The daily portfolio check\r\n\r\n- **Yes, monitor regularly — but under 10 minutes a day**, when the market is open.\r\n- **What you are looking for:** whether any price has retraced into a **buy zone** — i.e. **below intrinsic value AND at/near an identified support level**. If you don't yet hold a full position, add more shares.\r\n- Once the intrinsic value is exceeded, you can't buy any more until either the intrinsic value rises on revaluation, or price drops back below it.\r\n\r\n**What NOT to do while checking:** do not be concerned about **daily fluctuations**. That is volatility, and volatility is normal. Don't freak out if a great company drops **10%, 20% or 30%** — most of the time a price drop has **nothing to do with the value of the underlying business**. \"Be chill. Be zen.\"\r\n\r\n**Mr. Market framing.** The market behaves like a drunk, psychotic person with bipolar disorder — very happy one day, very sad the next. Daily prices are driven by **emotions, sentiment and manipulation**, not logic. On fearful red days you have exactly **two** legitimate options:\r\n1. **Take advantage of him** — buy more shares of great companies at depressed prices (if you don't yet hold a full position).\r\n2. **Ignore him** — if you already hold a full position, go fishing, don't even look.\r\n\r\nWhat you must **never** do is be **influenced** by him — getting scared when he's scared, excited when he's excited. That is the road to ruin.\r\n\r\nPrices never go up in a straight line; they move in **wave patterns** — wave up, wave down, wave up. \"After breathing out, you have to breathe in.\"\r\n\r\n#### 3.5 The 10 reasons a stock price drops (the diagnostic checklist)\r\n\r\nWhen price drops, classify the cause. **Reasons 1–9 are ~99% of cases, are all temporary, and are all buying opportunities (or things to ignore). Only reason 10 justifies concern.**\r\n\r\n**Non-company-specific (macro/market):**\r\n1. **Macro or geopolitical news** — a Middle East war, the Ukraine war, recession fears, the Fed raising interest rates. Hits all companies, not just yours.\r\n2. **Bear market** — happens on average **once every six years**; the whole market turns negative and good and bad companies drop together for purely emotional reasons.\r\n3. **Correction** — happens on average **once a year**; market drops about **10–15%**; good companies drop too.\r\n4. **Sector rotation** — money rotates between sectors. In 2023 institutions rotated **out of healthcare into technology**, so all healthcare names fell regardless of quality and most tech names rose regardless of quality. Nothing wrong with your company. Buy the discount; rotation eventually reverses (he suspected a rotation back into healthcare in 2024).\r\n5. **Industry-specific news** — e.g. the 2023 Ozempic story dragging the whole food industry down (McDonald's, Pepsi, Yum Brands, Hershey's).\r\n6. **Manipulation by market makers and algo traders.**\r\n\r\n**Company-specific but still temporary:**\r\n7. **Missed earnings estimates or lowered forward guidance.** Companies report **four times a year**; analysts publish a projection beforehand (e.g. \"McDonald's will earn $5 per share\"). Beat → price usually jumps; miss → price gaps down.\r\n   - **Can you predict a beat or a miss? No — it's a coin toss, 50/50.**\r\n   - Don't be upset by a miss and don't be too happy about a beat: **a great company will have bad quarters and good quarters.** A miss + panic selling = an opportunity to add.\r\n   - **Lowered forward guidance** can knock **5–10%** off even after a beat. *Example*: Adobe announced better-than-expected earnings but guided next-year revenue below projection → **stock dropped 6%**. Not a concern; it's a buying opportunity.\r\n8. **Cyclical slowdown in demand.** Even great businesses aren't linear. Semiconductors (ASML, Texas Instruments, Nvidia, AMD) trend up long term but dip in between. Online advertising grows long term but ad spend dips in slowdowns — in **2022** ad-spend fear of recession dented **Alphabet and Meta** revenue, which **re-accelerated the following year**. Semis did the same.\r\n9. **Other temporary bad news** — a **product recall** (e.g. Tesla recalling cars over a manufacturing fault), a **lawsuit**, a **sex scandal**, or a **forced seller**: a major shareholder dumping stock for personal reasons unrelated to the business. All temporary; all buying opportunities.\r\n   - **The one exception inside this bucket: accusation of financial fraud → sell immediately, do not hold.**\r\n\r\n**The only genuinely dangerous one:**\r\n10. **A structural / long-term problem** — permanent damage to the business model; revenue will never grow again, profits will never re-accelerate, or the **economic moat has permanently deteriorated** so the company can no longer fend off competition. **Rare** if you bought a wide-moat company that met all the criteria — but possible, so watch for it.\r\n   - Historical examples: **Nokia** (90% market share, disrupted by iPhone touchscreen and BlackBerry); **Blockbuster Video** (disrupted by Netflix streaming); **Kodak** (disrupted by digital photography); **Yahoo** (the #1 search engine, disrupted by Google); **AMC** movie theatres (disrupted by streaming + permanent change in consumer behaviour). None of them ever recovered.\r\n   - Root causes: **moat deterioration, permanent disruption of the business model, permanent change in consumer behaviour.**\r\n   - If unsure whether a problem is short-term or permanent, raise it in the **Discord private community chat** for feedback.\r\n\r\n#### 3.6 Earnings reports — the quarterly routine\r\n\r\n- Companies report **four times a year**; earnings seasons cluster in **April, July, October and January**.\r\n- **Finding the next earnings date:** on the **TradingView** chart (also on Thinkorswim), the letters under the chart mark events — **\"E\" = earnings**. Past E's show historical reports; the **purple** upcoming E shows the next one. Clicking it shows the date and the **analyst EPS estimate**.\r\n  - *Example*: Apple's next earnings **25 January 2024**, analysts projecting **$2.08 per share** for the quarter. Beat → price usually jumps; miss → price usually drops.\r\n- **\"D\" = dividends** — marks the **ex-dividend date**. Buy before the ex-dividend date to receive the dividend.\r\n- **Earnings calendar:** `finance.yahoo.com/calendar/earnings` — see which stocks report in coming days, weeks or months, and search for a specific company's next earnings date.\r\n\r\n**What to actually read after a report:**\r\n1. **The quarterly report itself** — download from the company's own website under **Investor Relations** (e.g. apple.com, adobe.com): latest quarterly financial reports and annual reports.\r\n2. **The conference call** — after results, the CEO and management take analyst questions. Listen to the audio or read the transcript. Find it by Google-searching e.g. \"Adobe conference call\"; transcripts show in the results.\r\n3. **seekingalpha.com** — search for conference calls and earnings results for all major stocks.\r\n\r\n**What you are reading for:** how **management is executing on its plans**, and — if revenue or profits dipped — **management's explanation of what happened**.\r\n\r\n**Framing:** don't be overly concerned about short-term beats or misses. You are only concerned with **long-term structural damage to the competitive advantage or business model**. That doesn't happen overnight — **it takes years for a company to lose its competitive advantage**, so you will see it coming.\r\n\r\n#### 3.7 Corporate announcements — how to read each one\r\n\r\n**Share buybacks — usually bullish, but conditional.** Fewer shares outstanding → higher value per share. **BUT** a buyback is only good if:\r\n- The shares are **undervalued** when repurchased. Buying back at an **all-time high / expensive price is NOT acting in shareholders' interest**; and\r\n- The **company itself is doing well** — revenue and profits growing.\r\nIf the company is doing badly (falling revenue, falling profits, eroding competitive advantage), it should be spending cash on **improving the business, products, services and hiring better people**, not on buybacks.\r\n- *Cautionary example*: years ago **IBM's** business was deteriorating and the CEO kept buying back shares to **artificially inflate EPS** instead of fixing the business — long-term detrimental.\r\n\r\n**New share issuance / rights issue — bearish to neutral.** Companies sell new shares when they need to raise money. Most companies he owns hold lots of cash and never need to. If one of your holdings issues shares, **find out what the money is for**:\r\n- To **pay off debt** → not a good sign.\r\n- Because they're **short of money for working capital** → not a good sign.\r\n- To fund an **acquisition** → check the target: is it a good company? Are they overpaying?\r\nGenerally he dislikes it, because issuance **dilutes existing shareholders**. In a **rights issue**, existing holders get first right to buy new shares **at a discount**; you can exercise the rights (put in more money), **sell the rights** for cash, or **let them expire**.\r\n\r\n**Stock split — bullish (mildly), but changes nothing fundamental.** A split does **not** change the value of the business, better or worse. It only makes shares look more affordable.\r\n- *Worked example*: Amazon at **$3,000/share**; you own 1 share = $3,000. A **20-for-1 split** gives you **20 shares at $150** = still **$3,000**. Like cutting a pizza into 20 smaller pieces.\r\n- **The intrinsic value splits proportionally.** His pre-split Amazon intrinsic value was about **$3,500**; after the 20-for-1 split the new intrinsic value is **$175**.\r\n- Why it's mildly bullish: at $3,000 few retail investors can buy a share; at $150 many can → more demand → can temporarily lift the price.\r\n\r\n**Reverse stock split — normally bearish.** The company combines e.g. **10 shares into 1** because the share price is too low and they want it to look more respectable.\r\n\r\n**Cash dividends.** Announcement carries an **ex-dividend date** (buy before it to receive the dividend; buy after and you don't) and a **payout date** (when it is credited to your account).\r\n\r\n**Where to read announcements:**\r\n- **Finviz** — enter the ticker (e.g. AAPL) and scroll down for recent news and public announcements.\r\n- **Yahoo Finance** — the ticker page, scroll to **Press Releases**; also **SEC filings**, which can be sorted by **financial reports, corporate changes, tender offer / acquisition reports, proxy statements**. Splits, dividend issues and results all get filed with the SEC.\r\n\r\n---\r\n\r\n### PART 4 — DEALING WITH DRAWDOWNS\r\n\r\n#### 4.1 Psychology is the majority of the game\r\n\r\n- Many very smart people with finance degrees and CFAs are **terrible investors** because they can't control their psychology and emotions.\r\n- **\"70% of investing success comes down to managing your psychology.\"**\r\n- A **drawdown** = a temporary drop in the price of the stocks you own and in the market value of your portfolio.\r\n- **Drawdowns are inevitable** — no portfolio goes up in a straight line, no matter how good the investor. Analogy: no matter how good a pilot you are, you cannot fly without turbulence. Be prepared for it, don't panic, ride the wave, and use it to build positions in great companies.\r\n\r\n#### 4.2 The evidence — real drawdown numbers\r\n\r\n**His own portfolio, last 5 years** (a period with **two bear markets in five years** — rare — plus the 2020 recession, the Ukraine war, very high interest rates and very high inflation):\r\n- Portfolio **+141%** over 5 years, beating the S&P 500 by a wide margin.\r\n- **2020 drawdown: −25%.**\r\n- **2022 drawdown: −30%.**\r\n\r\n**Warren Buffett / Berkshire Hathaway, last 10 years** (58 years of investing):\r\n- **+312%**, beating the S&P 500; **~12% compounded annual return**.\r\n- Drawdowns along the way: **−18%, −16%, −30%, −27%, −9%, −11%.** Even the greatest investor in the world takes drawdowns.\r\n\r\n**Peter Lynch / Magellan Fund, 1977–1990 (13 years):**\r\n- Fund **+604%** vs S&P 500 **+223%** — beat the index by over **3x**; **~29% compounded annual return**.\r\n- Drawdowns during that run: **−56%, −27%, −42%, −32%.**\r\n- **The kicker: more than 50% of the clients in his fund LOST money.** The best fund in the world, 29% a year, and a majority of investors lost.\r\n- **Why:** investors bought **after** strong runs (when excited), then panic-sold into the −56%, −27%, −42% drawdowns — repeatedly buying high and selling low.\r\n- **Conclusion:** you can own the best fund or the best stocks in the world and still lose money if you buy when everyone is excited and sell when everyone panics.\r\n\r\n#### 4.3 The behavioural rules for drawdowns\r\n\r\n1. **Expect them and be psychologically prepared before they happen.** If you're not prepared, you'll freak out and do \"dumb, stupid things\" — selling in fear and being worse off after the rebound.\r\n2. **Don't try to predict them.** There is **no way to predict** when a bear market or correction will hit.\r\n3. **Roller-coaster rule: the only people who get hurt on a roller coaster are those who jump off halfway.** Keep the seatbelt fastened through the ups and downs and you always reach a destination far higher than the start.\r\n4. **On panic days, two actions only:** add shares if you don't hold a full position (price below intrinsic value, at a support level), or **ignore the market entirely** if you do. Never be *influenced*.\r\n5. **Buy when others panic; don't buy more when everyone is excited.** \"You've got to buy great companies when it has collapsed, when people are panicking.\"\r\n6. Alternatively, when everything is euphoric you may **sell a bit to take profits**, or simply hold through the ups and downs — because eventually it goes higher.\r\n7. **Drawdowns don't matter to the end result** as long as you hold great companies — the compounding continues.\r\n8. **Optional hedging (see §6.4)** — covered calls and protective puts during corrections/bear markets. *Nice to have, not a must.*\r\n\r\n---\r\n\r\n### PART 5 — SELL RULES: THE SIX VALID REASONS TO SELL\r\n\r\nDefault stance: when you own shares in a great business, **hold as long as possible** — for years — and let it compound **5x, 10x, 50x or even 100x**. There are only **six valid reasons** to sell.\r\n\r\n---\r\n\r\n#### SELL RULE 1 — The business is no longer great: fundamentals have deteriorated PERMANENTLY\r\n\r\nTriggered by permanently changed consumer preferences, disruption by technology or competition, or **permanent deterioration of the economic moat**.\r\n\r\n**Frequency:** rare. A **wide-moat** company should sustain its moat for **at least 20 y
