<script>
var PAPER_LOCAL = true;
(async function(){
"use strict";
/* ------------------------------------------------------------------
   IBKR Client Portal Web API adapter.
   Talks to the gateway on localhost:5000 through the /api proxy that
   serve.py provides, and normalises every response into the same shape
   the Claude connector returns, so the trading engine above is untouched.
   ------------------------------------------------------------------ */
var GW_ACCOUNTS = [], GW_PAPER = false, GW_NODATA = 0;
function gwRaw(path, opts){
  opts = opts||{};
  return fetch('/api'+path, {
    method: opts.method||'GET',
    headers: {'Content-Type':'application/json'},
    body: opts.body ? JSON.stringify(opts.body) : undefined
  }).then(function(r){
    if(r.status===401 || r.status===403) throw {code:'not_authenticated'};
    if(r.status===410) throw {code:'session_gone'};
    if(r.status===502 || r.status===503 || r.status===504) throw {code:'gateway_down'};
    if(!r.ok) throw {code:'http_'+r.status, status:r.status};
    return r.text().then(function(t){ try { return t? JSON.parse(t) : null; } catch(e){ throw {code:'bad_json'}; } });
  }, function(){ throw {code:'gateway_down'}; });
}
/* A 410 from the gateway means the brokerage session ended underneath you - it happens
   after idling, or when the same login is used elsewhere. Re-authenticate and retry once. */
function gwFetch(path, opts){
  return gwRaw(path, opts).catch(function(e){
    if(!e || (e.code!=='session_gone' && e.code!=='not_authenticated')) throw e;
    return gwRaw('/iserver/reauthenticate?force=true', {method:'POST'})
      .catch(function(){ return null; })
      .then(function(){ return new Promise(function(res){ setTimeout(res, 1200); }); })
      .then(function(){ return gwRaw('/iserver/auth/status', {method:'POST'}).catch(function(){ return null; }); })
      .then(function(st){
        if(st && st.authenticated){ GW_REAUTHS++; return gwRaw(path, opts); }
        throw {code:'session_gone'};
      });
  });
}
var GW_REAUTHS = 0;
function gwStatus(){
  return gwFetch('/iserver/auth/status', {method:'POST'}).then(function(a){
    if(!a || !a.authenticated) return {ok:false, why:'not logged in', msg:'The gateway is reachable but not authenticated. Open https://localhost:5000 in a tab, log in with your IBKR credentials, then press Reconnect.'};
    /* the accounts call must happen once before market data will stream */
    /* this call must happen before any market data request, and it also tells us
       whether the gateway is logged into a paper login (DU/DF) or a live one */
    return gwFetch('/iserver/accounts').then(function(acc){
      GW_ACCOUNTS = (acc && acc.accounts) || [];
      GW_PAPER = GW_ACCOUNTS.some(function(a){ return /^(DU|DF)/i.test(String(a)); });
      return {ok:true, why:'', accounts:GW_ACCOUNTS.length, paper:GW_PAPER};
    }, function(){ return {ok:true, why:'', accounts:0}; });
  }, function(e){
    if(e && e.code==='not_authenticated') return {ok:false, why:'not logged in', msg:'The gateway is reachable but not authenticated. Open https://localhost:5000, log in, then press Reconnect.'};
    return {ok:false, why:'not reachable', msg:'No IBKR gateway answering on localhost:5000. Start the Client Portal Gateway, log in at https://localhost:5000, then press Reconnect.'};
  });
}
/* CPAPI returns numbers as strings, sometimes prefixed (C=previous close) or
   suffixed with K/M/B on volume. */
function gwNum(v){
  if(v==null) return null;
  if(typeof v==='number') return v;
  var s=String(v).trim(), mult=1;
  if(/^[A-Za-z]/.test(s)) s=s.replace(/^[A-Za-z]+/,'');
  var last=s.slice(-1).toUpperCase();
  if(last==='K'){mult=1e3;s=s.slice(0,-1);} else if(last==='M'){mult=1e6;s=s.slice(0,-1);} else if(last==='B'){mult=1e9;s=s.slice(0,-1);}
  s=s.replace(/,/g,'');
  var f=parseFloat(s);
  return isFinite(f) ? f*mult : null;
}
var GW_FIELDS = '31,84,85,86,87,88,82,83,70,71,7295,7296,7635';
var MONTHS3 = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
function gwThirdFriday(mon){                       /* 'SEP26' -> '20260918' */
  var mi = MONTHS3.indexOf(String(mon).slice(0,3).toUpperCase());
  var yy = parseInt(String(mon).slice(3),10); if(!isFinite(yy)) return '';
  var year = 2000+yy, d = new Date(Date.UTC(year, mi, 1));
  var firstFri = (5 - d.getUTCDay() + 7) % 7 + 1;
  var day = firstFri + 14;
  var mm = mi+1;
  return ''+year+(mm<10?'0':'')+mm+(day<10?'0':'')+day;
}
function gwPool(items, worker, width){
  width = width||6; var i=0;
  function next(){
    if(i>=items.length) return Promise.resolve();
    var it=items[i++];
    return Promise.resolve(worker(it)).catch(function(){}).then(next);
  }
  var runners=[]; for(var w=0;w<Math.min(width,items.length);w++) runners.push(next());
  return Promise.all(runners);
}
function gwSecdef(symbol){
  return gwFetch('/iserver/secdef/search', {method:'POST', body:{symbol:String(symbol), name:false}});
}
var GW_MATS = {};   /* conid|month -> [maturityDate,...] */
function gwMaturities(ucid, month, exch){
  var key = ucid+'|'+month;
  if(GW_MATS[key]) return Promise.resolve(GW_MATS[key]);
  return gwFetch('/iserver/secdef/strikes?conid='+ucid+'&sectype=OPT&month='+encodeURIComponent(month)+'&exchange='+encodeURIComponent(exch))
    .then(function(st){
      var calls=(st&&st.call)||[];
      if(!calls.length) throw {code:'no_strikes'};
      /* probe a mid strike: secdef/info returns one row per maturity in the month */
      var probe = Number(calls[Math.floor(calls.length/2)]);
      return gwFetch('/iserver/secdef/info?conid='+ucid+'&sectype=OPT&month='+encodeURIComponent(month)
        +'&exchange='+encodeURIComponent(exch)+'&strike='+probe+'&right=C');
    }).then(function(rows){
      var seen={}, out=[];
      (rows||[]).forEach(function(r){ var m=String(r.maturityDate||''); if(m && !seen[m]){ seen[m]=1; out.push(m); } });
      out.sort();
      GW_MATS[key] = out.length?out:[gwThirdFriday(month)];
      return GW_MATS[key];
    }, function(){ GW_MATS[key]=[gwThirdFriday(month)]; return GW_MATS[key]; });
}
/* 1-minute bars, used to reconstruct whether a resting order's price actually traded */
var GW_BARS = {};
function gwBars(conid, sinceTs){
  var now = Date.now(), c = GW_BARS[conid];
  if(c && now - c.at < 15000) return Promise.resolve(c.data);
  return gwFetch('/iserver/marketdata/history?conid='+conid+'&period=1d&bar=1min&outsideRth=true')
    .then(function(h){
      var data = ((h&&h.data)||[]).map(function(b){
        return {t:Number(b.t), o:Number(b.o), h:Number(b.h), l:Number(b.l), c:Number(b.c), v:Number(b.v)};
      });
      GW_BARS[conid] = {at:now, data:data};
      return data;
    }, function(){ return []; });
}
function callGW(tool, input){
  input = input||{};
  if(tool==='search_contracts'){
    return gwSecdef(input.query).then(function(rows){
      rows = rows||[];
      return {results: rows.map(function(r){
        var secs = (r.sections||[]).map(function(s){ return {security_type:s.secType}; });
        return {
          underlying_contract_id: Number(r.conid),
          symbol: r.symbol || r.ticker || '',
          description: r.companyName || r.companyHeader || '',
          exchange: r.description || '',
          country_code: '',
          sections: secs.length?secs:[{security_type:'STK'}]
        };
      })};
    });
  }
  if(tool==='get_price_snapshot'){
    var cid = Number(input.contract_id);
    var url = '/iserver/marketdata/snapshot?conids='+cid+'&fields='+GW_FIELDS;
    /* the first snapshot request only primes the subscription */
    return gwFetch(url).then(function(){
      return new Promise(function(res){ setTimeout(res, 350); });
    }).then(function(){
      return gwFetch(url);
    }).then(function(rows){
      var d = (rows&&rows[0])||{};
      var bid=gwNum(d['84']), ask=gwNum(d['86']), last=gwNum(d['31']), mark=gwNum(d['7635']);
      if(bid==null && ask==null && last==null) GW_NODATA++; else GW_NODATA = 0;
      var out = {
        'bid-ask': {bid:bid, ask:ask, bid_size:gwNum(d['88']), ask_size:gwNum(d['85'])},
        'last': last!=null ? {price:last, halted:false, is_close:false} : {},
        'top-status': {status:'REALTIME'}
      };
      if(mark!=null) out.plprice = {price:mark};
      var ch=gwNum(d['82']), chp=gwNum(d['83']);
      if(ch!=null||chp!=null) out.change = {change:ch, change_pct:chp};
      var pc=gwNum(d['7296']); if(pc!=null) out['prior-close'] = {price:pc};
      var op=gwNum(d['7295']); if(op!=null) out.open={open:op};
      var hi=gwNum(d['70']); if(hi!=null) out.high={high:hi};
      var lo=gwNum(d['71']); if(lo!=null) out.low={low:lo};
      var vo=gwNum(d['87']); if(vo!=null) out.volume={volume:vo};
      return out;
    });
  }
  if(tool==='get_option_parameters'){
    var uc = Number(input.underlying_contract_id);
    return gwFetch('/iserver/secdef/info?conid='+uc+'&sectype=STK').then(function(){ return null; }, function(){ return null; })
      .then(function(){ return gwFetch('/trsrv/secdef?conids='+uc).then(function(x){ return x; }, function(){ return null; }); })
      .then(function(sd){
        var sym = (sd && sd.secdef && sd.secdef[0] && sd.secdef[0].ticker) || null;
        return sym ? gwSecdef(sym) : gwSecdef(String(uc));
      }).then(function(rows){
        var row = (rows||[]).filter(function(r){ return Number(r.conid)===uc; })[0] || (rows||[])[0];
        if(!row) throw {code:'no_contract'};
        var opt = (row.sections||[]).filter(function(s){ return s.secType==='OPT'; })[0];
        if(!opt || !opt.months) throw {code:'no_options'};
        var months = String(opt.months).split(';').filter(Boolean);
        var exch = opt.exchange||'SMART';

          return gwMaturities(uc, m, exch).then(function(ds){ return {m:m, dates:ds}; },
                                               function(){ return {m:m, dates:[gwThirdFriday(m)]}; });
        })).then(function(res){
          var exps=[];
          res.forEach(function(r){
            var monthly = gwThirdFriday(r.m);
            r.dates.forEach(function(d){

          });

    var parts = String(input.expiration_id).split('|');

      .then(function(st){

            .filter(function(r){ return r.call_contract_id || r.put_contract_id; })};

      {method:'POST', body:{orders:[input.order]}});

  if(tool==='search_futures'){

        })};

  }

}

/* ------------------------------------------------------------------
   Streaming market data over the gateway's WebSocket, bridged by serve.py.
   Ticks land in Q as they arrive; REST polling stays as the fallback and
   as the backfill for anything the stream has not sent yet.
   ------------------------------------------------------------------ */
var STREAM = {
  sock:null, ready:false, subs:{}, want:{}, tries:0, timer:null, tickle:null,
  lastMsg:0, onTick:null, onState:null, state:'idle'
};
function streamSetState(s){
  if(STREAM.state===s) return;
  STREAM.state = s;
  if(STREAM.onState) try { STREAM.onState(s); } catch(e){}
}
function streamState(){
  if(!STREAM.sock) return STREAM.state;
  if(STREAM.ready) return 'streaming';
  return 'connecting';
}
function streamConnect(onTick, onState){
  if(onTick) STREAM.onTick = onTick;
  if(onState) STREAM.onState = onState;
  if(STREAM.sock && (STREAM.sock.readyState===0 || STREAM.sock.readyState===1)) return;
  var proto = location.protocol==='https:' ? 'wss://' : 'ws://';
  var sock;
  try { sock = new WebSocket(proto+location.host+'/ws'); }
  catch(e){ streamSetState('unavailable'); return; }
  STREAM.sock = sock; STREAM.ready=false; streamSetState('connecting');
  sock.onopen = function(){
    STREAM.tries = 0;
    /* the gateway wants the tickle session id as the first message */
    gwFetch('/tickle').then(function(t){
      STREAM.tickle = (t && t.session) || null;
      if(STREAM.tickle) sock.send(JSON.stringify({session:STREAM.tickle}));
      STREAM.ready = true;
      resubscribe();
      streamSetState('streaming');
    }, function(){
      STREAM.ready = true; resubscribe(); streamSetState('streaming');
    });
  };
  sock.onmessage = function(ev){
    STREAM.lastMsg = Date.now();
    var msg;
    try { msg = JSON.parse(ev.data); } catch(e){ return; }
    if(!msg) return;
    if(msg.topic === 'sts' || msg.topic === 'system' || msg.topic === 'act') return;
    var topic = String(msg.topic||'');
    if(topic.indexOf('smd+')!==0) return;
    var conid = Number(topic.slice(4));
    if(!conid) return;
    var patch = gwTickPatch(msg);
    if(patch && STREAM.onTick) STREAM.onTick(conid, patch);
  };
  sock.onclose = function(){
    STREAM.ready=false; STREAM.sock=null; STREAM.subs={};
    streamSetState('reconnecting');
    var wait = Math.min(30000, 1000*Math.pow(2, Math.min(5, STREAM.tries++)));
    if(STREAM.timer) clearTimeout(STREAM.timer);
    STREAM.timer = setTimeout(function(){ streamConnect(); }, wait);
  };
  sock.onerror = function(){ streamSetState('error'); };
  /* keepalive: the gateway drops idle sessions */
  if(!STREAM.keep) STREAM.keep = setInterval(function(){
    if(STREAM.sock && STREAM.sock.readyState===1){
      try { STREAM.sock.send('tic'); } catch(e){}
    }
  }, 25000);
}
/* one streamed message -> the same quote fields parseSnap produces */
function gwTickPatch(m){
  var out = {}, any=false;
  function put(k, v){ if(v!=null){ out[k]=v; any=true; } }
  put('bid',      gwNum(m['84']));
  put('ask',      gwNum(m['86']));
  put('bidSize',  gwNum(m['88']));
  put('askSize',  gwNum(m['85']));
  put('last',     gwNum(m['31']));
  put('mark',     gwNum(m['7635']));
  put('change',   gwNum(m['82']));
  put('changePct',gwNum(m['83']));
  put('high',     gwNum(m['70']));
  put('low',      gwNum(m['71']));
  put('open',     gwNum(m['7295']));
  put('volume',   gwNum(m['87']));
  put('prevClose',gwNum(m['7296']));
  if(!any) return null;
  out.at = Date.now();
  return out;
}
function streamSubscribe(conids){
  STREAM.want = {};
  for(var i=0;i<conids.length;i++) STREAM.want[conids[i]] = 1;
  resubscribe();
}
function resubscribe(){
  var s = STREAM.sock;
  if(!s || s.readyState!==1 || !STREAM.ready) return;
  var fields = JSON.stringify({fields:GW_FIELDS.split(',')});
  var c;
  for(c in STREAM.want){
    if(!STREAM.subs[c]){
      try { s.send('smd+'+c+'+'+fields); STREAM.subs[c]=1; } catch(e){}
    }
  }
  for(c in STREAM.subs){
    if(!STREAM.want[c]){
      try { s.send('umd+'+c+'+{}'); } catch(e){}
      delete STREAM.subs[c];
    }
  }
}

/* ------------------------------------------------------------------
   Free-provider fallback. Used when the IBKR gateway is not running.
   Every free tier is delayed and most publish no bid/ask, so a spread is
   synthesised from the instrument's liquidity class and the quote is flagged
   so nothing pretends this is live depth.
   ------------------------------------------------------------------ */
var TWSINFO = null;
var FEED = {client:'desk_'+(globalThis.crypto&&crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now()),
  source:null, signature:'', pending:null, timer:null, lastEvent:0, connected:false, requested:0, loaded:0, capacity:0, problem:'Connecting to IB Gateway'};
function usingTws(){ return LOCAL && usingFree() && FREE.provider==='tws'; }
function feedStop(){
  if(FEED.source){ FEED.source.close(); FEED.source=null; }
  FEED.connected=false; FEED.signature='';
}
function feedApply(payload){
  if(!usingTws()) return;
  if(FEED.generation!=null && payload.generation!=null && FEED.generation!==payload.generation) Q={};
  FEED.generation=payload.generation;
  FEED.lastEvent=Date.now(); FEED.connected=!!payload.connected && payload.feedHealthy!==false;
  FEED.requested=payload.requested||0; FEED.loaded=payload.loaded||0; FEED.capacity=payload.capacity||0;
  FEED.problem=payload.problem||''; FEED.overCapacity=payload.overCapacity||0;
  TWSINFO=payload;
  Object.keys(payload.quotes||{}).forEach(function(cid){
    var q=payload.quotes[cid];
    if(q.greeks) OPTMETA[cid]=Object.assign(OPTMETA[cid]||{},q.greeks);
    onTick(Number(cid),q);
  });
  renderDiag();
}
function feedOpen(){
  if(FEED.source || !usingTws()) return;
  var source=new EventSource('/data/stream?client='+encodeURIComponent(FEED.client));
  FEED.source=source;
  source.addEventListener('quotes',function(event){
    if(source!==FEED.source) return;
    try { feedApply(JSON.parse(event.data)); } catch(e){ FEED.problem='Invalid market-data response'; }
  });
  source.onerror=function(){ if(source===FEED.source){ FEED.connected=false; FEED.problem='Reconnecting quote stream'; renderDiag(); } };
}
function feedSync(force){
  if(!usingTws()) return Promise.resolve();
  if(FEED.pending) return FEED.pending;
  var list=universe(), signature=JSON.stringify(list);
  if(!force && signature===FEED.signature){ feedOpen(); return Promise.resolve(); }
  var controller=new AbortController(), timer=setTimeout(function(){controller.abort();},8000);
  FEED.pending=fetch('/data/subscriptions',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({client:FEED.client,instruments:list}),signal:controller.signal})
    .then(function(r){if(!r.ok)throw new Error('Subscription request failed ('+r.status+')');return r.json();})
    .then(function(data){ FEED.signature=signature; feedApply(data); feedOpen(); })
    .catch(function(e){FEED.connected=false; FEED.problem=e.message||'Gateway subscription failed'; renderDiag();})
    .finally(function(){
      clearTimeout(timer);FEED.pending=null;
      if(usingTws() && signature!==JSON.stringify(universe())) syncSubs();
    });
  return FEED.pending;
}
function quoteReady(conid){
  var q=Q[conid];
  if(!q||q.error||q.halted||q.bid==null||q.ask==null||!(q.bid>=0)||!(q.ask>0)||q.ask<q.bid) return false;
  if(usingTws()) return !/10197|competing live session/i.test(FEED.problem||'') && FEED.connected && Date.now()-FEED.lastEvent<15000 && q.status==='LIVE' && Date.now()-q.at<15000;
  return Date.now()-q.at<60000;

var FREE = {provider:'tws', key:'', info:null, symOf:{}, chain:{}};
/* providers hand back expirations in their own shape: epoch seconds (Yahoo) or
   an ISO date (Alpaca, Tradier). Normalise to YYYYMMDD for display. */
function freeYmd(tok){
  var s = String(tok);
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s.replace(/-/g,'');
  if(/^\d{8}$/.test(s)) return s;
  var n0 = Number(s);
  if(isFinite(n0) && n0>1e8){
    var d = new Date(n0*1000), mm=d.getUTCMonth()+1, dd=d.getUTCDate();
    return ''+d.getUTCFullYear()+(mm<10?'0':'')+mm+(dd<10?'0':'')+dd;
  }
  return s;
}
function isThirdFriday(ymd){
  if(!/^\d{8}$/.test(String(ymd))) return false;
  var y=+ymd.slice(0,4), m=+ymd.slice(4,6)-1, d=+ymd.slice(6,8);
  var dt=new Date(Date.UTC(y,m,d));
  return dt.getUTCDay()===5 && d>=15 && d<=21;
}
function freeRemember(sym){
  /* freeId() is a one-way hash, and FREE.symOf is the only way back. It starts
     empty on every load, so anything restored from saved state - a watched
     symbol, an open position, the last chain - has an id nothing can resolve
     until its ticker is registered again. */
  if(!sym) return null;
  var id = freeId(sym);
  FREE.symOf[id] = String(sym).toUpperCase();
  return id;
}
function freeId(sym){                       /* stable numeric id from a symbol */
  var h = 2166136261, s = String(sym).toUpperCase();
  for(var i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = (h*16777619)>>>0; }
  return 900000000 + (h % 90000000);
}
function wait(ms){ return new Promise(function(res){ setTimeout(res, ms); }); }
function freeFetch(kind, params){
  var useOpt = (kind==='chain') && S.settings.optProvider;
  var prov = useOpt ? S.settings.optProvider : FREE.provider;
  var key  = useOpt ? (S.settings.optKey || FREE.key) : FREE.key;
  var qs = ['provider='+encodeURIComponent(prov)];
  if(key) qs.push('key='+encodeURIComponent(key));
  for(var k in params) if(params[k]!=null) qs.push(k+'='+encodeURIComponent(params[k]));
  return fetch('/data/'+kind+'?'+qs.join('&')).then(function(r){
    if(!r.ok) throw {code:'provider_http_'+r.status};
    return r.json();
  }, function(){ throw {code:'provider_unreachable'}; }).then(function(j){
    if(j && j.error) throw {code:'provider_error', detail:j.error};
    if(j && j.served_by){
      FREE.servedBy = j.served_by; FREE.fellBack = !!j.fell_back;

  });
}
function twsStatus(){

function freeProviders(){

}
/* typical quoted spread in basis points, by class - grounded in the SEC's
   small-cap study (pennies on liquid mid caps, tens of cents on the smallest) */
var CLASS_SPREAD_BPS = {A:2, B:6, C:25, D:130};
function callFREE(tool, input){
  input = input||{};
  if(tool==='search_contracts'){
    return freeFetch('search', {q:input.query}).then(function(j){
      return {results: (j.results||[]).map(function(r){
        var cid = (FREE.provider==='tws' && r.conid) ? Number(r.conid) : freeId(r.symbol);
        FREE.symOf[cid] = r.symbol;
        return {underlying_contract_id: cid, symbol: r.symbol,
                description: r.name||'', exchange: r.exchange||'', country_code:'',
                sections: [{security_type: (r.type==='ETF'||r.type==='EQUITY')?'STK':(r.type||'STK')}]};
      })};
    });
  }
  if(tool==='get_price_snapshot'){
    var cid = Number(input.contract_id), sym = FREE.symOf[cid] || input.symbol;
    if(!sym) return Promise.reject({code:'unknown_symbol'});
    var tries = 0;
    function attempt(){
      return freeFetch('quote', {symbol:sym}).then(function(q){
        if(q.last==null && tries < 4){ tries++; return wait(500).then(attempt); }
        return q;
      });
    }
    return attempt().then(function(q){
      var last = q.last;
      if(last==null) throw {code:'no_data'};
      var bid=q.bid, ask=q.ask, synthetic=false;
      if(bid==null || ask==null || !(ask>=bid)){
        var key = (typeof classKeyFor==='function') ? classKeyFor(last, q.volume) : 'B';
        var half = last * (CLASS_SPREAD_BPS[key]||6) / 20000;
        bid = Math.round((last-half)*100)/100;
        ask = Math.round((last+half)*100)/100;
        synthetic = true;
      }
      var out = {
        'bid-ask': {bid:bid, ask:ask, bid_size:q.bidSize||null, ask_size:q.askSize||null},
        'last': {price:last, halted:false, is_close:false},
        'top-status': {status: synthetic ? 'DELAYED (spread estimated)' : 'DELAYED'},
        '__synthetic': synthetic
      };
      if(q.change!=null || q.changePct!=null) out.change = {change:q.change, change_pct:q.changePct};
      if(q.prevClose!=null) out['prior-close'] = {price:q.prevClose};
      if(q.open!=null) out.open = {open:q.open};
      if(q.high!=null) out.high = {high:q.high};
      if(q.low!=null) out.low = {low:q.low};
      if(q.volume!=null) out.volume = {volume:q.volume};
      return out;
    });
  }
  if(tool==='get_option_parameters'){
    var uc = Number(input.underlying_contract_id), usym = FREE.symOf[uc] || input.symbol;
    if(!usym) return Promise.reject({code:'unknown_symbol'});
    FREE.symOf[uc] = usym;
    return freeFetch('chain', {symbol:usym}).then(function(c){
      FREE.chain[usym] = c;
      var exps = (c.expirations||[]).map(function(tok){
        return {id: uc+'|'+tok, date: freeYmd(tok), regular: isThirdFriday(freeYmd(tok)), trading_class:''};
      });
      if(!exps.length) throw {code:'no_options'};
      return {exchanges:['FREE'], current_exchange:'FREE', expirations:exps,
              current_expiration: (exps.filter(function(e){return e.regular;})[0]||exps[0]).id};
    });
  }
  if(tool==='get_option_data'){
    var parts = String(input.expiration_id).split('|');
    var ucid = Number(parts[0]), tok = parts.slice(1).join('|');
    var sym2 = FREE.symOf[ucid] || input.symbol;
    if(!sym2) return Promise.reject({code:'unknown_symbol'});
    FREE.symOf[ucid] = sym2;
    var ctries = 0;
    function cattempt(){
      return freeFetch('chain', {symbol:sym2, expiry:tok}).then(function(c){
        if(c.partial && ctries < 4){ ctries++; return wait(600).then(cattempt); }
        return c;
      });
    }
    return cattempt().then(function(c){
      var byStrike = {};
      FREE.quoteCache = FREE.quoteCache||{};
      function add(o, right){
        if(o.strike==null) return;
        if(input.min_strike!=null && o.strike<input.min_strike) return;
        if(input.max_strike!=null && o.strike>input.max_strike) return;
        var id = o.conid ? Number(o.conid) : freeId(o.symbol);
        byStrike[o.strike] = byStrike[o.strike]||{strike:String(o.strike)};
        byStrike[o.strike][right==='C'?'call_contract_id':'put_contract_id'] = id;
        byStrike[o.strike][right==='C'?'call_description':'put_description'] =
          sym2+' '+fmtExp(freeYmd(tok))+' '+o.strike+' '+(right==='C'?'Call':'Put');
        FREE.symOf[id] = o.symbol;
        FREE.quoteCache[id] = o;
        OPTMETA[id] = {iv:o.iv, delta:o.delta, gamma:o.gamma, theta:o.theta, vega:o.vega,
                       oi:o.oi, volume:o.volume, strike:o.strike, right:right, expiry:freeYmd(tok),
                       underSym:sym2, underConid:ucid};
      }
      (c.calls||[]).forEach(function(o){ add(o,'C'); });
      (c.puts||[]).forEach(function(o){ add(o,'P'); });
      var keys = Object.keys(byStrike).map(Number).sort(function(a,b){ return a-b; });
      return {currency:'USD', exchange:'FREE', contracts: keys.map(function(k){ return byStrike[k]; })};
    });
  }
  if(tool==='search_futures') return Promise.reject({code:'no_free_futures'});
  if(tool==='__bars') return Promise.resolve([]);
  if(tool==='__whatif') return Promise.reject({code:'needs_gateway'});
  return Promise.reject({code:'unsupported_tool'});
}
/* option quotes come back inside the chain payload, so serve them from there */
function freeOptionQuote(conid){
  var o = FREE.quoteCache && FREE.quoteCache[conid];
  if(!o) return null;
  var bid=o.bid, ask=o.ask;
  if(bid==null||ask==null||!(ask>=bid)){
    var last=o.last!=null?o.last:0.05, half=Math.max(0.01, last*0.05);
    bid=Math.max(0, Math.round((last-half)*100)/100); ask=Math.round((last+half)*100)/100;
  }
  return {'bid-ask':{bid:bid, ask:ask, bid_size:o.bidSize||null, ask_size:o.askSize||null},
          'last': o.last!=null?{price:o.last, halted:false}:{},
          'top-status':{status:'DELAYED'}};
}

function errText(e){

/* ---------- portfolios ----------

var BOOK_FIELDS = ['account','cash','realized','lastDay','positions','orders',
                   'trades','cashflows','equity','watchlist','log','desk'];

function bookInit(){

function bookOf(id){

/* ------------------------------------------------------------------
   Liquidity classes.

   A marketable order does not pay the full quoted spread - retail flow gets
   price improvement, and how much depends on how liquid the name is. The SEC's
   small-cap market quality study puts the effective-to-quoted spread ratio near
   0.90-0.95 for mid and large caps and 0.63-0.77 for the smallest names.

   A resting limit at the touch does not fill the moment price arrives either -
   you join a queue. Measured time-to-fill for large-cap equity limit orders at
   the touch runs a median of roughly 4-8 seconds against a mean of 70-85, i.e.
   usually quick, occasionally never. Each order draws its own wait from a
   lognormal fitted to that median and mean.

   Sources are listed on the Account tab. Classes are cut by 90-day average
   dollar volume, which IBKR reports directly.
   ------------------------------------------------------------------ */
var LCLASS_DEFAULT = {
  A: {name:'Mega liquid',  minAdv:1e9,  eq:0.92, medFill:2,   meanFill:45,   impact:0.6, label:'>= $1B a day'},
  B: {name:'Liquid',       minAdv:1e8,  eq:0.90, medFill:5,   meanFill:75,   impact:1.0, label:'$100M - $1B'},
  C: {name:'Moderate',     minAdv:1e7,  eq:0.85, medFill:20,  meanFill:300,  impact:1.8, label:'$10M - $100M'},
  D: {name:'Thin',         minAdv:0,    eq:0.70, medFill:120, meanFill:1800, impact:3.5, label:'< $10M a day'}
};
var LCLASS_ORDER = ['A','B','C','D'];
function lclassTable(){
  var out={}, k;
  for(k in LCLASS_DEFAULT) out[k]=LCLASS_DEFAULT[k];
  for(k in (S.lclass||{})) out[k]=S.lclass[k];
  return out;
}
function advOf(inst){
  var q = Q[inst.conid];
  if(!q) return null;
  if(q.advUsd) return q.advUsd;
  var px0 = q.last!=null?q.last:q.mid;
  if(q.volume && px0) return q.volume*px0;      /* today's turnover as a stand-in */
  return null;
}
function classOf(inst){
  if(inst.secType==='OPT'||inst.secType==='FOP') return classSpec('C');   /* options quote wide */
  if(inst.secType==='FUT') return classSpec('A');
  var adv = advOf(inst);
  if(adv==null) return classSpec('B');          /* unknown: assume ordinary liquidity */
  var t = lclassTable();
  for(var i=0;i<LCLASS_ORDER.length;i++){
    var c = t[LCLASS_ORDER[i]];
    if(adv >= n(c.minAdv)) return classSpec(LCLASS_ORDER[i]);
  }
  return classSpec('D');
}
function classKeyFor(price, volume){
  var adv = (price&&volume) ? price*volume : null;
  if(adv==null) return 'B';
  var t = lclassTable();
  for(var i=0;i<LCLASS_ORDER.length;i++) if(adv >= n(t[LCLASS_ORDER[i]].minAdv)) return LCLASS_ORDER[i];
  return 'D';
}
function classSpec(key){
  var c = lclassTable()[key] || LCLASS_DEFAULT.B;
  return {key:key, name:c.name, label:c.label, eq:n(c.eq)||0.9,
          medFill:n(c.medFill)||5, meanFill:n(c.meanFill)||75, impact:n(c.impact)||1};
}
/* Marketable price: cross a fraction of the spread, not all of it, then pay for size. */
function marketablePrice(inst, side, want){
  var q = Q[inst.conid]; if(!q) return null;
  var bid=q.bid, ask=q.ask, mid=(bid!=null&&ask!=null&&ask>=bid)?(bid+ask)/2:null;
  var touchPx = side==='BUY' ? (ask!=null?ask:q.last) : (bid!=null?bid:q.last);
  if(touchPx==null) return null;
  if(mid==null) return touchPx;
  var c = classOf(inst);
  var half = (ask-bid)/2;
  var eff = half * c.eq;                              /* effective half-spread */
  var touchSize = side==='BUY' ? q.askSize : q.bidSize;
  var extra = 0;
  if(touchSize && want>touchSize){
    /* beyond the displayed size you are walking the book */
    extra = half * c.impact * (Math.sqrt(want/Math.max(1,touchSize)) - 1);
  }
  extra += mid * (n(S.settings.slippageBps)/10000);   /* residual drift/latency */
  var pxOut = side==='BUY' ? mid + eff + extra : mid - eff - extra;
  /* within the displayed size you cannot do worse than the quote you can see */
  if(!touchSize || want <= touchSize){
    pxOut = side==='BUY' ? Math.min(pxOut, touchPx) : Math.max(pxOut, touchPx);
  }
  return Math.round(pxOut*10000)/10000;
}
/* One draw from a lognormal fitted to the class median and mean. */
var RNG = Math.random;          /* swappable so the distribution can be tested deterministically */
function drawFillWait(spec){
  var med = Math.max(0.1, spec.medFill), mean = Math.max(med*1.01, spec.meanFill);
  var sigma = Math.sqrt(2*Math.log(mean/med));
  var mu = Math.log(med);
  var u1 = RNG()||1e-9, u2 = RNG();
  var z = Math.sqrt(-2*Math.log(u1))*Math.cos(2*Math.PI*u2);
  return Math.exp(mu + sigma*z);
}
function expectedFillNote(inst, side, type, limit, want){
  var q = Q[inst.conid]; if(!q) return '';
  var c = classOf(inst), adv = advOf(inst);
  var head = c.name+(adv?(' - '+money(adv/1e6)+'M a day'):'')+', crossing '+Math.round(c.eq*100)+'% of the spread';
  if(type==='MKT'){
    var pxE = marketablePrice(inst, side, want);
    if(pxE==null) return head;
    var mid=(q.bid+q.ask)/2, slip=Math.abs(pxE-mid);
    return head+'. Expected fill '+px(pxE)+', about '+px(slip)+' from mid ('
      +(mid?Math.round(slip/mid*1e4):0)+' bps).';
  }
  var marketable = limit!=null && (side==='BUY' ? (q.ask!=null&&limit>=q.ask) : (q.bid!=null&&limit<=q.bid));
  if(marketable) return head+'. Marketable - expect an immediate fill at '+px(limit)+' or better.';
  return head+'. Resting at the touch: typically about '+dur(c.medFill)+' to fill, mean '+dur(c.meanFill)
    +' - and if price leaves without trading through, not at all.';
}
function dur(s){
  s = Math.round(s);
  if(s<60) return s+'s';
  if(s<3600) return Math.round(s/60)+'m';
  return (s/3600).toFixed(1)+'h';
}

/* ------------------------------------------------------------------
   Greeks. Providers differ: Tradier and Alpaca publish them, IBKR publishes
   implied volatility only, and Yahoo publishes IV per contract. Anything
   missing is computed with Black-Scholes from the mid price, and labelled as
   modelled rather than quoted.
   ------------------------------------------------------------------ */
function ncdf(x){
  var a1=0.254829592,a2=-0.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,pp=0.3275911;
  var sign = x<0?-1:1; x=Math.abs(x)/Math.SQRT2;
  var t=1/(1+pp*x);
  var y=1-(((((a5*t+a4)*t)+a3)*t+a2)*t+a1)*t*Math.exp(-x*x);
  return 0.5*(1+sign*y);
}
function npdf(x){ return Math.exp(-0.5*x*x)/Math.sqrt(2*Math.PI); }
function bs(S0,K,T,sig,right,r){
  r = r==null ? n(S.settings.riskFree)/100 : r;
  if(!(S0>0&&K>0&&T>0&&sig>0)) return null;
  var sq=Math.sqrt(T);
  var d1=(Math.log(S0/K)+(r+sig*sig/2)*T)/(sig*sq), d2=d1-sig*sq;
  var call = right==='C';
  var disc=Math.exp(-r*T);
  var price = call ? S0*ncdf(d1)-K*disc*ncdf(d2) : K*disc*ncdf(-d2)-S0*ncdf(-d1);
  var delta = call ? ncdf(d1) : ncdf(d1)-1;
  var gamma = npdf(d1)/(S0*sig*sq);
  var vega  = S0*npdf(d1)*sq/100;
  var theta = (-(S0*npdf(d1)*sig)/(2*sq) + (call?-1:1)*r*K*disc*(call?ncdf(d2):ncdf(-d2)))/365;
  return {price:price, delta:delta, gamma:gamma, vega:vega, theta:theta, d1:d1, d2:d2};
}
function solveIV(price,S0,K,T,right){
  if(!(price>0&&S0>0&&K>0&&T>0)) return null;
  var lo=0.005, hi=5;
  for(var i=0;i<60;i++){
    var mid=(lo+hi)/2, v=bs(S0,K,T,mid,right);
    if(!v) return null;
    if(v.price>price) hi=mid; else lo=mid;
  }
  var out=(lo+hi)/2;
  return (out>0.006 && out<4.9) ? out : null;
}
function yearsTo(ymd){
  if(!/^\d{8}$/.test(String(ymd))) return null;
  var t=new Date(ymd.slice(0,4)+'-'+ymd.slice(4,6)+'-'+ymd.slice(6,8)+'T20:00:00Z').getTime();
  return Math.max(1/(365*24), (t-Date.now())/(365*86400000));
}
/* everything the chain and the builder need about one contract */
function optInfo(conid, meta){
  var m = meta || OPTMETA[conid] || null;
  var q = Q[conid];
  if(!m || !q) return m ? {iv:m.iv, delta:m.delta, gamma:m.gamma, theta:m.theta, vega:m.vega,
                           oi:m.oi, volume:m.volume, modelled:false} : null;
  var out = {iv:m.iv, delta:m.delta, gamma:m.gamma, theta:m.theta, vega:m.vega,
             oi:m.oi, volume:m.volume, modelled:false};
  if(out.delta!=null && out.iv!=null) return out;
  var uq = Q[m.underConid];
  var S0 = uq ? (uq.mark!=null?uq.mark:(uq.last!=null?uq.last:uq.mid)) : null;
  var T = yearsTo(m.expiry);
  var mid = (q.bid!=null&&q.ask!=null) ? (q.bid+q.ask)/2 : q.last;
  if(!(S0>0&&T>0)) return out;
  var sig = out.iv;
  if(!(sig>0) && mid>0) sig = solveIV(mid, S0, m.strike, T, m.right);
  if(!(sig>0)) return out;
  var g = bs(S0, m.strike, T, sig, m.right);
  if(!g) return out;
  out.iv = out.iv!=null?out.iv:sig;
  if(out.delta==null){ out.delta=g.delta; out.gamma=g.gamma; out.theta=g.theta; out.vega=g.vega; out.modelled=true; }
  return out;
}
/* the market's own guess at the move by expiry, from the at-the-money straddle */
function expectedMove(){
  var d=CH[S.builder.expId]; if(!d) return null;
  var uq=Q[S.builder.underConid]; if(!uq) return null;
  var spot = uq.mark!=null?uq.mark:(uq.last!=null?uq.last:uq.mid);
  if(!(spot>0)) return null;
  var best=null;
  (d.contracts||[]).forEach(function(r){
    var k=parseFloat(r.strike), dist=Math.abs(k-spot);
    if(best===null || dist<best.dist) best={dist:dist, row:r, k:k};
  });
  if(!best) return null;
  var cq=Q[best.row.call_contract_id], pq=Q[best.row.put_contract_id];
  function mid(x){ return (x&&x.bid!=null&&x.ask!=null)?(x.bid+x.ask)/2:(x&&x.last!=null?x.last:null); }
  var c=mid(cq), p=mid(pq);
  if(c==null||p==null) return null;
  var straddle=c+p, em=straddle*0.85;              /* the usual approximation */
  return {abs:em, pct:em/spot*100, spot:spot, lo:spot-em, hi:spot+em, strike:best.k};
}
function netGreeks(legs){
  var g={delta:0, gamma:0, theta:0, vega:0}, any=false, modelled=false;
  for(var i=0;i<legs.length;i++){
    var l=legs[i], info=optInfo(l.conid);
    if(!info||info.delta==null) continue;
    any=true; if(info.modelled) modelled=true;
    var sgn=(l.side==='BUY'?1:-1)*l.ratio*(l.mult||100);
    g.delta+=sgn*info.delta; g.gamma+=sgn*info.gamma;
    g.theta+=sgn*(info.theta||0); g.vega+=sgn*(info.vega||0);
  }
  return any?{g:g, modelled:modelled}:null;
}

/* ---------- streaming ---------- */
var tickDirty = false, tickTimer = null, TICKS = 0;
function onTick(conid, patch){
  if(Q[conid] && patch.at && Q[conid].at>patch.at) return;
  var q = usingTws()?{}:(Q[conid] || {});
  for(var k in patch) q[k] = patch[k];
  if(q.bid!=null && q.ask!=null && q.ask>=q.bid) q.mid=(q.bid+q.ask)/2;
  q.tradeLast = patch.last;
  if(q.last==null && q.mid!=null) q.last=q.mid;
  if(q.last!=null && q.prevClose==null && q.change!=null) q.prevClose = q.last - q.change;
  q.at = patch.at || Date.now();
  Q[conid] = q;
  TICKS++;
  if(chainAwaitSpot && S.builder.expId===chainAwaitSpot && conid===S.builder.underConid && (q.last>0||q.mid>0)){chainAwaitSpot='';loadStrikes();}
  /* a tick can make a resting order marketable - check straight away */
  var filled = guns ? guns.execution.manage(conid) : false;
  if(trading){filled=trading.manage(conid)||filled;trading.track();}
  var candidates = ordersFor(conid);
  for(var i=0;i<candidates.length;i++){
    var o=candidates[i];
    if(o.status==='working' && tryFill(o)) filled=true;
  }
  if(filled){ save(); return; }
  tickDirty = true;
  if(!tickTimer) tickTimer = setTimeout(function(){
    tickTimer=null;
    if(tickDirty){ tickDirty=false; renderLive(); }
  }, 100);
}
function startStream(){
  if(!LOCAL) return;
  streamConnect(onTick, function(){ renderDiag(); });
  syncSubs();
}
function syncSubs(){
  if(!LOCAL) return;
  if(usingTws()){
    if(!FEED.timer) FEED.timer=setTimeout(function(){ FEED.timer=null; feedSync(false); },50);
    return;
  }
  if(usingFree()) return;
  var u = universe();
  streamSubscribe(u.map(function(i){ return i.conid; }));
}

/* ---------- market data ---------- */
var FIELDS = ["bid_ask","last","plprice","change","prior_close","volume","open","high","low","top_status","avg_90d_usd_volume"];
function localCall(tool, input){
  var mode = S.settings.dataSource || 'auto';
  if(mode==='free') return callFREE(tool, input);
  if(mode==='gateway') return callGW(tool, input);
  /* auto: the gateway if it is up, otherwise the free provider */
  if(DIAG.gwUp===false) return callFREE(tool, input);
  return callGW(tool, input).catch(function(e){
    var c = e && e.code;
    if(c==='gateway_down' || c==='not_authenticated' || c==='provider_unreachable'){
      DIAG.gwUp = false;
      DIAG.fellBack = true;
      return callFREE(tool, input);
    }
    throw e;
  });
}
function callIB(tool, input){
  if(LOCAL) return localCall(tool, input).then(function(r){
    DIAG.lastErr=''; DIAG.lastTool=tool; return r;
  }, function(e){
    DIAG.lastErr=(e&&e.code)||'error'; DIAG.lastTool=tool;
    if(DIAG.lastErr==='session_gone') warn('The IBKR gateway session ended (HTTP 410) and could not be renewed. This happens after idling, or when the same login is used somewhere else - if you are signed into TWS or the mobile app with the same username, that will kick the gateway. Sign in again at https://localhost:5000, then press Reconnect.');
    else if(DIAG.lastErr==='not_authenticated') warn('The IBKR gateway is running but not logged in. Open https://localhost:5000 in a browser tab, sign in, then press Reconnect.');
    else if(DIAG.lastErr==='gateway_down') warn('No IBKR gateway on localhost:5000. Start the Client Portal Gateway (run bin/run.sh root/conf.yaml in the gateway folder), log in, then press Reconnect.');
    renderDiag(); throw e;
  });
  if(!mcp) return Promise.reject({code:'no_mcp'});
  return mcp.callTool(server, tool, input, {cache:false}).then(function(r){
    DIAG.lastErr=''; DIAG.lastTool=tool; return r.payload;
  }, function(e){
    DIAG.lastErr = (e&&e.code)||'error'; DIAG.lastTool = tool;
    if(DIAG.lastErr==='not_in_manifest') warn('The page is not allowed to call "'+tool+'" on "'+server+'". The connector name in the artifact manifest does not match your connector.');
    else if(DIAG.lastErr==='not_granted'||DIAG.lastErr==='needs_auth'||DIAG.lastErr==='unauthorized')
      warn('Your Interactive Brokers connector needs to be connected or re-authorised in claude.ai, then reload this page.');
    renderDiag();

  });
}
function parseSnap(p){
  if(!p||typeof p!=='object') return null;
  var ba = p['bid-ask']||{}, la = p['last']||{}, ch = p['change']||{};
  var q = {
    mark: (p.plprice && typeof p.plprice.price==='number') ? p.plprice.price : null,
    bid: n(ba.bid)||null, ask: n(ba.ask)||null,
    bidSize: n(ba.bid_size)||null, askSize: n(ba.ask_size)||null,
    last: (la && typeof la.price==='number') ? la.price : null,
    halted: !!la.halted,
    change: typeof ch.change==='number'?ch.change:null,
    changePct: typeof ch.change_pct==='number'?ch.change_pct:null,
    open: p.open&&p.open.open, high: p.high&&p.high.high, low: p.low&&p.low.low,
    volume: p.volume&&p.volume.volume,
    advUsd: (p['avg-90d-usd-volume'] && (p['avg-90d-usd-volume'].volume||p['avg-90d-usd-volume'].value)) || null,
    prevClose: (p['prior-close']&&p['prior-close'].price)||null,
    status: (p['top-status']&&p['top-status'].status)||null,
    at: Date.now()
  };
  if(q.bid&&q.ask&&q.ask>=q.bid) q.mid=(q.bid+q.ask)/2;
  if(q.last==null && q.mid) q.last=q.mid;
  if(q.last!=null && q.changePct!=null && q.prevClose==null && q.change!=null) q.prevClose = q.last - q.change;
  return q;
}
function fetchQuote(inst){
  if(usingTws()) return feedSync(false).then(function(){ return Q[inst.conid]||null; });
  if(LOCAL && usingFree() && (inst.secType==='OPT'||inst.secType==='FOP')){
    var cached = freeOptionQuote(inst.conid);
    if(cached){ var pq=parseSnap(cached); if(pq){ Q[inst.conid]=pq; } return Promise.resolve(pq); }
  }
  var input = {contract_id: Number(inst.conid), market_data_names: FIELDS};
  if(inst.exch && inst.secType!=='STK') input.exchange = inst.exch || 'SMART';
  if(LOCAL && usingFree()) input.symbol = inst.symbol;
  return callIB('get_price_snapshot', input).then(function(p){
    var q = parseSnap(p);
    if(q){ var prev=Q[inst.conid]; if(prev){ if(q.last==null)q.last=prev.last; if(q.prevClose==null)q.prevClose=prev.prevClose; if(q.mark==null)q.mark=prev.mark; if(q.advUsd==null)q.advUsd=prev.advUsd; }
      Q[inst.conid]=q; }

  });
}
function universe(){
  var m=new Map();
  function add(x){
    if(!x||!x.conid||!x.symbol)return;
    var previous=m.get(Number(x.conid));
    if(previous && (previous.priority||0)>=(x.priority||0))return;
    m.set(Number(x.conid),{conid:Number(x.conid),symbol:x.symbol,secType:x.secType||'STK',mult:x.mult||1,
      exch:(!x.exch||x.exch==='FREE')?'SMART':x.exch,right:x.right,strike:x.strike,expiry:x.expiry,underConid:x.underConid,root:x.root,
      brokerId:x.brokerId===true,priority:x.priority||0});
  }
  function book(b){
    (b.orders||[]).forEach(function(o){if(o.status==='working'){if(o.legs)o.legs.forEach(add);else add(o);}});
    (b.positions||[]).forEach(function(p){if(p.qty)add(p);});
    (b.watchlist||[]).forEach(add);
  }
  if(guns)guns.instruments().forEach(add);
  if(trading)trading.instruments().forEach(add);
  add(sel); S.builder.legs.forEach(add); book(S);
  if(S.chainOpen){
    var d=CH[S.builder.expId];
    ((d&&d.contracts)||[]).forEach(function(r){
      ['C','P'].forEach(function(right){
        var call=right==='C'; add({conid:call?r.call_contract_id:r.put_contract_id,
          symbol:(call?r.call_description:r.put_description)||S.builder.underSym,
          secType:'OPT',mult:100,exch:'SMART',right:right,strike:Number(r.strike),expiry:S.builder.expDate,
          underConid:S.builder.underConid,root:S.builder.underSym});
      });
    });
  }
  (S.books||[]).forEach(function(b){if(b.id!==S.bookId)book(b.data||{});});
  Array.from(m.values()).forEach(function(x){if(x.underConid&&x.root)add({conid:x.underConid,symbol:x.root,secType:'STK',mult:1});});
  return Array.from(m.values());
}
var ORDER_INDEX={list:null,length:0,byContract:new Map()};
function ordersFor(conid){

function refresh(){
  if(usingTws()) return feedSync(true).then(function(){ renderLive(); });
  if(LOCAL) syncSubs();
  var list = universe();
  if(!list.length){ render(); return Promise.resolve(); }
  if(!dataUp()){ setStatus('no IBKR connector'); render(); return Promise.resolve(); }
  busy++; setStatus('fetching '+list.length+' quote'+(list.length>1?'s':'')+'...');
  return Promise.all(list.map(function(i){ return fetchQuote(i).catch(function(e){ return {err:e&&e.code}; }); }))
   .then(function(res){
      busy--;
      var bad = res.filter(function(r){return r&&r.err;});

      else { warn(''); setStatus('quotes '+new Date().toLocaleTimeString()); }
      var settled = settleExpired();
      var filled = sweepOrders();
      /* queue progress is cheap to keep locally; on the hosted page it would mean
         republishing on every poll, so there it survives only until a reload */
      if(LOCAL && !filled && S.orders.some(function(o){ return o.status==='working' && o.touchedFor; })) filled = true;
      return barSweep().then(function(barFilled){
        if(filled||settled||barFilled) save(); else render();

   });
}

/* ---------- account math ---------- */
function posOf(conid){ for(var i=0;i<S.positions.length;i++) if(S.positions[i].conid===conid) return S.positions[i]; return null; }
/* IBKR's own mark price (plprice) when it is quoting one, else the midpoint. */
function markOf(p){
  var q=Q[p.conid];
  if(!q) return (p.lastMark!=null?p.lastMark:p.avgCost);
  if(q.mark!=null && q.mark>0) return q.mark;
  return (q.bid&&q.ask)? (q.bid+q.ask)/2 : (q.last!=null?q.last:p.avgCost);
}
function underMark(p){
  var uq=Q[p.underConid];
  if(!uq) return null;
  if(uq.mark!=null && uq.mark>0) return uq.mark;
  if(uq.bid!=null && uq.ask!=null) return (uq.bid+uq.ask)/2;
  return uq.last!=null?uq.last:null;
}

var FUT_ASOF = '24 Aug 2026';
function futRoot(p){
  var r = p.root || p.symbol || '';
  r = String(r).toUpperCase().split(' ')[0].replace(/[^A-Z0-9]/g,'');
  if(FUT_DEFAULT[r] || (S.futMargin&&S.futMargin[r])) return r;
  var m = r.match(/^([A-Z0-9]{1,4}?)(?:[FGHJKMNQUVXZ]\d{1,2})?$/);
  return m ? m[1] : r;
}
function futSpec(p){
  var r = futRoot(p);
  var custom = S.futMargin && S.futMargin[r];
  return custom || FUT_DEFAULT[r] || null;
}
function isOpt(p){ return p.secType==='OPT'||p.secType==='FOP'; }
function isFut(p){ return p.secType==='FUT'||p.secType==='FOP'; }
function sharesOf(list, conid){
  var q=0; for(var i=0;i<list.length;i++) if(list[i].conid===conid && !isOpt(list[i])) q+=list[i].qty;
  return q;
}
/* US Reg-T margin, modelled on IBKR's published US stock and option rules.
   mode 'initial'  -> what a new order must be funded at
   mode 'maint'    -> what the position must keep, i.e. the margin-call line
   Portfolio margin is NOT modelled; Reg-T is always the more conservative of the two. */
function requirement(list, mode){
  mode = mode||'initial';
  var lev = S.account.type==='margin' ? Math.max(1, n(S.settings.marginMult)||2) : 1;
  var netLiqRaw = S.cash;
  var i, j, req=0;
  for(i=0;i<list.length;i++){ var pp=list[i]; if(pp.qty) netLiqRaw += pp.qty*markOf(pp)*(pp.mult||1); }
  /* IBKR requires USD 2,000 equity before any margin loan is extended. */
  var margined = S.account.type==='margin' && netLiqRaw >= 2000;

  var opts=[];
  for(i=0;i<list.length;i++){
    var p=list[i]; if(!p.qty) continue;
    if(isOpt(p)){ opts.push(p); continue; }
    var mult=p.mult||1, mk=markOf(p), v=Math.abs(p.qty*mk*mult), sh=Math.abs(p.qty);
    if(isFut(p)){
      var fs = futSpec(p);
      if(fs) req += (mode==='initial' ? (S.settings.futIntraday? (fs.dayInit||fs.init) : fs.init) : fs.maint) * sh;
      else req += 0.15*v;    /* contract not in the margin table - flagged in the UI */
      continue;
    }
    if(!margined){ req += v; continue; }               /* cash account or under 2k: paid in full */
    if(p.qty>0) req += mode==='initial' ? v/lev : 0.25*v;
    else {
      if(mode==='initial') req += v/lev;
      else req += mk>=5 ? Math.max(2.50*sh, 0.30*v) : Math.max(2.50*sh, v);
    }
  }

  /* group options by underlying so stock cover and spreads are resolved together */
  var by={};
  for(i=0;i<opts.length;i++){ var u=opts[i].underConid||('x'+opts[i].conid); (by[u]=by[u]||[]).push(opts[i]); }
  for(var key in by){
    var g=by[key], shorts=[], longs=[];
    for(i=0;i<g.length;i++){
      var o=g[i], m2=Math.max(0, markOf(o)), mu=o.mult||100;
      if(o.qty>0){ req += o.qty*m2*mu; longs.push({p:o,left:o.qty}); }   /* long options: paid in full */
      else shorts.push({p:o,left:-o.qty});
    }
    var netShares = sharesOf(list, Number(key));
    var longLots = netShares>0 ? Math.floor(netShares/100) : 0;
    var shortLots = netShares<0 ? Math.floor(-netShares/100) : 0;
    /* covered calls and covered puts carry no option requirement of their own */
    for(i=0;i<shorts.length;i++){
      var sc=shorts[i];
      if(sc.p.right==='C' && longLots>0){ var uC=Math.min(sc.left,longLots); sc.left-=uC; longLots-=uC; }
      else if(sc.p.right==='P' && shortLots>0){ var uP=Math.min(sc.left,shortLots); sc.left-=uP; shortLots-=uP; }
    }
    /* spread offset: a long of the same right that expires no earlier and is on the protective side */
    for(i=0;i<shorts.length;i++){
      var s2=shorts[i]; if(s2.left<=0) continue;
      var sp=s2.p, mult2=sp.mult||100;
      var cands=[];
      for(j=0;j<longs.length;j++){
        var L=longs[j];
        if(L.left<=0 || L.p.right!==sp.right) continue;
        if(String(L.p.expiry||'') < String(sp.expiry||'')) continue;   /* long must not expire first */
        cands.push(L);
      }
      cands.sort(function(a,c){
        var pa=protects(sp,a.p)?0:1, pc=protects(sp,c.p)?0:1;
        if(pa!==pc) return pa-pc;
        return Math.abs(a.p.strike-sp.strike)-Math.abs(c.p.strike-sp.strike);
      });
      for(j=0;j<cands.length && s2.left>0;j++){
        var lg=cands[j], use=Math.min(s2.left, lg.left);
        req += (protects(sp,lg.p) ? Math.abs(lg.p.strike-sp.strike) : 0) * mult2 * use;
        s2.left-=use; lg.left-=use;
      }
      if(s2.left>0){
        var U=underMark(sp); if(U==null) U=sp.strike||0;
        var otm = sp.right==='C' ? Math.max(0, sp.strike-U) : Math.max(0, U-sp.strike);
        var floorV = sp.right==='C' ? 0.10*U : 0.10*sp.strike;
        /* Reg-T naked short option, plus the premium, per contract */
        req += (Math.max(0.20*U - otm, floorV) + Math.max(0, markOf(sp))) * mult2 * s2.left;
      }
    }
  }
  return req;
}
function protects(shortLeg, longLeg){
  return shortLeg.right==='C' ? longLeg.strike>=shortLeg.strike : longLeg.strike<=shortLeg.strike;
}
function acct(list, cashOverride){
  list = list || S.positions;
  var cash = cashOverride==null ? S.cash : cashOverride;
  var longMV=0,shortMV=0,unreal=0,gross=0,dayPL=0;
  for(var i=0;i<list.length;i++){
    var p=list[i]; if(!p.qty) continue;
    var m=markOf(p), v=p.qty*m*(p.mult||1);
    if(v>=0) longMV+=v; else shortMV+=v;
    gross+=Math.abs(v);
    unreal += (m-p.avgCost)*p.qty*(p.mult||1);
    var q=Q[p.conid];
    var base = (q&&q.prevClose!=null)? q.prevClose : null;
    if(base!=null){
      var ref = (p.openedToday? p.avgCost : base);
      dayPL += (m-ref)*p.qty*(p.mult||1);
    }
  }
  var netLiq = cash + longMV + shortMV;
  var lev = S.account.type==='margin' ? Math.max(1, n(S.settings.marginMult)||2) : 1;
  var init = requirement(list,'initial'), maint = requirement(list,'maint');
  var avail = netLiq - init;              /* available funds - what new orders draw on */
  var excessLiq = netLiq - maint;         /* excess liquidity - the margin-call line */
  var bp = S.account.type==='margin' ? avail*lev : Math.min(Math.max(0,cash), avail);
  return {netLiq:netLiq, cash:cash, longMV:longMV, shortMV:shortMV, gross:gross, unreal:unreal,
          init:init, maint:maint, req:init, excess:avail, avail:avail, excessLiq:excessLiq,
          bp:bp, dayPL:dayPL, call: excessLiq < 0};
}
/* Hypothetical book after a set of {conid,qty,price,mult,...} fills. */
function project(fills){
  var copy = S.positions.map(function(p){ var c={}; for(var k in p) c[k]=p[k]; return c; });
  var cash = S.cash, i, j;
  for(i=0;i<fills.length;i++){
    var f=fills[i], mult=f.mult||1, tgt=null;
    for(j=0;j<copy.length;j++) if(copy[j].conid===f.conid) tgt=copy[j];
    if(!tgt){ tgt={conid:f.conid,symbol:f.symbol,secType:f.secType,mult:mult,right:f.right,strike:f.strike,expiry:f.expiry,underConid:f.underConid,qty:0,avgCost:f.price}; copy.push(tgt); }
    var old=tgt.qty;
    if(old===0 || (old>0)===(f.qty>0)) tgt.avgCost=(tgt.avgCost*Math.abs(old)+f.price*Math.abs(f.qty))/(Math.abs(old)+Math.abs(f.qty));
    tgt.qty = old + f.qty;
    cash -= f.qty*f.price*mult;
    cash -= n(f.commission);
  }
  return {positions:copy, cash:cash};
}
function deposits(){ var t=0; for(var i=0;i<S.cashflows.length;i++) t+=S.cashflows[i].amount; return t; }

/* ---------- fill engine ---------- */
function slipBps(o,q,side,fillQty){
  var base = n(S.settings.slippageBps);
  var touch = side==='BUY' ? q.askSize : q.bidSize;
  var extra = 0;
  if(touch && fillQty > touch) extra = base * Math.min(4, Math.sqrt(fillQty/Math.max(1,touch)) - 1);
  return base + Math.max(0, extra);
}
/* Commission plus the pass-through fees IBKR actually bills.
   Rates live in settings so they can be updated when the regulators move them. */
function commission(inst, shares, price, side){
  var f = S.fees||{}, total = 0, sell = side==='SELL';
  if(inst.secType==='OPT'||inst.secType==='FOP'){
    var per = Math.max(n(S.settings.optCommissionMin), shares*n(S.settings.optCommission));
    total = per;
    total += shares*n(f.orf);                       /* options regulatory fee, both sides */
    total += Math.min(shares*n(f.occ), n(f.occCap));/* OCC clearing, capped per trade */
    total += shares*n(f.optExch);                   /* exchange fee, blended */
    if(sell){
      total += shares*n(f.optTaf);                  /* FINRA TAF, sales only */
      total += Math.abs(shares*price*100)*n(f.sec)/1e6;
    }
    return Math.round(total*100)/100;
  }
  if(inst.secType==='FUT'||inst.secType==='FOP'){
    return Math.round((shares*(n(f.futComm)+n(f.futExch)))*100)/100;
  }
  var c = shares*n(S.settings.commissionPerShare);
  c = Math.max(n(S.settings.commissionMin), c);
  var cap = Math.abs(shares*price)*n(S.settings.commissionMaxPct)/100;
  if(cap>0) c = Math.min(c, cap);
  total = c;
  if(sell){
    total += Math.abs(shares*price)*n(f.sec)/1e6;              /* SEC Section 31 */
    total += Math.min(shares*n(f.taf), n(f.tafCap));           /* FINRA TAF */
  }
  return Math.round(total*100)/100;
}
function ymd(d){ d=d||new Date(); var m=d.getMonth()+1, dd=d.getDate(); return ''+d.getFullYear()+(m<10?'0':'')+m+(dd<10?'0':'')+dd; }
function legPrice(leg, withSlip, spreads){
  var q=Q[leg.conid]; if(!q) return null;
  var buy = leg.side==='BUY';
  if(withSlip){
    var mp = marketablePrice(leg, leg.side, (spreads||1)*leg.ratio);
    if(mp!=null && mp>0) return mp;
  }
  var raw = buy ? (q.ask!=null?q.ask:q.last) : (q.bid!=null?q.bid:q.last);
  if(raw==null || !(raw>0)) return null;
  return Math.round(raw*10000)/10000;
}
/* Net premium per spread: positive = debit you pay, negative = credit you receive. */
function comboNet(legs, withSlip, spreads){
  var net=0, prices=[];
  for(var i=0;i<legs.length;i++){
    var pr = legPrice(legs[i], withSlip, spreads);
    if(pr==null) return null;
    prices.push(pr);
    net += (legs[i].side==='BUY'?1:-1)*pr*legs[i].ratio;
  }
  return {net:Math.round(net*10000)/10000, prices:prices};
}
function comboMid(legs){
  var net=0;
  for(var i=0;i<legs.length;i++){
    var q=Q[legs[i].conid]; if(!q) return null;
    var m=(q.bid!=null&&q.ask!=null)?(q.bid+q.ask)/2:q.last;
    if(m==null) return null;
    net += (legs[i].side==='BUY'?1:-1)*m*legs[i].ratio;
  }
  return Math.round(net*10000)/10000;
}
function tryFillCombo(o){
  var rem = o.qty - o.filledQty; if(rem<=0){ o.status='filled'; return true; }
  var touch = comboNet(o.legs, false, rem);
  if(!touch) return false;
  if(o.type==='COMBO' && o.limit!=null && touch.net > o.limit + 1e-9) return false;
  var use = o.limit!=null ? comboNet(o.legs,false,rem) : comboNet(o.legs,true,rem);
  if(!use) return false;
  var proposed=o.legs.map(function(l,i){return Object.assign({},l,{qty:(l.side==='BUY'?1:-1)*rem*l.ratio,price:use.prices[i],commission:commission(l,rem*l.ratio,use.prices[i],l.side)});});
  if(!fillRiskAllowed(proposed,o))return true;
  for(var i=0;i<o.legs.length;i++){
    var leg=o.legs[i];
    applyFill(o, rem*leg.ratio, use.prices[i], leg);
  }
  o.filledQty = o.qty; o.avgFill = use.net; o.status='filled'; o.filledAt=Date.now();
  say((use.net>=0?'Bought':'Sold')+' '+qty(rem)+'x '+o.symbol+' for '+(use.net>=0?'a debit of ':'a credit of ')+money(Math.abs(use.net))+' per spread');
  snapshotEquity(true);
  return true;
}
function settleExpired(){
  // Never invent settlement from a current or missing underlying quote.
  return false;
}
function settlePosition(conid,value){
  var p=posOf(conid);if(!p||!p.qty||!isOpt(p)||!p.expiry||p.expiry>=ymd())return false;
  if(value===undefined){
    var entered=prompt('Official expiry settlement value PER OPTION UNIT for '+p.symbol+' (not the underlying price). This is a manual paper cash settlement.');
    if(entered===null||!entered.trim())return false;
    value=Number(entered);
    if(!Number.isFinite(value)||value<0){warn('Enter a finite settlement value of zero or greater.');return false;}
    if(!confirm('Cash-settle '+qty(Math.abs(p.qty))+' '+p.symbol+' at '+money(value)+' per unit? This cannot be undone.'))return false;
  }
  if(!Number.isFinite(value)||value<0)return false;
  var mult=p.mult||100,realized=(value-p.avgCost)*p.qty*mult;
  S.cash+=p.qty*value*mult;S.realized=n(S.realized)+realized;
  S.trades.unshift({id:uid(),ts:Date.now(),orderId:null,symbol:p.symbol,conid:p.conid,secType:p.secType,mult:mult,
    side:p.qty>0?'SELL':'BUY',qty:Math.abs(p.qty),price:value,commission:0,realized:realized,cashAfter:S.cash,combo:'manual expiry settlement'});
  p.qty=0;S.positions=S.positions.filter(function(x){return x.qty!==0;});
  S.orders.forEach(function(o){if(o.status==='working'&&(o.conid===conid||(o.legs||[]).some(function(l){return l.conid===conid;}))){o.status='cancelled';o.note='contract expired';}});
  say('Manual paper expiry settlement: '+p.symbol+' at '+money(value));snapshotEquity(true);save();return true;
}
function tryFill(o){
  if(o.status!=='working')return false;
  if(o.expiry && o.expiry<ymd())return false;
  if(guns){
    if(!guns.execution.guard(o))return true;
    var handled=guns.execution.fill(o);
    if(handled!==null)return handled;
  }
  if(trading){if(!trading.guard(o))return true;var deskHandled=trading.fill(o);if(deskHandled!==null)return deskHandled;}
  if(o.type==='COMBO'){
    if((o.legs||[]).some(function(l){return !quoteReady(l.conid)||(l.expiry&&l.expiry<ymd());}))return false;
    return tryFillCombo(o);
  }
  if(!quoteReady(o.conid))return false;
  var q = Q[o.conid];
  if(!q) return false;
  var rem = o.qty - o.filledQty;
  if(rem<=0){ o.status='filled'; return true; }
  if(q.halted) return false;
  var bid=q.bid, ask=q.ask, last=q.last!=null?q.last:q.mid;
  if(bid==null&&ask==null&&last==null) return false;
  if(bid==null&&last!=null) bid=last; if(ask==null&&last!=null) ask=last;
  var buy = o.side==='BUY';
  var inst = {conid:o.conid, symbol:o.symbol, secType:o.secType, mult:o.mult, exch:o.exch};

  // stop trigger
  if((o.type==='STP'||o.type==='STPLMT') && !o.triggered){
    var t = last!=null?last:(buy?ask:bid);
    if(buy ? t>=o.stop : t<=o.stop){ o.triggered=true; o.triggeredAt=Date.now(); say(o.symbol+' stop '+px(o.stop)+' triggered @ '+px(t)); }
    else return false;
  }
  var eff = o.type==='STP' ? 'MKT' : (o.type==='STPLMT' ? 'LMT' : o.type);

  if(eff==='MKT'){
    var mp = marketablePrice(inst, o.side, rem);
    if(!(mp>0)) return false;
    applyFill(o, rem, Math.round(mp*10000)/10000);
    return true;
  }

  var lim = o.limit;
  // marketable on arrival: the other side is already at or through your price
  var marketable = buy ? (ask!=null && ask<=lim) : (bid!=null && bid>=lim);
  if(marketable){
    var mp2 = marketablePrice(inst, o.side, rem);
    if(!(mp2>0)) return false;
    mp2 = buy ? Math.min(mp2, lim) : Math.max(mp2, lim);   // never worse than the limit
    applyFill(o, rem, Math.round(mp2*10000)/10000);
    return true;
  }

  // resting. Two ways out: the market trades THROUGH your price, which means the
  // queue in front of you was consumed, or you wait your turn at the touch.
  var tick = tickOf(lim);
  var through = buy ? (last!=null && last <= lim - tick*0.5) : (last!=null && last >= lim + tick*0.5);
  if(through){
    applyFill(o, rem, lim);
    return true;
  }
  var atTouch = buy ? (bid!=null && Math.abs(bid-lim) < tick*0.5)
                    : (ask!=null && Math.abs(ask-lim) < tick*0.5);
  if(!atTouch){ o.touchedFor = n(o.touchedFor); o.touchAt = null; return false; }

  // we are at the front of the book but behind everyone who got here first
  var now = Date.now();
  if(o.queueWait==null) o.queueWait = drawFillWait(classOf(inst));
  if(!o.touchAt){ o.touchAt = now; return false; }
  o.touchedFor = n(o.touchedFor) + (now - o.touchAt)/1000;
  o.touchAt = now;
  if(o.touchedFor >= o.queueWait){
    /* your turn comes round in pieces, as the size at the touch turns over */
    var avail = buy ? q.bidSize : q.askSize;
    var got = Math.min(rem, Math.max(1, Math.round(avail || rem)));
    applyFill(o, got, lim);
    say(o.symbol+' filled '+qty(got)+' at the touch after '+dur(o.touchedFor)+' in the queue');
    if(got < rem){ o.touchedFor = 0; o.queueWait = drawFillWait(classOf(inst)); }
    return true;
  }
  return false;
}
function tickOf(price){
  if(!(price>0)) return 0.01;
  return price < 1 ? 0.0001 : 0.01;
}
function fillRiskAllowed(fills,order){
  var projected=project(fills),after=acct(projected.positions,projected.cash),before=acct();
  var invalid=!Number.isFinite(after.netLiq)||!Number.isFinite(projected.cash);
  var expandsRisk=after.init>before.init+1e-6;
  var explicitPaper=order.guns?.userOverride===true && order.priceSource==='USER_ENTERED_PAPER';
  if(invalid||(!explicitPaper&&((after.avail < -1e-6 && expandsRisk)||(S.account.type==='cash'&&projected.cash < -1e-6)))){
    order.status='rejected';order.note='Insufficient buying power at execution price';say(order.symbol+': '+order.note);orderNotice('REJECTED · '+order.symbol+' · '+order.note);return false;
  }
  return true;
}
function applyFill(o, fq, price, leg){
  if(!Number.isFinite(fq)||fq<=0||!Number.isFinite(price)||price<=0)return false;
  if(guns && !leg && !guns.execution.guard(o))return false;
  if(trading && !leg && !trading.guard(o))return false;
  var inst = leg || {conid:o.conid, symbol:o.symbol, secType:o.secType, mult:o.mult, exch:o.exch, brokerId:o.brokerId};
  var side = leg ? leg.side : o.side;
  var mult = inst.mult||1;
  var comm = commission(inst, fq, price, side);
  var signed = side==='BUY' ? fq : -fq;
  if(!leg&&!fillRiskAllowed([Object.assign({},inst,{qty:signed,price:price,commission:comm})],o))return false;
  var p = posOf(inst.conid);
  if(!p){ p = {conid:inst.conid, symbol:inst.symbol, secType:inst.secType, mult:mult, exch:inst.exch,
    right:inst.right, strike:inst.strike, expiry:inst.expiry, underConid:inst.underConid, root:inst.root, brokerId:inst.brokerId,
    qty:0, avgCost:0, openedToday:true, opened:Date.now()}; S.positions.push(p); }
  var realized = 0;
  var oldQty = p.qty, oldCost = p.avgCost;
  var gunsOwned = !!o.guns || !!(guns && guns.execution.book().active.some(function(b){return b.inst.conid===inst.conid;}));
  if(oldQty===0 || (oldQty>0)===(signed>0)){
    p.avgCost = (p.avgCost*Math.abs(oldQty) + price*fq) / (Math.abs(oldQty)+fq);
    p.qty = oldQty + signed;
  } else {
    var closing = Math.min(Math.abs(signed), Math.abs(oldQty));
    realized = (price - p.avgCost) * closing * (oldQty>0?1:-1) * mult;
    p.qty = oldQty + signed;
    if(Math.abs(p.qty) < 1e-9){ p.qty=0; p.avgCost=0; }
    else if((p.qty>0)!==(oldQty>0)) p.avgCost = price;
  }
  realized -= comm;
  S.cash -= signed*price*mult;
  S.cash -= comm;
  S.cash = Math.round(S.cash*1e6)/1e6;
  S.realized = n(S.realized) + realized;
  if(!leg){
    o.filledQty += fq;
    o.avgFill = ((o.avgFill||0)*(o.filledQty-fq) + price*fq)/o.filledQty;
    if(o.filledQty >= o.qty - 1e-9){ o.status='filled'; o.filledAt=Date.now(); }
  }
  o.commission = n(o.commission)+comm;
  S.trades.unshift({id:uid(), ts:Date.now(), orderId:o.id, symbol:inst.symbol, conid:inst.conid, secType:inst.secType,
    side:side, qty:fq, price:price, commission:Math.round(comm*100)/100, realized:Math.round(realized*100)/100,
    cashAfter:S.cash, mult:mult, strategyType:o.strategyType||null, portfolioMode:bookMode(), priceSource:o.priceSource||'MARKET_DATA',userOverride:!!o.guns?.userOverride,
    warnings:o.guns?.userOverride?(o.guns.notes?.warnings||[]):[],combo: leg? (o.strategy||'spread') : null});
  say(side+' '+qty(fq)+' '+inst.symbol+' @ '+px(price)+' (comm '+money(comm)+')'+(!leg&&o.status!=='filled'?' [partial]':''));
  if(!leg) snapshotEquity(true);
  if(guns && !leg) guns.execution.after(o,fq,price,oldQty,p.qty,realized,comm);
  if(trading && !leg && !gunsOwned)trading.after(o,fq,price,oldQty,p.qty,realized,comm,oldCost);
}
/* Between polls, price can trade through a resting order and come back. In the
   standalone build we pull 1-minute bars and check whether it actually did. */
function barSweep(){
  if(!LOCAL) return Promise.resolve(false);
  var working = S.orders.filter(function(o){
    return !o.guns && !o.desk && o.status==='working' && o.type!=='MKT' && o.type!=='COMBO' && o.conid;
  });
  if(!working.length) return Promise.resolve(false);
  var ids={}; working.forEach(function(o){ ids[o.conid]=1; });
  var list = Object.keys(ids).map(Number);
  var filled = false;
  return Promise.all(list.map(function(cid){
    return callIB('__bars', {conid:cid}).catch(function(){ return []; });
  })).then(function(sets){
    var byConid = {}; list.forEach(function(c,i){ byConid[c]=sets[i]||[]; });
    working.forEach(function(o){
      if(o.status!=='working') return;
      var bars = byConid[o.conid]||[];
      var since = o.triggeredAt || o.ts;
      for(var i=0;i<bars.length;i++){
        var bar = bars[i];
        if(!bar.t || bar.t < since) continue;
        if(o.type==='STP' || o.type==='STPLMT'){
          if(!o.triggered){
            var hit = o.side==='BUY' ? (bar.h>=o.stop) : (bar.l<=o.stop);
            if(!hit) continue;
            o.triggered = true; o.triggeredAt = bar.t;
            say(o.symbol+' stop triggered at '+px(o.stop)+' (from the '+new Date(bar.t).toLocaleTimeString()+' bar)');
            if(o.type==='STP'){ applyFill(o, o.qty-o.filledQty, o.stop); filled=true; break; }
            continue;
          }
        }
        if(o.limit!=null){
          var through = o.side==='BUY' ? (bar.l<=o.limit) : (bar.h>=o.limit);
          if(through){
            /* filled at the limit, never better - the bar only proves the price traded */
            applyFill(o, o.qty-o.filledQty, o.limit);
            say(o.symbol+' limit filled from the '+new Date(bar.t).toLocaleTimeString()+' bar');
            filled = true; break;
          }
        }
      }
    });
    return filled;
  });
}
function sweepOrders(){
  var any=false;
  for(var i=0;i<S.orders.length;i++){
    var o=S.orders[i];
    if(o.status!=='working') continue;
    if(o.tif==='DAY' && o.day && o.day!==today()){ o.status='cancelled'; o.note='expired (DAY)'; any=true; continue; }
    if(tryFill(o)) any=true;
  }
  if(any) S.positions = S.positions.filter(function(p){ return p.qty!==0 || Date.now()-(p.opened||0)<1000; });
  return any;
}
function today(){ var d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function snapshotEquity(force){
  var a=acct(), last=S.equity[S.equity.length-1];
  if(!force && last && Date.now()-last.ts < 60000){ last.ts=Date.now(); last.equity=a.netLiq; last.cash=a.cash; return; }
  S.equity.push({ts:Date.now(), equity:Math.round(a.netLiq*100)/100, cash:Math.round(a.cash*100)/100});
  if(S.equity.length>2000) S.equity.splice(0, S.equity.length-2000);
}

/* ---------- order entry ---------- */
function affordable(fills, label){
  var proj = project(fills);
  var a = acct(proj.positions, proj.cash);
  if(a.avail < -1e-6){
    var lev = S.account.type==='margin' ? Math.max(1,n(S.settings.marginMult)||2) : 1;
    warn('Not enough buying power for '+label+': it needs '+money(-a.avail*lev)+' more than you have. Available funds right now are '+money(acct().avail)+' (buying power '+money(acct().bp)+').');
    return false;
  }
  if(S.account.type==='cash' && proj.cash < -1e-6){
    warn('Not enough cash for '+label+': it would leave the balance at '+money(proj.cash)+'.');
    return false;
  }
  return true;
}
function submit(side){
  warn('');

  var q = parseFloat($('oQty').value);
  var lim = parseFloat($('oLimit').value);
  var stp = parseFloat($('oStop').value);
  if(!(q>0)||!isFinite(q)||((sel.secType==='OPT'||sel.secType==='FUT'||sel.secType==='FOP')&&!Number.isInteger(q))){ warn('Enter a finite, positive quantity (whole contracts for derivatives).'); return; }
  if(!quoteReady(sel.conid)){warn('Waiting for a fresh, two-sided quote. Orders are disabled while quotes are stale or disconnected.');syncSubs();return;}
  if(sel.expiry&&sel.expiry<ymd()){warn('This contract has expired. Use settlement from Positions.');return;}
  if((type==='LMT'||type==='STPLMT') && !(lim>0)){ warn('Limit orders need a limit price.'); return; }
  if((type==='STP'||type==='STPLMT') && !(stp>0)){ warn('Stop orders need a stop price.'); return; }
  var mult = sel.mult||1;
  var quote = Q[sel.conid];
  var ref = quote ? (side==='BUY' ? (quote.ask||quote.last) : (quote.bid||quote.last)) : (lim||stp);
  if(!(ref>0)){ warn('No quote yet for '+sel.symbol+' - hit Refresh quotes first.'); return; }

  var cur = p?p.qty:0;
  var after = cur + (side==='BUY'?q:-q);

  if(after<0 && S.account.type==='cash'){ warn('Cash accounts cannot hold short positions.'); return; }
  if(!affordable([{conid:sel.conid, symbol:sel.symbol, secType:sel.secType, mult:mult, right:sel.right, strike:sel.strike,
      expiry:sel.expiry, underConid:sel.underConid, qty:(side==='BUY'?q:-q), price:ref,
      commission:commission(sel,q,ref,side)}], 'this order')) return;
  var o = {id:uid(), ts:Date.now(), day:today(), symbol:sel.symbol, conid:sel.conid, secType:sel.secType, mult:mult, exch:sel.exch,
    right:sel.right, strike:sel.strike, expiry:sel.expiry, underConid:sel.underConid, root:sel.root,
    side:side, qty:q, type:type, limit:isFinite(lim)?lim:null, stop:isFinite(stp)?stp:null,
    tif: $('oTif').value, status:'working', filledQty:0, avgFill:0, commission:0, triggered:false};
  if(trading && bookMode()!=='GUNS')o.strategyType=trading.settings().strategy;
  S.orders.unshift(o);
  // Keep ticket values for repeated quick trades; do not erase a user's price.
  say('Order '+side+' '+qty(q)+' '+sel.symbol+' '+type+(o.limit?(' @'+px(o.limit)):'')+(o.stop?(' stop '+px(o.stop)):''));
  tryFill(o);
  orderNotice(o.status.toUpperCase()+' · '+side+' '+qty(q)+' '+sel.symbol+(o.avgFill?' @ '+px(o.avgFill):'')+' · paper order');
  save();
}
function strategyName(legs){
  var nL=legs.length, calls=legs.filter(function(l){return l.right==='C';}).length,
      puts=legs.filter(function(l){return l.right==='P';}).length,
      buys=legs.filter(function(l){return l.side==='BUY';}).length,
      exps={}, i;
  for(i=0;i<legs.length;i++) exps[legs[i].expiry]=1;
  var nExp=Object.keys(exps).length;
  var strikes={}; for(i=0;i<legs.length;i++) strikes[legs[i].strike]=1;
  var nK=Object.keys(strikes).length;
  if(nL===1) return (legs[0].side==='BUY'?'Long ':'Short ')+(legs[0].right==='C'?'call':'put');
  if(nL===2 && nExp>1 && nK===1) return 'Calendar';
  if(nL===2 && (calls===2||puts===2)) return 'Vertical';
  if(nL===2 && calls===1 && puts===1) return buys===2 ? 'Strangle/straddle' : (buys===1 ? 'Risk reversal' : 'Short strangle/straddle');
  if(nL===4 && calls===2 && puts===2) return 'Iron condor';
  if(nL===4 && (calls===4||puts===4)) return nK===3 ? 'Butterfly' : 'Condor';
  if(nL===3) return 'Butterfly';
  return nL+'-leg spread';
}
function comboLabel(legs){
  if(!legs.length) return '';
  var root = legs[0].root||'';
  return root+' '+strategyName(legs);
}
function submitCombo(){

  if(!(q>0)||!Number.isInteger(q)){ warn('Enter a positive whole number of spreads.'); return; }
  var useLmt = $('cType').value==='LMT';
  var lim = parseFloat($('cLimit').value);
  if(useLmt && !isFinite(lim)){ warn('Enter a net price. Positive is a debit you pay, negative is a credit you receive.'); return; }

  if(missing.length){ warn('No quote yet for '+missing[0].symbol+' - hit Refresh quotes first.'); return; }

  if(!S.settings.allowShort && legs.some(function(l){return l.side==='SELL';})){
    warn('Short selling is off (Account tab), so a spread with a short leg cannot be sent.'); return;
  }
  if(S.account.type==='cash' && legs.some(function(l){return l.side==='SELL';})){
    warn('Cash accounts cannot sell options short.'); return;
  }

    return {conid:l.conid, symbol:l.symbol, secType:'OPT', mult:l.mult||100, right:l.right, strike:l.strike,
      expiry:l.expiry, underConid:l.underConid, root:l.root,
      qty:(l.side==='BUY'?1:-1)*q*l.ratio, price:priced.prices[i], commission:commission(l, q*l.ratio, priced.prices[i], l.side)};
  });
  if(!affordable(fills, 'this spread')) return;
  var o = {id:uid(), ts:Date.now(), day:today(), symbol:comboLabel(legs), strategy:strategyName(legs),
    conid:legs[0].conid, secType:'OPT', mult:legs[0].mult||100, exch:legs[0].exch,
    side:'BUY', qty:q, type:'COMBO', limit:useLmt?lim:null, stop:null, tif:$('cTif').value,
    status:'working', filledQty:0, avgFill:0, commission:0, triggered:false,
    legs: legs.map(function(l){ var c={}; for(var k in l) c[k]=l[k]; return c; })};
  S.orders.unshift(o);
  say('Spread order: '+o.symbol+' x'+qty(q)+(useLmt?(' net '+(lim>=0?'debit ':'credit ')+money(Math.abs(lim))):' at market'));
  tryFill(o);
  S.builder.legs = []; TICKET.climit='';
  save();
}

function closePos(conid){
  var p = posOf(conid); if(!p||!p.qty) return;
  if(!quoteReady(conid)){warn('Cannot close '+p.symbol+' without a fresh quote. Data reconnects automatically.');return;}
  if(p.expiry&&p.expiry<ymd()){warn('This contract has expired; settle it using its official expiry settlement value.');return;}
  if(S.orders.some(function(o){return o.status==='working'&&o.closingConid===conid;})){warn('A closing order is already working for '+p.symbol);return;}
  sel = {conid:p.conid, symbol:p.symbol, secType:p.secType, mult:p.mult, exch:p.exch, right:p.right, strike:p.strike, expiry:p.expiry, underConid:p.underConid, root:p.root};
  var o = {id:uid(), ts:Date.now(), day:today(), symbol:p.symbol, conid:p.conid, secType:p.secType, mult:p.mult, exch:p.exch,
    right:p.right, strike:p.strike, expiry:p.expiry, underConid:p.underConid, root:p.root,
    side: p.qty>0?'SELL':'BUY', qty: Math.abs(p.qty), type:'MKT', limit:null, stop:null, tif:'DAY',

  o.closingConid=conid;
  S.orders.unshift(o); tryFill(o); orderNotice((o.status==='filled'?'CLOSED':'CLOSING')+' · '+p.symbol+' · paper order'); save();
}

var WHATIF = null;
function previewOrder(side){
  if(!LOCAL){ warn('Order preview needs the standalone build talking to your own IBKR gateway.'); return; }

    WHATIF = {
      at: Date.now(), side: side, qty: q, symbol: sel.symbol,
