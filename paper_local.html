om roughly 50,000 to 150,000 million) building data centres, robots and automation. Using the latest FCF would make intrinsic value artificially low.\r\n\r\n| Step | Input | Value |\r\n|---|---|---|\r\n| 1 | Stock / ticker / method | Amazon / **AMZN** / discounted free cash flow |\r\n| 2a | Capex, 5 years | 61,053 + 63,645 + 52,729 + 82,999 + 131,819 |\r\n| 2b | ÷ 5 → **5-year average capex** | **78,449** million |\r\n| 2c | Latest cash flow from operations | **139,514** million |\r\n| 2d | **Normalized FCF** = 139,514 − 78,449 | **61,065** million |\r\n| 3 | Total debt = short-term **2,748** + long-term **65,648** | **68,396** million |\r\n| 4 | Cash & investments (latest quarter) | **123,329** million |\r\n| 5a | Growth, StockOracle/FactSet 3–5 yr | 18.95% (long-term rate shown as 13.2%) |\r\n| 5b | Growth, FinViz | 18.42% |\r\n| 5c | Growth, Zacks | 17.15% |\r\n| 5d | **Average → years 1–5** | **18.17%** |\r\n| 6 | Years 6–10 (base 18.17% but capped) | **15%** |\r\n| 7 | Years 11–20 | **4%** |\r\n| 8 | Shares outstanding (diluted average) | **10,863** million |\r\n| 9 | Beta **1.4** → discount rate | **7.4%** |\r\n\r\n**Results:**\r\n- **Intrinsic value = $206**\r\n- Current share price = **$214.33**\r\n- → **3.99% overvalued** (slightly)\r\n\r\n#### 5.4 Using Cash Flow from Operations instead of Free Cash Flow\r\n- Permitted **only if** CFO is **very close to net income** — specifically, **CFO must not be more than 20% above net income**.\r\n- Justification cited: **Buffett has said he does not deduct capital expenditure in his valuation if the capex is growth capex rather than maintenance capex.**\r\n- In the calculator, select the method **\"Discounted Cash Flow from Operations.\"**\r\n\r\n#### 5.5 WORKED EXAMPLE — Apple (AAPL), Discounted Cash Flow from Operations\r\n\r\n**Eligibility check:** operating cash flow **135,472** vs net income **117,777** (117.78B). 135,472 ÷ 117,777 → less than a 20% difference → **CFO method allowed**.\r\n\r\n| Step | Input | Value |\r\n|---|---|---|\r\n| 1 | Stock / ticker / method | Apple / **AAPL** / discounted **cash flow from operations** |\r\n| 2 | Latest 12-month net operating cash flow | **135,472** million |\r\n| 3 | Total debt = short-term **13,824** + long-term **76,685** | **90,509** million |\r\n| 4 | Cash & short-term investments (latest) | **66,907** million |\r\n| 5a | Growth, StockOracle (3–5 yr) | 12.31% |\r\n| 5b | Growth, FinViz | 11.23% |\r\n| 5c | Growth, Zacks | 13.33% |\r\n| 5d | **Average → years 1–5** | **12.29%** |\r\n| 6 | Years 6–10 (base case = same, under the 15% cap) | **12.29%** |\r\n| 7 | Years 11–20 | **4%** |\r\n| 8 | Shares outstanding | **14,810.36** million |\r\n| 9 | Beta **1.1** → discount rate | **6.6%** |\r\n\r\n**Results:**\r\n- **Base case intrinsic value = $256**\r\n- Current share price = **$260.83** → **1.8% overvalued**\r\n- **Conservative case:** years 1–5 = **11.23%** (lowest of the three), years 6–10 = **5.61%** (11.23 ÷ 2) → **intrinsic value $199.98 (~$200)**\r\n- StockOracle's own Oracle value = **$190** — lower because it applies a lower growth assumption.\r\n- **Adam's decision:** would **not** buy Apple at $260 even on the optimistic $256 number. Would be attracted to add shares **below $190**.\r\n\r\n#### 5.6 When no cash-flow method works — Singapore Airlines\r\n- Singapore Airlines' **operating cash flow is not consistent at all** — sideways, down, up, down. Net income (light green) also alternates up and down.\r\n- Because CFO is inconsistent (not just capex), **DCF cannot be used**.\r\n- Adam would **never buy it in the first place**: it fails a key criterion — **no consistently increasing revenue, net income and cash flow from operations**.\r\n- If forced to value it, the only usable method is the **mean price-to-sales ratio method** (used for very cyclical companies with inconsistent profits).\r\n\r\n---\r\n\r\n### 6. Non-US Listed Stocks (procedure differences)\r\n\r\n#### 6.1 Data sourcing and currency handling\r\n- StockOracle is **US-only for now** (Singapore + Hong Kong expected by end of 2026). For non-US stocks use **Yahoo Finance**.\r\n- **Ticker conventions:** Singapore tickers mix **letters and numbers** (e.g. S68, U11); Hong Kong tickers are **numbers** (e.g. 9988).\r\n- **Reading direction:** StockOracle presents financials **left → right** (newest first); Yahoo Finance presents **right → left** (2022, 2023, 2024, 2025, then LTM). Yahoo typically gives only ~4 years of data.\r\n- **Denomination:** Yahoo reports in **thousands**; convert to **millions** for the calculator.\r\n- **Currency:** the calculator asks for (a) currency of the financial statements, (b) currency of the share price, and (c) the exchange rate between them.\r\n  - Singapore Exchange: statements in SGD, price in SGD → exchange rate = **1**.\r\n  - **Alibaba illustration:** financial statements are in **Chinese renminbi**; the share price depends on the listing — **BABA** in the US is priced in **USD**, while **9988** in Hong Kong is priced in **HKD**. Enter the appropriate exchange rate.\r\n\r\n#### 6.2 WORKED EXAMPLE — Singapore Exchange (S68), Discounted Free Cash Flow\r\n\r\n**Precondition checks from Yahoo Finance (SGD thousands):**\r\n- Operating cash flow: **583 → 446 → 615 → 841 → 826** — not up every year but a general uptrend → acceptable.\r\n- Free cash flow: **539 → 392 → 551 → 773** — general uptrend → acceptable.\r\n- Capex: **44 → 54 → 64 → 68 → 71** — rising smoothly, **no sudden spike** → **no capex normalization needed**, use the standard discounted FCF method.\r\n\r\n| Step | Input | Value |\r\n|---|---|---|\r\n| 1 | Stock / ticker / method | Singapore Exchange / **S68** / discounted free cash flow |\r\n| 2 | Currencies | Statements SGD, price SGD, exchange rate **1** |\r\n| 3 | Latest FCF = 755,255 thousands → convert | **755.255** million |\r\n| 4 | Debt: short-term/current **326,360** + long-term **299,667** (thousands) → keyed in as | **332.303** million *(figure as stated in the lesson; note the stated sum does not reconcile arithmetically with the two components — likely a transcription artefact)* |\r\n| 5 | Cash & equivalents = 2,046,023 thousands → convert | **2,046.023** million |\r\n| 6 | Growth, years 1–5 | **8.22%** |\r\n| 7 | Growth, years 6–10 (assume it continues) | **8.22%** |\r\n| 8 | Growth, years 11–20 | **4%** |\r\n| 9 | Shares outstanding: Yahoo → Statistics → **implied shares outstanding** 1.07 billion (1 billion = 1,000 million) | **1,070** million |\r\n| 10 | Beta **0.28** (Yahoo → Summary) → discount rate (lowest in table) | **5.8%** |\r\n\r\n**Growth-rate limitation for non-US stocks:**\r\n- There is generally **no 5-year or long-term growth estimate** for Singapore, India or Australian listings — those companies do not give long-range guidance, and FinViz/Zacks do not cover them.\r\n- **Best available:** Yahoo Finance → **Analysis / Analyst → Growth Estimates → next-year growth**, plus the historical growth rate. For S68 that was **8.22%**.\r\n\r\n**Results:**\r\n- **Intrinsic value = $17.67**\r\n- Current share price = **$18.37** → **~3.9% overvalued**\r\n- Decision: **would not buy**. Interested if it falls well below $17.67 — at $17, $16, $15 or $12.\r\n\r\n---\r\n\r\n### 7. Method 3 — Discounted Net Income\r\n\r\n#### 7.1 When to use\r\n- Preference is always DCF, because **cash is more real than accounting profits**.\r\n- But certain business models make cash flow **inconsistent or not always positive by nature**:\r\n  - **Finance companies**\r\n  - **Insurance companies**\r\n  - **Brokers**\r\n  - **Asset management companies**\r\n- Reason: their cash flow is distorted by **loans issued and loans redeemed**, and by **customers putting cash into or taking cash out of the funds they manage** — this masks the underlying operations.\r\n- **Precondition: net income must be increasing consistently.** Rule of thumb applied in the lesson: **use whichever series is the more consistent** — if operating cash flow is volatile but net income trends up steadily, use net income.\r\n\r\n#### 7.2 Procedure (differences from DCF only)\r\n- Calculator method = **Discounted Net Income**.\r\n- Step 1 input becomes **latest 12-month net income** from the **Income Statement → Annual**, instead of free cash flow from the cash flow statement.\r\n- Every other input is identical: total debt (short + long-term, latest quarter), cash & investments, growth rates for years 1–5 / 6–10 / 11–20, shares outstanding, beta-based discount rate, currencies.\r\n\r\n#### 7.3 WORKED EXAMPLE — BlackRock (BLK), Discounted Net Income\r\n\r\n**Company note:** BlackRock = world's biggest **asset management** company (ETFs and public assets). Not to be confused with **Blackstone**, which is private equity.\r\n\r\n**Precondition check:** on the financials chart, net income (green) rises consistently (not every year, but a clear uptrend) and is **far more consistent than operating cash flow**, which is volatile → use net income.\r\n\r\n| Step | Input | Value |\r\n|---|---|---|\r\n| 1 | Stock / ticker / method | BlackRock / **BLK** / discounted **net income** |\r\n| 2 | Latest 12-month net income (income statement, annual) | **5,553** million |\r\n| 3 | Total debt: long-term **12,768**, short-term **none** | **12,768** million |\r\n| 4 | Cash & investments (latest quarter) | **11,468** million |\r\n| 5 | Growth, years 1–5 — StockOracle/FactSet 3–5 yr projected | **11.53%** (could also average with Zacks and FinViz) |\r\n| 6 | Growth, years 6–10 | **11.53%** (same rate) |\r\n| 7 | Growth, years 11–20 | **4%** |\r\n| 8 | Shares outstanding | **165.4** million |\r\n| 9 | Beta **1.49** → discount rate (closest row) | **7.7%** |\r\n| 10 | Currencies | Statements USD, price USD |\r\n\r\n**Results:**\r\n- **Intrinsic value = $795**\r\n- Current share price = **$967** → **21% overvalued**\r\n- **Why StockOracle shows a higher number ($960):** StockOracle uses the **projected longer-term growth rate of ~16% (16.07%)** rather than the 11.53% 3–5 year figure. Substituting 16.07% into the years 6–10 box pushes intrinsic value **above $900**.\r\n- **There is no right or wrong** — intrinsic value is a range determined by how optimistic or conservative your growth assumption is.\r\n- **Decision:** at $967 this is not a good deal. Interested only at roughly **$700-plus or below $700**.\r\n\r\n---\r\n\r\n### 8. Method 4 — Price to Book Ratio\r\n\r\n#### 8.1 The three use cases\r\n1. **Companies with no profits / making losses** — especially **temporary** losses:\r\n   - Banks during the **Great Financial Crisis**\r\n   - Retailers and other companies during **COVID-19**\r\n   - **Distressed businesses**, usually cyclical companies temporarily unprofitable because of an **industry recession or crisis**\r\n   - Also used when a company is **deeply undervalued relative to liquidation value**\r\n2. **Banks** — even highly profitable ones. *\"Banks are a very unique animal.\"* Analysts (Adam included) do **not** use DCF or discounted net income for banks.\r\n3. **Property developers and REITs** — buying a REIT means buying a portfolio of properties.\r\n\r\n- Why you have no alternative for loss-makers: **no earnings → no PE**; **negative cash flow → no DCF**; **negative income → no discounted net income**. The only thing left to compare price to is **book value**.\r\n\r\n#### 8.2 Book value and liquidation value\r\n- **Liquidation value:** if the company closes down, sells all its assets (property, machinery, equipment), collects the cash and pays off all its debts, **what is left over for shareholders** is the liquidation value = **book value**.\r\n```\r\nBook value = Total assets − intangible assets (goodwill, brand) − total liabilities\r\nBook value per share = Book value ÷ total shares outstanding\r\nPrice to Book ratio (P/B) = Share price ÷ Book value per share\r\n```\r\n- Intangibles are deducted because **goodwill and brand disappear when the company closes down**.\r\n\r\n#### 8.3 Simple illustration\r\n1. Liquidation value of the whole company = **$100 million**\r\n2. Shares outstanding = **100 million**\r\n3. Book value per share = 100M ÷ 100M = **$1.00**\r\n4. Share price = **$0.50**\r\n5. P/B = 0.50 ÷ 1.00 = **0.5** → you are **paying 50 cents for a dollar** of liquidation value\r\n- If the company goes bust and liquidates, you get back **more than you paid**.\r\n\r\n#### 8.4 Thresholds\r\n\r\n| Situation | Threshold |\r\n|---|---|\r\n| **Loss-making / distressed company** | Ideally **P/B ≤ 0.5** (buying at 50 cents on the dollar) |\r\n| **Banks, general rule** | **P/B 1.2 – 1.4 = fairly valued** |\r\n| **Banks, cheap** | **Below 1.2**, and especially **below 1.0**, = really undervalued |\r\n| **Banks, more accurate method** | Compare **current P/B to the bank's own 5-year average P/B**: above average = overvalued, below = undervalued |\r\n| **REITs, general rule** | Do not pay **more than 1.2× P/B (price to NAV)** |\r\n| **REITs with high double-digit DPU growth** | Up to **1.5×** is still acceptable |\r\n\r\n- **Historical example:** in the Great Financial Crisis (2009) Adam bought US banks including **Bank of America at a P/B of 0.4** — 40 cents on the dollar; even in liquidation he would theoretically get $1 back for every 40 cents paid.\r\n\r\n#### 8.5 Fair value formula for banks / REITs\r\n```\r\nFair value (intrinsic value) = (5-year average P/B) × (current book value per share)\r\n```\r\n\r\n#### 8.6 WORKED EXAMPLE — Bank of America (BAC)\r\n\r\n1. Current share price = **$48.56**\r\n2. Book value per share (StockOracle → Overview) = **$38.44**\r\n3. Current P/B = 48.56 ÷ 38.44 = **1.26** (StockOracle's own \"Valuation Ratios → P/B, most recent quarter\" shows **1.25** — rounding difference)\r\n4. 5-year P/B history (StockOracle → Company Metrics → Valuation/Price Ratios → P/B): **1.08, 1.01, 1.24, 1.43, 1.26**\r\n5. **5-year average P/B = 1.24**\r\n6. Current 1.26 > average 1.24 → **slightly overvalued**\r\n7. **Fair value = 1.24 × 38.44 = $47.67**\r\n8. Share price $48.56 vs fair value $47.67 → **slightly overvalued**\r\n\r\n#### 8.7 Singapore banks — the two-filter approach\r\nAdam buys the three Singapore banks **primarily for dividends** (though they also give good capital gains, especially **DBS**, which is a relatively high-growth bank). Two checks must both be considered:\r\n\r\n**Filter 1 — Dividend yield**\r\n- Target (as of the recording, 26 March, and dependent on the interest-rate environment): **at least 4.5% to 5%**. Below that, he will not buy.\r\n```\r\nMaximum price to pay = Dividend per share (last 12 months) ÷ target dividend yield\r\n```\r\n- **UOB (ticker U11 on SGX), via Yahoo Finance → Statistics:**\r\n  1. Current dividend yield = **4.3%** → below the 4.5–5% requirement\r\n  2. Trailing 12-month dividend per share = **$1.56**\r\n  3. Required price for a 4.5% yield = 1.56 ÷ 0.045 = **$34.67**\r\n  4. Current price = **$36** → too expensive; needs to fall to **$34 or lower**\r\n\r\n**Filter 2 — Fair value from P/B**\r\n- **UOB fair value calculation:**\r\n  1. Current book value per share (Yahoo Finance → Statistics → Balance Sheet section; also on StockOracle) = **$29.35**\r\n  2. 5-year P/B history read from **TradingView** (add the \"Price to Book Ratio\" indicator, set 5-year view, read the value on the **first trading day of January** for each of the last 5 years): **2026 = 1.14**, **2025 = 1.30**, plus **1.09** among the earlier years\r\n  3. Sum the five readings and divide by 5 → **5-year average P/B = 1.18**\r\n  4. **Fair value = 1.18 × 29.35 = $34.63**\r\n  5. Current price **$36** → slightly overvalued\r\n- **Adam's stance:** for Singapore banks he is willing to buy **slightly above fair value** as long as the dividend yield is at least **4.5–5%** — but **not too far above**.\r\n\r\n#### 8.8 The Price-to-Book Ratio Calculator (Excel tab)\r\n- Located in one of the tabs of the **Intrinsic Value Calculator** workbook, called the **Price to Book Ratio calculator**.\r\n- **Inputs:** current **book value per share** + the **P/B ratio for each of the last 5 years** (five numbers).\r\n- **Outputs:** the fair value **plus the +1 and −1 standard deviation levels** — giving a buy range rather than a single point.\r\n- **UOB application:** fair value ≈ $34, +1 SD ≈ $37 → willing to buy in that band, but **only if the dividend yield is at least 4.5–5%**.\r\n\r\n#### 8.9 Update frequency and a full applied example (OCBC)\r\n- **How often to update:** once a **quarter** is fine; **Adam updates monthly**. (Subscribers to the Ultimate Investors Playbook receive his monthly workings, buy levels and fair values.)\r\n- **OCBC (latest calculation shown):**\r\n  - **Fair value = $16.39**\r\n  - Current share price = **$20** → **overvalued**, with quite a bit to fall before it is attractive\r\n  - **+1 standard deviation price = $19.25** — the maximum he would pay above fair value (current price is above even this → far too expensive)\r\n  - **5% yield line = $16.40** — only at $16.40 or lower does OCBC yield 5%\r\n  - **Four identified buy levels: $17.87, $16.35, $14.40, $13.48**\r\n    - Derived from **technical support levels** (taught in the next lesson) **combined with** the yield requirement\r\n    - Example: buying at **$17.87** is within one standard deviation and gives roughly a **4.5% yield**\r\n  - Method: **combine fundamentals (fair value, yield) with technicals (support levels)** to set buy levels.\r\n\r\n---\r\n\r\n### 9. REITs — Price to Book / Price to NAV + Yield\r\n\r\n#### 9.1 Framework\r\n- A REIT (Real Estate Investment Trust) is effectively **a portfolio of properties**. The best ways to value it are **price-to-book ratio** and **dividend yield**.\r\n- Adam specializes in **Singapore-listed REITs** because they pay very high dividend yields and those dividends are **tax-free**.\r\n- **NAV = Net Asset Value = estimated market value of the REIT's total assets − total liabilities.** NAV per share = NAV ÷ number of units.\r\n- For Singapore-listed REITs, **NAV and book value are the same thing** and **price-to-NAV and price-to-book are used interchangeably**, because the book value of a REIT is **marked to market**. (US REITs are slightly different; the lesson focuses on Singapore REITs.)\r\n\r\n#### 9.2 Interpreting P/NAV\r\n- **P/NAV = 1.0** → the REIT trades at exactly the market value of its properties less debt.\r\n- **P/NAV = 1.2** → the REIT trades **20% above** the market value of its properties less debt.\r\n- **Rule of thumb: do not pay more than 1.2×.**\r\n- **Exception:** REITs with **high double-digit growth in DPU (distributions per unit)** can justify **up to 1.5×**.\r\n- **Best practice:** compute the individual REIT's own **average P/B** (5-year or 10-year) and derive a fair value from that.\r\n\r\n#### 9.3 The two REIT checks\r\n**Check 1 — Dividend yield**\r\n- Want **at least 5%** in today's interest-rate environment (may change as rates change).\r\n```\r\nMaximum price to pay = DPU (distributions per unit) ÷ 5%\r\n```\r\n\r\n**Check 2 — Price to NAV / Price to Book**\r\n```\r\nFair value = (10-year or 5-year average P/B) × (current book value / NAV per share)\r\n```\r\n\r\n#### 9.4 WORKED EXAMPLE — CapitaLand Ascendas REIT\r\n\r\n1. Pull the REIT up on **TradingView**, add the **Price to Book Ratio indicator**, set the **10-year** view.\r\n2. **Proper method:** read the P/B for each year (2025, 2024, 2023, …), sum all 10, divide by 10.\r\n3. **Shortcut method** (Adam's admitted lazy version, gives a roughly similar number):\r\n   - 10-year **high** P/B = **1.61**\r\n   - 10-year **low** P/B = **1.03**\r\n   - (1.61 + 1.03) ÷ 2 = **1.32** ≈ the 10-year average\r\n4. **Average P/B = 1.32** → below 1.32 = cheap, above 1.32 = expensive. This alone is a very quick valuation test.\r\n5. Current book value per share (Yahoo Finance) = **$2.27**\r\n6. **Fair value = 1.32 × 2.27 = $2.99**\r\n7. Current price = **$2.64** → **undervalued** (below the $2.99 fair-value line)\r\n8. **Yield check:** current dividend yield = **5.759%**, better than the 5% requirement → also attractive\r\n9. **Conclusion:** attractive on both the price-to-book and the yield test.\r\n\r\n---\r\n\r\n### 10. Method 5 — Price to Sales (P/S) and Price to Sales Growth (PSG)\r\n\r\n#### 10.1 When to use\r\nValues a company on **revenue** — not profits, not cash flow. Two circumstances:\r\n1. **Speculative growth stocks that are not yet profitable** — revenue is growing but the company has not reached economies of scale. One day it could be profitable, so you might take a small position first.\r\n2. **Highly cyclical companies** whose profits swing up and down with the economic cycle:\r\n   - **Property developers**\r\n   - **Construction companies**\r\n   - **Shipping companies**\r\n   - **Commodity companies**\r\n   - **Utility companies**\r\n   - (Also the only method available for something like Singapore Airlines — see §5.6, the \"mean price to sales ratio method.\")\r\n- In these cases PE ratio and discounted net income / discounted cash flow **do not work**.\r\n\r\n#### 10.2 Formulas\r\n```\r\nPrice to Sales ratio = Share price ÷ Revenue per share\r\nFair value = (5-year average P/S ratio) × (current revenue per share)\r\n```\r\n- No need to calculate P/S manually — available on any financial website including StockOracle (**Company Metrics → Price Ratios**).\r\n- Quick read: **current P/S above the 5-year average → overvalued; below the 5-year average → undervalued.**\r\n\r\n#### 10.3 WORKED EXAMPLE — Constellation Energy (CEG)\r\n\r\n**Why P/S:** on the financials bar chart, net profit (green) goes up, down, down, up, down — **very inconsistent**, unlike Microsoft or Apple. PE ratio, discounted income and discounted cash flow do not work.\r\n\r\n1. P/S history (StockOracle → Company Metrics → Price Ratios):\r\n   - 2022 = **1.16**\r\n   - 2023 = **1.79**\r\n   - 2024 = **2.99**\r\n   - 2025 = **4.13**\r\n   - Most recent = **3.71**\r\n2. **5-year average P/S = 2.52**\r\n3. Current P/S **3.71 > 2.52** → **already tells you it is overvalued**\r\n4. Revenue per share, last 12 months (StockOracle → Overview) = **$85.77**\r\n5. **Fair value = 2.52 × 85.77 ≈ $216**\r\n6. Current share price = **$317** → **overvalued**\r\n\r\n#### 10.4 Price to Sales Growth (PSG) ratio\r\n- The **cousin of the PEG ratio** — not commonly used, but useful for **speculative growth companies with very high revenue growth (50%, 100%, 200%) that are not yet profitable**.\r\n```\r\nPSG ratio = Price to Sales ratio ÷ projected revenue growth rate (%)\r\n```\r\n\r\n**Thresholds:**\r\n\r\n| PSG | Verdict |\r\n|---|---|\r\n| **0.2 – 0.3** | Fairly priced |\r\n| **Above 0.3** | Overvalued |\r\n| **Below 0.2** | Undervalued |\r\n\r\n#### 10.5 WORKED EXAMPLE — Nebius (NBIS)\r\n\r\n**Profile:** revenue growing \"like crazy\" but the company is **losing money**.\r\n\r\n1. Projected revenue growth rate (StockOracle → Company Metrics → Growth Rates → **Projected Revenue Growth Rate**) = **144.5%** (stated as ~144%)\r\n2. Latest **Price to Sales ratio** (Company Metrics → Price Ratios) = **48.72**\r\n3. **PSG = 48.72 ÷ 144.5 = 0.34** (StockOracle also calculates this for you)\r\n4. 0.34 is **above 0.3** → **slightly overvalued**\r\n5. **Buy trigger:** when PSG falls **below 0.3**, that would be at least a safe price to buy.\r\n\r\n---\r\n\r\n### 11. Adam's Full Decision Sequence (as summarised in the lesson)\r\n\r\n1. **Primary/default: DCF method.** Take the **free cash flow of the last 12 months**, project it **20 years**, discount to present value.\r\n2. **If FCF is inconsistent because capex is inconsistent:** use **latest 12-month CFO − 5-year average capex** = normalized FCF.\r\n3. **Optionally use cash flow from operations directly** instead of FCF — **only if CFO is very close to net income (not more than 20% above it)**.\r\n4. **Precondition for all of the above: cash flow from operations must be increasing consistently.**\r\n5. **If CFO is not consistently increasing → Discounted Net Income method**, provided net income is consistently increasing. Typically **financial stocks: insurance companies, asset managers, brokers, finance companies**.\r\n6. **Banks (special case) → Price to Book.** Fair value = **5-year average P/B × current book value per share**.\r\n7. **REITs → Price to NAV/Book.** Fair value = **5-year or 10-year average P/NAV × current NAV per share**, plus a **dividend yield check (target ≥ ~5%)**.\r\n8. **Companies with inconsistent profits (cyclicals) → Price to Sales ratio.**\r\n9. **Speculative growth stocks, high sales growth, unprofitable → Price to Sales Growth (PSG) ratio.**\r\n10. **Loss-making / distressed companies → Price to Book, ideally P/B ≤ 0.5.**\r\n11. **PEG ratio** sits outside this sequence as a **screening/quick-check tool only** (target ≤ 1.5).\r\n\r\n- If you would rather not do it manually, the **StockOracle Pro Intrinsic Value tab** runs every method and its algorithm picks the most appropriate one, published as the **Oracle Value**.\r\n  - Example given: **Microsoft — Oracle Value $557 vs share price $405 → undervalued.**\r\n\r\n---\r\n\r\n### 12. End-of-Lesson Quiz (with answers as given)\r\n\r\n1. **What type of companies tend to have inconsistent cash flow from operations?**\r\n   → **All of the above** — property developers, banks and commodity companies.\r\n2. **I want to value a company with inconsistently increasing cash flow from operations but consistently increasing net income. What method?**\r\n   → **(B) Discounted Net Income method.**\r\n3. **I want to value a bank and a property developer. Which method?**\r\n   → **Price to Book ratio method.**\r\n4. **I want to value a speculative growth company with high sales growth but still unprofitable. Which method?**\r\n   → **Price to Sales Growth ratio method.**\r\n\r\n---\r\n\r\n### 13. Key Takeaways\r\n\r\n- **Great business first, valuation second** — but never overpay. \"Cheap crap is still crap.\"\r\n- **Absolute price and recent price moves say nothing about value.** NVIDIA rose 120% and is still fairly priced; AMD fell 50% and is still expensive.\r\n- **A business is a money-making machine; its value is the present value of the cash it will generate.** Adam projects **20 years** (conservative vs. the CFA/textbook perpetuity + terminal-value approach) — anything beyond 20 years is a bonus.\r\n- **DCF on free cash flow is the default, used ~90% of the time**, but only when **CFO is consistently increasing**. One or two down years are fine; a broken trend is not.\r\n- **Growth-rate discipline:** average the **StockOracle (FactSet) 3–5 yr EPS growth**, **FinViz**, and **Zacks** estimates for years 1–5; **cap years 6–10 at a maximum of 15%**; use **4% for years 11–20** (nominal GDP + 2%).\r\n- **Discount rate = risk-free rate + beta × market risk premium**, using 5-year averages, read off the calculator's beta table (observed: beta 0.28 → 5.8%; 0.83 → 6.1%; 1.1 → 6.6%; 1.4 → 7.4%; 1.49 → 7.7%). Not WACC (that belongs to perpetuity DCF). Buffett instead just uses the **10-year Treasury yield (3.6%)**.\r\n- **Lumpy capex ≠ a broken business.** Normalize with a **5-year average capex** (Amazon: $78,449M average capex → normalized FCF $61,065M). Only inconsistent **operating** cash flow disqualifies a stock.\r\n- **CFO may substitute for FCF only if CFO is within 20% of net income** (Apple: CFO 135,472 vs NI 117,777).\r\n- **Intrinsic value is a range, not a number.** Run base / conservative / doomsday growth cases (MasterCard: $655.97 / $600 / $545.50). Buffett said American Express was worth $60, Munger said $50, the market said $35 — the gap is the **margin of safety**.\r\n- **Discipline shown by example:** Adam declined Apple at $260.83 (IV $256, conservative $199.98) and BlackRock at $967 (IV $795). Undervaluation, not a good story, triggers a buy.\r\n- **Banks are valued on P/B, never DCF.** Fair value = 5-yr avg P/B × current BVPS. 1.2–1.4 is fair; below 1.2 (especially below 1.0) is cheap; 0.4 was the GFC bargain in Bank of America.\r\n- **Singapore banks and REITs get a double filter:** fair value from P/B **and** a dividend-yield hurdle (**4.5–5% for banks, ≥5% for REITs**), with buy levels set at technical supports inside the ±1 standard-deviation band (OCBC: fair value $16.39, +1 SD $19.25, 5% yield line $16.40, buy levels $17.87 / $16.35 / $14.40 / $13.48).\r\n- **REIT rule of thumb: don't pay above 1.2× P/NAV**, up to 1.5× only for high double-digit DPU growth. Quick 10-year average shortcut: (10-yr high P/B + 10-yr low P/B) ÷ 2.\r\n- **Loss-making/distressed: P/B ≤ 0.5** — 50 cents on the dollar of liquidation value, so you profit even in liquidation.\r\n- **Unprofitable growth or cyclical: use revenue.** Fair value = 5-yr avg P/S × revenue per share. For hyper-growth unprofitable names, **PSG 0.2–0.3 = fair, >0.3 overvalued, \u003c0.2 undervalued**.\r\n- **Update your valuations at least quarterly; Adam does it monthly.**\r\n\r\n---\r\n\r\n### 14. Decision Table — Company Type → Valuation Method\r\n\r\n| Company type / situation | Method to use | Key inputs & thresholds |\r\n|---|---|---|\r\n| **Any stock — quick screen only** | **PEG ratio** | PE ÷ projected 5-yr EPS growth. Target **≤ 1.5**. Theory says \u003c1. Requires positive, consistently rising earnings. NVDA 54.69/61.17 = 0.89; AMD 112/33 = 3.4 |\r\n| **Great business, consistently rising CFO and positive, rising FCF** (e.g. MasterCard, Singapore Exchange) | **DCF — Discounted Free Cash Flow** (default, ~90% of cases) | Latest 12-mo FCF; total debt (ST+LT); cash & ST investments; growth yrs 1–5 = avg of StockOracle/FinViz/Zacks; yrs 6–10 capped at 15%; yrs 11–20 = 4%; 20-yr horizon; diluted shares; beta-based discount rate |\r\n| **Consistent CFO but lumpy/spiking capex** (Amazon, hyperscalers: MSFT, META, GOOGL) | **DCF with normalized capex** | Normalized FCF = latest CFO − **5-year average capex**; all other inputs unchanged |\r\n| **CFO very close to net income (CFO ≤ 20% above NI)** (Apple) | **DCF — Discounted Cash Flow from Operations** | Use latest 12-mo CFO in place of FCF. Buffett rationale: no capex deduction when capex is growth, not maintenance |\r\n| **Finance companies, insurance companies, brokers, asset managers** — cash flow distorted by loans and fund flows (BlackRock) | **Discounted Net Income** | Latest 12-mo net income; requires **consistently increasing** net income; all other DCF inputs identical |\r\n| **Banks** — profitable or not (Bank of America, DBS, UOB, OCBC) | **Price to Book** | Fair value = **5-yr avg P/B × current BVPS**. Fair band **1.2–1.4**; cheap below 1.2 / 1.0. For SG banks add **dividend yield ≥ 4.5–5%** filter |\r\n| **Loss-making, distressed, near-bankruptcy, cyclical firms in an industry recession** (GFC banks, COVID retailers) | **Price to Book** | Target **P/B ≤ 0.5**; BAC bought at **0.4** in 2009. Book value = assets − intangibles − total liabilities |\r\n| **REITs and property developers** (CapitaLand Ascendas REIT) | **Price to NAV / Price to Book + dividend yield** | Fair value = **5- or 10-yr avg P/NAV × current NAV per share**. Don't exceed **1.2×** (1.5× only for high double-digit DPU growth). Yield target **≥ 5%**; max price = DPU ÷ 5% |\r\n| **Highly cyclical: utilities, shipping, commodities, construction, property developers, airlines** (Constellation Energy, Singapore Airlines) | **Price to Sales (mean P/S)** | Fair value = **5-yr avg P/S × revenue per share**. Current P/S above avg = overvalued |\r\n| **Speculative growth, very high revenue growth (50–200%), not yet profitable** (Nebius) | **Price to Sales Growth (PSG)** | PSG = P/S ÷ projected revenue growth %. **0.2–0.3 fair, >0.3 overvalued, \u003c0.2 undervalued** |\r\n| **Company with inconsistent operating cash flow AND inconsistent net income AND no meaningful book value** | **Do not buy** | Fails the core criterion of consistently increasing revenue, net income and CFO — find another stock |\r\n\r\n---\r\n\r\n# Part V — Technical Analysis: Timing Entries and Exits\r\n\r\n## 05 — Technical Analysis (Lesson 6: Timing Your Entries with Technical Analysis)\r\n\r\n*Source transcripts: 43 Reading Charts · 44 Support & Resistance · 45 Moving Averages · 46 Buying on Uptrends · 47 Buy/Sell on Downtrends · 48 Catching Bottoms*\r\n\r\n---\r\n\r\n### 1. Why Technical Analysis in a Value Framework\r\n\r\n#### 1.1 The Rationale\r\n- In the **short term the market is not driven by logic — it is driven by emotions (sentiment)**.\r\n- Prices are driven by **demand and supply**, which in turn is driven by **fear and greed**.\r\n  - When people are excited → they buy, buy, buy → price keeps going up **even though it's overpriced**. \"High can get even higher.\"\r\n  - When people are scared → they sell → price keeps going down **even though it's a good company and undervalued**. \"Low can keep going lower.\"\r\n- Technical analysis identifies **potential reversal points** where price tends to reverse back up — the ideal points to enter.\r\n- We do **not** want to buy a great, undervalued company and then watch the price keep sliding. We want to buy **at or near the point of reversal**.\r\n\r\n#### 1.2 Core Caveats Adam Repeats Constantly\r\n- **There is no 100% certainty in technical analysis.** We cannot predict the market.\r\n- TA is about **probability**, not prediction: \"Are prices more likely to keep going up, or more likely to keep going down?\"\r\n- We look for **high-probability reversal points** — a high chance the price reverses up at that level. It could still go lower.\r\n- Because of this uncertainty: **NEVER go all-in at once. Always buy in tranches — three to four tranches — at these reversal levels.**\r\n- Adam's phrase used throughout: we buy at \"**potential bottoms**\", never \"the bottom\".\r\n\r\n#### 1.3 Definition Adam Uses\r\n> **Technical analysis is the study of emotional patterns that are captured on price charts.**\r\n\r\n- Analogy: reading a chart is like a **psychologist reading a patient** — facial expression and body language reveal emotion, and from emotion you anticipate behaviour.\r\n- A chart tells you whether investors are **bullish** (increasingly optimistic), **bearish** (increasingly pessimistic), or **confused**, and what the most probable short-term move is.\r\n\r\n#### 1.4 The Contrarian Note\r\n- Warren Buffett and Peter Lynch **do not look at charts at all**. If it's a good company and undervalued, they just buy — they hold 5/10/15 years, so a 6-month or 1-year decline doesn't matter to them.\r\n- Adam: \"There's nothing wrong with that. You can ignore all these charts as well.\"\r\n- **Adam's position:** combining chart patterns with great, undervalued companies gives you **better entry points** — not perfect entry points, but better.\r\n\r\n#### 1.5 Trend Probability Principle\r\n> **An established trend in price is statistically more likely to continue from one interval to the next than it is to reverse.**\r\n\r\n- **River-current analogy:** if the current flows upward, jumping in carries you up. If the current flows downward, no matter how hard you swim you get swept downstream.\r\n- Downtrend → probability is price keeps going lower **until the trend changes**.\r\n- Uptrend → probability is price keeps going higher.\r\n\r\n---\r\n\r\n### 2. Reading Charts: Candlesticks and OHLC\r\n\r\n#### 2.1 The Four Daily Prices\r\n- US market **opens 9:30 a.m. Eastern (New York) time** every weekday. First transacted price = **opening price**.\r\n- Market **closes 4:30 p.m. Eastern time** *(as spoken in the transcript)*. Last transacted price = **closing price**.\r\n- Every trading day has four prices: **Open, High, Low, Close (OHLC)**.\r\n- **Worked example (McDonald's):**\r\n  - Open = **$99.70**\r\n  - High of day = **$100.30**\r\n  - Low of day = **$99.45**\r\n  - Close = **$99.99**\r\n\r\n#### 2.2 Candlestick Anatomy\r\n- Candlesticks represent all four prices in one bar.\r\n- **Bullish / up day** = close **higher** than open → **green candle** (some platforms use white — same meaning).\r\n  - Body **bottom** = opening price\r\n  - Body **top** = closing price\r\n  - Worked example: opens $10, closes $20, high $25, low $8\r\n- **Bearish / down day** = close **lower** than open → **red candle**.\r\n  - Body **top** = opening price\r\n  - Body **bottom** = closing price\r\n  - Worked example: opens $20, closes $10, high $25, low $7\r\n- **Mnemonic:** bullish candle — open below, close on top. Bearish candle — the **opposite**: open on top, close below.\r\n- **Body** = the rectangle (open→close range).\r\n- **Wick / shadow / tail** = the thin lines (all three words mean the same thing).\r\n  - Upper wick = high of the period\r\n  - Lower wick = low of the period\r\n- Bottom line for the course: **green = bullish, red = bearish.**\r\n\r\n#### 2.3 The Pin Bar (the one candlestick pattern Adam teaches)\r\n- Adam explicitly says: there are many candlestick patterns, but **for investing they are not that important — except the pin bar**.\r\n- **Pin bar = a candle with a very small body and one long tail** (looks like a pin).\r\n\r\n**Bullish pin bar**\r\n1. **Small body**\r\n2. **Long LOWER tail** (tail below the body)\r\n3. Upper tail is short or absent\r\n4. **Colour of the body does not matter** — a red-bodied candle with a long lower tail is still a bullish pin bar\r\n5. **Meaning:** higher likelihood price moves UP after this candle\r\n6. **Critical qualifier:** the candle alone is not good enough — it **must appear at a strong support level or at a moving-average support**\r\n\r\n**Bearish pin bar**\r\n1. **Small body**\r\n2. **Long UPPER tail** (tail above the body)\r\n3. **Colour does not matter** — a green-bodied candle with a long upper tail is still a bearish pin bar\r\n4. **Meaning:** higher chance price goes DOWN\r\n5. **Critical qualifier:** must appear at a **strong resistance level** to be reliable\r\n\r\n- **Worked example:** Amazon (AMZN) **daily** candles — multiple red-bodied bullish pin bars with small bodies and long lower tails; price went up after each.\r\n\r\n#### 2.4 Gaps\r\n- On shorter timeframes you see **big gaps** between one candle's close and the next candle's open.\r\n- **Cause:** overnight news — most commonly **earnings announcements**.\r\n  - If earnings disappoint vs expectations → gap down.\r\n  - If earnings beat → often gap up, but **not guaranteed**.\r\n- **Worked example:** Google — a large gap down between Wednesday's close and Thursday's open, caused by earnings.\r\n- **Counter-example given:** McDonald's announced terrible earnings (revenue slowed) and **the price went up** — \"in the short term, the market can be totally irrational.\"\r\n- **Investor interpretation:** short-term drops on news/earnings are **not important** — in fact they are **buying opportunities** if the drop makes the stock undervalued.\r\n\r\n---\r\n\r\n### 3. Timeframes — The Three-Chart Top-Down Routine\r\n\r\n#### 3.1 Candle Periods Available\r\n- **Daily candles** — each candle = one trading day\r\n- **Weekly candles** — each candle = one week\r\n- **Monthly candles** — each candle = one month\r\n\r\n#### 3.2 Adam's Fixed Sequence (every new stock, in this order)\r\n\r\n| Step | Period | Candles | Purpose |\r\n|---|---|---|---|\r\n| 1 | **10 years** | **Monthly** | Confirm long-term uptrend; is this a long-term performer? |\r\n| 2 | **5 years** | **Weekly** | See medium-term cycles (uptrend/downtrend alternation) |\r\n| 3 | **1 year** (sometimes **6 months**) | **Daily** | Short-term trend, precise entry timing |\r\n\r\n> \"As an investor, you have to take a look at **all** the timeframes, because every timeframe gives you a different perspective.\"\r\n\r\n#### 3.3 What Each Timeframe Shows\r\n- **10-year monthly:** should be one clear **long-term uptrend**. This is the screening filter.\r\n  - **If the 10-year chart is not going up, Adam is not interested — he won't even look at the business.**\r\n  - **Rejection examples:**\r\n    - **TransOcean (RIG)** — oil & gas — 10-year chart \"not going up\" → rejected immediately.\r\n    - **Singapore Airlines (SIA)** — stock did not go up over 10 years → \"not long-term performers, forget about it.\"\r\n  - A rising 10-year chart means the company **increases in value over the long run** — makes more and more money, price keeps going up.\r\n- **5-year weekly:** you will **not** see one straight line. You see **big medium-term cycles** — uptrend, downtrend, uptrend.\r\n  - Key structural fact: **in a great company, the uptrends will be longer than the downtrends.**\r\n  - Worked example: Google 5-year weekly — visible uptrend → downtrend → uptrend sequence.\r\n- **1-year daily:** shorter-term trends, gaps, precise support touches.\r\n\r\n#### 3.4 The Unclosed-Candle Rule\r\n1. **Never analyse a candle that has not closed.**\r\n2. Only analyse **closed** candles.\r\n- Worked example (recorded **11 February 2025**): the February monthly candle is still forming → ignore it. **The last valid candle is the January candle.**\r\n- Adam then reads the closed monthly candles of Google:\r\n  - **January** — very bullish month, closed way above the open (open at body bottom, close at body top, wicks = month high/low)\r\n  - **December** — very bullish; opened 1 December at body bottom, ran to month high, closed 31 December at body top\r\n  - **November** — bearish month; opened 1 November at body **top**, closed at body **bottom**\r\n\r\n---\r\n\r\n### 4. Charting Platform Setup — TradingView\r\n\r\n#### 4.1 Platform Choice\r\n- Adam uses **TradingView**; you may use **any** charting software (your broker's own charting works too).\r\n- TradingView advantages: **stocks from all around the world** (US, Singapore, India) plus other assets (gold, Bitcoin).\r\n- Access: **tradingview.com → Products → Supercharts**.\r\n- Available as **desktop app (Windows/Mac)** or **web version** — both fine.\r\n- **Paid vs free:** free version limits you to **two indicators**. Adam subscribes to paid for flexibility, but says it is **not a must** — there is a workaround (see §6.6).\r\n\r\n#### 4.2 Entering a Symbol\r\n- **Top-left corner** — type the ticker (e.g. `GOOG` or `GOOGL`) and the chart loads.\r\n\r\n#### 4.3 Adam's Chart Settings (right-click on chart → Settings; on Mac use **two fingers on trackpad**)\r\n\r\n**Symbol tab**\r\n- Candle **body**: green / red\r\n- **Borders**: green / red\r\n- **Wick** (upper and lower tail): green / red\r\n\r\n**Status line tab**\r\n- Logo\r\n- Title\r\n- Chart values\r\n- Bar change values\r\n\r\n**Scales and lines tab**\r\n- Currency and unit: **always visible**\r\n- Scale modes **A and L**: visible\r\n- On mouse-over scale\r\n- Scale **placement: auto**\r\n- Symbol **name and value**\r\n\r\n**Canvas tab** (background)\r\n- Background: **solid white** (Adam's personal preference — \"I don't like a dark background\")\r\n- Crosshairs: set colour\r\n- Text: **black**\r\n- Lines: **black**\r\n\r\n**Events tab** (Adam enables all of these)\r\n- **Dividends** (so he sees ex-dividend dates)\r\n- **Splits**\r\n- **Earnings**\r\n- **Latest news**\r\n\r\n#### 4.4 Scale Setting\r\n- On the **right-hand side**, enable **log (logarithmic) scale** when viewing the 10-year chart — makes the long-term trend read clearly.\r\n\r\n#### 4.5 Period Buttons\r\n- **\"All\"** → shows the stock from the beginning of its listing and **automatically switches to monthly candles**. Adam then drags the chart back to show roughly the **last 10 years** (in 2025 → back to ~2015).\r\n- **\"5Y\"** → automatically shows **weekly candles**.\r\n- **\"1Y\"** → automatically shows **daily candles**.\r\n\r\n#### 4.6 Chart Event Icons (bottom of chart)\r\n- **`E` in a square (outlined)** = earnings **not yet reported / upcoming**.\r\n  - Worked example: **NVIDIA** — hovering shows earnings on **Wednesday 26 February**; the icon style indicates it reports **after the market closes** that day (some companies report **before the open**).\r\n- **Green `E`** = earnings **already reported**.\r\n- **News icon** = click to see all news related to the stock on that day — useful when price suddenly drops or spikes and you want the cause.\r\n- **`D`** = **dividend**, usually the **ex-dividend date**. Buy **before** the ex-dividend date to receive the dividend.\r\n\r\n#### 4.7 Dividend-Adjustment Toggle (bottom right)\r\n1. **Analysing a single stock on its own → DO NOT adjust for dividends.**\r\n2. **Comparing the performance of two or more stocks → DO adjust for dividends.**\r\n- **Worked example (5-year comparison):**\r\n  - Unadjusted: **Google +152%** vs **DBS Bank (Singapore) +92%** → Google looks far better.\r\n  - DBS pays large dividends; Google pays none.\r\n  - **Adjusted for dividends: the two are almost neck and neck — only about 4% difference.**\r\n- Lesson: dividend adjustment is **essential** for fair cross-stock comparison.\r\n\r\n#### 4.8 Drawing Tools\r\n- Drawing tools are on the **left-hand side** of the chart.\r\n- **Horizontal Line** → used for support and resistance levels.\r\n- **Horizontal Ray** → used for the **intrinsic value line**.\r\n- To style a drawn line: put mouse on it → **right-click** (or two fingers on Mac trackpad) → **Settings** → set colour, label text, and line style.\r\n\r\n---\r\n\r\n### 5. Swing Points, Support and Resistance\r\n\r\n#### 5.1 Order of Operations\r\n> \"The first thing I do when I look at charts is identify **swing high and swing low points**, then **support and resistance levels**. And I do this on **all** the timeframes, **especially on the weekly and on the daily**.\"\r\n\r\n**Why:** it tells you where price is likely to reverse.\r\n- Price falling → at a **support level** it is more likely to reverse back **up**.\r\n- Price rising → at a **resistance level** it is more likely to reverse back **down**.\r\n- Not a guarantee — a **high probability**.\r\n\r\n#### 5.2 Swing Point Definitions\r\n- **Swing high** = price goes **up**, then reverses **down**. The peak is the swing high.\r\n- **Swing low** = price goes **down**, then reverses **up**. The trough is the swing low.\r\n\r\n#### 5.3 Support Level — Identification Rules\r\n1. Find a **swing low**.\r\n2. If price comes down again and reverses up at **roughly the same price**, you now have **two swing lows at a similar level**.\r\n3. **Two swing lows at roughly the same price → draw a horizontal line across them → this is a POTENTIAL support level.**\r\n4. If price returns to that same level a **third time** and reverses up again → it becomes a **CONFIRMED support level**.\r\n5. Levels do **not** have to be exact — \"roughly the same point, doesn't have to be exact.\"\r\n\r\n**Definition:** A support level is a price where every time the stock drops to it, it reverses back up.\r\n\r\n**Why it works (mechanism):** At that price there are **a lot of buyers queued waiting to buy** — a **demand zone**. When price hits it, buy orders flood in, **demand exceeds supply**, price reverses up.\r\n\r\n#### 5.4 Resistance Level — Identification Rules\r\n1. Find a **swing high**.\r\n2. Price rallies again and reverses down at **a very similar swing-high level**.\r\n3. **Two or more swing highs coinciding at a similar level → draw a horizontal line → resistance level.**\r\n4. Subsequently, when price returns to that level it has a **higher likelihood of reversing back down**.\r\n\r\n**Why it works (mechanism):** At that level there are **many sellers queuing to sell**. When price reaches it, sellers rush in, **supply exceeds demand**, price reverses down.\r\n\r\n#### 5.5 THE POLARITY RULE (Adam: \"Very important concept. Please write this down.\")\r\n> **When a resistance level is broken, that previous resistance becomes a SUPPORT level.**\r\n> **When a support level is broken, that previous support becomes a RESISTANCE level.**\r\n\r\n- Practical consequence: **previous swing highs and previous resistance levels are your future support levels — the places where you add shares.**\r\n- Adam: \"That is why it's important to look at previously where were the resistance levels, where were the swing highs.\"\r\n- If it's a good company with good fundamentals and it's undervalued, it will **eventually break out** of a resistance — and then that level flips to support on the way back down.\r\n\r\n#### 5.6 Support/Resistance Is a ZONE, Not a Line\r\n- Although you draw a line, **think of it as a zone with a buffer**.\r\n- Price may:\r\n  - Overshoot slightly **below** the support line and then reverse up (\"like hitting a fence and the fence moves a bit\").\r\n  - **Fall short** of the line — buyers anticipate the touch, buy early, and price reverses before reaching the line.\r\n- Give the level **a bit of a buffer**.\r\n\r\n#### 5.7 Line-of-Best-Fit Rule (where exactly to draw the line)\r\n1. Place the line at the **point of best fit**.\r\n2. Best fit = **the line that touches as MANY swing lows (or swing highs) as possible**.\r\n3. A line touching only one swing low is **not significant**.\r\n4. **The more swing lows it touches, the more significant the level.** (Adam's demonstration line touched **five** swing lows.)\r\n\r\n#### 5.8 Timeframe Applicability\r\n- Support and resistance levels appear on **different timeframes at different places** — draw them on **both daily and weekly**.\r\n- **Weekly is usually clearer** than daily.\r\n- **Monthly:** occasionally you will find them, but **usually not** — on monthly the price is normally in a very clear uptrend. S/R normally occurs at the **shorter timeframes (weekly and daily)**.\r\n- Note also: **when a stock is in a very strong trending phase you won't see many support levels** — S/R levels form mostly when price moves into **consolidation**.\r\n- **The market has a long-term memory** — a support level can be respected again **many months later**.\r\n\r\n#### 5.9 Worked Support/Resistance Examples\r\n\r\n**Google (GOOG/GOOGL)**\r\n- Support at **$49.90 / ~$50** — three-plus swing lows; price repeatedly bounced there.\r\n- **Polarity:** *before* becoming support, **$49.90 was RESISTANCE** — price hit $49.90 and reversed down, hit $49.90 again and reversed down, was rejected a third time, then **broke out**. After breakout, $49.90 became **support**.\r\n- Multiple additional support levels drawn on the same chart.\r\n\r\n**McDonald's (MCD)**\r\n- Support at **~$230** — price dropped to $230, reversed up; came back to a similar level, reversed up; came back again, reversed up. Many buyers waiting at 230 = demand zone.\r\n- A second, lower support level also identified (swing low, rally, return to the same point, reversal up).\r\n\r\n**Thermo Fisher (TMO)** — weekly and daily\r\n- Support at **~$520** — repeated reversals; demonstrates the **zone** concept (price sometimes goes slightly below $520 before reversing, sometimes reverses just above it).\r\n- Support at **~$439** — repeated reversals; and **many months later** the market \"remembered\" $439 and reversed there again.\r\n- Resistance at **~$604** — four-plus swing highs rejected; price has been below $604 for **one, two, three years**.\r\n  - Adam's forward view: Thermo Fisher is a great company, will earn more over time and increase in value, so **eventually it will break $604 — exactly when, unknown** — and once broken, **that very strong resistance becomes future support**.\r\n- Also noted: the **$520 level was itself a previous resistance** before becoming support.\r\n\r\n**IWM (Russell 2000 / small-cap ETF)**\r\n- Support at **$162.70 / $162.72** — swing low, then repeated bounces \"right on the dot\".\r\n- Resistance at **$198** — three swing highs rejected at $198.\r\n- Then $198 was **broken**, and on the pullback **$198 acted as support** — repeated bounces, and the stock began to trend up.\r\n- Zooming from weekly to **daily** made the support level \"a lot clearer\".\r\n- Line-of-best-fit demonstration on this chart: a line touching **five swing lows**; price later reversed again at ~**210** *(figure as spoken in the ASR transcript)*.\r\n\r\n**Mercado Libre (MELI) — daily**\r\n- Resistance at **~$288 / $280** formed by two coinciding swing highs → broke out → came back down → **that same line became support**, bounced there repeatedly.\r\n- Another support identified from a matching pair of swing lows → **when broken it became resistance**.\r\n- Adam summarises on this chart: \"Support when broken becomes resistance. Resistance when broken becomes support. The same phenomenon.\"\r\n\r\n**Mercado Libre (MELI) — weekly**\r\n- Resistance at **~$290** — three swing highs rejected; price \"not able to break out of it yet.\"\r\n- Forward view: good company, good fundamentals, undervalued → eventually breaks out → then that resistance becomes support and price bounces off it repeatedly on the way up.\r\n\r\n**Walmart (WMT) — weekly**\r\n- Two swing highs at the same level = **resistance**; once broken, the level became **support** and price bounced off it repeatedly before running higher.\r\n- A second support level from matching swing lows also identified.\r\n\r\n#### 5.10 The Investing Purpose of S/R\r\n> \"Before we buy a stock — ideally it's a great company, it is undervalued, **and it has dropped to a support level** — we get in right at the support so that we have a high probability of catching the reversal back up.\"\r\n\r\n- Adam: \"For me, when I buy shares, **I always buy them at support levels**.\"\r\n- Corollary: if price is **mid-fall between levels**, he'd **rather not buy there**, knowing there's a high chance it drops to the support first.\r\n\r\n---\r\n\r\n### 6. Moving Averages\r\n\r\n#### 6.1 What They Are and Why\r\n- A **moving average is a mathematical calculation that averages the price of a stock over a certain period of time**; the charting software plots it.\r\n- **Key function: moving averages act as DYNAMIC support levels.**\r\n  - \"Stocks have a tendency to wave down towards their moving averages and use the moving average as a support where they bounce off.\"\r\n  - Worked illustration: **Meta** — price waves down, hits the blue 50 MA, bounces; repeated six-plus times.\r\n- **Moving averages are areas where Adam likes to buy** — because that's where price tends to bounce and reverse back up after dropping.\r\n- Not every stock bounces off the 50 — some bounce off the 100, some the 150. Hence a **set** of MAs.\r\n\r\n#### 6.2 Adam's EXACT Moving-Average Set (6 total)\r\n\r\n**Simple Moving Averages (SMA) — 4 of them**\r\n\r\n| Period | Colour | Line weight |\r\n|---|---|---|\r\n| **50 SMA** | **Blue** | Thick (2nd thickness) |\r\n| **100 SMA** | **Orange** | Thick |\r\n| **150 SMA** | **Green** | Thick |\r\n| **200 SMA** | **Red** | Thick |\r\n\r\n**Exponential Moving Averages (EMA) — 2 of them**\r\n\r\n| Period | Colour | Line weight |\r\n|---|---|---|\r\n| **20 EMA** | **Red** | **Thin** (to distinguish from the red 200 SMA) |\r\n| **40 EMA** | **Blue** | **Thin** (to distinguish from the blue 50 SMA) |\r\n\r\n- Adam on the colour scheme: \"The 50 is always in blue. Why? **Because I said so, so follow it.**\" \"150 **has to be** green.\" \"200 is **always** red.\"\r\n- Justification for the periods: \"**Over the years I found that these are the most reliable simple moving averages.**\"\r\n\r\n#### 6.3 SMA vs EMA — The Calculation Difference\r\n- **SMA:** software takes the **last N days of closing prices, adds them together, divides by N**, equally weighted. Repeats every day.\r\n  - 50 SMA = sum of last 50 closes ÷ 50.\r\n  - 200 SMA = sum of last 200 closes ÷ 200.\r\n- **EMA:** software takes the last N closes but **assigns individual weights** — **recent prices are weighted more heavily** than older prices. It is a **weighted** moving average.\r\n- Adam: \"You don't have to worry about the mathematics behind it. It's not important. **Just know when to use which one.**\"\r\n\r\n#### 6.4 TIMEFRAME RULE — Which MAs Apply Where (critical)\r\n\r\n| Timeframe | Moving averages that act as support | Ignore |\r\n|---|---|---|\r\n| **Daily** | **50, 100, 150, 200 SMA only** | **20 and 40 EMA** |\r\n| **Weekly** | **20 and 40 EMA** (plus SMAs) | — |\r\n| **Monthly** | **20 and 40 EMA** (plus SMAs) | — |\r\n\r\n> \"On the **daily** timeframe we pay attention mainly to the simple moving averages — the 50, 100, 150 and 200. **We do not really pay attention to the 20 and 40 EMAs. Please take note of that.** The 20 and 40 EMAs only come into service at the higher timeframes — at the weekly and the monthly candles.\"\r\n\r\n#### 6.5 How to Install Them in TradingView (step-by-step)\r\n1. Click **Indicators**.\r\n2. Type **\"moving average\"** → select **Moving Average Simple** (or type **EMA** → **Moving Average Exponential**).\r\n3. TradingView defaults to the **9 period** — this must be changed.\r\n4. Click the **gear icon** (settings) on the indicator → **Inputs** tab → change the period to 50 / 100 / 150 / 200 (or 20 / 40 for EMA). **Change nothing else in Inputs.**\r\n5. Go to the **Style** tab → set the colour per the table above and the line thickness (thick for SMAs, thin for EMAs).\r\n6. Repeat for all six.\r\n7. **Save the template:** click the **four-boxes icon (\"Indicator templates\") → Save** → name it e.g. **\"all moving averages\"**.\r\n8. For any new stock (e.g. Apple) with a blank chart, just load the saved **\"all moving averages\"** template instead of re-keying everything.\r\n\r\n#### 6.6 Free-Account Workaround — PP Multi MA\r\n- TradingView **free version allows only two indicators**.\r\n- Piranha Profits has built a **single indicator containing all the moving averages**: **PP Multi MA**.\r\n- **How to get it:**\r\n  1. Go to the Piranha Profits website where you watch the video → **Lesson 6** → scroll to **\"Course notes and resources\"**.\r\n  2. Below the course notes, find **\"PP Multi MA\"** and click the link.\r\n  3. On the page that opens, **scroll down** and click **\"Add to favorites\"**. Done.\r\n  4. Back on your chart → **Indicators → Favorites → PP Multi MA** → all moving averages appear at once.\r\n- **Trade-off / only drawback:** with PP Multi MA you must **view all MAs together — you cannot hide individual ones**. Installing them individually lets you hide/show any single MA (e.g. show only the 50).\r\n\r\n#### 6.7 Moving Averages and Stock \"Personality\"\r\n> \"Stocks are like people. We are all different. Same with stocks.\"\r\n\r\n- Some stocks like to bounce off the **20**; others ignore the 20 and bounce off the **40**; others use the **50** or **100**.\r\n- **Rule:** *Before buying a stock, look at HISTORICALLY which moving averages it bounced off. Determine the \"personality\" of the stock. Then wait for it to hit its preferred moving average — the one where it tended to bounce in the past — and add shares there.*\r\n- Adam draws a **horizontal support line at that preferred moving average** on the chart.\r\n\r\n---\r\n\r\n### 7. Trend Identification\r\n\r\n#### 7.1 The Three Trends\r\n1. **Uptrend** — price generally moves upward\r\n2. **Downtrend** — price generally moves downward\r\n3. **Consolidation** — price generally moves sideways\r\n\r\n#### 7.2 UPTREND — Definition and Confirmation\r\n\r\n**Price-structure definition**\r\n- **Higher swing highs AND higher swing lows.**\r\n  - Prices still drop on an uptrend — but each drop makes a **swing low higher than the previous low**, and each rally makes an **even higher high**.\r\n- Message: **the market is bullish** on this stock; probability is price continues higher.\r\n\r\n**Moving-average confirmation (two clues)**\r\n1. **All moving averages sloping UPWARDS.** \"The slope of the moving average tells you the direction of the trend.\"\r\n2. **Sequence: shorter-term MAs ABOVE longer-term MAs** →\r\n   **50 above 100 above 150 above 200.**\r\n\r\n**Wave behaviour**\r\n- Price moves in **waves**: wave up, wave down, wave up, wave down — \"like a breathing pattern: breathe out, breathe in.\" The pattern continues **until the trend reverses**.\r\n- Normal uptrend advances at roughly a **45-degree angle**.\r\n\r\n#### 7.3 DOWNTREND — Definition and Confirmation\r\n\r\n**Price-structure definition**\r\n- **Lower swing highs AND lower swing lows.**\r\n  - Prices still go up on a downtrend — each rise is a **short-term rally** — but each rally tops out **lower than the last**, and each drop goes **lower than the last**.\r\n- Message: **the market is bearish / pessimistic**; probability is price continues downward.\r\n- \"Even if it's a great company and it's undervalued, on a downtrend, because of the downward momentum — **cheap can get cheaper, low can get lower.**\"\r\n\r\n**Moving-average confirmation (two clues — exact opposite of uptrend)**\r\n1. **All moving averages sloping DOWNWARDS** (50, 100, 150, 200 all sloping down).\r\n2. **Sequence reversed: longer-term MAs ABOVE shorter-term MAs** →\r\n   **200 above 150 above 50.**\r\n\r\n**Timeframe note**\r\n- Downtrends can appear on **daily and weekly**.\r\n- On the **monthly** you normally do **not** see a downtrend for a good company — the monthly is the long-term trend and it should always be going up.\r\n- **If the long-term monthly trend is going down → do not touch that company.**\r\n- Daily and weekly downtrends in an otherwise-good company: \"**that's fine. I don't sweat it.**\"\r\n\r\n#### 7.4 TREND-CHANGE RULES (from Lesson 2 — DAILY timeframe specifically)\r\n\r\n**Uptrend → Downtrend reversal. BOTH conditions required:**\r\n1. **The 50 MA (blue) must flatten or slope DOWNWARDS**, AND **the 150 MA (green) must flatten or slope DOWNWARDS.**\r\n   - **If EITHER one is still sloping up, it is NOT a change of trend.** Both must be flat or sloping down.\r\n2. **The 50 MA must CROSS BELOW the 150 MA** (blue crosses under green).\r\n- Both satisfied → **the uptrend has reversed into a downtrend.**\r\n\r\n**Downtrend → Uptrend reversal. The exact opposite, BOTH required:**\r\n1. The **50 must flatten and slope UP**, AND the **150 must flatten and slope UP**.\r\n2. The **50 must cross back ABOVE the 150**.\r\n- **Invalidation example given (Mercado Libre):** the blue 50 crossed above the green 150 — **but the green 150 was still sloping down → NOT a valid uptrend confirmation.** You must wait for **both** lines to flatten and slope up.\r\n\r\n#### 7.5 CONSOLIDATION / CHANNEL — Definition\r\n- **Same highs, same lows** (contrast: uptrend = higher highs/higher lows; downtrend = lower highs/lower lows).\r\n- **Confirmation rule:**\r\n  1. **Three same highs** → confirms a **resistance**.\r\n  2. **Three same lows** → confirms a **support**.\r\n  3. Price sandwiched between the two = a **CHANNEL** (a range).\r\n- **Moving averages in consolidation:**\r\n  - They **move sideways and crisscross each other** back and forth.\r\n  - **They do NOT act as support levels in a consolidation.**\r\n  - **Therefore: in a consolidation, IGNORE the moving averages entirely.** \"The moving averages are useless in a consolidation.\"\r\n  - Look **only** at the drawn support level and the drawn resistance level. \"That's it, that's all I look for.\"\r\n\r\n---\r\n\r\n### 8. BUYING ON UPTRENDS\r\n\r\n#### 8.1 The First Golden Rule\r\n> **If the price is on an uptrend, you always BUY THE DIP of the uptrend.**\r\n\r\n- Buy **after a wave DOWN**, never after a wave up.\r\n- Logic: if you buy after a wave up, the tendency is that it **waves down right after you buy**. Buy after a wave down and price tends to **wave up right after your entry**, so you're immediately above your entry price.\r\n- Not a guarantee — but **increases returns over time**.\r\n\r\n#### 8.2 Dip Size Terminology (from earlier lessons)\r\n- **Pullback** = a wave down of **less than 10%**\r\n- **Correction** = a wave down of **more than 10%**\r\n- **Frequency:** every year you get **at least three pullbacks** and **at least one correction** → these are your buying windows.\r\n- Precondition: **provided it is a good company and it is currently undervalued.**\r\n\r\n#### 8.3 Locating the Potential Bottom of the Wave Down\r\n- No one can predict the absolute bottom. But we can make **intelligent probabilistic guesses** and buy at **potential bottoms**.\r\n- **Tool: MOVING AVERAGES.** When a stock is on a clear uptrend and it waves down, it **tends to find support at one of the moving averages**.\r\n\r\n#### 8.4 UPTREND ENTRY RULES (numbered)\r\n\r\n1. **Confirm long-term uptrend:** 10-year monthly chart is rising (long-term performer). Reject if not.\r\n2. **Confirm the stock is on an uptrend** on the timeframe you're working: higher swing highs + higher swing lows; all MAs sloping up; 50 above 100 above 150 above 200.\r\n3. **Confirm fundamentals:** it is a **great company**.\r\n4. **Confirm valuation:** the price is **BELOW your calculated intrinsic value**. (Adam: \"Ultimately remember that **we only buy when the stock price is below the intrinsic value**.\")\r\n5. **Wait for a wave DOWN** (a pullback or a correction). Do not chase a wave up.\r\n6. **Identify the support the stock is falling into** — either\r\n   - a **drawn horizontal support** (from swing lows or from a broken resistance), or\r\n   - the **moving average this specific stock historically bounces off** (its \"personality\").\r\n   - Use the correct MA set for the timeframe: **daily → 50/100/150/200 SMA; weekly & monthly → 20/40 EMA also apply.**\r\n7. **When price hits the FIRST support level, buy only a portion** — \"I buy a bit first. I don't buy all the shares.\"\r\n8. **(Optional, more conservative confirmation)** — Wait for price to touch the support/moving average **and then wait for a GREEN (bullish) candle to print** — i.e. wait until it looks like it's bouncing — before entering.\r\n9. **If price breaks below that support**, do not panic — **watch the NEXT moving average / next support level down**. When it hits that level and bounces, **add more shares**.\r\n10. **Repeat at each successively lower support**, scaling in. **Adam buys over about FOUR TRANCHES.**\r\n11. **Size the tranche by the degree of undervaluation** — if only *slightly* below intrinsic value, \"**nibble a small portion**\"; buy more heavily only when **significantly undervalued**.\r\n12. **Exit logic:** none required from the chart while it remains a great company — see §9.5 (Adam no longer sells on trend change).\r\n\r\n#### 8.5 Worked Uptrend Examples\r\n\r\n**Microsoft (MSFT) — daily, period A**\r\n- Clear uptrend: higher swing highs, higher swing lows, wave up / wave down pattern.\r\n- **Every wave down found support near the 50 SMA (blue)** — hit blue, bounced; five-plus times.\r\n- Once you notice this pattern, **any subsequent drop back near the 50 MA is a potential entry**.\r\n\r\n**Microsoft (MSFT) — daily, period B (different period)**\r\n- The **50 SMA support broke**; price then found support at the **100 SMA (orange)** — hit orange, bounced, four-plus times.\r\n- Later in the same chart, a wave down again found support at the **50** and bounced → another buy point.\r\n- **Illustrates the scale-in rule:** buy a bit at the 50; if it breaks, add more at the 100.\r\n\r\n**Microsoft (MSFT) — weekly**\r\n- On the weekly, **the 20 EMA (thin red line) acted as the strong support** — wave up, wave down, hit the 20 EMA, bounce; repeated many times. \"That would be a great place to add shares.\"\r\n\r\n**Google (GOOGL) — monthly**\r\n- Over a long period, **every wave down found support at the 20 EMA (red) on monthly candles**.\r\n- Every touch of that red line = an area to buy — **provided it is undervalued**.\r\n- Precondition restated: \"You've got to calculate the intrinsic value first… always ensure the price is below the intrinsic value **and** it hits a support level where it has tended to bounce in the past.\"\r\n\r\n#### 8.6 FULL WORKED EXAMPLE — Microsoft, Three-Timeframe Build (the model workflow)\r\n\r\n**Step 1 — 10-year monthly**\r\n- Click \"All\" → monthly by default → drag back ~10 years → enable **log scale**.\r\n- **Q: Is it on a clear uptrend? Yes.** ✔\r\n- **Which MA did it bounce off historically during corrections? The 20 EMA (red line).** → **Draw a horizontal support line at the 20 EMA.**\r\n- **2022 bear market** (whole market crashed): Microsoft **broke below the red 20 EMA** — but ultimately **bounced off the blue 50 SMA on monthly candles**.\r\n  - → **Draw a second support line at the monthly 50 SMA = $324.**\r\n  - Interpretation: \"In the event of another big crash, **324 should be the bottom**.\"\r\n- **Confluence check at 324:** that level was also a **previous swing-high resistance** (two swing highs). Resistance broken → becomes support. So **324 = previous resistance + monthly 50 SMA** → \"a very powerful, significant level that you have to watch in the event of a crash.\"\r\n\r\n**Step 2 — 5-year weekly**\r\n- A **swing low at ~$390** coincides with a line already drawn → **reaffirms 390 as a significant support**.\r\n- The **200 SMA (red) on weekly** was hit and bounced off twice → **and it coincides with the 324 level**.\r\n- Point: \"**Everything coincides — all the lines are intersecting to reinforce that these are very strong levels of support.** That's where I want to be a buyer.\"\r\n\r\n**Step 3 — 1-year daily**\r\n- Short-term picture: **not an uptrend — a choppy sideways CONSOLIDATION pattern.**\r\n- Visually identifiable support at **$407 / $407.80** — price reached it and reversed up repeatedly.\r\n- Two **swing highs** identified and connected with a line — because **swing highs are significant levels that can act as strong future support** if price falls to them.\r\n\r\n**Step 4 — Draw the intrinsic value line**\r\n- Adam has already calculated **Microsoft intrinsic value = $415**.\r\n- Method: **Drawing tools → Horizontal Ray**, drawn at **415**.\r\n- Then right-click (or two-finger click on Mac) → **Settings** → colour **GREEN** (\"For intrinsic value, I always use green\"), label text **\"intrinsic value\"**, **line style = dotted**.\r\n\r\n**Step 5 — The buy decision at the time of recording**\r\n- Current price: **$412**.\r\n- Check 1 — **Is it below intrinsic value of $415? Yes, slightly.** ✔\r\n- Check 2 — **Is it at a support level? Yes, at the $407 support.** ✔\r\n- **Decision: Yes, you could add shares here — but only nibble a small portion**, because it's **only slightly undervalued**. Adam buys more only when **more significantly undervalued**.\r\n- **Scale-in ladder for Microsoft:**\r\n  1. Nibble at **~$412** (at the $407 support, just under IV $415)\r\n  2. If it breaks that support and drops to **$390** → **add more**\r\n  3. If it breaks down to the third, more significant long-term support at **~$349.50** → **add more**\r\n- Rationale: \"That is how I build and average into a position — because ultimately a great stock will go up over time. Once it waves down to a support, eventually it will go higher, as the company makes more and more money and its **intrinsic value goes up over time**.\"\r\n\r\n**Number of levels to draw**\r\n> **\"Usually for each stock, I'll draw about FOUR TO FIVE support levels, because this will tell me where to add shares when the price comes down.\"**\r\n\r\n- Support lines may be drawn from **either** (a) swing-low patterns / broken resistance, **or** (b) moving averages. \"It could be either or. As long as it's a support level, I would draw a line.\"\r\n\r\n---\r\n\r\n### 9. SELLING / THE PARABOLIC MOVE, AND WHAT TO DO IN DOWNTRENDS\r\n\r\n#### 9.1 The Worst Time to Buy = The Parabolic Move\r\n- **Normal uptrend advance = ~45-degree angle** (wave up, wave down, wave up, wave down).\r\n- **Parabolic move = price goes up at ~90 degrees** — a very sharp vertical move.\r\n- **Cause:** **panic buying** — enthusiasm, lots of good news, crazy excitement.\r\n- **Signatures of a parabolic top:**\r\n  1. **90-degree (near-vertical) advance**\r\n  2. **Very long bullish candles** — Adam calls them **\"extended range candles\"** (exceptionally big green candles)\r\n  3. **Price becomes stretched far away from the moving averages**\r\n- **Rubber-band / pendulum analogy:** the moving average is \"home base\". Pull price too far above the MA and **it snaps back**. After a parabolic move price **tends to retrace back down to the moving averages**.\r\n- **Rule: a parabolic move is the ABSOLUTE WORST time to buy — and the BEST time to sell (if you are going to sell).**\r\n\r\n#### 9.2 IMPORTANT QUALIFIER — Parabolic ≠ Automatic Sell\r\n- A 90-degree move **does NOT mean you must sell**.\r\n- **If it is still a great company, still growing, and not that overvalued → Adam holds. He would not sell.**\r\n- Adam only uses the parabolic move as the **selling trigger** when he has already decided to sell for another reason:\r\n  - He thinks it's **really overvalued**, or\r\n  - He **needs the money** for something else, or\r\n  - He wants cash to **buy another stock**.\r\n- \"Even if it drops, I don't really care — I'll just add more shares, because it's going to continue going up eventually anyway.\"\r\n- **Timing caveat:** \"We can't always sell right at the top. Sometimes after you sell, it can still go up a bit more — but it's better to sell nearer the top than near the bottom.\"\r\n\r\n#### 9.3 Covered Calls Note\r\n- **The best time to sell covered call options is when a stock makes a parabolic 90-degree move.**\r\n- Adam sells covered calls **not on growth stocks**, but on **more defensive and moderately cyclical stocks**.\r\n- (Options strategies are covered at the end of the course.)\r\n\r\n#### 9.4 Retail Investor Behaviour (the mistake to avoid)\r\n- The **average retail investor does the complete opposite** of what is taught here:\r\n  - They **buy when there's good news** — which happens at the top of a parabolic wave up → they always **buy high**.\r\n  - They **sell when there's bad news** — which happens after the wave down (rate rises, tariffs, \"not as good as before\") → they **sell low**.\r\n  - Result: buy high / sell low repeatedly → **they lose money even when they are in the right stock**.\r\n- **Therefore: we do NOT buy and sell based on news. We ignore the news. \"The news is there to confuse you and to distract you.\"**\r\n- **We buy and sell purely based on price action** — after we have established it is a great business with great fundamentals and we know the intrinsic value.\r\n\r\n**Parabolic-top worked examples**\r\n- **Broadcom (AVGO):** nice uptrend, wave up/wave down bouncing off the 50 SMA at 45 degrees → then euphoria/great news → **90-degree parabolic move with big green extended-range candles, price far from the MAs** → snapback expected.\r\n- **Lockheed Martin (LMT):** same structure — 45-degree uptrend with wave up/wave down → good news → 90-degree move with big green candles, price stretched far from the moving average → \"eventually it will snap back down.\"\r\n- **Monster Beverage (MNST):** uptrend, nicely bouncing off the **50 SMA** (three identified buy points at the 50, provided undervalued vs intrinsic value) → then good news → **parabolic 90-degree move with green candles** → the point at which to sell covered calls or scale out if raising cash.\r\n\r\n#### 9.5 If You ALREADY OWN a Great Company and It Enters a Downtrend — DO NOT SELL\r\n\r\n- **What Adam used to do (many years ago):** the moment the downtrend signalled (50 crossing below 150, both sloping down), sell everything, then wait for the new uptrend and buy back.\r\n- **What Adam does now: he does NOT do that anymore.**\r\n- **Reason: WHIPSAW.** Downtrends often don't last long; they reverse fast, so by the time the new uptrend confirms you buy back **at a much higher price** than you sold.\r\n- \"Eight or nine out of 10 times you get whipsawed — you end up buying it back 20–30% higher, and all this reduces your returns.\"\r\n- Conclusion: \"**If I had just held on to great companies through these up and down trends, I would have ended up making a lot more** than what I did in the past jumping out and jumping back in.\"\r\n\r\n**Amazon (AMZN) whipsaw worked examples**\r\n\r\n| Case | Sell (downtrend signal) | Buy back (uptrend signal) | Result |\r\n|---|---|---|---|\r\n| **2022 bear market** (Fed raised rates rapidly; 2021 uptrend reversed) | **$165** | **$106** | **Worked** — but this only happens in a bear market |\r\n| **Case 2** | **$74** | **$92** | **Lost $8** — whipsawed |\r\n| **Case 3** | **$15** | **$19** | **Lost $4 on $15 = 27%** — whipsawed |\r\n\r\n- **Bear markets happen on average ONCE EVERY SIX YEARS** — so the \"sell the downtrend\" trade only pays off rarely; **more often than not you get whipsawed.**\r\n\r\n#### 9.6 If You DO NOT Yet Own the Stock and It Is in a Downtrend — Two Options\r\n\r\n- Buffett-style investors would just buy — they don't care about the downtrend, because downtrends last a couple of months and eventually reverse and go much higher. If you have a 5–10 year horizon, short-term trends don't bother you.\r\n- **Adam personally: \"I wouldn't just jump in blindly. I won't do that.\"**\r\n\r\n**Universal prohibition on downtrends:**\r\n> **NEVER buy after a wave UP in a downtrend.** \"If you want to buy on a downtrend, for goodness sake don't buy after a wave up — that's the dumbest time to buy, because after you buy it's going to crash back down again.\"\r\n\r\n**The two legitimate options:**\r\n- **Option A — Wait for the downtrend to end and the NEW UPTREND to be confirmed, then buy.**\r\n  - Trigger: the **50 crosses back above the 150** AND **both the 50 and the 150 have flattened and are sloping up**.\r\n- **Option B — Buy DURING the downtrend, but only at signs of a POTENTIAL BOTTOM** (see §10). \"You buy at the bottom of a downtrend anticipating the reversal to an uptrend **before** the uptrend starts.\"\r\n\r\n**The cost of Option A (why Option B exists)**\r\n- **Main disadvantage of waiting for the new uptrend: you cannot get in near the bottom. You get in after price has already moved typically 30%, 40%, or 50% off the low.**\r\n- **Worked cost examples:**\r\n\r\n| Stock | Bottom | Uptrend-confirmation entry | Late by |\r\n|---|---|---|---|\r\n| **Mercado Libre (MELI)**, 2022 bear market | **$600** | **~$920** | **~50%** |\r\n| **Apple (AAPL)** | **$164** | **$209** | **27%** |\r\n| **Monster Beverage (MNST)** | — | uptrend confirmed when 50 crossed above 150 | **37%** |\r\n\r\n---\r\n\r\n### 10. CATCHING BOTTOMS — Buying During a Downtrend\r\n\r\n#### 10.1 The Two Signs of a Bottom\r\n> **There are exactly two signs of a bottom that we use:**\r\n> **1. A PARABOLIC DROP to a strong support level**\r\n> **2. A DOUBLE BOTTOM pattern**\r\n\r\n#### 10.2 Why Bottoms Form (the mechanism)\r\n- **A stock can only bottom when there are NO MORE SELLERS LEFT.**\r\n- There are no sellers left **when everyone who wants to sell has already sold.**\r\n- That is induced by **CAPITULATION / PANIC SELLING**.\r\n- Panic selling is induced by a **90-degree drop** — the sharp final plunge makes retail traders \"throw in the towel\" and get out.\r\n- Roller-coaster analogy: before the ride ends there's usually a big drop at the end.\r\n\r\n#### 10.3 SIGN #1 — PARABOLIC DROP TO A STRONG SUPPORT LEVEL\r\n\r\n**Setup context:** in a normal downtrend price falls at a **45-degree angle** (wave down, wave up, wave down, wave up). Before a stock bottoms it typically **drops at 90 degrees** — the parabolic drop.\r\n\r\n**RULES:**\r\n1. Stock is in a confirmed **downtrend** (lower highs, lower lows; MAs sloping down; 200 above 150 above 50).\r\n2. Price makes a **PARABOLIC 90-DEGREE DROP** — a sharp near-vertical plunge.\r\n3. You must see **LONGER-THAN-USUAL RED CANDLES** (\"bigger than usual red candles\") — the signature of capitulation/panic selling.\r\n4. **The drop must terminate AT a PREVIOUSLY IDENTIFIED support level** — a level you drew earlier, taken from the **monthly, weekly or daily** charts. (This is precisely why you draw 4–5 support levels on the higher timeframes
