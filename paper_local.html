<script id="vmi-source">window.VMI_SOURCE="# The Value Momentum Investing (VMI) Master Document\r\n\r\n### Complete Notes from Adam Khoo's *Whale Investor / Value Momentum Investor* Course\r\n\r\n---\r\n\r\n## About This Document\r\n\r\nThis document is a complete, exhaustive written record of **every core-methodology lesson\r\nvideo** in the course — **55 videos totalling 23 hours 7 minutes** of instruction.\r\n\r\nEvery video was transcribed in full (OpenAI Whisper `medium`, 236,275 words of raw\r\ntranscript), then every transcript was read end-to-end and distilled into structured notes.\r\nNothing was skipped or sampled. Concepts, formulas, numeric thresholds, worked examples,\r\ncompany names, tickers, tool navigation steps, and rules are preserved as taught.\r\n\r\n**Provenance note:** all content below comes from the course videos themselves. No outside\r\nmaterial has been added. Where the instructor gives a specific number, that number is\r\nreproduced exactly as stated in the lesson.\r\n\r\n**Coverage note:** this document covers the full core investing methodology — stock basics,\r\ntrend following and strategy, fundamental analysis, valuation, technical analysis, the 7-step\r\nVMI formula, worked case studies, portfolio construction, finding/monitoring/selling, and\r\ninvestor psychology.\r\n\r\nDeliberately **excluded** from this document (not part of the core stock-picking method):\r\nthe ETF lessons, the broker-selection and IBKR platform walkthroughs, and the options /\r\nleverage lessons, along with the bonus webinar recordings.\r\n\r\n---\r\n\r\n## The Core Idea in One Page\r\n\r\n**When you buy a share of stock, you are buying a piece of a business.** If the business\r\nmakes more money over time, the shares become worth more and the price follows. Everything\r\nelse — elections, the Fed, geopolitics, yield curves, daily headlines — is noise.\r\n\r\nThe whole method answers four questions, which the instructor abbreviates **WWHW**:\r\n\r\n| Key | Question | Answered by |\r\n|-----|----------|-------------|\r\n| **W** | **What** to buy | Fundamental analysis → only the top ~1% of businesses |\r\n| **W** | **When** to buy | Valuation (buy below intrinsic value) + technical analysis for timing |\r\n| **H** | **How many** shares | Position sizing and portfolio construction |\r\n| **W** | **When** to sell | Explicit exit rules — and knowing the many invalid reasons to sell |\r\n\r\nTwo engines drive returns, and the name of the method comes from combining them:\r\n\r\n- **Value** — buy great businesses only when price sits below calculated intrinsic value.\r\n- **Momentum** — use trend and chart structure so you buy into strength and avoid\r\n  catching falling knives, and so exits are disciplined rather than emotional.\r\n\r\nAnd one factor sits above the method itself: **temperament**. The instructor's own\r\nweighting is that **70% of an investor's success is mindset** — the ability to follow the\r\nrules when fear or greed says otherwise. That is why Part X exists, and why he tells\r\nstudents to watch that lesson more than any other.\r\n\r\n---\r\n\r\n## Table of Contents\r\n\r\n- **[Part I — Stock Market Basics](#part-i--stock-market-basics)**\r\n  - [Course Introduction (Video 06 — Course Structure, Rules, Community)](#course-introduction-video-06--course-structure-rules-community)\r\n  - [What Is a Share of Stock (Parts of a Business)](#what-is-a-share-of-stock-parts-of-a-business)\r\n  - [Net Income & Implied Shares Outstanding](#net-income--implied-shares-outstanding)\r\n  - [Market Capitalization](#market-capitalization)\r\n  - [P/E and PEG Ratio](#pe-and-peg-ratio)\r\n  - [What Drives Stock Prices](#what-drives-stock-prices)\r\n  - [How to Make Money in Stocks](#how-to-make-money-in-stocks)\r\n  - [Stock Exchanges](#stock-exchanges)\r\n  - [Stock Index Performance](#stock-index-performance)\r\n  - [Lesson 1 Quiz — Questions & Adam's Answers (9 Questions)](#lesson-1-quiz--questions--adams-answers-9-que ID TRIGGERS)](#part-6--reasons-not-to-sell-invalid-triggers)\r\n  - [KEY TAKEAWAYS](#key-takeaways)\r\n  - [CHEAT SHEET A — SELL CHECKLIST (VALID TRIGGERS)](#cheat-sheet-a--sell-checklist-valid-triggers)\r\n  - [CHEAT SHEET B — DO **NOT** SELL BECAUSE…](#cheat-sheet-b--do-not-sell-because)\r\n- **[Part X — Investor Psychology (The Most Important Lesson)](#part-x--investor-psychology-the-most-important-lesson)**\r\n  - [Opening Framework: Strategy (30%) vs. Psychology (70%)](#opening-framework-strategy-30-vs-psychology-70)\r\n  - [Psychology Rule #1: Absolute Discipline](#psychology-rule-1-absolute-discipline)\r\n  - [Psychology Rule #2: Invest Only Within Your Circle of Competence; Never Blindly Follow Experts](#psychology-rule-2-invest-only-within-your-circle-of-competence-never-blindly-follow-experts)\r\n  - [Psychology Rule #3: Be Patient and Think Long-Term](#psychology-rule-3-be-patient-and-think-long-term)\r\n  - [Psychology Rule #4: Buy Slowly, Sell Even Slower](#psychology-rule-4-buy-slowly-sell-even-slower)\r\n  - [Psychology Rule #5: Judge Investments by Business Performance, Not Short-Term Stock Price](#psychology-rule-5-judge-investments-by-business-performance-not-short-term-stock-price)\r\n  - [Psychology Rule #6: Think Independently (Contrarian Psychology)](#psychology-rule-6-think-independently-contrarian-psychology)\r\n  - [Psychology Rule #7: Never Attempt to Predict the Market](#psychology-rule-7-never-attempt-to-predict-the-market)\r\n  - [Psychology Rule #8: Pay No Attention to Macroeconomic or Geopolitical Events](#psychology-rule-8-pay-no-attention-to-macroeconomic-or-geopolitical-events)\r\n  - [Psychology Rule #9: Risk Management and Capital Protection](#psychology-rule-9-risk-management-and-capital-protection)\r\n  - [Psychology Rule #10: Take Responsibility and Learn From Mistakes](#psychology-rule-10-take-responsibility-and-learn-from-mistakes)\r\n  - [Full 10-Rule Summary (as recapped by Adam at the end)](#full-10-rule-summary-as-recapped-by-adam-at-the-end)\r\n  - [Key Takeaways](#key-takeaways)\r\n  - [Psychology Rules Checklist (Practical)](#psychology-rules-checklist-practical)\r\n\r\n---\r\n\r\n# Part I — Stock Market Basics\r\n\r\n## Lesson 1: Stock Market Basics — Master Notes (Whale Investor / VMI Course)\r\n\r\nSource videos: (06) VMI Course Introduction, (07) Stock Basics Part 1 — Parts of a Business, (08) Stock Basics Part 2 — P/E & PEG, (10) Stock Basics Part 4 — What Drives Stock Prices, (11) Stock Basics Part 5 — How to Make Money in Stocks, (12) Stock Basics Part 6 — Stock Index Performance, (14) Shocking Market Facts.\r\n\r\n---\r\n\r\n### Course Introduction (Video 06 — Course Structure, Rules, Community)\r\n\r\n- Course also called \"The Whale Investor\" or \"Value Momentum Investor (VMI)\" course.\r\n- Goal: consistent profits, stress-free, low-risk, sustainable investing; build net worth toward \"financial freedom.\"\r\n- Course explicitly cuts out financial-media \"noise/bullshit\" and \"impractical theories\" from business school/financial academia.\r\n- **The Four Keys — \"W, W, H, W\":**\r\n  1. **What** to buy — only the top 1% of the strongest stocks in the market.\r\n  2. **When** to buy — only when strong stocks are attractively priced/undervalued.\r\n  3. **How** many shares to buy — position sizing, building a diversified, balanced portfolio.\r\n  4. **When** to sell — exit rules.\r\n- Following the methodology strictly → can beat the market, achieve double-digit returns over the long run, outperform most retail investors and most professional money managers.\r\n- You CAN fail — but only by failing to take action, failing to apply what's taught, or breaking the rules. Rules exist to keep you safe.\r\n- **Course structure — 12 core lessons, each ~2–3 hours:**\r\n  1. Stock Market Basics (this lesson)\r\n  2. Exchange Traded Funds (ETFs) — simplest way to start investing\r\n  3. Keys to Profitable Investing — overview of the methodology\r\n  4. Fundamental Analysis — analyzing a business inside out, identifying great companies\r\n  5. Stock Valuation — how to value businesses (expensive vs. cheap)\r\n  6. Technical Analysis — optimizing entries/exits via chart patterns\r\n  7. The Seven-Step VMI Formula (Value Momentum Investment Formula) — everything combined into a checklist/methodology\r\n  8. Building a bulletproof, diversified portfolio that performs in all economic conditions\r\n  9. Finding great stocks/opportunities + exit rules (when to say goodbye to a stock and replace it)\r\n  10. **Psychology** — Adam calls this one of the most important lessons even though numbered 10th. \"70% of an investor's success is their mindset\" — ability to manage temperament and emotions. Recommended to rewatch multiple times.\r\n  11. Choosing the right stockbroker for your objectives\r\n  12. Turbocharging your portfolio using options (generating extra income)\r\n  - Plus additional sections: how to use TradingView (Adam's charting platform of choice) and how to use Interactive Brokers (his brokerage); any reputable broker will do since broker mechanics are similar once you learn one.\r\n  - Bonus section: past webinars for students.\r\n- **Recommended learning approach:**\r\n  - Complete every lesson, don't skip any — even experienced/professional investors should redo the basics.\r\n  - Learn actively: take your own notes (even though slides/notes are provided), pause and repeat videos.\r\n  - Each lesson ends with a quiz — attempt it before seeing answers.\r\n  - Downloadable course notes + resources (Excel templates for managing investments, an intrinsic value calculator) available under \"Course Notes and Resources.\"\r\n  - Time to finish: intensive pace (12–13 hrs/day) = ~2 days; moderate pace (~2 hrs/day) = ~13 days (~1.5 weeks); relaxed pace (~1 hr/day) = ~26 days (~1 month). \"Repetition is the mother of skill.\"\r\n- **Community (Discord):**\r\n  - Active chat 7 days/week, including weekends/holidays, ~15–16 hours/day.\r\n  - Members can tag \"Adam Koo\" directly with questions.\r\n  - New members only granted chat-group access **7 days after enrolling**, so they first watch lessons (most questions get answered by the content itself).\r\n  - Members encouraged to share their own stock analyses/ideas — but should NOT ask \"Adam, what do you think of this stock?\" (Adam won't spoon-feed picks; he guides members to do their own analysis, and will give feedback on analysis already done).\r\n  - Security warning: turn off direct messages (DMs) in the group — scammers impersonate Adam or others via DM. Adam states he will **never** DM anyone directly; all his communication happens in the main chat group (under \"Investing Costs\" → main chat stock group).\r\n  - Separate \"Friendly Chit Chat\" channel exists for off-topic/social conversation.\r\n\r\n---\r\n\r\n### What Is a Share of Stock (Parts of a Business)\r\n\r\n- A share of stock is **not** a lottery ticket / price-prediction bet. Buying a share = **becoming a part owner (shareholder) of an underlying business.**\r\n- A business (McDonald's, Microsoft, Apple, etc.) is fundamentally **a money-making machine**: it sells products/services to make money.\r\n- Core logic chain: more money the business makes → more the business is worth → more valuable the shares → share price rises over time. As an owner, you have a claim over the business's profits.\r\n- Adam uses \"stocks\" and \"businesses\" interchangeably — deliberately.\r\n- **Core rule:** \"If the business does well, the shares will do very well... Everything else is noise and distraction.\" Ignore financial-media sensationalism (geopolitics, elections, war, yield curve, inflation, what the Fed is doing) — the only real question is: *will this business make more money over time?*\r\n- **Example — Microsoft:** Adam is a shareholder because regardless of who's US President, the yield curve, inflation, or wars, people keep using Microsoft, more people use it every year, Microsoft keeps raising prices, and profits keep growing → as a shareholder his claim on those profits grows → share value rises over time.\r\n\r\n#### Shares Outstanding (the \"pizza\" concept)\r\n\r\n- Before buying into a business, you need to know how many total \"pieces\" (shares) exist.\r\n- **Example: \"Success Company\"** — has **100 million shares outstanding**. Think of the company as a pizza with 100 million slices; you can buy as many slices as you want.\r\n- Companies can **issue more shares** (increasing shares outstanding) or **buy back and cancel shares** (decreasing shares outstanding) — the number is not fixed over time.\r\n- If you buy 1 million shares out of 100 million total, you own **1% of the business**, entitling you to 1% of the profits and 1% of voting rights (voting rights not a focus of this course — \"we're just interested in the money\").\r\n\r\n#### Minimum Shares / Fractional Shares by Market\r\n\r\n- **US market:** biggest market in the world; **no minimum number of shares** — you can buy as little as 1 share. Some brokers (e.g., **Interactive Brokers**, Adam's broker) even allow **fractional shares**.\r\n  - Example: **Meta Platforms (owns Facebook & Instagram)** — one share priced at ~**$600**. If you can't afford a full share, you could buy **0.1 of a share for $60**.\r\n- **Asian exchanges (e.g., Singapore):** typically require a **minimum of 100 shares, in multiples of 100**.\r\n  - Example: **DBS Bank** on the Singapore Exchange — 1 share = **$40**, so minimum investment = $40 × 100 = **$4,000**.\r\n  - Conclusion: Asian markets are \"less flexible\" than US markets for position sizing.\r\n\r\n#### Yahoo Finance — First Tool Introduced\r\n\r\n- Website: **finance.yahoo.com**. Search by company name or **ticker symbol** in the search bar.\r\n- Every stock has a ticker symbol (does not need to be memorized): Meta = **META**, Apple = **AAPL**, Microsoft = **MSFT**.\r\n\r\n---\r\n\r\n### Net Income & Implied Shares Outstanding\r\n\r\n- The first basic question when considering owning a piece of a business: **how much money is the business making?** → this is the **net income**.\r\n- **Net income = net profits = earnings** — these three terms are used interchangeably.\r\n- Net income specifically means **net income after tax** — what's left after deducting everything.\r\n- Found on Yahoo Finance under **Statistics** → \"Net income available to common shareholders\" (shares you buy as a retail investor are \"common shares\").\r\n- **TTM** = **Trailing Twelve Months** — the last 12 months from the date you're looking at the data (e.g., recording in Dec 2024 → TTM covers Dec 2023–Dec 2024).\r\n- **Example — Meta Platforms:** Net income (TTM) = **$55.54 billion** = 55,540 million (1 billion = 1,000 million).\r\n\r\n#### Shares Outstanding vs. Implied Shares Outstanding\r\n\r\n- Yahoo Finance Statistics page shows two figures for Meta:\r\n  - **Shares Outstanding:** 2.18 billion (current pieces of the \"pizza\" actually in the market).\r\n  - **Implied Shares Outstanding:** 2.52 billion.\r\n- **Why the difference:** companies grant employees free shares via **options**, which employees can convert into actual shares in the future. Implied shares outstanding accounts for what happens if all employees convert their options — i.e., a larger, more conservative share count.\r\n- **Rule: always use the implied shares outstanding figure** (to be conservative). For Meta: **2.52 billion = 2,520 million shares.**\r\n\r\n#### Earnings Per Share (EPS)\r\n\r\n- **Formula:** EPS = Total net income ÷ Total (implied) shares outstanding.\r\n- Calculation for Meta: $55.54 billion ÷ 2,520 million.\r\n- Pre-calculated on Yahoo Finance's **Summary** page as \"Earnings Per Share (TTM).\"\r\n- **Meta EPS (TTM) = $21.17** — meaning every share entitles the owner to $21.17 of profit per year (based on trailing 12 months). This figure is *entitled* profit, not necessarily cash received.\r\n\r\n#### The Four Ways a Company Returns Profit to Shareholders\r\n\r\nAdam poses the question: as a shareholder \"entitled\" to $21.17/share, how do you actually get that money? Four mechanisms:\r\n\r\n1. **Dividends** — company pays out cash from profits.\r\n   - Not all companies pay dividends; some keep 100% of profit (\"like a savings account\"), some pay a little, some pay a lot.\r\n   - **\"Forward\" dividend** = expected dividend over the *next* 12 months if you buy now.\r\n   - Meta example: forward dividend = **$2.00 per share** (i.e., out of the ~$21 earned, the company pays $2 cash).\r\n   - **Dividend taxation:** depends where the stock is listed and where the investor resides.\r\n     - US-listed stocks: dividends are taxed. A US resident pays tax per their income bracket. A resident of a country with **no tax treaty with the US** (e.g., Singapore) pays a **flat 30% withholding tax** — i.e., only 70% of each $1 of US dividend is received.\r\n     - Singapore or Hong Kong-listed stocks: dividends are generally **tax-free** for the investor — though **certain Hong Kong stocks carry a 10% withholding tax**.\r\n     - Adam's personal preference: doesn't like buying **US stocks for dividends** (30% tax hit); prefers US stocks for **capital gains** (zero capital gains tax for a Singaporean). For dividend income specifically, he prefers **Singapore-listed stocks** (no dividend tax).\r\n2. **Share buybacks** — company uses profit to repurchase its own shares from the market and cancel them.\r\n   - Good when done while shares are undervalued and the business is healthy/growing profits.\r\n   - Mechanism: fewer shares outstanding → each remaining share represents a larger ownership slice → EPS rises (same total profit split among fewer shares) → over time this should push the share price higher.\r\n   - **Extreme illustrative example:** if a company buys back and cancels **half** of all its shares outstanding — Meta's 2,520 million shares ÷ 2 = **1,260 million shares** remaining. Recomputing EPS: $55.54 billion ÷ 1.26 billion = EPS **doubles from ~$21 to ~$42 per share**.\r\n   - **Pizza analogy:** a pizza has 4 slices, you own 1 slice (25% of pizza). If the company buys back and cancels 2 slices, only 2 slices remain, and you still own 1 — now you own **50%** of the pizza, without spending any additional money yourself. \"The company buys shares on your behalf.\"\r\n3. **Reinvest profits in the business** — via R&D, entering new markets, building factories, new products — aiming to generate more future revenue/profit, which should raise intrinsic value and share price.\r\n   - Key metric to evaluate this option: **Return on Invested Capital (ROIC)**.\r\n   - **Not available on Yahoo Finance** — Adam uses **Stock Oracle** (**app.stockoracle.com**) instead, found under \"Company Metrics\" (as a chart or as a standalone favorited metric).\r\n   - **Meta ROIC (TTM) = 22.81%.**\r\n   - **Benchmarks:** ROIC of **12% and above** = good business; **15%+** = excellent business.\r\n   - **ROIC does not apply to:** financial-services companies (banks, insurers) — use **Return on Equity (ROE)** instead for those; also does not apply to **REITs** (Real Estate Investment Trusts). Applies to all other company types.\r\n   - Interpretation: Meta grows reinvested profits internally at ~22.81%/year on average — an investor must weigh whether they could personally beat that return if paid out as a dividend instead.\r\n   - **Warren Buffett / Berkshire Hathaway example:** Berkshire has never paid a dividend in **60 years**, despite Buffett being the largest shareholder — he prefers reinvesting internally at a high ROIC, compounding his wealth tax-free.\r\n4. **Retain the cash (retained earnings)** — company simply keeps the profit without returning it via any of the above three methods.\r\n   - Shareholders generally dislike this: \"why are you keeping my cash?\" — not returned as dividend, buyback, or productive reinvestment.\r\n   - Adam's preference: companies that return capital via the **first three** methods.\r\n\r\n---\r\n\r\n### Market Capitalization\r\n\r\n- **Formula:** Market Cap = Share price × Total shares outstanding (theoretical cost to buy 100% of the company).\r\n- No need to calculate manually — available on any finance website.\r\n- **Meta example:** Share price ~$599.81 × shares outstanding → **Market cap = $1.51 trillion** (i.e., **$1,514 billion**; 1 trillion = 1,000 billion).\r\n- **Company size classifications by market cap:**\r\n  - **Large-cap:** $10 billion or more.\r\n  - **Mid-cap:** $2 billion – $10 billion.\r\n  - **Small-cap:** less than $2 billion.\r\n- It doesn't matter which size category a company falls into as long as it meets the course's investment criteria — but Adam personally buys **mostly large-cap companies**, believing they are generally the \"strongest and safest\" in the markets.\r\n\r\n---\r\n\r\n### P/E and PEG Ratio\r\n\r\n#### Price-to-Earnings (P/E) Ratio\r\n\r\n- **Formula:** P/E = Share price ÷ EPS.\r\n- **Meta example:** $599 ÷ $21.70 (approx.) = **28.31×** (Yahoo Finance's own precomputed figure showed **28.33×**, a slight rounding difference). Based on trailing twelve months (TTM) earnings.\r\n- P/E changes constantly — every second while the market is open, since price fluctuates continuously.\r\n- **Interpretation:** P/E of 28× means you pay $28 for every $1 of annual earnings per share — theoretically it would take 28 years of flat $21/year earnings to \"get back\" your $599 investment.\r\n- **But** this ignores earnings growth. Illustrative extreme example: if EPS were to **double every year** (100% growth) starting from $21 → $42 → $84 → $168 → $336, cumulative profit exceeds $650 (the cost of the share) in under 5 years, not 28.\r\n- **Core teaching:** \"P/E ratio by itself is quite useless / meaningless\" unless you know the earnings growth rate. A common investor mistake: assuming low P/E = cheap and high P/E = expensive. This is false — a high-P/E stock can be cheap if growth is high, and a low-P/E stock can be expensive if growth is low.\r\n\r\n#### Finding Earnings Growth Projections\r\n\r\n- Previously available free on Yahoo Finance and GuruFocus, but both removed this data. Two current free sources:\r\n  - **finviz.com** — shows past 5-year growth and projected next-5-year growth.\r\n    - Meta: past 5-year EPS growth = **14%**; projected next 5-year growth = **17%**.\r\n  - **zacks.com** — a second opinion source (Adam recommends getting more than one growth estimate).\r\n    - Meta: projected earnings growth = **20.05%**.\r\n  - Combined range used for Meta: **17%–20%** projected growth.\r\n\r\n#### PEG (or \"PEC\") Ratio\r\n\r\n- Theoretical rule: for a **fairly valued company**, the P/E ratio should roughly equal the earnings growth rate (e.g., 15% growth → P/E of 15; 5% growth → P/E of 5; 20% growth → P/E of 20).\r\n- **Formula:** PEG = P/E ratio ÷ Earnings growth rate (%).\r\n- **Meta example:** P/E 28.31 ÷ 20 (using 20% growth) = **PEG 1.41**.\r\n- **Textbook/theoretical interpretation:** PEG > 1 = expensive; PEG \u003c 1 = undervalued.\r\n- **Adam's practical/real-world rule (differs from pure theory):** Strictly requiring PEG \u003c 1 finds very cheap stocks but causes you to **miss many great companies**. Adam's threshold: PEG up to **1.5** is acceptable; **above 1.5** starts to look expensive.\r\n  - Meta's PEG of 1.41 (on 20% growth assumption) = \"reasonably priced.\"\r\n\r\n#### Worked Comparison — NVIDIA vs. Ford Motor Company\r\n\r\n- **NVIDIA:** price ~**$137**/share, P/E = **53.97×**, past-5-year EPS growth = **48%**, projected next-5-year growth = **35%**.\r\n  - PEG = 53.97 ÷ 35 = **1.54** (slightly above the 1.5 threshold — \"not cheap, but not super expensive... slightly expensive\").\r\n- **Ford Motor Company:** price ~**$10**/share, P/E = **11.44×**, projected next-5-year growth = **3%** (stated as 3.06%).\r\n  - PEG = 11.44 ÷ 3.06 = **3.74** — \"very expensive\" by the PEG framework.\r\n- **Conclusion:** despite Nvidia's much higher headline P/E (53.97 vs. 11.44) and much higher share price, **Nvidia is actually the cheaper stock on a PEG basis** — Ford is more expensive. This directly rebuts the \"low P/E = cheap\" fallacy.\r\n- **Trailing vs. Forward P/E clarified:** P/E = Price ÷ Earnings, but \"Earnings\" can be last-12-months (trailing) earnings or next-12-months (projected) earnings.\r\n  - Trailing P/E uses last 12 months of earnings.\r\n  - **Forward P/E** uses projected earnings for the next 12 months. In Nvidia's case, the video shows the forward P/E figure at **30.95×**, lower than the trailing 53.97× because next year's earnings are projected to be much larger than the trailing-12-months figure (bigger expected future earnings → lower forward P/E for the same price). *(Note: transcript audio says \"Ford PE\" here in context of discussing forward P/E for Nvidia — this is understood as \"forward P/E,\" not a reference to Ford Motor Company, based on the surrounding explanation of trailing vs. projected earnings.)*\r\n\r\n#### Historical Case Study — Why P/E Alone Misleads (Adam's Own Trades)\r\n\r\n- **NVIDIA:** Adam first bought in **October 2022**. At that time, many avoided it because the P/E ratio looked high — approximately **39.9× (~40×)** on TradingView's P/E indicator overlay at the time of purchase.\r\n- **Result:** From October 2022 to the time of recording (~3 years later, 2022–2024/25), Nvidia's share price rose **1,133%** (roughly **12×**).\r\n- **Ford Motor Company (contrast):** Many investors bought Ford around the same period (Oct 2022) because its P/E looked very low — **3.8×** at that time.\r\n- **Result:** Holding Ford for 3 years, \"the price basically went nowhere\" — no meaningful gain.\r\n- **Takeaway (stated emphatically):** \"P/E ratio itself is totally useless, is totally meaningless. Don't look at it.\" Only the **PEG ratio** (P/E relative to earnings growth) should be considered — and even PEG \"is also not the best way to value a stock... only a rough guide.\" The most comprehensive valuation method taught later in the course is the **Discounted Cash Flow (DCF) method**, which Adam uses primarily because it gives \"the most accurate intrinsic value of the stock.\"\r\n\r\n#### Stock Oracle Full Walkthrough — Microsoft (MSFT) Example (recorded 2026)\r\n\r\nUsing **app.stockoracle.com**, searching MSFT:\r\n- Share price: **$397** per share.\r\n- Market capitalization: **$2.9 trillion** (stated precisely as **$2,958 billion**).\r\n- Net profit (annual): **$119 billion**.\r\n- Shares outstanding: **7.46 billion**.\r\n- EPS = net profit ÷ shares outstanding (derivable from the above).\r\n- **P/E ratio (trailing 12 months): 24.93×** (~24 stated first, then refined to 24.93).\r\n- **Forward P/E ratio (next year's projected earnings): 20.95×.**\r\n- **Projected earnings growth rate (5-year): 19.62%.**\r\n- **PEG ratio = P/E ÷ growth rate = 24.93 ÷ 19.62% (or forward P/E basis) ≈ 1.27.**\r\n- **Long-term growth rate beyond 5 years: 8.9%** — Adam notes **Stock Oracle is the only website that also shows long-term growth projections beyond the standard next-5-years window.**\r\n- **ROIC: 26.71%.**\r\n- **ROE (Return on Equity): 34.39%.**\r\n- Stock Oracle's \"Favorites\" feature lets you customize which metrics display (out of **~479–497 available metrics** on the platform). Adam's **personal \"10 favorite metrics\"** to check on any stock at a glance: trailing P/E, forward P/E, 5-year projected growth rate, long-term growth rate (beyond 5 yrs), shares outstanding, PEG ratio, ROIC, ROE (plus other items rounding out the ten).\r\n\r\n---\r\n\r\n### What Drives Stock Prices\r\n\r\n#### Short-Term Price Movement: Demand, Supply, and Emotion\r\n\r\n- A common beginner surprise: prices are highly volatile day-to-day (e.g., up 5% one day, down 5% the next, up 8%, down 3%, etc.).\r\n- **Key mistake to avoid:** believing price always reflects business worth. A 5% two-day price swing does NOT mean the business made 5% more or fewer profits, or that usage changed 5% — \"it's the exact same business.\"\r\n- **Stock market = an auction-driven market** (compared explicitly to a live auction: \"do I get $25... sold to the man for $29\").\r\n- **Short-term price driver = demand and supply.** More buyers than sellers on a given day → price rises (same company); more sellers than buyers → price falls (same company).\r\n- **What drives demand/supply short-term = emotions**, specifically **fear and greed**.\r\n  - Fear → panic selling.\r\n  - Greed → excited buying.\r\n  - Fear can also cause buying — **FOMO (fear of missing out)**: fear that a rising stock will keep rising without you, so people buy, which itself pushes price higher.\r\n- **Emotions are triggered by news** — lockdowns, recession/depression fears, war headlines → panic/selling; good earnings announcements, rate news → buying/price rises.\r\n- Rule for investors: **ignore the news noise and disassociate emotionally from the market**; \"if you get emotional in the market... you're going to lose money, I guarantee you that.\" The way to make money is to go opposite of the crowd.\r\n\r\n#### Case Study — Microsoft, 2019–2020 (COVID Crash)\r\n\r\n- **2019:** Microsoft share price ~**$190** (\"said $109\" appears to be a transcription slip immediately corrected/contextualized as $190 throughout); Adam's calculated **intrinsic value = $230** at that time (intrinsic value calculation covered in the later Stock Valuation lesson). Conclusion: the stock was **already undervalued** at $190.\r\n- **2020 COVID-19 pandemic / global lockdown announced** → panic selling across the market (\"whether it's McDonald's or Microsoft, every stock came down\").\r\n- Microsoft dropped from **$190 to $133 in four weeks** (roughly a 30% drop as characterized in the discussion — later stated as \"35% less\").\r\n- **Reality check:** the business itself did not deteriorate — Microsoft's revenue and profits actually **increased** during the pandemic (whether working from home or in-office, people still needed Microsoft subscriptions).\r\n- **Why the price fell anyway:** short-term market price reflects emotion and manipulation, not underlying value. Adam also implicates **market makers/institutions** deliberately fueling fear to cause retail investors to panic-sell at the bottom, so institutions can buy the cheap shares — \"that's how they make a lot of money, by scaring the retail investors.\"\r\n- **Margin selling mechanic explained:** some investors get greedy during rallies and borrow money from their broker to buy more shares — **\"buying on margin.\"** Existing shares serve as **collateral**. When the market drops suddenly, collateral value falls, and the broker demands more cash (\"margin call\"); investors without spare cash get **forcibly liquidated** by the broker (shares sold at very low prices). Mass forced liquidations create a feedback loop of extra selling pressure, accelerating the price's \"free fall\" during a panic.\r\n- **Investor response:** rational investors benefit from this mispricing by buying shares of great companies while they're 30–40% (or more) below intrinsic value due to panic and forced liquidations.\r\n- **On timing the bottom:** \"no one knows where is the bottom... there's no way to predict the bottom.\" As long as a purchase is made while the stock is undervalued, timing precision doesn't matter — you don't have to catch the exact bottom. Adam's method: **never buy all at once**; instead **\"nibble\"** — buy in small tranches as the price moves.\r\n\r\n#### Quotes Cited\r\n\r\n- **Benjamin Graham** (mentor to Warren Buffett, known as \"the father of value investing,\" author of *The Intelligent Investor*, which Adam highly recommends reading):\r\n  > \"The market is a pendulum that forever swings between unsustainable optimism that makes stocks too expensive at times and unjustified pessimism which makes them too cheap at times. And the intelligent investor is a realist who sells to optimists when stocks are too expensive, and buys from pessimists when stocks are too cheap.\"\r\n- **Peter Lynch** (described as one of the very few fund managers who actually beat the market by a wide margin over his career; Adam has studied his work extensively):\r\n  > (paraphrased per Adam) \"Often there's no correlation between the success of a company's operations and the success of the stock price over a few months or even sometimes a year or so\" — but Adam adds that over the **long term** (defined here as **at least two years or more**), \"there's a hundred percent correlation between the success of a company and the success of its stock price.\"\r\n- Adam's synthesis: \"this disparity is the key to making money. It pays to be patient and to own successful companies.\"\r\n\r\n#### Long-Term Price Drivers (5 Factors)\r\n\r\nOver the long run (the S&P 500 specifically referenced as having risen for over 120 years), five factors drive stock prices higher:\r\n\r\n1. **Earnings** — companies (in aggregate, the 500 biggest US companies) make more profit over time. **Corporate earnings grow at an average of ~8% per year over the long run** (explicitly called out to \"write this down\"). Higher EPS → higher share value → higher share price.\r\n   - Beyond EPS, **free cash flow per share** is highlighted as even more important than reported accounting earnings — \"cash flow is more tangible\" than accounting profit (expanded further in the Fundamental Analysis lesson).\r\n2. **Share buybacks** — reduce share count, so each remaining share is worth more (same mechanism as described earlier).\r\n3. **Dividends** — more dividends paid (e.g., by the S&P 500 in aggregate) increases attractiveness/value, since investors are willing to pay more for dividend income.\r\n4. **Future earnings growth (anticipation)** — the market often prices in *future*, not just current, earnings. Some companies with current losses still see rising share prices because investors anticipate future profitability/cash flow growth.\r\n5. **Money supply** — controlled largely by the **Federal Reserve**. When the Fed lowers interest rates and buys bonds, money supply increases, inflating asset prices (including stocks). Conversely, raising rates / halting bond purchases reduces money supply.\r\n   - **Example: 2022–2023** — the Fed **reduced money supply by ~40%** (raised interest rates, stopped buying bonds), yet the **stock market still rose in 2023** — because even with lower money supply, growing corporate earnings were enough to push the market higher. When all five factors move favorably together (money supply up, earnings up, dividends up), the market rises even more strongly.\r\n- Supporting chart description: S&P 500 share price (red line) tracks alongside forward earnings/projected company earnings (blue line) over the long run — they move together over time despite short-term divergence.\r\n\r\n#### Summary Framework: Short-Term vs. Long-Term Drivers\r\n\r\n- **Short term (next day/week/month/few months):** price driven mainly by **emotion** (fear/greed) and **market sentiment**, triggered by news. The **study of these short-term emotional/price patterns is called Technical Analysis.**\r\n- **Long term (2+ years):** price driven by the underlying **intrinsic value** of the business — determined by revenue, profit, cash flow, assets, and liabilities. **The study of the business itself is called Fundamental Analysis.**\r\n- **Weighting rule for investing decisions (explicitly told to \"write this down\"):** **90% of buy/sell decisions should be based on fundamentals**, and only **10%** on technical analysis (used to optimize entry/exit timing). This 90/10 split applies to *investing*; short-term speculative trading would weight technicals more heavily.\r\n- Two things needed to maximize investing profit: (1) identify which are the great companies, and (2) determine the stock's **intrinsic value**.\r\n\r\n#### Trend/Pattern Vocabulary Introduced\r\n\r\n- **Uptrend pattern:** price makes a repeating \"wave up, wave down\" sequence trending higher overall.\r\n- **Downtrend pattern:** price makes a repeating wave sequence trending lower overall.\r\n- **Consolidation:** price moves sideways in waves without a clear directional trend.\r\n- These patterns are explored in depth in the later Technical Analysis lesson; described here as \"the cherry on the cake,\" with fundamentals being \"the main cake.\"\r\n\r\n#### Illustrative Example — McDonald's\r\n\r\n- McDonald's: a long-standing, well-known company. Revenue, profits, and cash increase globally over time → **intrinsic value** (shown as a black dotted line in Adam's chart) rises steadily over time.\r\n- **Share price**, however, does **not** track intrinsic value smoothly day-to-day/month-to-month — it moves \"like a yo-yo\" due to short-term volatility, emotion, and manipulation, cycling through consolidation → uptrend → downtrend → uptrend → downtrend → consolidation → uptrend patterns, etc.\r\n- Zooming into a downtrend segment: Adam narrates the emotional swings driving it (\"Oh my God, we're going to die, no one's going to eat burgers anymore, I hate Ronald McDonald\" during downtrends, vs. excitement during uptrends), likening the market to \"a bipolar, manic, depressive person.\"\r\n- **Key conclusion:** \"the majority of the time, the price movements... are caused by reasons that have nothing to do with the company's long-term business potential... fundamentals and intrinsic value.\"\r\n\r\n---\r\n\r\n### How to Make Money in Stocks\r\n\r\n#### Don't Ask \"Why Did the Market Move?\"\r\n\r\n- Using the S&P 500 chart as illustration: prices move in repeated wave-up/wave-down patterns driven by cycling excitement/fear.\r\n- **\"Why did the market go up/down?\" is called \"the most stupid question to ask.\"** Reasoning: analysts always retroactively construct a plausible-sounding explanation for any price move (e.g., \"market went up because GDP beat expectations,\" \"market went down because of the war in Gaza\") — there are always both positive and negative narratives available in the world to cherry-pick from; these justifications are a waste of time and not useful for investment decisions.\r\n- **Simple operating rule:** when the market/a favored company goes down and becomes undervalued, buy. When it goes up and becomes expensive, don't buy (and it may be a time to sell certain positions).\r\n\r\n#### Procter & Gamble (P&G) Example — Overvalued vs. Undervalued\r\n\r\n- P&G: a long-standing company (household products, e.g. shampoos) whose sales/profits/value keep rising over time → intrinsic value line (green) rises steadily.\r\n- Share price oscillates above and below the intrinsic-value (green) line repeatedly, \"like a pendulum.\"\r\n- **Definitions:**\r\n  - **Overpriced/overvalued** = share price above the intrinsic value line.\r\n  - **Underpriced/undervalued** = share price below the intrinsic value line.\r\n- **The investor's job, simply stated:** add shares of great companies when they are undervalued (below the green line). \"Why the price went down, why the price went up is totally irrelevant.\"\r\n- **You do not need to buy the exact bottom.** Nobody can predict a wave's bottom. Adam's personal tranche-buying (\"nibbling\") method:\r\n  - Once price drops **~10% below intrinsic value**, nibble (buy a small amount).\r\n  - If it drops another **5–10%** further, nibble more.\r\n  - If it drops another **5–10%**, nibble again.\r\n  - This averages down the cost basis over time; doesn't require catching the exact bottom, since the goal is simply an average entry price below where intrinsic value (rising over time) eventually reconnects with price.\r\n- **Key aphorism:** **\"Price is not value... Price is what you pay, value is what you get.\"** (Price = the fluctuating line; Value = the green intrinsic-value line.)\r\n- Adam states he specifically *loves* when a great company he holds gets hit by bad news, because panic selling creates buying opportunities.\r\n\r\n#### Meta/Facebook — Long-Term Holding Through Repeated \"Bad News\" Buying Opportunities\r\n\r\n- Adam has held Facebook/Meta for many years. A few years prior to recording it traded between **$120 and $360 per share**; by the time of recording it was near **$600**.\r\n- Throughout the holding period, intrinsic value (green line) rose steadily as profits grew, while a string of negative headlines periodically crashed the price below intrinsic value — each cited by Adam as a buying opportunity:\r\n  - **April 2018** — Facebook data-selling scandal (accused of selling user data to other providers) → panic, price fell below intrinsic value → buying opportunity.\r\n  - Facebook fined over the **Cambridge Analytica scandal** → more panic → another buying opportunity.\r\n  - Headline: *\"Facebook shares extend slide as Starbucks joins major global brands in social media ads spending boycott\"* → advertiser boycott news → opportunity.\r\n  - Headline: *\"Tech stocks closed sharply lower as bond yields jumped\"* — long-term interest rates rose, causing broad panic and a share price drop → opportunity.\r\n  - **Whistleblower complaint** alleging Facebook's platform was used to promote human trafficking and domestic servitude (Adam clarifies he is not condoning the underlying issue — merely noting the market reaction) → opportunity.\r\n  - Headline: *\"Facebook's outage frustrates advertisers heading into holiday season\"* → an outage-driven scare → opportunity.\r\n- **General lesson:** every company (McDonald's, Visa, MasterCard, Meta, etc.) periodically faces scandals/bad news. Rational investors who evaluate fundamentals (is the company still making more money? what is intrinsic value?) and buy the dip rather than panic-sell tend to profit; those who \"buy high, sell low\" out of panic tend to lose money repeatedly.\r\n\r\n#### Two Ways Stocks Build Wealth\r\n\r\n1. **Capital appreciation** — profit from the share price rising over time between purchase and sale.\r\n   - You should not expect gains \"next day, next week, or even next month\" — short-term price movement is essentially random/unpredictable.\r\n   - **Worked example — Apple:** bought at **$320**/share (bullish thesis: great company, widely used products, undervalued); later sold at approximately **$502**/share (the video also momentarily states \"$520\" during narration, but the profit calculation that follows — $182 profit per share — is only consistent with a $502 sale price: $320 + $182 = $502). **Profit = $182 per share.**\r\n   - Adam's own biggest wins came from **not** selling too early — holding long enough for a position to compound **5×, 10×, 20×, or even 50×** the original cost. \"That's how you get really rich.\"\r\n   - **Capital gains tax:** depends on investor's home country. Adam (Singapore resident) pays **zero capital gains tax** investing in either the US or Singapore markets. By contrast, US citizens investing in US shares owe capital gains tax per their income bracket. (Viewers told to check with their own tax advisor.)\r\n2. **Collecting cash dividends** — a share of company profits paid out periodically (commonly quarterly, some companies pay twice yearly).\r\n   - Not all companies pay dividends. Dividend payers tend to be **mature, large, established companies with excess cash** beyond what's needed for reinvestment.\r\n   - **US dividend-payer examples cited:** PepsiCo, Johnson & Johnson.\r\n   - **Adam's personal dividend preference: Singapore-listed banks** — **DBS Bank, OCBC, UOB** — for high, tax-free dividend income.\r\n   - **Non-dividend / high-growth company examples:** NVIDIA, Palantir (which Adam owns) — these reinvest all profits into the business or buy back shares rather than pay dividends; investors profit via capital appreciation instead.\r\n   - **Investor decision framework:** dividend-heavy stocks (Pepsi, J&J, OCBC) tend to have slower-rising share prices; growth stocks (Nvidia, Meta, Apple) tend to pay little/no dividend but appreciate faster. Choose based on whether you want regular cash income or growth of wealth.\r\n   - Adam personally runs **multiple portfolios**: two focused on capital gains (own companies with fast-rising price, low dividends) and a separate **dividend portfolio** (UOB, OCBC, DBS — slower price appreciation, high dividend income). Full detail in the later \"building winning portfolios\" lesson.\r\n\r\n#### Dividend Yield\r\n\r\n- **Formula:** Dividend yield = Dividend per share (paid over last 12 months) ÷ Current share price.\r\n- **Simple example:** a $20 stock paying $2/year in dividends → yield = **10%**. Framed as compared against bank interest or bond yields; described as \"pretty good.\"\r\n- **\"Attractive\" yield benchmarks by market:**\r\n  - **US market:** ~**3%** dividend yield considered attractive.\r\n  - **Singapore market:** ~**5%–6%** dividend yield considered attractive.\r\n  - Adam prefers Singapore for dividend investing specifically because yields run higher (5–6% vs. US's typical 2–3%) **and** are tax-free, whereas US dividends are taxed. The US market is framed as better suited for **capital gains** investing instead.\r\n- **PepsiCo (Yahoo Finance) example:** last closing price **$152.89**/share; forward dividend (expected over next 12 months) = **$5.42**/share → dividend yield = $5.42 ÷ $152.89 = **3.55%**.\r\n- **UOB Bank (Singapore) example:** share price **$36.02** (minimum purchase 100 shares, as with most Asian markets); dividend **$1.76**/share → yield = $1.76 ÷ $36.02 = **4.89%**. Confirms Singapore stocks generally carry higher dividend yields than US stocks, and Singapore dividends are tax-free.\r\n\r\n#### Stock Oracle — Dividend Data Deep Dive (DBS Bank Example)\r\n\r\n*(Shown via DBS Bank's US OTC-market listing on Stock Oracle at time of recording; Adam notes Stock Oracle plans to add native Singapore/China/Hong Kong-listed data by end of 2026.)*\r\n\r\n- **Current dividend yield: 3.86%.**\r\n- **Dividend payout ratio: 63.86%** — meaning DBS pays out ~63% of its profits as dividends, retaining the other ~37% as retained earnings.\r\n- **Dividend growth rate:** last **5 years**: **26% per year** average growth; last **10 years**: **16% per year**; last **3 years**: **23% per year** — described as \"amazing,\" consistent dividend growth.\r\n- Dividends from DBS (Singapore-listed) are tax-free.\r\n- **Dividend yield history (10 years):** yield has cycled up and down over time; generally, when share price falls, yield rises (and vice versa). At time of recording, DBS's share price had risen a lot recently, pushing the yield **down from ~5.8% to under 4%** — Adam characterizes this as **DBS currently being \"a bit overvalued\"** for dividend-buying purposes; he'd prefer to buy back above a ~4% yield, and would find it \"very attractive\" if yield approached or exceeded **5%**.\r\n- **Dividend-per-share chart (10 years):** shows a steadily increasing dividend per share over time, **except during COVID**, when DBS was forced to cut dividends **\"because of MAS\"** (Monetary Authority of Singapore) — dividends resumed increasing afterward.\r\n- **Most recent financial year (FY2025) figures:** EPS (profit per share) = **$2.95**; dividends paid out of that = **$1.88** per share; free cash flow generated ≈ **$3.7x per share** (transcript audio here is garbled — heard as \"three dollars into a seven since it's free cash flow\" — figure is approximate, likely intended as roughly $3.7–3.79 per share).\r\n- **Ex-date / pay-date mechanic:** if you own shares before the stock's \"ex-date,\" you are entitled to receive the dividend, which is then distributed on the \"pay date.\" DBS pays dividends **quarterly (4 times per year)**.\r\n\r\n---\r\n\r\n### Stock Exchanges\r\n\r\n- The **US market** is Adam's primary focus — \"world's biggest market,\" home to \"the best companies in the world.\" Comprises about **24 stock exchanges**, of which the **three biggest** are:\r\n  - **New York Stock Exchange (NYSE)**\r\n  - **American Stock Exchange (AMEX)**\r\n  - **NASDAQ Stock Exchange**\r\n  - Example: Coca-Cola is listed on the NYSE; Apple is listed on NASDAQ. Knowing which exchange a stock trades on is **not important** for investors — your broker automatically routes the order to the correct exchange.\r\n- **China:** three main exchanges — **Shanghai Stock Exchange**, **Shenzhen Stock Exchange** (both mainland China), and the **Hong Kong Stock Exchange**.\r\n- **UK:** the **London Stock Exchange**.\r\n- **Europe:** several exchanges, biggest include **Euronext** (based in Amsterdam) and the **Frankfurt Stock Exchange**.\r\n- **Asia (other):** **Singapore Exchange**, **Tokyo Stock Exchange**, **Bombay Stock Exchange**, **Jakarta Stock Exchange**, and others.\r\n\r\n---\r\n\r\n### Stock Index Performance\r\n\r\n#### What Is a Stock Index and Why It Matters\r\n\r\n- Every stock market has at least one index measuring its overall performance — used by investors as a **benchmark to beat**.\r\n- **How an index is built:** a curated \"basket\" of the biggest/most representative companies stands in for the entire market — compared to elected representatives (members of parliament/congress) representing a whole population.\r\n\r\n#### Major US Indexes\r\n\r\n- The US market has roughly **10,000 total listed stocks**.\r\n- **S&P 500** = the **500 biggest** US companies, averaged together — the index most commonly used to represent the overall US market, and the one **most followed by retail investors** (because it captures far more companies than the Dow).\r\n- **Dow Jones Industrial Average (DJIA)** = the **30 biggest** US companies (a subset that is also within the S&P 500).\r\n- **NASDAQ 100** = the **100 biggest** companies listed specifically on the NASDAQ exchange, many of them technology companies.\r\n- These three indexes only include **large-cap** companies (market cap ≥ **$10 billion**).\r\n- **Russell 2000** = a basket of **2,000 small- and mid-size companies** (fills the gap for smaller companies not captured by the above three).\r\n- Important: when headlines say \"the market went up 20% this year,\" this typically refers to the **S&P 500** specifically, **not** all ~10,000 US-listed stocks.\r\n\r\n#### Singapore & Other Global Indexes\r\n\r\n- **Singapore market:** only **~600 total stocks** (a \"very small market\"). The top **30 biggest** are combined into the **Straits Times Index (STI)**.\r\n- **Global index reference list provided:**\r\n  - US: Dow Jones (30), S&P 500 (500), NASDAQ 100 (100), Russell 2000 (2,000 small/mid).\r\n  - Singapore: Straits Times Index (STI) — weighted average of 30 biggest companies.\r\n  - UK: **FTSE 100** — 100 biggest companies on the London Stock Exchange.\r\n  - Europe: **Euro Stoxx 50** — 50 biggest companies across 11 European countries; **DAX** — weighted average of the 40 biggest companies on the Frankfurt Stock Exchange; **CAC 40** — 40 stocks on the Paris Stock Exchange.\r\n  - China: **Shanghai Composite Index**, **Shenzhen Composite Index**, **Hang Seng Index** (represents Hong Kong), **CSI 300** (the 300 biggest mainland Chinese companies — generally used to represent mainland China).\r\n  - Japan: **Nikkei 225** — the 225 biggest Japanese companies on the Tokyo Stock Exchange.\r\n  - Australia: **ASX 200**.\r\n  - Malaysia: **KLCI (Kuala Lumpur Composite Index)** — the 30 largest companies listed in Malaysia.\r\n\r\n#### Index Membership Examples & Overlap\r\n\r\n- **Apple:** IS in the S&P 500, IS in the Dow Jones, IS in the NASDAQ 100, is **NOT** in the Russell 2000 (too large for that index).\r\n- **Coca-Cola:** IS in the S&P 500, IS in the Dow Jones, is **NOT** in the NASDAQ 100.\r\n- Some stocks appear across multiple indexes; others appear in just one.\r\n\r\n#### Index Composition Changes Over Time\r\n\r\n- Index members are **not fixed** — a company losing profitability/relevance gets removed and replaced with a stronger/more representative company.\r\n- **DJIA historical replacements cited:** **Citigroup, AIG, and General Electric** were previously in the Dow Jones but have all been removed, replaced over time by companies including **Nike, Salesforce, and Amazon**. More recently, **Intel** was removed from the Dow Jones and replaced by **Nvidia** \"just a few months ago\" (relative to recording).\r\n- **Current DJIA member examples cited (partial list):** Amazon, American Express, Apple, Boeing, Cisco, Nvidia, Visa, Disney, Walmart, 3M, Nike, and others.\r\n- Observation: DJIA's 30 companies sell not just to US consumers but **globally** — hence Adam calls them \"global companies\" and states the **Dow Jones \"in a way represents the global economy.\"** When asked \"what is the safest thing I can invest in,\" Adam's answer is **the Dow Jones**, reasoning that people worldwide consistently consume McDonald's, Apple products, etc.\r\n\r\n#### Index Weighting\r\n\r\n- The 500 companies in the S&P 500 do **not** carry equal weight — bigger **market cap** = bigger weighting/influence on the index's overall movement.\r\n- Example: **NVIDIA has a much bigger weighting than Texas Instruments** because Nvidia's market cap is larger — a 1% move in NVIDIA affects the index more than a 1% move in Texas Instruments.\r\n- Reminder: market cap = share price × total shares outstanding.\r\n\r\n#### FinViz \"Maps\" Feature — Visualizing the S&P 500 by Sector\r\n\r\n- On **finviz.com**, the \"Maps\" (referenced initially as \"groups\") feature visually displays all 500 S&P components, colored by year-to-date performance (green = price increased YTD, red = price decreased YTD; example date context: YTD from January to December 2024).\r\n- Components are grouped into sectors, e.g.:\r\n  - **Technology:** Microsoft, Apple, Oracle, Nvidia, Broadcom, Salesforce, ServiceNow.\r\n  - **Consumer Cyclical / Consumer Discretionary:** Amazon, Tesla, Home Depot.\r\n  - **Financials:** Visa, JPMorgan, American Express, MasterCard.\r\n  - **Healthcare:** Eli Lilly, Johnson & Johnson, Merck, UnitedHealth.\r\n  - **Consumer Defensive:** Pepsi, Walmart.\r\n  - (Sectors covered in more depth in the next lesson.)\r\n\r\n#### Historical S&P 500 Performance (data through end of 2024, as presented in Adam's chart tool)\r\n\r\n- **20-year period (Jan 2005 – end 2024):** index moved from ~**80 points** to **595 points** → total gain **613%**; equivalent to a **compounded annual growth rate (CAGR) of 10.32%**.\r\n- **10-year period (Jan 2015 – end 2024):** index moved from ~**170 points** to **595 points** → total gain **246%**; CAGR **~13%**.\r\n- **5-year period:** index started at **300 points** → total gain **100%**; CAGR **14.9%**.\r\n- All figures noted to include **dividends reinvested** into the index.\r\n- Major crashes/corrections referenced along the 20-year timeline: **2008–2009 Great Financial Crisis**, **2018 trade-war crash**, **2020 COVID-19 pandemic crash**, **2022 bear market** (driven by high inflation and high interest rates).\r\n- Lesson: despite multiple crashes, the long-term trajectory is upward because companies make more money over time and the index composition upgrades itself (weak companies replaced by strong ones).\r\n\r\n#### Global Market Comparison (via TradingView, 10-year lookback, priced in local currency first, then currency-adjusted)\r\n\r\n- Tool: **TradingView.com** (free version usable; paid not required); comparison built by charting the **S&P 500 (symbol SPX)** against other indexes added via the \"+\" button.\r\n- **10-year returns (local currency, unadjusted), ranked:**\r\n  1. **US (S&P 500): 191%**\r\n  2. **India (Nifty): 179%**\r\n  3. **Europe (Euro Stoxx 50): 60%**\r\n  4. **Australia (ASX): 53%**\r\n  5. **UK (FTSE 100): 24%**\r\n  6. **Singapore (Straits Times Index): 14%**\r\n  7. **Hong Kong (Hang Seng): –16%** (a loss; described as \"very sad\")\r\n  - (Also referenced: China market generally lands in last place.)\r\n- **Currency-adjustment point:** indexes are quoted in different currencies (e.g., Nifty in Indian rupees). When converted/normalized to a single currency (e.g., USD), the US market's outperformance over India **widens further**, because the Indian rupee has been depreciating against other currencies — so India's 179% local-currency gain looks smaller once currency loss is factored in.\r\n- **Japan (Nikkei 225), once added to the comparison:** performed **better than India** over the 10-year currency-adjusted view — landing in **second place behind the US**.\r\n- **5-year ranking (currency-adjusted):** US (best) → Japan → India → Europe → Singapore → Australia → UK → China (worst).\r\n- **Takeaway:** if the objective is maximizing capital gains, the data supports focusing on the **US market**, which delivered the best returns of all markets compared.\r\n\r\n---\r\n\r\n### Lesson 1 Quiz — Questions & Adam's Answers (9 Questions)\r\n\r\n1. **Which statement is FALSE?**\r\n   - (A) In the US market you can buy fractional shares (less than 1 share) — **TRUE** (via brokers like Interactive Brokers).\r\n   - (B) In the Hong Kong market you must always buy a minimum of 100 shares — **FALSE** (flagged as the \"tricky\" answer: it actually depends on the specific stock/counter — some require 100-share minimums, others require 500-share minimums).\r\n   - (C) In Singapore and Malaysia markets, minimum purchase is 100 shares — **TRUE.**\r\n   - (D) In the US market, there is no maximum number of shares you need to buy — **TRUE.**\r\n   - **Answer: B.**\r\n2. **Success Company** earned **$350 million** net income (last 12 months) with **100 million shares outstanding**. EPS?\r\n   - EPS = $350M ÷ 100M = **$3.50**. **Answer: B.**\r\n3. Success Company's share price is **$50**. P/E ratio?\r\n   - P/E = $50 ÷ $3.50 = **14.3×**. **Answer: B.**\r\n4. Success Company's share price is **$50**, with **100 million shares outstanding**. Market capitalization?\r\n   - Market cap = $50 × 100M = **5,000 million = $5 billion**. *(The transcript's stated answer letter here is garbled/unclear — likely a transcription artifact.)*\r\n5. What is the PEG ratio formula — P/E ratio multiplied by growth rate, or P/E ratio divided by growth rate?\r\n   - **Answer: divided by (B).** Reminder: PEG of **1.5 or less** is considered reasonable; below 1 is considered cheap.\r\n6. Success Company's share price is **$50** and it paid **$5** in dividends (last 12 months). Dividend yield?\r\n   - Yield = $5 ÷ $50 = **10%**. **Answer: A.**\r\n7. If a stock generates EPS of **$5**, how can the company return this capital to shareholders? (Multi-part answer — all four mechanisms restated:)\r\n   - **Dividends** (taxable in US markets, not taxable in markets like Singapore).\r\n   - **Share buybacks** (indirectly returns capital — with fewer shares outstanding, you own a bigger percentage of the business).\r\n   - **Retain the earnings** (like a savings account).\r\n   - **Reinvest the capital back into the business.**\r\n8. **Company A:** P/E = 10, projected earnings growth = 5%. **Company B:** P/E = 40, projected earnings growth = 100%. Which is cheaper?\r\n   - Company A PEG = 10 ÷ 5 = **2**. Company B PEG = 40 ÷ 100 = **0.4**.\r\n   - Lower PEG = cheaper → **Answer: B (Company B is cheaper).**\r\n9. **True/False set:**\r\n   - \"Great investors can predict where the share price will go in the short term.\" → **FALSE** — \"no one can predict where prices go in the short term... too many moving parts,\" only probability-based guessing is possible.\r\n   - \"In the short term, share prices are driven by emotions, manipulation, and forced selling.\" → **TRUE.**\r\n   - \"In the long run, share prices are driven by the fundamental value of the business.\" → **TRUE.**\r\n   - \"Short-term trading/speculation has a much higher win rate than long-term investing.\" → **FALSE.** Best win rates in short-term trading run **50–60%**, whereas long-term investing in great companies wins **90%+** of the time (companies make money over time).\r\n\r\n---\r\n\r\n### Shocking Market Facts\r\n\r\n*(Note: this video's opening lines introduce Lesson 2 on ETFs, but the bulk of the content — as transcribed — covers statistical \"facts\" about long-run market behavior, cycles, and probabilities; captured here as delivered.)*\r\n\r\n#### Fact 1: The US Index Always Goes Up Over the Long Run\r\n\r\n- Illustrated via a **Dow Jones Industrial Average, 121-year chart** (January **1904** to December **2024**) — chosen over the S&P 500 because the S&P 500's history only goes back about 60 years, while the Dow Jones is the oldest/longest-history US index.\r\n- Despite an extensive list of historical crises across the 121 years — **World War I, World War II, the Great Depression, the Vietnam War, the assassination of President JFK, the Cuban Missile Crisis, the Black Monday stock crash, the Gulf War, a 21-day US government shutdown, the Asian Financial Crisis, the dot-com crash, the 2008–09 Great Financial Crisis, the European sovereign debt crisis, the US credit-rating downgrade (from excessive debt), the 2018 US–China trade war, the 2020 COVID-19 pandemic, and the 2022 \"Fed hyperinflation war\"** — the market kept climbing.\r\n- **Total gain over 121 years: 11,188,000%.** Equivalent **CAGR: 10.04%.**\r\n- **Why the index always goes up long-run (two reasons given):**\r\n  1. Underlying driver = **earnings/profits**. Example: McDonald's — a Big Mac costs more today than 20 years ago (price increases) *and* more burgers are sold globally today than 20–30 years ago (volume increases) → rising prices × rising volume → rising profits → rising share value.\r\n  2. **Index composition self-upgrades.** Weak/unprofitable companies get removed and replaced by stronger ones (again citing **AIG, Citigroup, General Electric** removed from the Dow Jones, replaced by better companies like **Apple, Salesforce, Goldman Sachs**) — the index is effectively \"engineered to always go up.\"\r\n\r\n#### Fact 2: The Market Doesn't Go Up Every Year, But Goes Up Most Years\r\n\r\n- Looking at the **last 74 years (1951–2024):**\r\n  - Sample year-by-year figures cited: 1951 +23%, 1952 +18%, 1953 –1%, etc.\r\n  - **16 of 74 years ended down (21.6% of the time).**\r\n  - **58 of 74 years ended up (78.4% of the time).**\r\n  - Conclusion: buying US stocks in January and holding to December gives roughly a **78% probability of making money** in any given year — \"better than the casino\" (casino games generally offer worse-than-50/50 odds; investing in the US market offers better-than-70% odds).\r\n- **Holding for 5-year periods:** out of **70 total 5-year periods** (every overlapping 5-year combination across the 74-year span), **6 periods ended in a loss (8.6%)**, **64 periods ended in a gain (91.4%)**.\r\n- **Holding for 10-year periods:** out of **65 total 10-year periods**, only **2** ended in a loss (both spanning the **dot-com crash**) → **loss probability 3.1%**, **gain probability 96.9%**.\r\n- **How long to hold for a historically \"100% guaranteed\" gain?** According to the historical data shown, **about 15 years** — even if you had bought at the exact top of the dot-com bubble or the Great Financial Crisis, holding 15 years historically always produced a gain. (Adam notes the course will still teach how to avoid blindly buying at market tops, aiming instead to buy when undervalued or near fair value.)\r\n- **Distribution of annual return outcomes (over the 74 years):**\r\n  - +10% to +20% in a year: happened **23%** of the time.\r\n  - +20% to +30%: happened **21.6%** of the time.\r\n  - +30% to +40%: happened **13.5%** of the time.\r\n  - +40% to +50%: happened **once** (in **1958**) = **1.4%** of the time.\r\n  - +50% to +60%: happened **once** (in **1954**).\r\n  - 0% to –10% (down): happened **12.2%** of the time.\r\n  - –10% to –20%: happened **5.4%** of the time.\r\n  - –20% to –30%: happened **2.7%** of the time (twice in 74 years).\r\n  - –30% to –40%: happened **once** (in **2008**, the Great Financial Crisis) = **1.4%** of the time.\r\n  - Comparative takeaway: a +20–30% year (21.6% probability) is roughly **~10× more likely** than a –20–30% year (2.7% probability) — pushing back against financial-media pessimism about crash predictions.\r\n  - Overall: of 74 years, **58 were bullish, 16 were bearish** — \"it pays to stay invested... it pays to stay bullish.\"\r\n\r\n#### Singapore Market Comparison (Straits Times Index, via STI ETF, ticker ES3)\r\n\r\n- Because most Singapore market gains historically come from **dividends** (unlike the US, where gains come mostly from price appreciation), Adam uses the **STI ETF (ticker: ES3)**, which only has data back to **2003** (started in 2003), giving **22 years of data** (vs. 74 for the US) — \"better than nothing.\"\r\n- **Annual performance (22 years, dividends included):** e.g., 2003 +36% (incl. dividends), 2004 +18.96%, etc.\r\n  - **5 of 22 years ended in a loss (22.73% probability).**\r\n  - **17 of 22 years ended in a gain (77.27% probability).**\r\n  - Note: **without** counting dividends, the annual gain-probability drops to roughly **56%** — dividends are a major driver of Singapore market total returns.\r\n- **5-year holding periods:** **18 total 5-year periods**; only **1** period (**2011–2015**) ended in a loss even after dividends → **gain probability 94.44%**, **loss probability 5.56%**.\r\n- **10-year holding periods:** **13 total 10-year periods**, **all 13** ended in a gain (**100%** gain probability, 0% loss) — *(the transcript momentarily also states \"zero out of 30 periods,\" which appears to be an inconsistency/speech slip relative to the \"13 total periods\" figure stated just before it)*.\r\n\r\n#### Fact 3: Stock Prices Move in Cycles, Not Straight Lines\r\n\r\n- **Bull market (uptrend):** a series of **higher highs and higher lows** — generally associated with economic growth and market optimism. Most of the time, the market is in a bull-market phase.\r\n- **Bear market (downtrend):** a series of **lower highs and lower lows** — generally (though not always) associated with recessions or broad pessimism.\r\n- On an actual long-run S&P 500 chart, Adam demonstrates visually marking off alternating bull-market and bear-market segments over time.\r\n\r\n#### Fact 4: Bull Markets Are Opportunities for Investors\r\n\r\n- The stock market spends roughly **80% of the time in a bull-market phase**.\r\n- Even within a bull market, prices still regularly decline — but \"every time they go down, they go even higher\" afterward, producing a pattern of **higher highs and higher lows** made up of repeated **\"wave up, wave down\"** cycles.\r\n- **Breathing analogy:** price behavior compared to breathing — \"breathe out, breathe in\" repeatedly; a market \"can't go up every single day... it's got to come down before going even higher.\"\r\n- **Pullback:** a wave-down decline of **1% to 9%**. Occurs on average **~3 times per year**. Timing is unpredictable (\"no one knows... it will happen when it happens\").\r\n- **Correction:** a bigger wave-down decline of **10% to 19%**. Occurs on average **~once per year** (essentially, one of the roughly three pullbacks in a given year tends to deepen into a correction).\r\n- **Duration:** pullbacks and corrections typically **last 1 to 4 months**.\r\n- Both pullbacks and corrections are framed as **buying opportunities** — the investor's aim is to buy during wave-downs (small ones = pullbacks, big ones = corrections).\r\n- **Estimating possible bottoms — Moving Averages:** since no one can predict the exact bottom of a wave-down, **moving averages** are used as a probabilistic guide (full detail deferred to the later Technical Analysis lesson).\r\n  - **50-day moving average** — shown as the **blue line**.\r\n  - **150-day moving average** — shown as the **green line**.\r\n  - **200-day moving average** — shown as the **red line**.\r\n  - These are auto-calculated/auto-plotted by charting software.\r\n  - Moving averages help identify **support levels** — price levels where a decline tends to stall and bounce back up (not guaranteed, but \"a good probability\"). Example given: the S&P 500 repeatedly using its 50-day (blue) moving average as a support level, bouncing off it multiple times in succession.\r\n  - Practical application: once price falls to a moving-average support level, that's a **possible bottom** and a point to start adding shares — but because price could still fall further to the *next* moving average down, positions should always be built in **tranches at successive support levels**, never bought \"at one go.\"\r\n\r\n---\r\n\r\n### Tools & Websites Referenced (Summary)\r\n\r\n- **Yahoo Finance** (finance.yahoo.com) — ticker search; \"Statistics\" page (net income, shares outstanding, implied shares outstanding); \"Summary\" page (EPS TTM, P/E TTM, forward dividend/yield, market cap, current share price).\r\n- **Stock Oracle** (app.stockoracle.com) — subscription platform; \"Company Metrics\" page (ROIC, ROE, P/E trailing & forward, PEG, 5-year and beyond-5-year growth projections, dividend yield/history/growth-rate/payout ratio/ex-date-pay-date schedule); customizable \"Favorites\" from a pool of ~479–497 available metrics; Adam's primary go-to tool for metrics not available on Yahoo Finance (e.g., ROIC).\r\n- **FinViz** (finviz.com) — ticker search; past-5-year and projected-next-5-year earnings growth; \"Maps\" feature visualizing the entire S&P 500 by sector/performance, color-coded green (up YTD) / red (down YTD).\r\n- **Zacks** (zacks.com) — alternative source for earnings growth projections, used to cross-check FinViz's numbers (Adam recommends getting more than one source/opinion).\r\n- **TradingView** (tradingview.com) — charting software (free version sufficient); used for P/E-ratio overlays on price charts, moving averages, and cross-market/currency-adjusted index comparisons (index symbols such as SPX for the S&P 500). Course includes dedicated tutorials on setting up TradingView charts.\r\n- **Interactive Brokers** — Adam's personal brokerage; notable for allowing fractional share purchases in the US market. (Any reputable broker is acceptable for the course; broker mechanics are broadly similar once learned.)\r\n\r\n---\r\n\r\n### Key Takeaways\r\n\r\n- A share is ownership in a real business, not a lottery ticket — the business's growing profitability, not news headlines, is what ultimately makes a share worth more.\r\n- Learn to find and use **net income**, **implied shares outstanding**, and **EPS** — and understand the four ways a company can return that profit to you: dividends, buybacks, reinvestment (ROIC), or retained earnings.\r\n- **P/E ratio alone is meaningless** — it must always be evaluated against the **earnings growth rate** via the **PEG ratio** (PEG = P/E ÷ growth%; roughly ≤1.5 reasonable, \u003c1 cheap, >1.5 getting expensive), and even PEG is only a rough guide — full valuation comes later via discounted cash flow.\r\n- Short-term price action is driven by **demand/supply, emotion (fear and greed), news, and manipulation/forced selling** — largely unpredictable and not correlated to actual business performance.\r\n- Long-term price action (2+ years) is driven by **fundamentals**: earnings growth (~8%/year long-run average), share buybacks, dividends, future earnings anticipation, and money supply — with a **100% long-term correlation** between business success and stock price success.\r\n- The investing decision mix should be **90% fundamental analysis, 10% technical analysis**.\r\n- Making money requires buying great businesses **when undervalued** (below intrinsic value) and being willing to buy into bad news/panic, rather than asking \"why did the market move\" (an unproductive question).\r\n- Wealth is built two ways: **capital appreciation** and **dividends** — know which one your objective favors, and choose stocks/markets accordingly (US market: better for capital gains, low-taxed; Singapore market: better dividend yields, tax-free).\r\n- Stock indexes (S&P 500, Dow Jones, NASDAQ 100, etc.) are curated, self-upgrading baskets of top companies used as **performance benchmarks** — the course's implicit goal is to beat them.\r\n- Historically, the **US market has the best long-run and 10-year track record** among major global markets, with a high (~78–96%+) probability of gains the longer the holding period, especially past 10–15 years.\r\n- Markets move in **bull/bear cycles** made of repeated wave patterns; expect regular **pullbacks (1–9% drops, ~3x/year)** and **corrections (10–19% drops, ~1x/year)** even within a bull market — these are normal and are buying opportunities, not reasons to panic.\r\n\r\n---\r\n\r\n# Part II — Trend Following, Strategy Execution & The Keys to Profitable Investing\r\n\r\n## Section 02 — Trend Following, Strategy Execution & The Three Steps to Successful Investing\r\n\r\n**Source videos**\r\n| File | Actual content |\r\n|---|---|\r\n| 20 — Trend Following Part 1 (20:09) | Moving-average trend-following theory + charting setup |\r\n| 21 — Trend Following Part 2 (36:36) | Live 20-year SPY back-test, trade-by-trade; parabolic drops; bear-market staged buying |\r\n| 22 — Strategy Execution (30:31) | 200 MA rule, combined signal, three method summary, buy-and-hold vs trend-following back-test, timing studies, macro vs price action, 2020 case study |\r\n| 25 — Part 1 (27:34) | **Lesson 3: The Three Steps to Successful Investing — Part 1** (great businesses, intrinsic value, five criteria, reasons 1–3 a stock goes on sale) |\r\n| 26 — Part 2 (23:03) | **Lesson 3: The Three Steps to Successful Investing — Part 2** (reasons 4–5 a stock goes on sale, GOOGL/J&J case studies, when to sell) |\r\n\r\n---\r\n\r\n## PART A — TREND FOLLOWING (Videos 20 & 21)\r\n\r\n### A1. The Two Methods of Investing — Where Trend Following Fits\r\n\r\n- **Method 1 (previous lesson): Buy and hold.**\r\n  - Buy consistently every couple of months regardless of the trend — through bull markets and bear markets.\r\n  - Hold through the ups and downs.\r\n  - Long-run average return: **about 10% per year**.\r\n- **Method 2: Trend following.**\r\n  - We attempt to **time the market by following the trend**.\r\n  - Goal: identify uptrends (bull markets) and identify bear markets.\r\n  - Far more **active** than buy and hold.\r\n  - Procedure:\r\n    1. Buy **only during the uptrend / bull market**.\r\n    2. Once we identify that it is turning into a bear market, **sell all our shares**.\r\n    3. Only once the bear market has ended and a new bull market starts, **get back in** to ride the new bull market.\r\n    4. Repeat the process indefinitely.\r\n  - The tool that makes this possible: **moving averages**.\r\n\r\n### A2. What a Moving Average Is\r\n\r\n- A moving average is a mathematical calculation: **the average of the stock price over a certain period of time**.\r\n- **50-day MA** — software takes the last **50 days of the stock's closing price**, adds them together, divides by 50, repeats every day, and plots the line.\r\n- **150-day MA** — software adds the last **150 days of closing price**, divides by 150, repeats every day, plots the line.\r\n- **Colour convention used throughout the course (Adam's own convention — \"because Adam says so\"):**\r\n  - **50 MA = BLUE**\r\n  - **150 MA = GREEN**\r\n  - **200 MA = RED** (introduced later, in video 22)\r\n\r\n### A3. The Hulk-and-Smurf Mnemonic\r\n\r\n- **Green (150) = the Incredible Hulk. Blue (50) = a Smurf.**\r\n- Alternative framing: a **150 kg man** and a **50 kg man**.\r\n- **When the Hulk sits on the Smurf → it goes DOWN.** So when the 150 green is *above* the 50 blue → **confirmed downtrend / bear market**.\r\n- **When the Smurf sits on the Hulk → the Hulk carries him UP.** So when the 50 blue is *above* the 150 green → **uptrend / bull market**.\r\n\r\n### A4. RULE — Identifying a Change in Trend (50/150 Crossover Method)\r\n\r\n#### State definitions\r\n- **Downtrend / bear market:** 150 green is above 50 blue, and **both moving averages are sloping down**.\r\n- **Uptrend / bull market:** 50 blue is above 150 green, and **both moving averages are sloping up**.\r\n- As long as blue stays below green, the downtrend continues.\r\n\r\n#### RULE — Downtrend reverses into an Uptrend (TWO conditions, both must be met)\r\n1. **Both moving averages must change their slope.** From sloping down, both lines must **flatten or slope upwards**.\r\n   - *If either line is still sloping down, it is still a downtrend. It is NOT a change in trend.*\r\n   - Both lines have to be flat or sloping up for the change in trend to be confirmed.\r\n2. **The 50 MA (blue) must cross ABOVE the 150 MA (green).** There must be a crossover.\r\n- When both are satisfied → **uptrend confirmation / bull-market confirmation → BUY to get back into the market.**\r\n\r\n#### RULE — Uptrend reverses into a Downtrend (TWO conditions, both must be met)\r\n1. **Both moving averages must change their slope.** From sloping up, both must **flatten or slope downwards**.\r\n   - *If one moving average is still sloping up, it is NOT a change in trend.*\r\n2. **The 50 MA (blue) must cross BELOW the 150 MA (green).**\r\n- When both are satisfied → confirmed bear market → **SELL**.\r\n\r\n#### The single most important refinement\r\n- **The slope is the most important thing — you cannot just look at the 50/150 crossover.**\r\n- The classic mistake: people see the 50 above the 150 and buy immediately — and it was a **fake-out** / false reversal.\r\n- **Watch the GREEN line.** You have to wait for the green line to flatten before confirming the uptrend, and wait for the green line to flatten/slope down before confirming the downtrend.\r\n- **If you are not sure whether the green has flattened, wait a few more days.** (Adam does exactly this repeatedly in the back-test.)\r\n\r\n### A5. RULE — Timeframe Restriction\r\n\r\n- **The 50/150 crossover change-in-trend method ONLY works on DAILY candles.**\r\n- **Do NOT use it on weekly or monthly candles** for the change-in-trend method. (Repeated for emphasis in both video 20 and video 22.)\r\n\r\n### A6. Adding Shares Inside an Uptrend — \"Buy the Dip on the Uptrend\"\r\n\r\n- Price moves in **wave up, wave down, wave up, wave down** = **impulse, correction, impulse, correction** (\"breathe out, breathe in\").\r\n- **We buy on the wave down.** When price waves down and hits one of the moving averages, we can add more shares.\r\n- Valid as long as the blue line remains above the green line (still an uptrend).\r\n- **Write this down: \"Buy the dip on the uptrend.\"**\r\n- **Dip = correction = retracement** — all the same thing.\r\n- The moving averages **act like support levels** — that's where you know you can add more shares.\r\n- Frequency of adding is up to you: **once in three months, once in six months, once a year.**\r\n- You can't tell how long an uptrend will last — it could last many months or many years. Keep adding along the way.\r\n\r\n### A7. Worked Example — 2006 to 2011 (Financial Crisis Window)\r\n\r\n- If you bought the Dow Jones or the S&P at the start of this ~five-year window and simply held, you would end up with **a very small return**.\r\n- Using trend following you exit before the bear market and buy back to catch the bull market. Three trades:\r\n  - Trade 1: **+22%**\r\n  - Trade 2: **+31%** (after avoiding the entire bear market)\r\n  - Trade 3: **+19%**\r\n  - **Total: 72% over the five-year period** — better than buying and holding across the same window.\r\n\r\n### A8. Charting Setup — Tools and Exact Steps\r\n\r\n- **Any charting software will work** — all charting software lets you add moving averages. Named options: **TradingView**, or **the charting software from your broker**, whichever broker you use.\r\n- Adam demonstrates on **Think or Swim (TD Ameritrade)** charting software.\r\n- Instru
