ment used: **SPY** (the S&P 500 ETF).\r\n\r\n#### Steps to install the moving averages (Think or Swim)\r\n1. Set candles to **daily**.\r\n2. To back-test, set the chart range to **20 years** — the software automatically switches to monthly candles, so go to **Time Frame** and **change it back to daily candles** (20 years, daily candles).\r\n3. Click the **\"magic potion\" (studies) icon** → type **\"moving averages\"**.\r\n4. Two kinds exist: **Simple Moving Average** and **Exponential Moving Average**. **For the 50/150 method, use the SIMPLE moving average.**\r\n5. Double-click Simple Moving Average → it defaults to a **9-day** MA.\r\n6. Click **Edit**, change **9 → 50**, set colour **blue**, width **2 or 3** (doesn't matter).\r\n7. Click again to add a second study → **Edit** → change to **150**, colour **green**, width **2**.\r\n8. Click OK. Optionally **Save as \"50 150\"** so the preset is reusable.\r\n9. (Later: add the **200 MA in red**.)\r\n\r\n### A9. The 20-Year SPY Back-Test — Trade-by-Trade Walkthrough (Video 21)\r\n\r\n#### Back-test protocol\r\n- Chart starts at **2001**. Move forward day by day.\r\n- **Pretend you don't know the future** — make decisions only on what is visible at that moment.\r\n- **Execution rule: buy or sell on the OPENING PRICE of the day AFTER the crossover is confirmed.**\r\n- Chart legend used to read the price: **O = opening price, H = high, L = low, C = closing price.** We trade the **O**.\r\n- Prices recorded in an **Excel spreadsheet** to calculate profit/loss.\r\n\r\n#### Signals and fake-outs encountered\r\n- Starting state 2001: **downtrend** (blue below green) → do not buy.\r\n- **First crossover: NOT a buy** — the blue had sloped up but the **green was still sloping down**. It was a fake-out; the 50 fell back below the 150 and the downtrend continued.\r\n- **Second crossover: confirmed** — both sloping up + crossover → **BUY**.\r\n\r\n#### Complete trade log (SPY, opening prices)\r\n| # | Action | Price | Note |\r\n|---|---|---|---|\r\n| 1 | BUY | 94.89 | Day after confirmed crossover |\r\n| 2 | SELL | 109.62 | Crossover came first, waited for green to flatten |\r\n| 3 | BUY | 113.12 | Prior downtrend was very short-lived |\r\n| 4 | SELL | 125.20 | Blue sloping down, green flat |\r\n| 5 | BUY | 132.12 | Downtrend again short-lived, reversed back up |\r\n| 6 | SELL | 147.93 | Confirmed by price action too: higher highs turned into **lower highs** |\r\n| 7 | BUY | 93.67 | After the crash; waited for green to flatten |\r\n| 8 | SELL | 106.02 | Blue sloping down, green flat |\r\n| 9 | BUY | 118.10 | |\r\n| 10 | SELL | 124.42 | Sold into a **gap down** after green flattened |\r\n| 11 | BUY | 128.73 | Waited extra days for green to flatten |\r\n| 12 | SELL | 187.49 | **Parabolic drop** — sold only \"to follow the rules of the game\" |\r\n| 13 | BUY | 210.12 | After a **double dip** |\r\n| 14 | SELL | 266.52 | Took several extra days of waiting to confirm green had flattened |\r\n| 15 | BUY | 284.70 | |\r\n| 16 | SELL | 249.52 | **COVID / pandemic crash, February 2020 — a parabolic drop** |\r\n| 17 | BUY | 320.13 | Blue sloping up, green flattened |\r\n| — | Mark-to-market | **390.25** | Last closing price at time of recording |\r\n\r\n#### Back-test results and observations\r\n- Over the 20 years there were **nine buys and nine sells** — nine round-trip transactions.\r\n- **Most trades made money.** There was **one loss — caused by the February 2020 plunge** — but it was made back very quickly on the next trade.\r\n- **Overall: yes, you make money.** As with any method there is no 100% win rate — you win some and lose some, but you win more than you lose.\r\n- Biggest win of the method: **it got us out before the financial-crisis bear market — a 50% plunge — and kept us out of the market for a year**, then put us back in near the start of the new bull market.\r\n\r\n#### Discipline principles stated during the back-test\r\n- **We are not predicting the future. No one can predict the market.** \"I'm not a fortune teller. All I'm doing is following the trend.\"\r\n- **River analogy:** if the river flows north, I swim north; if it flows south, I get off the boat. Follow the market — don't outsmart the market.\r\n- **Ignore the news and the newspapers — everything is noise.** Look only at price action and the trend.\r\n- We can identify **when** a trend changes, but **not how long the new trend will last**. Some downtrends are very short-lived and reverse straight back up.\r\n\r\n### A10. The Limitation — Parabolic Drops\r\n\r\n- **Definition: a parabolic drop is when the market drops 90 degrees — straight down.**\r\n- Normal trend change is roughly **45 degrees up / 45 degrees down**. A parabolic drop is a 90-degree collapse.\r\n- **This does happen in the market once in a while.** In the 20-year back-test it happened twice — including the **February 2020 COVID crash**.\r\n- **The failure mode:** when the market drops that fast, **by the time the moving averages cross and you sell, you are selling far too low — after the crash has already happened.** There is no point selling at that stage.\r\n- **RULE (Adam's real-life behaviour): when you see a 90-degree drop, DO NOT SELL. Just hold it.**\r\n  - He states explicitly that in reality he did **not** sell in February 2020; he ignored the moving averages completely.\r\n  - In the back-test he sold anyway, only to follow the mechanical rules of the exercise.\r\n- **Rubber-ball theory:** the harder you throw the ball down, the faster it bounces back up. If you hold great companies/good ETFs, they bounce back just as fast.\r\n- **The problem this creates:** where do you buy more shares to take advantage of the discount? Waiting for the 50 to cross back above the 150 means buying **only after the big recovery — too high**.\r\n\r\n### A11. RULE — Staged Buying Into a Crash (Bear-Market Ladder)\r\n\r\n#### The historical facts underpinning the rule\r\n- Adam has studied the markets for **28 years** and lived through **six bear markets**; the statistics are drawn from **100 years** of market history.\r\n- **A bear market is a drop of more than 20% from the high.** Anything more than 20% is a bear market.\r\n- **The average bear market drops 36%.**\r\n- **The worst drop in history was 55%** (the financial crisis).\r\n\r\n#### The staged-entry rule (using a target of 100 shares of the ETF as the illustration)\r\n- **At −25% from the top:** start adding — buy **25 shares (a quarter position)**. Do *not* deploy the full 100 at this level.\r\n- **At −35%/−36% (the historical average):** add another **quarter position** → now half the planned position is filled.\r\n- **At another −10% down (i.e. −45%):** add the **third quarter position**.\r\n- **At −55% (the biggest drop the market has ever seen):** you know you are definitely at the bottom → add the **last quarter position** — \"all in maybe.\"\r\n- **Rationale:** you can never know where the exact bottom is — the market can reverse at −25%, at −35%, anywhere. Buying in stages means that if it reverses at −35% you still captured at least half your intended position. Once the moving average crosses back and the uptrend is confirmed, **add more shares later on**.\r\n\r\n### A12. Supplementary Resources Referenced\r\n\r\n- YouTube: search **\"Adam Khoo bull market\"**.\r\n  - **\"Has the stock market bottomed?\" — 3 April 2020** — the video where he called the bottom (or at least \"near the bottom\").\r\n  - **\"The bull market is back\" — 10 April 2020** — where he called the new bull market and told viewers to get back into the markets.\r\n  - These videos show the additional parameters and indicators he uses.\r\n\r\n---\r\n\r\n## PART B — STRATEGY EXECUTION (Video 22)\r\n\r\n### B1. RULE — The 200-Day Simple Moving Average (Red Line)\r\n\r\n- Install the **200 simple moving average** into the chart; Adam's preference is to colour it **red**.\r\n- **The 200 works ALONE** — it is a single moving average, so the rules are stricter.\r\n\r\n#### RULE — Uptrend by the 200 MA (two criteria)\r\n1. **The price of the stock/ETF must be ABOVE the 200 moving average**, and\r\n2. **The 200 must be SLOPING UP.**\r\n- **It cannot be flat.** It must slope up.\r\n- *Contrast with 50/150:* for the 50/150 the lines may be **flat or sloping up** for an uptrend, and **flat or sloping down** for a downtrend. Because the 200 is only one moving average, **we have to be more strict — only sloping up counts as an uptrend.**\r\n\r\n#### RULE — Downtrend by the 200 MA (two criteria)\r\n1. **The price must cross BELOW the 200 moving average**, and\r\n2. **The 200 must slope downwards.**\r\n\r\n#### Interpretation notes\r\n- Price dipping below the 200 while the 200 is **still sloping up** is **not** a downtrend.\r\n- Price rising above the 200 while the 200 is **still sloping down** is **not** an uptrend.\r\n\r\n### B2. RULE — Which Signal Do I Use? Combine All Three and Take Whichever Comes First\r\n\r\n- **Answer: combine all three moving averages (50, 150, 200) to determine the trend.**\r\n- **RULE: follow the signal that comes FIRST.** Whichever fires earlier is the change-in-trend signal.\r\n- Worked illustration:\r\n  - On an uptrend turning down, the 50/150 exit fired earlier than the 200 exit (the 200 exit only came once the red line was sloping down with price below it) → take the **50/150** signal.\r\n  - On a downtrend turning up, the 50/150 entry fired earlier than the 200 entry → take the **50/150** signal.\r\n  - **The 50/150 does not always come first. There are times the 200 comes first.** Always take the earlier signal.\r\n- **Re-emphasised: this trend-reversal method only works on daily candles.**\r\n\r\n### B3. RULE — Complete ETF Trend-Following Strategy (Summary)\r\n\r\n**BUY when the index/ETF is making a dip on an uptrend.** Uptrend is defined as EITHER:\r\n- The **50 MA is above the 150 MA and both moving averages are flat or sloping up** (they must not be sloping down), **OR**\r\n- The **price of the ETF is above the 200 MA and the 200 is sloping up.**\r\n- Either condition satisfies the uptrend condition.\r\n- As long as it is an uptrend, **buy when the price retraces or dips to the moving average.**\r\n\r\n**SELL / exit the ETF when the index reverses into a downtrend** (a potential bear market). Downtrend is EITHER:\r\n- The **50 MA crosses below the 150 MA and both moving averages have flattened or are sloping down**, **OR**\r\n- The **ETF price crosses below the 200 MA and the 200 is sloping down.**\r\n- **Whichever comes first.**\r\n\r\n**EXCEPTION TO THE SELL RULE:** if the price drops **90 degrees (parabolic drop)**, as in the 2020 pandemic — **do not sell.** By then it is too late; you would be selling near the bottom, which makes no sense. Hold it. Good ETFs and good companies bounce back like a rubber ball — the faster it drops, the faster it bounces back.\r\n- On such a crash, rather than waiting for the 50 to get back above the 150 (by which time price has risen a lot), **add at −25%, add more at −35%, more at −45%, and at −55% that's the bottom — all in.**\r\n\r\n### B4. The Three Methods Compared\r\n\r\n#### Method 1 — Dollar-Cost Averaging (passive)\r\n- The simplest method. **No market timing, no need to look at the trend.**\r\n- **Invest a fixed dollar amount at regular intervals**, regardless of uptrend or downtrend. The only requirement is **consistency**.\r\n- Effect: on average you **buy more shares at a low price and fewer at a high price**, averaging your cost to a reasonable level.\r\n- You always make money over time.\r\n- Can be done on a portfolio of **equity ETFs** or a portfolio of **multi-asset ETFs**.\r\n- Passive approach — buy and hold through the ups and downs.\r\n- *\"If you're colourblind, just do this.\"*\r\n\r\n#### Method 2 — Trend Following\r\n- Requires seeing the colours of the moving averages.\r\n- Identify uptrend vs downtrend using the **50, 150 and 200 moving averages**.\r\n- Buy when the index/ETF starts an uptrend; **add more shares on every dip on the uptrend** (wave down toward a moving average).\r\n- You can't pick the exact bottom, but near the moving averages you know you're near the bottom.\r\n- **Yes, you do get out of the market** — when the uptrend reverses into a downtrend/bear market.\r\n- There is no telling how long bear markets last — one month, six months, one year.\r\n\r\n#### Method 3 — The Hybrid (the method Adam actually uses)\r\n- A hybrid of methods 1 and 2.\r\n- **Dollar-cost average — buy shares with a fixed amount of money every six months — but do NOT buy blindly.**\r\n- **Look at the trend of the market.** Only buy when:\r\n  - the market is making a **dip on the uptrend**, **or**\r\n  - the market is at the **support level of a consolidation**.\r\n- **If the market is in a downtrend, avoid dollar-cost averaging.**\r\n\r\n### B5. BACK-TEST — Buy-and-Hold vs Trend Following over 26 Years\r\n\r\n- Comparison run over the **last 26 years**:\r\n  - **Buy and hold** (dollar-cost averaging consistently regardless of trend, holding through the ups and downs): **total return 644%**\r\n  - **Trend following** (buy on the uptrend, exit at the start of the downtrend, buy back in): **total return 696%**\r\n- **Conclusion: in the long run the two are about the same.** Trend following gives slightly better results, but passive buying and holding would have done pretty well as well.\r\n- **Whatever strategy you use, the most important thing is to GET STARTED as early as possible.** The worst thing a person can do is procrastinate and never start.\r\n\r\n### B6. Cash Rules and the Risk-Over-Time Inversion\r\n\r\n- **Only invest with cash you don't need in the short term.** If you need the cash for emergencies or expenses in the next one to two years, **don't invest it** — keep it in cash or time deposits.\r\n- If you don't need the cash for the next one, two, three, four years and you want to compound your wealth, **start as early as possible**.\r\n- **Short term:** holding cash *is* safer than stocks. Example: in the **2022 bear market the stock market dropped up to 20% in that one year**. Cash didn't drop nominally — though cash still loses value to **inflation**, so there is a drop in real terms.\r\n- **Long term (5 to 10 years) the relationship inverts:**\r\n  - **The longer you hold cash, the more risky it becomes** — cash hardly grows, you only get very minute interest from time deposits, it doesn't build wealth, and in the long run you won't have enough for retirement or to beat inflation.\r\n  - **The longer you hold stocks, the safer it becomes** — despite going through repeated bear markets and ups and downs, over time you are much better off than someone who stayed in cash for 5–10 years.\r\n- **On the fear \"what if I buy and it crashes next week?\":**\r\n  - First, **you can never predict when the next crash will come.**\r\n  - Second, **even if you are unlucky enough to buy right at the top before a crash, if you hold on over the long run you are STILL better off than the person who stayed in cash the whole time.**\r\n\r\n### B7. STUDY — Bad Timing Still Beats Procrastination (2001–2020, $2,000/year into the S&P 500 ETF)\r\n\r\nFive scenarios, each investing **$2,000 annually into the S&P 500 ETF from 2001 to 2020** (20 years):\r\n\r\n| Scenario | Behaviour | Ending value |\r\n|---|---|---|\r\n| 1. Perfect timing (\"like God\") | Invests $2,000 at the exact **bottom of the market every year** (impossible in practice) | **$151,000** |\r\n| 2. Invest immediately | Puts in $2,000 on the **first trading day of every year** (2nd/3rd January) | **$135,000** |\r\n| 3. Dollar-cost averaging | Splits $2,000 into 12 months = **$167 per month**, every month | **$134,856** |\r\n| 4. Worst timing (\"Charlie Brown\") | Invests $2,000 at the **top of the market every year** | **$121,000** |\r\n| 5. Stayed in cash | Kept $2,000/yr in **time deposits** for 20 years, always waiting for a lower price | **$44,000** |\r\n\r\n- **Lesson: even bad timing beats procrastination.** The worst outcome by far belongs to the person who never started.\r\n- Note how close scenario 3 (DCA, $134,856) is to scenario 2 (lump sum at the start of each year, $135,000).\r\n\r\n### B8. RULE — Ignore Macroeconomics; The Stock Market Is Not The Economy\r\n\r\n- **Adam does not use macroeconomic factors — interest rates, GDP, employment data — in making investment decisions at all.** He reads them \"for entertainment purposes.\"\r\n- **Looking at macro data will not only fail to help — it will make your decisions WORSE.** It will adversely affect your returns: you'll buy at the worst time and sell at the worst time.\r\n- **The stock market is not the economy. They are two totally separate animals.**\r\n- **The stock market is a LEADING INDICATOR of the economy — it leads the economy by about SIX TO NINE MONTHS.**\r\n  - When the stock market turns from uptrend to downtrend, **six to nine months later** the economy will show a recession.\r\n  - When the stock market turns from downtrend to uptrend, **six to nine months later** the economy will show a recovery in GDP.\r\n- **If you focus on economic data you are six to nine months late and you will always make late decisions.**\r\n- **Focus only on the price action / the trend of the market.**\r\n\r\n#### The economy-vs-market cycle chart (red line = stock price, green line = GDP)\r\n- **At the market top:** the market reverses into a downtrend (50 crossing below the 150 and sloping down = the trend-follower's exit signal) — but **the economy is still showing growth, in full recovery**. Investors reading the news see a strong economy and BUY right at the top, then wonder why it goes down.\r\n- **When the recession finally appears:** those investors sell — and by then **they are selling near the bottom of the stock market cycle**. This is why most retail investors **buy high and sell low**.\r\n- **At the market bottom:** a new uptrend forms (50 crossing above the 150 sloping up, or price above the 200 sloping up). Smart investors buy here. Retail investors won't — \"it's a recession, GDP is still dropping.\"\r\n- **They wait for the green line (early recovery) and end up buying near the top again.** It goes up a bit, then collapses.\r\n- **Instruction: ignore the economy, ignore GDP, ignore inflation, ignore interest rates, ignore employment. All you have to look at is the price action.**\r\n\r\n### B9. CASE STUDY — March/April 2020: Buying While the News Screamed Depression\r\n\r\n#### The headlines that scared retail investors out (late March / early April 2020)\r\n- Jobless claims soar to surpass **3 million**, a record high.\r\n- **30 March:** coronavirus job losses could total **47 million**; the unemployment rate may hit **32%**.\r\n- **6 April:** Janet Yellen (Federal Reserve Chairperson) says second-quarter GDP could **decline by 30%** and unemployment is already at **12 to 30%**.\r\n- **9 April:** death toll reaches a third straight record, **799**; the IMF chief says the pandemic will unleash **the worst recession since the Great Depression**.\r\n- **9 April:** the bull market started — **the Dow jumped 500 points, up 13% on the week.**\r\n\r\n#### What actually happened\r\n- **The market bottomed on 23 March 2020**, precisely when the media was most pessimistic and predicting the worst depression in history.\r\n- Most people were selling like crazy; **many banks were recommending their clients sell everything** (Adam notes he has many banker friends).\r\n- **Adam started buying on 25 March 2020 — two days after the bottom** — and was buying shares every single day on 4, 6 and 9 April, along with his entire investment community.\r\n\r\n#### The Ultimate Investors Playbook (UIP)\r\n- A subscription service where Adam sends a **notification within a couple of minutes** the moment he buys or sells something.\r\n- At the time it had **1,200 members**; a few thousand more have joined since.\r\n- Actual notifications from the crash:\r\n  - **24 March:** heads-up — looking to add **MasterCard** to the portfolio as it's at the **150 MA support**.\r\n  - **25 March:** bought **MasterCard at $236.40**, with the intention of adding more if it dropped to **$210**.\r\n  - **30 March:** added **Facebook (now Meta Platforms) at $159.43**.\r\n- **The buying rationale (important):** the decision to buy is **not** a prediction that it's the bottom or that it will go up. **No one can predict the bottom.** The criteria are simply: it's a **great company**, it is **undervalued**, and it's **at a support level** → just buy, and you will do very well.\r\n\r\n#### The results\r\n- By the end of 2020, when most people made no money:\r\n  - **Portfolio 1 grew 44%**\r\n  - **Portfolio 2 grew 41.37%**\r\n  - **Actual dollar gain: $791,000 in profits** during that recession/bear-market year.\r\n- **These returns required more than index ETFs** — he picked individual companies that were **super high quality and very, very undervalued**. That is the subject of the next stage of the course.\r\n\r\n---\r\n\r\n## PART C — LESSON 3: THE THREE STEPS TO SUCCESSFUL INVESTING (Videos 25 & 26)\r\n\r\n> *Content identification:* Video 25 (\"Part 1\") and video 26 (\"Part 2\") are the two halves of **Lesson 3 — The Three Steps to Successful Investing**. Video 25 opens with \"welcome to lesson 3, the three steps to successful investing\" and video 26 closes with \"that concludes lesson number three… in the next lesson we're gonna dive deeper into analyzing businesses… lesson four, fundamental analysis.\"\r\n\r\n### C1. Framing\r\n\r\n- The previous lesson taught the simplest way to invest: buy an ETF tracking an index, owning the 30 or 500 biggest companies. **But that only gets you market returns.**\r\n- **The purpose of this course is to BEAT the market** — to get much higher returns than the index provides — by picking individual stocks that outperform.\r\n- Lesson 3 is deliberately shorter: it delivers the broad concept; the details come in the subsequent lessons.\r\n\r\n### C2. STEP 1 — Identify Great Businesses\r\n\r\n- When you buy a share of stock **you are not buying a lottery ticket — you are buying a piece of a business. You are owning a business.**\r\n- **Only buy great businesses — best of breed.** Not mediocre businesses, not lousy businesses.\r\n- **In the US market there are over 10,000 businesses** and you can buy any one you want — so why waste time with low-quality businesses?\r\n- **Adam focuses only on the top 1% of great businesses and ignores the other 99%.**\r\n\r\n### C3. STEP 2 — Buy Only at the Right Price (Below Intrinsic Value)\r\n\r\n- **A great business can be a lousy investment if you pay too high a price** — if you buy it when it's overvalued.\r\n- **A great business becomes a great investment only when you buy it for less than what it is worth.**\r\n- **Property analogy:**\r\n  - The bank values an apartment at **$1 million**. You fall in love with it and pay **$1.5 million** — **50% above valuation**. Bad investment: it will be very hard to profit, and any eventual return will be low because you overpaid.\r\n  - Alternatively the seller is desperate (a divorce, or he lost his business and needs cash) and sells at **$700,000** — **30% below intrinsic value**. Great investment.\r\n- **In real estate, a great property with a desperate motivated seller is really hard to find.** In the stock market it happens all the time.\r\n- **Frequency:** not every day, but **at least once a year, or once every few years**, a great business goes on sale at a **20%, 30% or 50% discount** because there are desperate, panicking sellers reacting to bad news.\r\n- \"That's how I got really rich, and that's how people like Warren Buffett got really rich.\"\r\n- **Ideally the price has waved down to a SUPPORT LEVEL.**\r\n  - **Support level** = a technical-analysis term (taught in **lesson 6**): a price level where price drops to that level and **there is a high potential for it to reverse and bounce back up.**\r\n\r\n### C4. STEP 3 — Sell (Or Rather, Usually, Don't)\r\n\r\n- **If you have done steps 1 and 2 very well, you shouldn't ever have to sell** — until you need the cash to pay for something.\r\n- Reasoning:\r\n  - A great business keeps growing and compounding your wealth.\r\n  - If you sell it, you must reinvest the cash into another great business — **which is not easy, because there aren't that many great businesses around.**\r\n  - \"Once you latch on to a great business — like having the perfect wife — you're going to hold on for the rest of your life.\"\r\n\r\n#### Holding-period return evidence (as presented)\r\n| Company | 1 year | 5 years | 10 years | 20 years |\r\n|---|---|---|---|---|\r\n| **Apple** | ~16% to 35% (depending where you sell) | **191%** | **792%** | **22,830%** |\r\n| **MasterCard** | ~20% | **68%** | **563%** (despite COVID crash, 2022 bear market, trade war) | **6,000%** (despite recessions, crashes, the 08/09 great financial crisis) |\r\n| **NVIDIA** (leader in the AI revolution, one of his biggest holdings) | **144%** | **2,200%** | **29,615%** (from 2015) | — |\r\n| **American Airlines** (a lousy business) | **+33%** | **−33%** | **−60%** | — |\r\n\r\n- **The big money is in staying invested in a great business and letting it compound massively. That's how you make millions and build generational wealth.**\r\n- **You do NOT build generational wealth by taking profit at 20%, 30% or 50%. You want a 10x, a 15x, a 20x.**\r\n- **With American Airlines, the longer you hold, the worse it gets.** Only great businesses compound your wealth over time; mediocre and lousy businesses stagnate or reduce your wealth.\r\n\r\n#### RULE — Whole industries to avoid\r\n- **Write this down: ALL airlines are lousy businesses.** It is **not the fault of the management — it is the nature of the industry.**\r\n- **The property development industry** is likewise not a great business by the nature of the industry.\r\n- Certain industries are simply not very profitable.\r\n\r\n#### The legitimate reasons to sell (broad concept; full detail in the exit-rules lesson)\r\n1. **The fundamentals of the business have deteriorated.**\r\n   - This does **NOT** mean a short-term drop in profits or sales — that is cyclical and very normal.\r\n   - It means **the long-term business model is disrupted, or the company loses its competitive advantage.**\r\n   - Examples of businesses that were once great and no longer are: **Intel** and **General Electric** — over time they lost their competitive advantage and their business got disrupted.\r\n   - The moment you see that, get out and reinvest into a great business.\r\n2. **You found an even better business** → sell and swap into the greater business.\r\n3. **The share price has gone crazy / way overvalued / way too expensive** → nothing wrong with selling part or all, holding cash and waiting for it to get cheap again, or reinvesting into a more attractively priced great business.\r\n\r\n### C5. What Makes a Business \"Great\"\r\n\r\n- **Definition:** a great business is one where you are **confident that over the next three, five, ten, twenty years the business will consistently increase in value.**\r\n- The **green line** on the charts = **the value of the business = the intrinsic value** of the business / of its shares.\r\n- **Mechanism:** as the business increases in value over time and is worth more and more, people are willing to pay more for it — and hence the share price rises over time.\r\n- **A business is a money-making machine. The more money it makes, the more it is worth.**\r\n- **What makes a business more valuable: consistently making more money** — generating **increasing sales revenue, increasing net income (also known as earnings), and increasing cash flow from operations**. When these rise, the intrinsic value keeps rising.\r\n\r\n#### THE FIVE CRITERIA of a great business (taught in full in **lesson 7**)\r\n1. **Track record** — at least the **last five to ten years** showing the ability to increase **revenue, net income and cash flow from operations consistently.**\r\n   - *But history does not predict the future — this alone is not good enough.*\r\n2. **A sustainable competitive advantage that protects it from competition — an ECONOMIC MOAT.**\r\n3. **High return on equity and high return on capital** — i.e. the management is extremely efficient.\r\n4. **A strong balance sheet** — **low, conservative debt structure and high levels of cash.**\r\n5. **Strong growth catalysts and drivers.**\r\n\r\n- **Fewer than 1% of businesses in the market meet all five criteria.** When a business does meet all five it is highly likely to be a great business that will keep growing in value over time.\r\n- **Fails the criteria:** American Airlines.\r\n- **Meets the criteria:** Microsoft, NVIDIA, Apple, MasterCard.\r\n\r\n### C6. Why Price Diverges From Value (Intrinsic Value vs Share Price)\r\n\r\n- The intrinsic value line rises steadily for a great business (examples shown: **Microsoft**, **Visa**) — but **the share price does not go up in a straight line and does not always reflect the value of the business.**\r\n- **Why:** the share price is determined by **demand and supply in an auction-driven market**. In the short term the market price **is not driven by logic — it is driven by news and emotions** (and manipulation).\r\n- Result: the price behaves like **a pendulum swinging from overvalued to undervalued and back**, repeating endlessly.\r\n  - Bad news / pessimism → price drops **below** intrinsic value → **undervalued**.\r\n  - Good news / euphoria / excitement → price runs **above** intrinsic value → **overvalued**.\r\n- **When the share price gets very far from the intrinsic value, we have MISPRICING — and taking advantage of the mispricing is how you get really rich in the markets.**\r\n\r\n#### The man-and-dog analogy\r\n- A man walks in a straight line from his house to his office. He has a dog on a **very long leash**.\r\n- The dog runs all over the park — far to the right, far to the left — because it's excited by a cat or a tree. **You have no idea where the dog is going.**\r\n- That's the market in the short term: **very random; you don't know if it's up or down tomorrow.**\r\n- **But eventually the dog meets back up with the man when he reaches his office — because the dog is on the leash.** Price eventually converges to value.\r\n\r\n### C7. RULE — How to Buy: Tranching at Support Levels\r\n\r\n- **Job: patiently wait for the stock price to go BELOW the intrinsic value (the green line), then start to add — ideally at support levels** (support-level drawing is taught in **lesson 6**, technical analysis; valuation methods in **lesson 5**, and different businesses are valued a bit differently).\r\n- **You do not have to buy at the exact bottom of every correction or wave down.** No one can predict the exact bottom. **As long as you buy below the intrinsic value, you've done your job.**\r\n- **RULE: never buy at one go. Always buy in three to four — or even five — tranches.**\r\n  - Once the price goes below intrinsic value by a **margin of safety of about 10–15%**, start adding some shares **at the support level**.\r\n  - If it goes even lower — say **20% below intrinsic value** — add more.\r\n  - If it goes lower still, add even more.\r\n  - You **slowly average into the position**. It's like dollar-cost averaging, **except you are adding at support levels**.\r\n  - Your average cost ends up somewhere in the middle — **not at the bottom, and it doesn't have to be.**\r\n- **Why it works:** as long as you buy below intrinsic value, over time the price gets back above intrinsic value — **plus the intrinsic value itself is increasing.** That's how you see growth in the value of your shares.\r\n- **Warren Buffett (as quoted in the lesson):** the time to be greedy is when others are fearful, and the time to be fearful is when others are greedy.\r\n\r\n### C8. THE FIVE REASONS A GREAT BUSINESS SELLS BELOW INTRINSIC VALUE\r\n\r\n> Reasons 1–3 have **nothing to do with the company itself** — the stock is just collateral damage in the short term. Reasons 4–5 are company-specific. Adam explicitly says he does **not care why** sellers are desperate (panic, emotions, or being force-sold by a broker because they were on margin) — the job is simply to take advantage of the discount.\r\n\r\n#### Reason 1 — Overall stock market correction\r\n- **On average, once a year the whole market drops by at least 10%.**\r\n- There is **always a trigger** but you can **never predict** it: a war, a disaster, geopolitical tensions, tariffs, weak economic numbers — it doesn't matter.\r\n- When the market drops, **most companies go down together — the good, the bad and the ugly.**\r\n- **That is a great time to buy the good companies**, because the market drop has nothing to do with the company; it's overall market sentiment.\r\n\r\n#### Reason 2 — Bear market\r\n- **Definitions:**\r\n  - **Correction:** the market drops **more than 10% but less than 20%** — happens more frequently.\r\n  - **Bear market:** the market drops **more than 20% from the high** — usually due to a recession, an economic crisis or a financial crisis.\r\n- **Frequency:** looking at the last 100 years, **on average once every six years** — but it is **not** a regular occurrence:\r\n  - **From 2009 to 2019 — ten years — there was no bear market at all.**\r\n  - **Then a bear market in 2020, and another bear market in 2022.**\r\n  - Sometimes they come close together, sometimes very far apart. We don't know.\r\n- In a bear market **everyone panics and loses their mind; good companies and bad companies all fall 20, 30, 40%** — that's how you buy a great company at a discount when there's maximum fear.\r\n- **\"I love bear markets.\"** After every bear market his portfolio grows exponentially because he gets to add shares at huge discounts.\r\n\r\n#### Reason 3 — The sector or industry is unloved / \"out of rotation\"\r\n- There are **11 sectors** in the market (technology, financial, healthcare, and so on). Within each sector there are **industries** — e.g. within technology: semiconductor, hardware, software.\r\n- **Sectors take turns being loved and unloved by investors.**\r\n  - When a sector is loved, money (especially institutional money) flows in — that sector is **\"in rotation\"** and **most or all of its stocks go up — the good, the bad and the ugly. A rising tide lifts all boats.**\r\n  - **The money has to come out of somewhere** — the sector it leaves is **\"out of rotation\" / unloved**, and **all its stocks drop**, good, bad and ugly.\r\n- **It's almost impossible to predict exactly when a rotation will happen or reverse.** \"My job is not to predict the rotation. My job is to take advantage of the rotation.\"\r\n\r\n**Worked example — Healthcare, 2023 and especially 2024**\r\n- The whole healthcare sector was out of rotation and unloved; money flowed out. Reasons given:\r\n  - **Politics:** usually in an **election year** money flows out of healthcare because of **uncertainty over new political regulations**.\r\n  - **Post-COVID surgery backlog:** COVID caused people to delay non-essential surgeries; afterwards they all went for them, **increasing insurance companies' claim costs → costs up, profits down**.\r\n- Healthcare stocks got very, very cheap → **that's when he bought them**.\r\n- Long-run case: **everyone needs healthcare; healthcare is a recession-proof sector; and the aging population is a long-term growth driver.** When people get excited about healthcare again and money flows back, that's how you get **20, 30, 40% returns**.\r\n\r\n**Worked example — Consumer Staples, 2024**\r\n- **Consumer staples** = companies that sell **low-growth essential goods** — e.g. **Coca-Cola, Pepsi, Procter & Gamble, Colgate**.\r\n- They are very **defensive** stocks and **recession-proof**.\r\n- **When the economy is doing very well, people don't want these boring companies, so they sell them** — that's why they tend to drop during good economic growth. And when they drop, they're cheap.\r\n- **In 2024 he bought a lot of consumer staple stocks — for example Pepsi — and a lot of healthcare stocks.**\r\n- Whenever a fear of recession appears (we can't know when), everyone gets scared, they buy healthcare and consumer staples again, and those stocks fly.\r\n\r\n#### Reason 4 — The company is hit by short-term bad news\r\n- **When you buy a great business that meets the five criteria, 99.9% of the time any bad news that hits the company is SHORT TERM.** They will sort it out, solve the issue, and the company will do very well again.\r\n\r\n**(a) Lawsuits.** Great companies get sued all the time — by **consumers**, by **investors** (class-action lawsuits after a price drop), and by **the government** (e.g. the **Department of Justice** suing them for being a monopoly). **Every time a great company gets sued and the share price drops on the bad news, Adam buys** — it's always temporary and rebounds very fast.\r\n- **2024 — three great companies sued by the US DOJ: Google, Apple and Visa.** Google actually lost its lawsuit. Each caused a temporary drop that made the stock undervalued — **and by the end of the year all three were back at all-time highs.**\r\n  - **March 2024:** the Justice Department sues **Apple**, alleging it illegally monopolised the smartphone market → **Apple shares dropped about 10%** → back to an all-time high by the end of the year.\r\n  - **5 August:** **Google loses its landmark US antitrust case over search dominance** → share price plunged → back to all-time highs by the end of the year / the following year.\r\n  - **24 September:** the US DOJ **sues Visa over the debit card market monopoly** → Visa's price dropped and was undervalued very briefly → all-time highs again.\r\n\r\n**(b) The Buffett / American Express archetype (1963).**\r\n- American Express was **not yet listed on the stock market** — it traded **over the counter as a pink sheet**.\r\n- Buffett wanted the company: it was a great business, but **too expensive at about $60 per share**, so **he waited patiently for bad news.**\r\n- In **1963 the \"Salad Oil Scandal\"** hit: American Express was **sued for negligence** and lost roughly **$30–50 million** because of the lawsuit, causing a short-term drop in profits.\r\n- Buffett's insight: the short-term loss didn't matter because **the brand was still very strong** — at the time, credit cards and travel both meant American Express; the advertisement said \"don't leave home without it.\"\r\n- **The scandal cut the share price by about 50%, from $60 to $30, and Buffett pounced and bought shares.**\r\n- Once the scandal was resolved the share price went back to **$60 and a lot higher**. He bought in **1964 and has never sold** — **he has made over US$20 billion on that one great business.**\r\n\r\n**(c) Earnings misses.** A great company will have good years and bad years, good quarters and bad quarters. Sometimes when it reports earnings, **earnings or revenue come in lower than expected**. People panic and sell, the **share price drops 10, 20, 30%** — a **great time to buy**, because it will rebound very strongly.\r\n\r\n**(d) Cyclical slowdown.** A business can be in a long-term growth industry yet still have a temporary slowdown.\r\n- **Digital advertising** is a long-term growth industry — five or ten years from now more companies will be spending on online advertising. **The biggest players are Google, Amazon and Meta.** (**Meta owns Facebook, Instagram and WhatsApp.**)\r\n- **In 2022 there was a short-term cyclical slowdown in advertising spend.** Google's and Meta's revenue slowed, and **the share prices dropped roughly 15–20%.** Adam **bought a lot more in 2022**, and it has rebounded significantly since as advertising spend re-accelerated.\r\n- **Cybersecurity** is the same: in the long run more and more companies will spend on cybersecurity systems. **His favourite cybersecurity companies are Palo Alto and Fortinet.** In **2022 and early 2023 there was a short-term slowdown in corporate cybersecurity spending**, and **Palo Alto and Fortinet dropped 10%, 20%, 30% — way below intrinsic value.** He **added a lot of shares** and it has produced very nice gains.\r\n\r\n**(e) Product recalls.** Usually affects auto companies — **Adam does not buy auto companies** (reasons explained later in the course).\r\n\r\n**(f) Diseases.** Years ago, **mad cow disease** meant no one dared eat beef. **McDonald's**, which sells primarily beef, saw profits fall and **the share price drop 30%.** He bought it undervalued knowing it was a short-term problem — \"the cow won't be mad forever… one day the cow will be happy again, people eat beef again.\" **McDonald's went back to all-time highs.**\r\n\r\n#### Reason 5 — Great companies making stupid mistakes\r\n- Sometimes even great companies make **stupid mistakes that hit their short-term profits**, while their **competitive advantage, brand, economies of scale and economic moat remain intact.**\r\n\r\n**Example — American Express, 1963 (as a self-inflicted mistake).** They made the mistake of **certifying salad oil for a commodities trader who had falsified the records**, and were **sued for negligence**. The **share price dropped 50%.** Buffett recognised the brand was still very strong — people used AmEx credit cards and travellers' cheques every day — **bought shares at half price and made billions.**\r\n\r\n**Example — Nike.** Nike is a great brand with the **biggest marketing budget among all the athletic footwear companies.** But in **2019 they hired a new CEO who made very bad management decisions:**\r\n- He **cut out all the wholesalers**, wanting to sell **Nike direct to consumers** — a bad mistake.\r\n- He **killed a lot of the innovation**: instead of having a **football department and a running department** that built the most innovative shoes, he reorganised Nike into only **men's, women's and children's departments.**\r\n- Result: **innovation fell, they lost shelf space**, and **for the first time Nike's revenue growth decelerated and profit decelerated.** **The share price dropped 40%.**\r\n- **That was when Adam accumulated shares of Nike** — the brand is still very strong, there's a long runway, they **fired the old CEO** and brought in a CEO to repair everything, and it's on the path of recovery.\r\n- **Caveat stated at the time of recording: Nike shares had NOT yet rebounded to their prior glory — it is in the process of rebounding.**\r\n\r\n### C9. CASE STUDY — Alphabet / Google (GOOGL), two-year chart\r\n\r\n- **Share classes:** Alphabet has two classes you can buy, **GOOGL and GOOG**. **There is no difference — you can buy either one.** The only difference: **the one with the L has voting rights.**\r\n- Google is a great business: **revenue and profits keep growing year after year, so intrinsic value keeps rising** — but the share price \"goes up and down like a crazy yo-yo\" between overvalued and undervalued because of the news flow:\r\n\r\n| Date | News event | Effect |\r\n|---|---|---|\r\n| **February 2023** | Their new **AI chatbot made a mistake** | People panicked and sold; shares became very undervalued, then recovered once people realised everyone still uses Google |\r\n| **24 October 2023** | Earnings not as good as expected — **cloud business revenue missed expectations, profit missed expectations** | Share price dropped, then went back to new highs |\r\n| **March 2024** | **Not company-specific** — the entire market dropped on **fears of inflation coming back**; the **Dow Jones dropped 475 points** and the **S&P 500 suffered its worst day since January** | Google fell with everything (\"the good, the bad and the ugly\"), became really undervalued, then back to all-time highs |\r\n| **September 2024** | Google **lost its fight against a $2.7 billion EU antitrust fine** | Share price really undervalued — **Adam added more shares** — then rebounded |\r\n| **October 2024** | **Google faces a US government attempt to break it up** | Panic, then recovery |\r\n\r\n- At the time of speaking, **Google is near intrinsic value — slightly below it**; be patient and you'll get a chance to buy soon.\r\n\r\n### C10. CASE STUDY — Johnson & Johnson\r\n\r\n- **He no longer owns J&J.** He owned it **before they spun off their consumer health division**, when J&J was a very diversified healthcare company. After the spin-off they became a **pure pharma stock, which he does not invest in.**\r\n- While he owned it: **revenue and profit grew year after year, so intrinsic value kept growing**, while the share price swung on litigation news.\r\n\r\n| Event | Effect |\r\n|---|---|\r\n| **Failed to overturn a $2.12 billion baby powder verdict**, planned a Supreme Court appeal (the baby powder was alleged to contain carcinogenic, cancer-causing material) | Price dropped a lot, got really undervalued — **Adam was adding more shares here** — then recovered |\r\n| **23 February** — faces another **25,000 baby powder lawsuits**; assigns **$4 billion in litigation expenses and lawyer's fees** | Price dropped, then rose again |\r\n| **The Supreme Court rejects J&J's appeal** against the **$2 billion penalty** in the baby powder case | Price dropped again, then rose again |\r\n\r\n### C11. CRITICAL CAVEAT — Only Do This On Great Businesses\r\n\r\n- **All of the buy-the-bad-news examples apply ONLY to great businesses / high-quality companies.**\r\n  - Great businesses: bad news + pessimism → share price drops → **great time to buy — it will rebound higher, because the company makes way more money over time.**\r\n- **DO NOT do this on low-quality companies.**\r\n  - Low-quality = companies that **don't make profits**, or whose **profits are inconsistent**, or whose **revenue, profits and cash flow are not growing consistently.**\r\n  - **For those companies, when bad news hits and the share price drops, it may NEVER come back.**\r\n- \"Please remember that.\"\r\n\r\n### C12. THE FINAL STEP — Selling to Take Profits\r\n\r\n- Full exit rules come in **lesson 9** (portfolio management and exit rules). The broad concept:\r\n- **If you really did a good job of buying a great business that keeps growing year after year, there is no reason to sell it — unless you need the money to buy something** (a new car, a new house). Otherwise, **stay invested.**\r\n\r\n#### Reason to sell 1 — Long-term fundamentals / competitive advantage have deteriorated\r\n- Stocks he actually sold for this reason: **Estée Lauder** and **Disney**.\r\n  - They were great businesses but he doesn't think they're great anymore — **they lost their competitive advantage; the long-term moat is not as strong as it once was.**\r\n  - He **sold and reinvested into another company with a very, very strong moat.**\r\n\r\n#### Reason to sell 2 — He found an even better business\r\n- Nothing wrong with the business, but a **greater business exists** → **do a swap**: sell this, reinvest in that one.\r\n\r\n#### Reason to sell 3 — The share price is overvalued (way above intrinsic value)\r\n- **How much is \"way above\" depends on the KIND of stock:**\r\n\r\n**(i) Mid-to-lower-growth, very predictable companies**\r\n- Examples: **Pepsi, Procter & Gamble, McDonald's, Yum Brands, Lockheed Martin.**\r\n- They are great companies and they grow, **but not super high growth — they grow at maybe 10% or 12%.**\r\n- **RULE: once the share price gets about 20% or more above intrinsic value, he may start to sell some of it, or even all of it.**\r\n\r\n**Worked example — McDonald's**\r\n- **Intrinsic value at the time of recording: $273.**\r\n- He **added shares at about $252** — a pretty good discount.\r\n- The share price then made a **parabolic move** — going up 90 degrees. (**Parabolic = a 90-degree move; covered further in the technical analysis lesson, lesson 6.**)\r\n- Price reached about **$300**, roughly **15–20% overvalued**. He felt it was **overextended — \"like a rubber band, once it goes up too much it tends to snap back\"** — and he needed cash to buy something else, so **he sold near the top (not at the top).**\r\n- It has since come back down, **but he has NOT bought it back — because it is still not below his intrinsic value; it's still above the valuation.**\r\n- **If it drops back to about $265 or $259, he'll add it back.**\r\n\r\n**(ii) High-growth companies**\r\n- Examples: **NVIDIA, Palantir, Amazon, Meta, Microsoft, Salesforce** — these **make up the bulk of his portfolio.**\r\n- **In the past he bought them undervalued, sold them when overvalued — and that was one of the biggest mistakes he made.** After he sold, they'd dip a bit, but **before he could buy back they zoomed even higher and he missed out on a lot of returns.**\r\n- **Apple and Microsoft:** he bought them **over 15, 16, 18 years ago** and jumped in and out many, many times, making \"okay money.\" **Looking back, if he had simply bought and stayed invested through the ups and downs, he would have compounded his wealth probably FIVE TO TEN TIMES MORE.** \"It's a lesson I learned as I became more experienced.\"\r\n- **RULE TODAY: for great high-growth companies (NVIDIA, Palantir, Microsoft), even if it gets overvalued, he WON'T sell it.** Short term it may be overvalued and come down a bit, but long run the intrinsic value continues to compound — it makes more sense to just stay invested.\r\n- **Exception: if it gets CRAZY overvalued — more than 100% above intrinsic value — he may sell PART of it.** Especially if it has taken **too big an allocation in the portfolio.**\r\n- **At 30, 40, 50% overvalued for a high-growth company, he stays invested and does not sell.**\r\n\r\n### C13. Course Roadmap References Made in Lesson 3\r\n\r\n| Lesson | Content promised |\r\n|---|---|\r\n| Lesson 4 | Fundamental analysis — reading a business inside out to judge great / mediocre / lousy |\r\n| Lesson 5 | How to value stocks of businesses (different businesses valued differently) |\r\n| Lesson 6 | Technical analysis — support levels, resistance, parabolic moves |\r\n| Lesson 7 | The five criteria of a great business, in detail |\r\n| Lesson 9 | Portfolio management and exit rules, in detail |\r\n\r\n---\r\n\r\n## KEY TAKEAWAYS\r\n\r\n- **Trend following = two moving-average tests, and the SLOPE matters more than the crossover.** Uptrend confirmed when the 50 (blue) crosses above the 150 (green) **and** both lines have flattened or turned up; downtrend confirmed when the 50 crosses below the 150 **and** both have flattened or turned down. A crossover without a slope change is a fake-out. Daily candles only.\r\n- **The 200 MA (red) is a stricter, standalone confirmation:** price above a **rising** 200 = uptrend; price below a **falling** 200 = downtrend. Combine all three MAs and **act on whichever signal comes first**.\r\n- **The method's one failure mode is the 90-degree parabolic drop.** By the time the MAs cross you'd be selling at the bottom — so don't sell; hold, and instead **ladder in at −25%, −35%, −45% and −55%** (bear market = >20% drop; average bear = −36%; worst ever = −55%).\r\n- **Over 26 years, buy-and-hold returned 644% vs trend following's 696% — essentially the same.** Getting started matters far more than which method you choose: the $2,000/year study showed perfect timing $151k, start-of-year $135k, DCA $134,856, worst timing $121k — and staying in cash only $44k. **Bad timing beats procrastination.**\r\n- **Ignore all macroeconomics.** The stock market is not the economy — it **leads** the economy by six to nine months, so trading off GDP, inflation, rates or employment guarantees you buy near tops and sell near bottoms. Price action only. Adam's proof: buying MasterCard at $236.40 and Facebook at $159.43 in late March 2020 while headlines predicted 32% unemployment — producing 44% and 41.37% portfolio gains and **$791,000 in profit** in a bear-market year.\r\n- **Three steps to successful investing: (1) identify great businesses — only the top 1%; (2) buy only below intrinsic value, ideally at a support level; (3) don't sell** unless fundamentals deteriorate, you find a better business, or it becomes extremely overvalued.\r\n- **Five criteria for a great business:** 5–10 year track record of rising revenue/net income/operating cash flow; a sustainable competitive advantage (economic moat); high ROE and return on capital; a strong balance sheet with low debt and high cash; strong growth catalysts. **Fewer than 1% of companies qualify.**\r\n- **Value compounds in a straight line; price yo-yos on news and emotion** (the man walking his dog on a long leash). **Mispricing is the source of outsized returns** — and great businesses go on sale for five reasons: market corrections (~10% drop once a year), bear markets (>20%, roughly once every six years), sector rotation, short-term company bad news, and self-inflicted management mistakes.\r\n- **Never buy in one go — always tranche into 3–5 buys at support levels**, starting at roughly 10–15% below intrinsic value and adding more at ~20% below and lower.\r\n- **Sell discipline scales with growth rate:** predictable 10–12% growers (Pepsi, P&G, McDonald's, Yum, Lockheed) get sold at ~20%+ overvaluation; high-growth compounders (NVIDIA, Palantir, Amazon, Meta, Microsoft, Salesforce) are held even when 30–50% overvalued, trimmed only above **100% overvalued** — because selling Apple and Microsoft in and out cost Adam an estimated 5–10x of compounded wealth.\r\n\r\n---\r\n\r\n# Part III — Fundamental Analysis: Reading the Financial Statements\r\n\r\n## Lesson 4 — Fundamental Analysis (Financial Statements)\r\n\r\n> Adam Khoo, Value Momentum Investing (Whale Investor). Videos 28–34.\r\n> Adam's own framing: *\"This is probably the heaviest, most technical lesson in the entire course.\"*\r\n> Everything below is drawn only from the lesson transcripts.\r\n\r\n---\r\n\r\n### 0. Introduction — Why Fundamental Analysis Matters\r\n\r\n#### 0.1 The core claim\r\n\r\n- Fundamental analysis = **\"the art of learning how to analyze a business\"** — reading a business inside out to decide whether it is a **good**, **mediocre**, or **lousy** business.\r\n- **70% of your investment decisions are based on the fundamentals of the business.**\r\n- When you buy a stock, **you are not buying a ticker that goes up and down — you are buying a piece of an underlying business.** If the business does well, the stock will do well over time.\r\n\r\n#### 0.2 Why great businesses give you \"no worries\"\r\n\r\n- If you own a great business and the price falls 20%, 30%, 40% on emotion or manipulation, you don't sweat it — you know it will eventually bounce back higher. In fact you **use the correction to add more shares**.\r\n- If you own a lousy or average business and the price drops, you have **every reason to panic**, because you don't know if it will come back.\r\n\r\n#### 0.3 The real purpose: avoiding disasters\r\n\r\n- Fundamental analysis is **not just about finding great companies — more importantly it is about identifying and avoiding lousy businesses.**\r\n- **The main reason investors lose money is that they buy stocks of lousy businesses.** They get seduced by short-term speculation/hype, buy in, the bubble bursts, the price crashes and **never comes back** because the underlying business was never great.\r\n\r\n#### 0.4 Our job as investors\r\n\r\n- **Not** to predict where the market goes next week / next month / next year — short-term price movement is impossible to predict with certainty.\r\n- **Our job is to invest into a portfolio of great businesses that will thrive and grow under all economic conditions.**\r\n- We cannot predict interest rates, inflation or GDP — **and we don't have to.** Rain or shine, recession or no recession, high or low inflation, high or low rates, a portfolio of great businesses will grow consistently and grow our wealth over time.\r\n\r\n#### 0.5 \"Blue chip can get blue black\" — the collapse case files\r\n\r\n| Company | Market / Sector | What happened |\r\n|---|---|---|\r\n| **Noble Group** | SGX blue chip, component of the **Straits Times Index**, one of the biggest companies in Singapore and Asia | Collapsed. Investors said \"I was cheated, all my money's gone.\" **Many analysts had recommended the stock.** |\r\n| **Hyflux** | Singapore water treatment company, blue chip | Collapsed. **Both share investors and bondholders lost most of their money.** (Full case study in §7.) |\r\n| **China Evergrande** | One of the biggest real estate developers in China, blue chip | On the verge of collapse, **defaulting on its debt.** |\r\n\r\n- Adam: *\"Blue chip can get blue black if you invest in the wrong ones.\"* Don't be deceived by the word \"blue chip.\"\r\n- Adam has **never invested in any of these companies**, because he studies the financial statements and does a fundamental deep-dive. **All of these companies failed his fundamental criteria.**\r\n\r\n#### 0.6 Great businesses can decay — but slowly\r\n\r\n- Does a great business become a lousy business? **Yes, it happens** — but it does **not** happen overnight, over one quarter or one year. **It takes years.**\r\n- **Intel** — was a great business with a strong economic moat, but over time **lost its competitive advantage to Nvidia and to AMD**.\r\n- **Boeing** — was a great business, but **management missteps** destroyed a lot of its reputation.\r\n- Therefore: ignore short-term performance; look at the **long-term year-on-year trends** of revenue, profits and cash flow.\r\n\r\n---\r\n\r\n### 1. Reporting Cadence, Earnings Dates, and Where to Get the Data\r\n\r\n#### 1.1 How often companies report\r\n\r\n- Companies report **four times a year**: a **quarterly report** every quarter, and an **annual report** at the end of every financial year.\r\n- They report **three things**:\r\n  1. **Income statement** — how much money they made, how much they spent, what's the profit at the end of the day.\r\n  2. **Balance sheet** — how financially strong the business is: assets minus liabilities = shareholders' equity.\r\n  3. **Statement of cash flows** — **the most important** — how much cash was generated from the business, how much was paid out, how much was borrowed or repaid.\r\n\r\n#### 1.2 You don't need to read the raw reports\r\n\r\n- You *can* download quarterly and annual reports from the company's website, but modern financial websites already **compile and collate the data and pre-calculate most of the ratios**.\r\n\r\n#### 1.3 Finding the next earnings date\r\n\r\n**TradingView (charting software)**\r\n- Enter the ticker; an **\"E\" icon** appears on the chart marking earnings.\r\n- Example shown: **Apple — earnings to be announced Thursday, 30 January 2025** (recording date 28 January, so two days away).\r\n- Companies announce either **before the market opens (\"BFO\")** or **after the market closes** — Apple's example showed *after market close, 4pm Eastern Time*.\r\n- Historical earnings markers show beats/misses. Example quarter shown: analysts expected **$1.60 EPS**, company reported **$0.97 — 39% below expectations**; **revenue was above expectations by 0.44%**. Stock dropped a bit, then eventually went up again. Another marker showed earnings and revenue **both better than expected**, and the stock **initially dropped, then went up again**.\r\n\r\n**Yahoo Finance earnings calendar**\r\n- `finance.yahoo.com/calendar/earnings`\r\n- Shows all companies reporting in a chosen period; search a ticker (e.g. **MSFT**) to get its next date. Example shown: **next earnings 25 April 2022**.\r\n\r\n#### 1.4 Should you buy before or after earnings?\r\n\r\n- **\"It is totally unimportant.\"**\r\n- Reason: **a great business will have good quarters and bad quarters, good years and bad years. There is no great company that has a good quarter every quarter.**\r\n- In the short term the market is **often manipulated / illogical** — a company can beat on earnings *and* revenue and the share price still drops; it can report bad results and the price goes up. **On an earnings announcement, anything can happen — it's a coin flip.**\r\n- What matters: over the years, **revenue, profits and cash flow from operations trend upward**.\r\n- Once you *own* a company it *is* useful to read the quarterly results and the **CEO conference call transcript** to confirm the company is following its plan and roughly delivering on projected revenues and profits.\r\n\r\n#### 1.5 Where to pull financial statements\r\n\r\n**Website 1 — StockOracle (preferred; presents data very visually)**\r\n- Enter the ticker in the **top right** search (e.g. Apple = **AAPL**).\r\n- The company page shows the **next earnings date** immediately. (Example: Apple next earnings **30 April 2026**; recording made **February 2026**.)\r\n- Go to **Financials → financial statements**.\r\n- Data can be displayed as a **line chart or bar chart**. Charts show, in one view: **sales revenue**, **operating income (orange)**, **net income**, and on the right the cash flow data — **operating cash flow (orange)** and **free cash flow (dark green)**.\r\n- Scroll down for the three statements in order: **income statement → balance sheet → cash flow statement (statement of cash flows)**.\r\n- **Free / basic account = last 5 years of data. Paid account = 10 years of data.** (Visual trend charts of margins and ROE/ROIC require the paid/Pro account.)\r\n- Toggle **annual** or **quarterly**.\r\n- Additional locations for ratios: **Company Metrics** page (profitability ratios, debt ratios, efficiency ratios) — the basic free account also carries roughly the last 5 years there.\r\n- **Coverage limitation:** StockOracle covers **all US-listed stocks** only. Stocks listed in India, South Korea, Malaysia, Singapore, China are **not yet available**. **By end of 2026, Singapore and China–Hong Kong listed stocks will be added.**\r\n\r\n**Website 2 — Yahoo Finance (for non-US listings)**\r\n- Example walkthrough: search **DBS Bank → ticker D05 → Financials**. Same three statements: income statement, balance sheet, statement of cash flows.\r\n- Free version shows **4 years of data plus the last 12 months**; toggle annual/quarterly.\r\n\r\n**Website 3 — Morningstar.com (fallback for foreign stocks; free section)**\r\n- Normally a paid site, but a free section carries **ROE and ROIC**.\r\n- Example: **Ping An Insurance** (China–Hong Kong), choose the **H shares listed on the Hong Kong market → Key Metrics → Profit and Efficiency Ratios** → ROE is shown. **ROIC is not provided** (and in any case ROIC does not apply to banks or insurance companies — Ping An is both).\r\n\r\n#### 1.6 ⚠️ Two formatting traps to watch\r\n\r\n| | Yahoo Finance | StockOracle (and most other sites) |\r\n|---|---|---|\r\n| **Column order** | Data runs **right to left** (2022, 2023, 2024, 2025 reading right to left) | Data runs **left to right** (2021, 22, 23, 24, 25, then TTM) |\r\n| **Denomination** | Figures reported **in thousands** | Figures reported **in millions** (US dollars, adjusted to USD) |\r\n\r\n- Reading millions: **1,000 million = 1 billion.** So Apple's `435,617` = **435,617 million = $435.617 billion**.\r\n\r\n#### 1.7 TTM (trailing twelve months)\r\n\r\n- The last column on StockOracle is **TTM = the last 12 months = the last four quarters added together**.\r\n- **The last 12 months may or may not match the last financial year** — they don't always coincide. (For Alphabet in the example they *did* coincide, so the TTM figure equalled the last financial year figure.)\r\n- You can verify TTM yourself by clicking **Quarterly** and summing the last four quarters.\r\n- **Not all companies end their financial year in December** — Apple's financial year **ends in September**.\r\n\r\n#### 1.8 Which period to use for which statement\r\n\r\n| Statement | Measures | Use |\r\n|---|---|---|\r\n| **Income statement** | A **period of time** (how much was made over a year) | **Annual** figures, compared year to year |\r\n| **Statement of cash flows** | A **period of time** (cash in/out over 12 months) | **Annual** figures |\r\n| **Balance sheet** | A **snapshot at a point in time** (how much cash/debt right now) | **Latest quarterly** report |\r\n\r\n---\r\n\r\n### 2. The Income Statement\r\n\r\n> *\"The income statement tells you how good the company is at making money.\"* Sales generated, all costs and expenses, and the profit left for shareholders.\r\n\r\n#### 2.1 The line items in order (Adam's whiteboard shoe-company example)\r\n\r\nWorked example: a shoe company sells shoes at **$500 each**, sells **1,000 shoes a year**.\r\n\r\n| # | Line item | Also called | Example figure | Note |\r\n|---|---|---|---|---|\r\n| 1 | **Sales revenue** | Revenue | **$500,000** | $500 × 1,000 shoes |\r\n| 2 | **− Cost of goods sold** | **COGS** | **−$250,000** | $250 to make each shoe × 1,000 |\r\n| 3 | **= Gross profit** | | **$250,000** | Sales − COGS |\r\n| 4 | **− Operating expenses** | **OPEX** / overheads | **−$100,000** | Costs of running the business |\r\n| 5 | **= Operating income** | | **$150,000** | **Profit the company makes from its core business** |\r\n| 6 | **− Non-operating expenses** | | **−$50,000** | Not really related to the core business |\r\n| 7 | **+ Other (non-operating) income** | | **+$60,000** | Extra income not from the core business |\r\n| 8 | **= Net income / net profit after tax** | Net profit | **$160,000** | The bottom line |\r\n\r\n**What sits inside operating expenses (OPEX / overheads):**\r\n- Staff salary\r\n- Rental\r\n- Utilities\r\n- **Depreciation** — a **non-cash expense**. Cash does not actually go out; you already paid for the equipment years ago. Adam's example: you bought equipment five years ago (cash left five years ago) but you **depreciate it over ten years**, deducting a certain amount each year — non-cash.\r\n- **R&D** (research and development)\r\n- Marketing costs\r\n\r\n**What sits inside non-operating expenses:**\r\n- **Lawsuit / lawyer fees** (company got sued)\r\n- **Taxes**\r\n- **Restructuring costs**\r\n- **Interest payments** on borrowed money\r\n- (Elsewhere Adam adds: **inventory write-offs**)\r\n\r\n**What sits inside other / non-operating income:**\r\n- **Dividends** from a company it has invested in\r\n- **Capital gain** on selling a property or an asset\r\n- **Interest income**\r\n- **Forex gains**\r\n\r\n#### 2.2 What actually matters in the income statement\r\n\r\nAdam: *\"The only thing you've got to pay attention to in the income statement\"* — **three items**:\r\n\r\n1. **Revenue (sales revenue)**\r\n2. **Operating income**\r\n3. **Net income after tax**\r\n\r\nAll other line items are **not so important** unless you are digging for specific information.\r\n\r\n#### 2.3 The tests\r\n\r\n- **Test 1 — Sales revenue must be increasing consistently** over **at least the last 5 years**, **10 years even better**.\r\n- **Test 2 — Net profit (net income after tax) must also be increasing consistently** over the last 5 years.\r\n- **\"Increasing consistently\" does not mean it must rise every single year.** One or two down years are fine **as long as the general trend is upwards.**\r\n- **Test 3 — the escape hatch:** If **net income is *not* consistent**, that's **OK — provided operating income is increasing consistently.**\r\n\r\n**Why the escape hatch exists:** Net profit is frequently **skewed or distorted by non-operating income and expenses** — a big tax bill, a lawsuit, restructuring, a merger/acquisition cost, or a windfall gain on an investment or on selling a building. These are **one-off / non-recurring gains and losses**, **exceptional items** that are **not part of the core business**, happen once, will not recur, and can therefore be **disregarded when analyzing the business.**\r\n\r\n**Operating income** *\"reports the amount of profit from the business's ongoing operations\"* and **excludes**:\r\n- Non-operating **expenses**: taxation, interest costs, lawsuit costs, restructuring costs, inventory write-offs\r\n- Non-operating **income**: dividend income, capital gains on investments, interest income, forex gains\r\n\r\n**Worked distortion examples:**\r\n- **Pepsi** — profits rising, but one or two years had a big drop. **Nothing to do with the business** — it was **taxation changes** or **forex losses/gains** from cross-border transactions. Ignore.\r\n- **Salesforce** — recently spent a lot of money **acquiring other companies**; the acquisition cost caused a **big drop in profit last year**. Non-operating. Ignore.\r\n\r\n#### 2.4 Speculative growth companies (the exception to \"must be profitable\")\r\n\r\n- Companies named: **Sea (\"C\"/SE), Roku, Palantir, Airbnb** — revenues growing but **not profitable yet**.\r\n- Adam calls these **speculative growth companies** — **more risky** because they are not yet profitable.\r\n- **He does buy them once in a while, but with a very small allocation.**\r\n- **His requirement:** although net profit is not yet positive, **the company must already have positive free cash flow.**\r\n- Example given: **Palantir** — revenues growing, not yet profitable, but **free cash flow has already turned positive**.\r\n\r\n#### 2.5 Profit margins\r\n\r\n**Gross profit margin**\r\n\r\n```\r\nGross profit margin = Gross profit ÷ Sales revenue × 100%\r\nExample: $250,000 ÷ $500,000 = 50%\r\n```\r\n- **Meaning:** for every **$1 in sales**, the company keeps **50 cents** to pay all its other expenses.\r\n\r\n**Net profit margin**\r\n\r\n```\r\nNet profit margin = Net profit after tax ÷ Sales revenue × 100%\r\nExample: $160,000 ÷ $500,000 = 32%\r\n```\r\n- **Meaning:** for every **$1 in sales**, the company keeps **32 cents** in net profit, which it can use to **pay off debt, pay dividends, buy back shares, or reinvest**.\r\n\r\n**How to judge a margin — there is no absolute number:**\r\n1. **Comparative test:** compare the company's margins to its **closest competitors**. You want the company to have **the same or higher** margins than its closest competition. If competitors have *higher* margins, that is **not good**.\r\n2. **Trend test:** look at the margin over the **last 5 years**. You want it **increasing or consistent**. **Falling gross margins over 5 years is a bad sign** — it means the cost of making the products is rising and eroding the margin.\r\n3. **Escape hatch again:** if **net profit margin** is inconsistent because it's skewed by non-operating items, look at the **operating profit margin** instead. **As long as gross profit margin and operating margin are both consistent or growing, that's fine.**\r\n\r\n**Where to find margins on StockOracle:** **Company Metrics → scroll down** (available on the free basic account, roughly last 5 years) → **gross profit margin, operating profit margin, net profit margin**, plus the **10-year average** for comparison. Visual margin charts require the **paid account** (scroll up on the same page).\r\n\r\n#### 2.6 Worked example — Apple's income statement (StockOracle)\r\n\r\n**Line-by-line for the year shown:**\r\n\r\n| Line item | Figure |\r\n|---|---|\r\n| Sales revenue (last financial year) | **$416.161 billion** |\r\n| Sales revenue (TTM / last 12 months) | **435,617 million = $435.617 billion** |\r\n| − Cost of goods sold | ~**$220,000 million** |\r\n| = **Gross profit** | **$195,201 million** |\r\n| − Total operating expenses | **$62.151 billion** |\r\n| &nbsp;&nbsp;• of which SG&A (selling, general & administrative) | **$27.6 billion** |\r\n| &nbsp;&nbsp;• of which R&D | **$34.55 billion** |\r\n| = **Operating income** | **$114 billion** |\r\n| − Interest expense on debt (FY2023 detail) | **$3.9 billion** |\r\n| + Interest income earned on its cash pile | **$3.75 billion** |\r\n| = **Net interest expense** | **$183 million** — *\"considered very low for a company\"* |\r\n| − Other non-operating income & expenses | **$382 million** |\r\n| = **Earnings before taxes** | **$113.736 billion** |\r\n| − Income tax expense | — |\r\n| = **Net income** | **$96.995 billion** |\r\n\r\n- Note: **Apple takes on debt for taxation reasons**, and simultaneously holds a lot of cash earning bank interest — hence both an interest expense and interest income line. In the two most recent financial years these lines were **not shown / treated as zero**.\r\n\r\n**Apple's trend check (Adam reads them off the table):**\r\n- **Revenue:** 2020 **$274B** → **$365B** → **$394B** → slight drop to **$383B** → **$391B** → **$416B** → TTM **$435.617B**. Verdict: **\"pretty consistent\"** — yes.\r\n- **Operating income:** **$65B** → **$108B** → **$119B** → **$114B** (slight drop) → **$113B** → TTM **$141B**. Verdict: generally **uptrend** — yes.\r\n- **Net income:** **$57B** → **$94B** → **$99B** → **$96B** → **$93B** (two dip years) → **$112B** → **$117B**. Verdict: generally **uptrend**.\r\n- Easiest method: **just look at the StockOracle chart** set to **annual** — revenue uptrend? net income (green) uptrend? if not, is operating income (orange) going up? **\"That's all you've got to know about the income statement.\"**\r\n\r\n**Apple's margins (last five years):**\r\n- **Gross profit margin:** 43% → 44% → 46% → 46.9% → 47%. **Increasing — they are getting more and more profitable**, and current gross margins are **higher than the 10-year average**. Good sign.\r\n- **Operating margin:** 30.29% → 29.82% (slight drop, *\"no need to panic\"*) → 31.51% → 31.97% → 32%. Generally rising and **above the 10-year average**.\r\n- **Net profit margin:** 25.31% → 25.31% → 23% (dipped) → 26% → 27%. *\"Everything looks fantastic.\"*\r\n\r\n---\r\n\r\n### 3. The Balance Sheet\r\n\r\n> *\"The income statement tells us how profitable the business is. The balance sheet tells us how financially strong the business is.\"*\r\n\r\n#### 3.1 The master equation\r\n\r\n```\r\nTotal Assets − Total Liabilities = Shareholders' Equity\r\n```\r\n- **Assets** = what the company **owns**\r\n- **Liabilities** = what the company **owes**\r\n- **Shareholders' equity** = what is **left behind for the shareholders — you and me**\r\n\r\n**Always use the LATEST QUARTERLY report** for the balance sheet, because it is a **snapshot at a point in time**, not a period.\r\n\r\n#### 3.2 ASSETS\r\n\r\n**Current assets (short-term assets)** — things the company owns that it **can convert to cash easily within three months**:\r\n1. **Cash and equivalents** — cash in the bank plus **short-term bonds, commercial paper, fixed deposits** convertible to cash within three months.\r\n2. **Short-term investments** — investments the company can sell and convert to cash easily.\r\n   - *(1 + 2 are shown combined on StockOracle as **\"cash and short-term investments\"**.)*\r\n3. **Inventory**\r\n4. **Accounts receivable** (and **net accounts receivable** after deducting bad debt) — money customers owe the company that it has yet to collect.\r\n\r\n**Non-current assets (long-term assets)** — things the company owns that it **can't convert to cash easily**:\r\n- **Physical / tangible assets** (assets you can actually touch): **real estate, machinery, plant, equipment (PP&E)**\r\n- **Long-term investments**\r\n- **Intangible assets**: **goodwill, patents, the brand**\r\n\r\n> **⭐ The one asset figure Adam actually uses: \"cash and short-term investments.\"** *\"This figure is important because later when you learn to calculate the intrinsic value of a business, this is one of the things we're going to input.\"*\r\n\r\n#### 3.3 LIABILITIES\r\n\r\n**Current liabilities (short-term liabilities)** — things the company owes that it must pay **within three months** (Adam also describes them in the Pepsi walkthrough as payable **within a year**):\r\n- **Accounts payable** — owed to suppliers, owed to employees as unpaid salary. Must be paid within three months or the company may get sued.\r\n- **Taxes payable**\r\n- **⭐ Short-term debt** — borrowed money repayable within three months. **This is what matters.**\r\n- **Deferred revenue** (see §3.8) — subscription money collected upfront for services not yet delivered.\r\n- Other current liabilities\r\n\r\n**Non-current liabilities (long-term liabilities)**:\r\n- **⭐ Long-term debt** — the two most common forms:\r\n  1. **Term loans** the company has taken\r\n  2. **Bonds the company has issued** (corporate bonds)\r\n- Long-term leases, provisions for risks and charges, etc.\r\n\r\n> **⭐ The one liability figure Adam actually uses: TOTAL DEBT.**\r\n> ```\r\n> Total Debt = Short-term debt + Long-term debt\r\n> ```\r\n> **Total debt is NOT total liabilities** — total liabilities include a lot of other stuff besides debt. Total debt is used in **the debt ratios** and in **the intrinsic value calculation**.\r\n\r\n**How much debt is too much? It depends entirely on how much the company earns.**\r\n- Company earning **$1 billion/year** with **$1 billion of debt** → fine, it can repay all debt in one year.\r\n- Company earning **$1 billion/year** with **$20 billion of debt** → **it will take 20 years to repay. That is too much debt.**\r\n\r\n#### 3.4 SHAREHOLDERS' EQUITY — three main parts\r\n\r\n1. **Common stock + additional paid-up capital**\r\n   - The money the company raised when it **first sold shares to the public, usually at the IPO** (initial public offering).\r\n   - **Is it important? \"Not really.\"** General knowledge only.\r\n   - **Key insight:** when you and I buy Apple stock today, **the money does NOT go into the company** — it goes to the shareholder who sold you the shares. Money only enters the company when the company **issues new shares**. That is **very rare for US companies like Apple and Microsoft** (they already have so much cash they don't need to raise any) but **very common for REITs**.\r\n\r\n2. **Retained earnings** — *\"this is more important.\"*\r\n   - Profits made over the years that the company **did not pay out as dividends** and kept inside the business — **accumulated savings from the profits**, which all belong to the shareholders.\r\n   - **A good business shows a lot of retained earnings accumulated over the years.**\r\n\r\n3. **Treasury stock** — **always a negative; it always reduces shareholders' equity.**\r\n   - Created when a company **buys back its own shares** and holds them.\r\n   - Bought-back shares held in treasury **no longer receive dividends and have no voting rights — they are kept in cold storage.**\r\n   - **Why buybacks are generally good:** fewer shares in the market → **each remaining share becomes worth more**.\r\n   - **But buybacks are only good if:** (a) the company buys back **when the shares are cheap / undervalued**, and (b) the company is **already profitable**.\r\n   - **Why the reduction in equity is good, not bad:** with less shareholders' equity, the company is **making profits using less equity**, and you are **sharing with fewer shareholders**.\r\n\r\n4. *(Also on the statement — general knowledge only)* **Accumulated other comprehensive income** — any **unrealized loss or profit** from the company's investments or from **foreign exchange**. Example: Pepsi buys other companies whose value falls but Pepsi doesn't sell → unrealized loss recorded here; or Pepsi holds a lot of cash overseas and the **US dollar strengthens against foreign currencies** → unrealized forex loss recorded here. *\"Is this really important for you as an investor? No, it's really not important.\"*\r\n\r\n#### 3.5 ⚠️ Negative shareholders' equity is NOT automatically bad\r\n\r\n- Normally you want equity **positive** (assets > liabilities). Negative equity normally means liabilities exceed assets — **generally not good**.\r\n- **THE EXCEPTION:** companies like **Domino's Pizza, McDonald's, and Yum Brands** have **negative shareholders' equity** — **not** because they are losing money. On the contrary, **they are mak
