/* ---------- option chain ---------- */
function pool(items, worker, width){
  width = width||5;
  var i=0, out=[];
  function next(){
    if(i>=items.length) return Promise.resolve();
    var idx=i++;
    return Promise.resolve(worker(items[idx])).catch(function(){}).then(next);
  }
  var runners=[]; for(var w=0;w<Math.min(width,items.length);w++) runners.push(next());
  return Promise.all(runners);
}
function fmtExp(d){
  if(!d||d.length!==8) return d||'';
  var mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return mo[parseInt(d.slice(4,6),10)-1]+' '+parseInt(d.slice(6,8),10)+" '"+d.slice(2,4);
}
function dte(d){
  if(!d||d.length!==8) return '';
  var t=new Date(d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6,8)+'T16:00:00');
  return Math.max(0, Math.round((t-Date.now())/86400000))+'d';
}
var CHAIN_SEQ=0,CHAIN_DATA={},chainAwaitSpot='';
function loadChainFor(inst){
  if(!dataUp() || !inst){ return; }
  var chainSeq=++CHAIN_SEQ,chainBook=S.bookId;
  S.builder.underConid = inst.conid; S.builder.underSym = inst.symbol;
  if(typeof freeRemember==='function') freeRemember(inst.symbol);
  chainBusy = true; setStatus('loading chain...'); render();
  var pp = PARAMS[inst.conid] ? Promise.resolve(PARAMS[inst.conid])
    : callIB('get_option_parameters', {underlying_contract_id:Number(inst.conid),
                                       symbol:inst.symbol}).then(function(p){ PARAMS[inst.conid]=p; return p; });
  return pp.then(function(p){
    if(chainSeq!==CHAIN_SEQ||S.bookId!==chainBook||S.builder.underConid!==inst.conid)return;
    var exps = (p.expirations||[]).filter(function(e){ return !e.trading_class || e.trading_class.indexOf('2')!==0; });
    if(!exps.length){ throw {code:'no_expirations'}; }
    var keep = S.builder.expId && exps.filter(function(e){return e.id===S.builder.expId;}).length;
    if(!keep){
      var def = exps.filter(function(e){ return e.id===p.current_expiration; })[0] || exps.filter(function(e){return e.regular;})[0] || exps[0];
      S.builder.expId = def.id; S.builder.expDate = def.date;
    }
    return loadStrikes();
  }).catch(function(e){
    if(chainSeq!==CHAIN_SEQ||S.bookId!==chainBook||S.builder.underConid!==inst.conid)return;
    chainBusy=false;
    var extra='';
    if(LOCAL && !usingFree() && typeof GW_PAPER!=='undefined' && GW_PAPER)
      extra = ' Your gateway is logged into a paper username, and paper logins do not inherit '
            + 'market data subscriptions. In Client Portal go to Settings, Account Configuration, '
            + 'Paper Trading Account, and turn on "Share real-time market data" for this paper user. '
            + 'Options need the OPRA subscription on the funded account for that sharing to give you chains.';
    warn('Could not load the option chain for '+inst.symbol+'. '+errText(e)+extra);
    setStatus('chain failed'); render();
  });
}
function loadStrikes(){
  var b2=S.builder, spot=null, uq=Q[b2.underConid],expId=b2.expId,chainBook=S.bookId,chainSeq=++CHAIN_SEQ;
  if(uq) spot = uq.last!=null?uq.last:uq.mid;
  var span = Math.max(2, Math.min(15, n(b2.span)||6));
  var input = {expiration_id:b2.expId, symbol:b2.underSym};
  if(spot){ var w = Math.max(2, spot*0.012)*span; input.min_strike=Math.max(0, Math.round((spot-w)*100)/100); input.max_strike=Math.round((spot+w)*100)/100; }
  chainBusy=true; setStatus('loading strikes...'); render();
  var cached=CHAIN_DATA[JSON.stringify(input)];
  return (cached&&Date.now()-cached.at<300000?Promise.resolve(cached.data):callIB('get_option_data', input)).then(function(d){
    CHAIN_DATA[JSON.stringify(input)]={at:Date.now(),data:d};
    if(Object.keys(CHAIN_DATA).length>100)delete CHAIN_DATA[Object.keys(CHAIN_DATA)[0]];
    if(chainSeq!==CHAIN_SEQ||S.bookId!==chainBook||S.builder.expId!==expId)return;
    CH[expId] = d;
    var rows = (d.contracts||[]);
    if(spot){
      rows = rows.slice().sort(function(a,c){ return Math.abs(parseFloat(a.strike)-spot)-Math.abs(parseFloat(c.strike)-spot); }).slice(0, span*2+1);
      rows.sort(function(a,c){ return parseFloat(a.strike)-parseFloat(c.strike); });
      CH[b2.expId] = {currency:d.currency, exchange:d.exchange, contracts:rows};
    }
    if(!spot){CH[expId]={currency:d.currency,exchange:d.exchange,contracts:rows.slice(0,span*2+1)};chainAwaitSpot=expId;}
    else chainAwaitSpot='';
    chainBusy=false; setStatus('chain loaded'); render();
    return chainQuotes();
  }).catch(function(e){
    if(chainSeq!==CHAIN_SEQ||S.bookId!==chainBook||S.builder.expId!==expId)return;
    chainBusy=false; setStatus('chain failed');
    warn('Could not load strikes ('+((e&&e.code)||'error')+').'); render();
  });
}
function chainQuotes(){
  var d = CH[S.builder.expId]; if(!d) return Promise.resolve();
  if(usingTws()) return feedSync(false).then(function(){ setStatus('Chain subscribed; prices update continuously'); renderLive(); });
  var ex = d.exchange||'SMART', ids=[];
  (d.contracts||[]).forEach(function(r){ ids.push({conid:r.call_contract_id, exch:ex, secType:'OPT'}); ids.push({conid:r.put_contract_id, exch:ex, secType:'OPT'}); });
  setStatus('pricing '+ids.length+' contracts...');
  return pool(ids, function(i){ return fetchQuote(i); }, 6).then(function(){
    setStatus('chain priced '+new Date().toLocaleTimeString()); render();
  });
}
function strikesNearSpot(){
  var d=CH[S.builder.expId]; if(!d) return null;
  var uq=Q[S.builder.underConid]; if(!uq) return null;
  var spot = uq.mark!=null?uq.mark:(uq.last!=null?uq.last:uq.mid);
  if(!(spot>0)) return null;
  var rows=(d.contracts||[]).slice().sort(function(a,c){ return parseFloat(a.strike)-parseFloat(c.strike); });
  var atmIdx=0, best=Infinity;
  rows.forEach(function(r,i){ var dd=Math.abs(parseFloat(r.strike)-spot); if(dd<best){best=dd;atmIdx=i;} });
  return {rows:rows, atm:atmIdx, spot:spot};
}
function legFrom(row, right, side){
  var d=CH[S.builder.expId];
  var cid = right==='C'?row.call_contract_id:row.put_contract_id;
  if(!cid) return null;
  return {conid:cid, symbol:(right==='C'?row.call_description:row.put_description)||'',
          root:S.builder.underSym, secType:'OPT', mult:100, exch:(d&&d.exchange)||'SMART',
          right:right, strike:parseFloat(row.strike), expiry:S.builder.expDate,
          side:side, ratio:1, underConid:S.builder.underConid};
}
function applyPreset(kind){
  var ctx=strikesNearSpot();
  if(!ctx){ warn('Load a chain with quotes first - the presets need a spot price to centre on.'); return; }
  var w = Math.max(1, Math.round(n(S.builder.width)||1));
  var rows=ctx.rows, i=ctx.atm, legs=[];
  function row(off){ return rows[i+off]||null; }
  function push(off, right, side){
    var r=row(off); if(!r) return false;
    var l=legFrom(r, right, side); if(!l) return false;
    legs.push(l); return true;
  }
  var ok=true;
  if(kind==='callvert'){ ok = push(0,'C','BUY') && push(w,'C','SELL'); }
  else if(kind==='putvert'){ ok = push(0,'P','BUY') && push(-w,'P','SELL'); }
  else if(kind==='straddle'){ ok = push(0,'C','BUY') && push(0,'P','BUY'); }
  else if(kind==='strangle'){ ok = push(w,'C','BUY') && push(-w,'P','BUY'); }
  else if(kind==='condor'){ ok = push(w,'C','SELL') && push(2*w,'C','BUY') && push(-w,'P','SELL') && push(-2*w,'P','BUY'); }
  else if(kind==='fly'){ ok = push(-w,'C','BUY') && push(0,'C','SELL') && push(0,'C','SELL') && push(w,'C','BUY');
    if(ok){ legs=[legs[0], legs[1], legs[3]]; legs[1].ratio=2; } }
  else if(kind==='cover'){
    var p=posOf(S.builder.underConid);
    if(!p || p.qty<100){ warn('A covered call needs at least 100 shares of '+S.builder.underSym+' first.'); return; }
    ok = push(w,'C','SELL');
  }
  if(!ok || !legs.length){ warn('Not enough strikes loaded either side of the money - widen the strike range.'); return; }
  if(legs.length>4){ warn('That preset needs more than four legs.'); return; }
  S.builder.legs = legs;
  warn(''); render();
}
function addLeg(conid, right, side, strike, desc){
  var b2=S.builder, d=CH[b2.expId];
  if(b2.legs.length>=4){ warn('Four legs is the maximum - remove one first.'); return; }
  for(var i=0;i<b2.legs.length;i++) if(b2.legs[i].conid===conid){ warn('That contract is already a leg. Change its side or ratio instead.'); return; }
  b2.legs.push({conid:conid, symbol:desc, root:b2.underSym, secType:'OPT', mult:100, exch:(d&&d.exchange)||'SMART',
    right:right, strike:parseFloat(strike), expiry:b2.expDate, side:side, ratio:1, underConid:b2.underConid});
  warn(''); render();
}

function greekLine(){
  var legs=S.builder.legs;
  if(!legs.length) return '';
  var ng=netGreeks(legs);
  var bits=[];
  if(ng){
    bits.push('&Delta; '+ng.g.delta.toFixed(1)+' shares');
    bits.push('&Theta; '+money(ng.g.theta)+' a day');
    bits.push('vega '+money(ng.g.vega)+' per point of IV');
    if(ng.modelled) bits.push('<span class="dim">greeks computed, not quoted</span>');
  }
  var be = breakevens(legs);
  if(be && be.length) bits.push('break-even '+be.map(px).join(' and '));
  return bits.join(' &middot; ');
}
/* where the strategy makes nothing at expiry, scanned across strikes */
function breakevens(legs){
  var nat=comboNet(legs,false,1); if(!nat) return null;
  var ks=legs.map(function(l){ return l.strike; });
  var lo=Math.max(0.01, Math.min.apply(null,ks)*0.5), hi=Math.max.apply(null,ks)*1.5;
  var prev=null, out=[], steps=600;
  for(var i=0;i<=steps;i++){
    var Sx=lo+(hi-lo)*i/steps, pnl=-nat.net;
    for(var j=0;j<legs.length;j++){
      var l=legs[j];
      var intr = l.right==='C' ? Math.max(0,Sx-l.strike) : Math.max(0,l.strike-Sx);
      pnl += (l.side==='BUY'?1:-1)*l.ratio*intr;
    }
    if(prev!==null && ((prev<0&&pnl>=0)||(prev>0&&pnl<=0))) out.push(Math.round(Sx*100)/100);
    prev=pnl;
    if(out.length>=4) break;
  }
  return out;
}
function netLine(){
  var legs=S.builder.legs;
  if(!legs.length) return '';
  var nat=comboNet(legs,false,1), mid=comboMid(legs);
  var netTxt = nat ? (nat.net>=0 ? 'debit '+money(nat.net)+' per spread' : 'credit '+money(-nat.net)+' per spread') : 'no two-sided market';
  var midTxt = mid!=null ? (mid>=0?'debit '+money(mid):'credit '+money(-mid)) : '--';
  var risk = riskLine(legs);
  return 'At the touch: <b>'+netTxt+'</b> &middot; mid '+midTxt+(risk?' &middot; '+risk:'');
}
function riskLine(legs){
  if(legs.length!==2) return '';
  var a=legs[0], c=legs[1];
  if(a.right!==c.right || a.expiry!==c.expiry) return '';
  if(a.side===c.side || a.ratio!==c.ratio) return '';
  var nat=comboNet(legs,false,1); if(!nat) return '';
  var width=Math.abs(a.strike-c.strike)*100*a.ratio;
  var debit=nat.net*100*a.ratio;
  if(debit>0) return 'max risk '+money(debit)+', max gain '+money(width-debit);
  return 'max gain '+money(-debit)+', max risk '+money(width+debit);
}

   +'<b>Naked short options</b> &mdash; the greater of 20% of the underlying less the out-of-the-money amount, or the 10% floor, plus the premium.<br>'
   +'<b>Futures</b> &mdash; the per-contract initial and maintenance margin IBKR publishes, not a percentage of notional. The table above is editable, since IBKR rebuilds those numbers daily from the CME performance-bond minimums.<br><br>'
   +'<b>Available funds</b> = net liquidation minus initial margin, and new orders draw on it. <b>Excess liquidity</b> = net liquidation minus maintenance margin; when it turns negative IBKR starts liquidating, whereas this page only warns you.'

}

if(LOCAL && navigator.locks){
  accountWriterLocked=await new Promise(function(resolve){
    navigator.locks.request('paperAccount.writer',{ifAvailable:true},function(lock){
      resolve(!!lock);
      if(lock)return new Promise(function(){});
    }).catch(function(){resolve(false);});
  });
  if(!accountWriterLocked){warn('Paper Desk is already open in another tab. Close that tab, then reload this one. No account changes or execution started.');return;}
}
if(LOCAL){
  try { var saved = localStorage.getItem('paperAccount'); if(saved){ var pS=JSON.parse(saved); for(var _k in pS) S[_k]=pS[_k]; } }
  catch(e){}
}
// One-time migration to the requested IB Gateway workstation mode; never alter balances.
if(!S.settings.gatewayStreamVersion){
  S.settings.previousDataSource={mode:S.settings.dataSource,provider:S.settings.provider,optProvider:S.settings.optProvider};
  S.settings.dataSource='free';S.settings.provider='tws';S.settings.optProvider='';
  S.settings.gatewayStreamVersion=1;
}
S.settings.auto=true;
bookInit();          /* after the saved state is merged in, before anything reads it */
if(LOCAL && saved && window.PaperTrading){
  var ownerBefore=S;
  try{
    var ownerChange=window.PaperTrading.requestedAccountRepair(S,Date.now());
    if(ownerChange){
      if(!accountWriterLocked)throw Error('Use localhost in a browser supporting Web Locks for the safe account update');
      if(localStorage.getItem('paperAccount')!==saved)throw Error('Account changed in another tab; close other tabs and reload');
      var ownerBackup='paperAccount.backup.'+ownerChange.report.id;
      // Preserve prior backups as well as this exact pre-update account.
      var previousOwnerBackup=localStorage.getItem(ownerBackup);
      if(previousOwnerBackup!==null && previousOwnerBackup!==saved)ownerBackup+='.'+crypto.randomUUID();
      if(localStorage.getItem(ownerBackup)===null)localStorage.setItem(ownerBackup,saved);
      ownerChange.report.backupKey=ownerBackup;
      S=ownerChange.state;
      snapshotEquity(true);bookSync();
      localStorage.setItem('paperAccount',JSON.stringify(S));
    }
  }catch(e){
    S=ownerBefore;
    warn('Account update NOT applied. '+(e.message||'Backup/save failed')+'. No execution started; resolve storage or account conflict and reload.');
    return;
  }
}
sel=S.lastSelected || S.watchlist[0] || S.positions.find(function(p){return p.qty;}) || null;
if(S.lastDay !== today()){
  S.lastDay = today();
  for(var _i=0;_i<S.positions.length;_i++) S.positions[_i].openedToday=false;
}
function connect(){
  DIAG.cap='checking'; DIAG.storage='checking'; DIAG.lastErr=''; renderDiag();
  if(LOCAL){
    DIAG.storage = 'browser storage';
    DIAG.server = 'IBKR Client Portal Gateway';
    feedStop();
    FREE.provider = S.settings.provider || 'tws';
    FREE.key = S.settings.providerKey || '';
    freeProviders().then(function(){ renderDiag(); if(tab==='acct')render(); }, function(){});
    if(usingTws()){
      DIAG.cap='IB Gateway';DIAG.server='';startAuto();
      return feedSync(true).then(function(){renderLive();});
    }
    var mode = S.settings.dataSource || 'auto';
    if(mode==='free'){
      DIAG.gwUp = false; DIAG.cap='free provider'; DIAG.server='';
      startAuto(); renderDiag(); return refresh();
    }
    return gwStatus().then(function(st){
      DIAG.gwUp = !!st.ok;
      DIAG.cap = st.ok ? 'ready' : ('gateway: '+st.why);
      DIAG.tools = st.accounts||0;
      if(st.ok){ startStream(); startAuto(); renderDiag(); return refresh(); }
      if(mode==='auto'){
        DIAG.fellBack = true; DIAG.cap = 'free provider';
        say('IBKR gateway unavailable - falling back to '+FREE.provider+' (delayed data).');
        startAuto(); renderDiag(); return refresh();
      }
      warn(st.msg); startAuto(); renderDiag(); return render();
    });
  }
  if(typeof claude==='undefined' || typeof claude.use!=='function'){
    DIAG.cap='unavailable in this view'; DIAG.storage='unavailable in this view';
    warn('This view does not grant the page its runtime capabilities, so there are no quotes and nothing is saved. Open the artifact from its own URL on claude.ai (or the artifacts gallery) rather than an inline preview.');
    render(); return Promise.resolve();
  }
  return Promise.all([claude.use('mcp'), claude.use('artifact')]).then(function(r){
    mcp=r[0]; artifact=r[1];
    DIAG.storage = artifact ? 'ready' : 'unavailable (changes will not persist)';
    if(!mcp){
      DIAG.cap='unavailable';
      warn('This view has no connector access, so IBKR quotes are unavailable. Open the artifact from claude.ai with the Interactive Brokers connector connected.');
      render(); return;
    }
    DIAG.cap='ready';
    return mcp.listTools().then(function(lt){
      var servers = lt.servers||[];
      DIAG.servers = servers.map(function(s){ return s.server; });
      var hit = servers.filter(function(s){ return /interactive|ibkr/i.test(s.server); })[0];
      if(!hit) hit = servers.filter(function(s){ return (s.tools||[]).some(function(t){ return t.name==='get_price_snapshot'; }); })[0];
      if(hit){ server=hit.server; DIAG.server=hit.server; DIAG.tools=(hit.tools||[]).length; }
      else {
        DIAG.server='';
        warn('No Interactive Brokers connector is visible to this page'+(servers.length?(' - it can see: '+DIAG.servers.join(', ')):'')+'. Connect IBKR in claude.ai, then press Reconnect.');
      }
      startAuto();
      renderDiag();
      return hit ? refresh() : render();
    }, function(e){
      DIAG.lastErr=(e&&e.code)||'listTools failed'; DIAG.lastTool='listTools';
      startAuto(); renderDiag(); return refresh();
    });
  }, function(e){
    DIAG.cap='init failed ('+((e&&e.code)||'error')+')';
    warn('Could not start the page capabilities. Reload the artifact, then press Reconnect.');
    render();
  });
}
if(window.GunsUI)guns=window.GunsUI.create({
  state:function(){return S;},quotes:function(){return Q;},account:function(){return acct();},
  position:posOf,ready:quoteReady,usingTws:usingTws,now:Date.now,uid:uid,today:today,
  commission:commission,marketPrice:marketablePrice,fill:applyFill,save:save,sync:syncSubs,snapshot:function(){snapshotEquity(true);},
  render:render,tab:function(){return tab;},esc:esc,px:px,money:money,cancel:cancelOrder,
  mode:bookMode,deskPanel:function(){return tradingUI?tradingUI.panel():'';},
  deskLevels:function(inst){return tradingUI?tradingUI.levels(inst):{};},deskLive:function(){if(tradingUI)tradingUI.live();},
  trackingView:function(b){return tradingUI?tradingUI.tracking(b):'';},
  onClosed:function(b){if(trading)trading.onGunsClose(b);}
});
if(window.PaperTrading){
  trading=window.PaperTrading.create({state:function(){return S;},mode:bookMode,quotes:function(){return Q;},
    account:acct,position:posOf,ready:quoteReady,usingTws:usingTws,now:Date.now,uid:uid,today:today,
    commission:commission,fill:applyFill,save:save,sync:syncSubs});
  tradingUI=window.PaperTradingUI({state:function(){return S;},mode:bookMode,quotes:function(){return Q;},
    context:function(){return tab==='guns'?guns?.context():{inst:sel,frame:trading.settings().timeframe};},
    schedule:async function(){var r=await fetch('/data/guns_schedule?provider=tws',{signal:AbortSignal.timeout(20000)});if(!r.ok)throw Error('Session schedule unavailable');var d=await r.json();if(d.error)throw Error(d.error);return d;},
    bars:async function(inst){var r=await fetch('/data/guns_bars?provider=tws&symbol='+encodeURIComponent(inst.symbol),{signal:AbortSignal.timeout(40000)});if(!r.ok)throw Error('Chart HTTP '+r.status);var d=await r.json();if(d.error)throw Error(d.error);return d;},
    gunsJournal:function(){return guns?guns.execution.book().journal:[];},save:save,render:render,warn:warn,cancel:cancelOrder,esc:esc,money:money,px:px},trading);
}
if(window.VMIUI)vmi=window.VMIUI.create({
  active:function(){return tab==='vmi';},
  books:function(){return S.books.map(function(b){return {id:b.id,name:b.name};});},
  snapshot:function(id){
    var b=S.books.find(function(x){return x.id===id;});if(!b)return null;
    var d=id===S.bookId?S:b.data;
    function rows(list,keys){return (Array.isArray(list)?list:[]).map(function(row){var out={};keys.forEach(function(k){if(row[k]===null||['string','number','boolean'].includes(typeof row[k]))out[k]=row[k];});return out;});}
    return {bookId:id,name:b.name,cash:d.cash,realized:d.realized,
      positions:rows(d.positions,['conid','symbol','secType','qty','mult','avgCost','currency']),
      orders:rows(d.orders,['id','symbol','conid','side','qty','type','limit','stop','status']),
      trades:rows(d.trades,['id','date','time','symbol','conid','side','qty','price','fee','realized']),
      equity:rows(d.equity,['date','time','value','netLiq','cash']),
      cashflows:rows(d.cashflows,['date','time','amount','type'])};
  },
  quote:async function(symbol){var r=await fetch('/data/quote?provider=tws&symbol='+encodeURIComponent(symbol),{signal:AbortSignal.timeout(25000)});if(!r.ok)throw Error('Quote HTTP '+r.status);var d=await r.json();if(d.error)throw Error(d.error);return d;}
});
render();
connect();
})();
</script>
</body></html>
