ears**; a **narrow-moat** company for **at least 10 years**. And moats **never erode overnight — it takes years**, which means you always have plenty of time to get out.\r\n\r\n**1a. Disruption by new technology or competition** — the company can no longer generate increasing revenue, profits and free cash flow.\r\n- **Singapore Press Holdings** — a monopoly in Singapore media, disrupted by social media, Google and Facebook. He knew first-hand: he used to advertise **100%** in the Singapore newspapers, watched his ad effectiveness diminish as readers moved online, and shifted his **entire ad spend to Google and Facebook** — as did many other advertisers. Share price collapsed; shares eventually delisted.\r\n- **Nokia** — **90% market share** in the 1990s. Apple launched the first touchscreen iPhone; Samsung copied; BlackBerry arrived. Nokia's **strategic blunder**: phones cost $100–$200 at the time, and when Apple priced at ~$500 Nokia declared nobody would pay that and kept making $200 phones. Market share fell from **90% to ~1%**; share price fell from **$42 to ~$2**. The tell came early — *people around him started swapping Nokias for iPhones and BlackBerrys*, **before** the bad financials and **before** the price collapse. Anyone holding at $42 had years to exit.\r\n- **Kodak** — market leader in film. When the digital camera appeared, and then phones that took pictures with no film, the outcome was obvious. Kodak's price was still high and it was still making a lot of money for years, because adoption was gradual — again, **lots of time to get out**.\r\n- **Intel** — every computer once carried \"Intel inside\". Then Apple moved to its own chips, others followed, and the Intel-inside badge disappeared from more and more machines. Again visible **before** the price collapsed.\r\n- **Blockbuster Video** — a US monopoly for video rental (rent a cassette, return in three days or get fined). Netflix streaming arrived; the shift took many years and the demise was visible in slow motion.\r\n\r\n**1b. Change in consumer preferences.**\r\n- **Kraft Heinz** — canned baked beans, Heinz ketchup, Kraft cheese did very well in an era of processed food. As consumers became health-conscious and shifted to fresh food, the dominant food moat began to erode.\r\n\r\n**How to detect moat erosion — the signals:**\r\n1. **Best signal: observe consumers, including yourself.** Are the people around you — and are *you* — no longer buying that product or service? *\"The day I stop eating McDonald's is the day I'm going to sell the stock.\"* (He eats there ~3 times a week for breakfast.) This is precisely why you must own businesses **where you are the customer** — he does **not** own **Starbucks** despite it possibly being a great company, because he doesn't drink Starbucks (he drinks Singapore local coffee at **$1.50** and refuses to pay more than **$3** for coffee), so he has no informational edge. He does own **McDonald's, Yum Brands, Hershey's** because he consumes them.\r\n2. **Profit margins decline consistently for at least 2–3 years** — and the decline is due to **lower prices**, i.e. the company is forced to **discount** to attract customers → it is **losing pricing power**. A great business doesn't need to discount to keep market share. Forced discounting = heavy competition = deteriorating business.\r\n3. **Margins contracting from higher cost of sales.**\r\n4. **Declining market share** — one quarter is fine, three quarters is fine, one year maybe okay, but **losing market share for two straight years** is a sign the business has changed.\r\n5. **Customers visibly switching to competitor brands.**\r\n\r\n**His own real case — Manulife US REIT (bought ~2018).** A US office REIT, a great business when bought. Then:\r\n- COVID-19 (2020) moved people to work-from-home, and **the behaviour did not revert** after the pandemic (hybrid work stuck).\r\n- Occupancy fell from **95% to 30%**, with no sign of returning; revenue and profits dropped and could not get back to pre-pandemic levels.\r\n- The Fed then raised rates **very fast in 2022**. With rents too low, the properties were **devalued**, which pushed up the **debt-to-asset / gearing ratio**.\r\n- Gearing **exceeded 50%** → **breach of financial covenants** → banks could withdraw loans → risk of bankruptcy.\r\n- The business model had changed permanently and the balance sheet was no longer strong, so **he sold at a loss**. Because it was only a **small percentage of his dividend portfolio**, the year was still positive overall.\r\n\r\n---\r\n\r\n#### SELL RULE 2 — You made a mistake in your initial analysis\r\n\r\nEither the company isn't as great as you thought, or it isn't as cheap as you thought because you were **too optimistic in your valuation**.\r\n\r\n**His own case — Disney.** Bought as a **turnaround**: Disney had grown revenue and profits consistently, then transitioned from cable TV networks (a sunset industry, as viewers moved to streaming) to **Disney+**. During the transition, **profits dropped more than 60%** because streaming wasn't yet profitable and cable was in decline. He judged it cheap and expected profits to return to past highs.\r\nAfter holding **~2 years** and doing more research he concluded:\r\n- Streaming had become far more competitive (Amazon Prime, Apple TV, Netflix).\r\n- Disney's created content **was not as great as before**.\r\n- Content requires **millions of dollars per title** and is **hit-or-miss** — good movies make a lot, bad movies lose millions.\r\n- Verdict: **not a predictable business** — not the kind he wants to own.\r\n**Action taken:** sold **all** shares, \"took the loss like a man\", and **immediately reinvested the proceeds into other great, undervalued businesses** to make back the loss.\r\n\r\n---\r\n\r\n#### SELL RULE 3 — Management does not act in the best interest of shareholders\r\n\r\nRed flags in this category:\r\n1. Management **buys back shares at an all-time high / when overpriced**.\r\n2. Management **buys back shares when the company is not doing well** (rather than investing in the business).\r\n3. The company **issues new shares to raise capital when it already has plenty of undeployed cash** on the balance sheet.\r\n\r\nAny of these → red flag → sell. *(He notes this has never happened to him — yet.)*\r\n\r\n---\r\n\r\n#### SELL RULE 4 — Still a great company, but grossly overvalued\r\n\r\n**The threshold:**\r\n- **Overvalued by 10%, 20% or 30% → HOLD.** A great company's intrinsic value keeps rising and eventually catches up to the price.\r\n- **Overvalued by MORE THAN 50–100% above intrinsic value → start reducing the position.**\r\n\r\n**How to sell:** never all at once — **sell in tranches**, because you can no more pick the top than you can pick the bottom. Sell roughly a third, then half, then the rest; or, if selling 100 shares, sell **25 shares, then another 25 a few days later, then 25 more** — averaging out the position. Reinvest the proceeds into another business just as great but at a more reasonable valuation.\r\n- *Illustration*: if McDonald's intrinsic value is **$250** and the price runs to **$500** (100% overpriced), start selling — even though McDonald's is still a great company.\r\n\r\n**Supporting technical trigger — the parabolic move.** When a stock is extremely overvalued you will usually also see the price go **parabolic and far from its moving averages**:\r\n- A **sustainable uptrend** advances at roughly a **45-degree angle**, waving up and down, staying near its moving averages — in this context, the **20 EMA** is normally closest to price in an uptrend (and price stays near the 50 MA too).\r\n- A **parabolic move** is a **90-degree**, vertical advance with **very long green candles**, driven by **panic buying** — everyone rushing in. This is usually **the end of the uptrend**, and it's where late retail investors (who heard about the stock from a neighbour or friend) buy right at the top before the collapse.\r\n- Same pattern applies to the **overall index**. Buffett's line, as quoted: a bull market is like sex — it feels best just before it ends.\r\n- **Rule:** if a stock he owns shifts from a 45-degree advance to a **90-degree advance with big long candles, especially while significantly overvalued, he exits** — because it usually collapses.\r\n\r\n**His own case — Meituan (Hong Kong).**\r\n- Bought at about **$70/share**; his calculated intrinsic value was **$220**.\r\n- Price rose through intrinsic value; he held while it was only modestly overvalued.\r\n- It then went **parabolic (90 degrees)**. At **~$330** — i.e. **50% above the $220 intrinsic value** — he sold **one quarter** of his shares.\r\n- It dipped, then went parabolic again to **~$440** — **100% overvalued** — and he **sold all remaining shares** (the remaining half sold above $440).\r\n- Outcome: about a **400% return**. Trade alerts were sent to his ~**3,000** UIP subscribers (via Telegram then; Discord now). He also sold **Ping An Insurance** at the time.\r\n- The stock later collapsed. **He did not buy it back**, because **new Chinese government regulations totally changed Meituan's business model** — it was no longer a great business. \"No matter how low it goes, I ain't buying it back.\"\r\n\r\n**Holding-period nuance by stock type:**\r\n- **Secular / large-cap growth stocks** (Meta, Microsoft, Amazon, Nvidia) — he **very rarely sells**; holds many years unless ridiculously overpriced, because they keep compounding.\r\n- **Defensive companies** — also very rarely sold, unless they get crazy expensive.\r\n- **Deep cyclical stocks** — he **very rarely buys** them, and when he does he does **not hold them long** (see Sell Rule 4b).\r\n\r\n**SELL RULE 4b — the cyclical-stock exit (price-to-book band method).**\r\nDeep cyclicals = **banks, insurance, industrial companies, real-estate companies / property developers, shipping companies, commodity companies**. Their profits and share prices swing with the economic cycle — booming economy = big profits, weak economy = small profits or losses.\r\n\r\nHe only buys them **near or at the bottom of the cycle**, as a **medium-term trade**, and exits **near the top of the cycle**. The tool is the **price-to-book (P/B) ratio** — specifically for **banks, insurance companies and real-estate companies**. On TradingView, add the **price-to-book ratio indicator**.\r\n\r\n*Worked example — JP Morgan, 10-year P/B history:*\r\n1. **10-year high P/B = 1.89**\r\n2. **10-year low P/B = 0.64**\r\n3. **Midpoint = (1.89 + 0.64) / 2 = 1.26** → the median line.\r\n   - **Above 1.26 = getting expensive. Below 1.26 = getting cheap. He buys below the midline.**\r\n4. **Sell level = (10-year high + median) / 2 = (1.89 + 1.26) / 2 = 1.56** → the midpoint between the 10-year high and the 10-year median. **When P/B reaches ~1.56, that's a sell.**\r\n- Accepting imperfection: after you sell it can still go higher — you can never sell exactly at the top.\r\n\r\n**Caveat to 4b — Singapore bank stocks.** He owns a lot of Singapore bank stocks and, although they are cyclical, he **never sells them**. Reason: he buys them **not as medium-term trades but for dividends**, entering when yields are very low-priced/high-yield at about **5–6% dividend yield**, locking in a **tax-free** yield and holding for passive income year after year. **US banks** he *will* sell on the cycle, because their dividends are too small to justify holding.\r\n\r\n---\r\n\r\n#### SELL RULE 5 — You found a better opportunity and need the cash to fund it\r\n\r\nYou own a great company, but you find another stock that is **just as great or better** and/or **more undervalued**. If you **don't have spare cash**, there is nothing wrong with **swapping** — selling the first to buy the second, or selling **half** of the first and using the proceeds for the second.\r\n**Condition:** this only applies when you lack the cash. **If you have extra cash, hold the first and buy the second as well.**\r\n\r\n---\r\n\r\n#### SELL RULE 6 — You need the cash for personal expenses\r\n\r\nLegitimate: funding a child's college, buying a car, renovating the house.\r\n\r\n**Framing via founders:** when **Jeff Bezos** sells Amazon shares or **Mark Zuckerberg** sells Meta shares, it usually does **not** mean they are bearish — Bezos funds his rocket venture, Zuckerberg funds his charity. Founder selling ≠ bad company.\r\n\r\n**The attached money-management rule:** only invest money you **do not need in the short term**. Money you need in the **next one or two years must not go into the stock market** — put it in **short-term bonds that mature when you need the money, money-market funds, or a fixed/time deposit**. In the short term markets can drop 50% or rise 50%; the worst outcome is being **forced to sell great companies at a 50–60% discount** to raise cash you needed.\r\n**Ideal timing:** raise personal-expense cash by selling **when stocks are overvalued / at an all-time high**, not when you're forced to.\r\n\r\n---\r\n\r\n### PART 6 — REASONS *NOT* TO SELL (INVALID TRIGGERS)\r\n\r\n#### 6.1 The seven bad reasons and the counter-arguments\r\n\r\n**BAD REASON 1 — \"The price is too high\" / \"I want to lock in my unrealised gains.\"**\r\nThe mistake: the stock is up 20/30/40%, you get nervous about losing the paper profit and sell to \"take profit.\"\r\n**Counter:** that's a **short-term trading mentality**, not an investor's. To get a **5x, 10x or 50x** stock you must **resist selling at +50%, +100%, +150%, +200%**. **There is no such thing as \"too high\"** — high can go higher, especially when the business is growing and **intrinsic value keeps rising**. Stocks can run for years and decades; selling early cuts off the entire compounding tail.\r\n\r\n**BAD REASON 2 — \"I'll sell high and buy back lower\" (trading in and out).**\r\n**Counter:** he did exactly this for years — on Apple, Microsoft, Meta — and he **made money doing it**. But had he simply **held Apple, Meta, Microsoft and Amazon for the last 20+ years**, he'd be **five to ten times richer**. Two failure modes he lived through repeatedly:\r\n- He sells near a perceived high; price dips slightly, then **flies up without him**; to re-enter he'd have to pay far more, missing 100–300% of upside.\r\n- He sells, price *does* fall, he plans to re-buy at a trend line — but it **zooms up before reaching the trendline** and takes off without him.\r\nYes, you can occasionally nail it. But **over the long term you will mistime it often** and end up with far lower returns than simply holding.\r\n\r\n**Quantified illustration — Amazon, 2018–2020, trading the 50/150 moving-average crossovers (pre-split prices):**\r\n- Buy **1,006**; downtrend signal (50 crosses below 150) → sell **1,330** → transcript states a **−17%** leg outcome in the running total;\r\n- Re-buy on uptrend at **1,009**; sell on downtrend at **1,776** → **−6.5%** leg;\r\n- Re-buy at **2,000**; runs to **3,352** → **+62%** leg.\r\n- **Total from trading in and out: +24% over two years** (62 − 6.5 − 17).\r\n- **Simply buying and holding through the ups and downs: +108%.**\r\n- Longer horizons for Amazon: **+610% over 5 years**, **+2,176% over 10 years**. Very few investors capture even a fraction — they freak out on dips or take profits on pops and get thrown off the ride.\r\n\r\n**The relationship analogy:** great compounding companies are **rare — less than 1% of US companies** are great companies to hold (Microsoft, Nvidia, Amazon, Meta). Finding one is like finding a great spouse — beautiful, funny, loyal, intelligent, kind. Once found, you hold on and go through their ups and downs. If you keep running away every time they're in a bad mood, one day you come back and they're gone. **If you leave a great company, it will leave you behind.**\r\n> **\"Time in the markets is more important than timing the markets.\"**\r\n\r\n**BAD REASON 3 — \"A crash / recession is coming\" (your own prediction or an expert's).**\r\n**Counter:** **nobody can predict** the next recession or crash. Case in point **2023**: at the end of 2022 the majority of economists and analysts said a recession was inevitable and most predicted a crash. Investors **sold near the bottom** at end-2022, and some **shorted**. In 2023 the **S&P 500 rose over 20%** and the **NASDAQ over 40%**. The sellers missed it and the shorts took huge losses. **Never sell on an economic or market prediction.**\r\n\r\n**BAD REASON 4 — Macro or geopolitical bad news.**\r\nInverted yield curve, negative GDP, high interest rates, a new war, declining M2, the Fed doing QT, an earthquake, a virus.\r\n**Counter:** you will usually regret it — the market keeps rising, or dips slightly and rises without you.\r\n**The wall-of-worry evidence:** from **March 2009 to December 2019** the S&P 500 gained **495%**. Very few investors captured a fraction of it, because the news scared them out (bad news drives views and eyeballs). The headlines through that 500% bull market included: 663,000 jobs lost in March; Chrysler and GM bankruptcies; the BP oil spill; the flash crash; the most powerful earthquake on record; the S&P downgrade of US debt; the European sovereign debt crisis; a US government shutdown; Ebola contagion fears; Brexit; Charlottesville; the S&P 500 entering a bear market; a second government shutdown; the trade war; yield-curve inversion; Iranian bombing; the emergency Fed injection into the repo market.\r\n> **\"There is always something to worry about,\" and \"the bull always climbs a wall of constant worry.\"**\r\n> Peter Lynch: your success or failure depends on your ability to **ignore the worries of the world long enough** to let your investments succeed.\r\n\r\n**BAD REASON 5 — Panic during a correction or bear market.**\r\nCorrections drop **10–15%**; bear markets drop **20–25%**. People who don't understand what they own start fearing the price will keep dropping forever or go to zero, and sell **near or at the bottom**.\r\n**Counter / evidence:** many who sold at the **March 2020** bear-market bottom then watched the market rocket **~80% one year later**. Many who panicked and sold in **September/October 2022** — when everyone said it would get worse — watched 2023 rise **20–40%**. Stay invested in great companies and ride the temporary drawdowns.\r\n\r\n**BAD REASON 6 — Selling a great stock purely to reduce its allocation (mechanical rebalancing).**\r\nThe practice: fund managers rebalance at year-end to keep equal weights.\r\n*Worked example*: 10 stocks, **$10,000 invested, $1,000 each = 10% allocations**. One year later one winner (e.g. an Nvidia-type) **doubles** while the rest are flat → the winner is now **~18%** of the portfolio and each of the other nine is **~9%**. The manager sells down the winner and spreads the cash into the other nine to restore 10% each.\r\n**Counter:** **Warren Buffett and Peter Lynch both call this stupid.** If stock #1 is still a great business and still growing, **do not sell it just because it's big**. Buffett's Apple started as a normal-sized position and grew to **~50% of his entire public portfolio** — he does **not** trim it; as long as Apple stays great, keeps growing, keeps dominating and isn't too overpriced, it makes sense **not only to hold but possibly to buy more**. This is a key difference between super investors and ordinary fund managers — and part of why **over 90% of fund managers can't beat the market**.\r\n> Peter Lynch: selling your winner to fund the others is **\"cutting the flowers and watering the weeds.\"**\r\n\r\n**BAD REASON 7 — \"The market/my portfolio is at an all-time high, so I should get out before it comes down.\"**\r\nAt all-time highs there are always two camps: chasers who want to buy more, and sellers who want out before a fall.\r\n**Counter:**\r\n- If already invested, **do not buy more** at an all-time high — follow the rules and only add when price drops to undervalued levels **and** to support levels.\r\n- But that does **not** mean sell. He used to sell near perceived tops; sometimes it did dip, but then ran much higher without him; or it dipped and reversed up before he could re-buy. Holding through would have left him **much richer**.\r\n- **The risk of mistiming is asymmetric:** if you're **in** the market and it drops, no problem — you're still in and it comes back. If you're **out** and it runs, **you can't get back in except at a much higher price**.\r\n> **\"The risk of staying out of the market over the long run is worse than the risk of staying in the market.\"**\r\n\r\n#### 6.2 The cost of missing the best days (why timing kills)\r\n\r\n**$10,000 invested in the S&P 500 for 20 years, January 2003 to 2022:**\r\n\r\n| Scenario | 20-year return |\r\n|---|---|\r\n| Fully invested (held through all ups and downs) | **+548%** |\r\n| Missed the best **10** days | **+197%** |\r\n| Missed the best **20** days | **+78%** |\r\n| Missed the best **30** days | **+17%** |\r\n| Missed the best **40** days | **−19%** |\r\n| Missed the best **50** days | **−42%** |\r\n| Missed the best **60** days | **−57%** |\r\n\r\n- Missing just **10 days out of 20 years cuts returns by more than half**.\r\n- **7 of the 10 best days in the entire 20-year history occurred during bear markets** — precisely when most investors are out of the market, which is why they end up with big losses.\r\n- \"But can't I just miss the 10 *worst* days?\" — only with a crystal ball. **In trying to dodge the 10 worst days you will unknowingly miss the 10 best days.** Better to stay put and miss none.\r\n- The market averages about **10% a year**, but it does not accrue smoothly — **an entire year's return can arrive in a single day.**\r\n- **His own screenshot evidence** from one such day (two Interactive Brokers portfolios): one portfolio **+10.5%** and the other **+10.83%** in a single day; **+$175k** and **+$231k** respectively — **+$396,000 USD in one day.** Missing that one day would have changed his returns for that year and for the five-year period.\r\n\r\n> Peter Lynch: **far more money has been lost by investors preparing for or anticipating corrections than has been lost in the corrections themselves.** People predict a crash, get out or stay out, and lose far more in opportunity cost than they'd have lost by simply riding the short-term swings.\r\n\r\n#### 6.3 Quoted words of wisdom he credits with changing his approach\r\n\r\n- **Charlie Munger:** the big money is not in the buying and selling, it is in the **waiting** — sitting patiently. Few people can do it.\r\n- **Peter Lynch:** his best stocks delivered their greatest gains in the **third, fourth or even fifth year** of ownership — not the third or fourth *week*. People want money rapidly; it doesn't work that way. You can make small money fast; you will **never make millions with a short-term mentality**.\r\n- **Charlie Munger:** the first rule of compounding is **never interrupt it unnecessarily**.\r\n- The stock market is a **device for transferring money from the impatient to the patient**.\r\n\r\n#### 6.4 The third option at market highs — hedging (optional)\r\n\r\nInstead of holding blindly (option 1) or trying to sell high and buy back low (option 2, \"good luck to you\"), there is a **third option**:\r\n- **Hold your shares — don't sell** — and, if a correction or bear market is developing:\r\n  - **Sell covered call options** to generate extra income while price corrects and consolidates.\r\n  - **Buy protective put options** to generate profits as the market drops, offsetting the drawdown.\r\n- Structures he showed from his own bear-market portfolios: **calendar spreads** producing short-term profits while holdings fell; a **bear put spread combo** producing put-option profits during a bear market. This is **hedging**.\r\n- **Explicitly optional:** \"learning to hedge your portfolio is not a must. It is nice to have, but it's not a must.\" If you don't know how, just hold — you will still do very well simply holding great companies through short-term ups and downs. Options are taught in a separate Piranha Profits options trading course.\r\n\r\n---\r\n\r\n### KEY TAKEAWAYS\r\n\r\n1. **The best ideas come from your own life.** Buy the businesses you personally patronise — consumer monopolies with brand power, market leadership and predictable revenue and cash flow. Do the daily inventory: soap, toothpaste, breakfast, groceries, car, lunch, dinner, software.\r\n2. **Using a product is a lead, not a decision.** Every candidate must pass the **7-step criteria** — Netflix is used in his household and still isn't owned (high maintenance capex, hit-or-miss content, not predictable).\r\n3. **Bad news on great companies is the second-best source of ideas** — but only if the bad news is temporary and the moat is intact. Fraud accusations are the one exclusion.\r\n4. **News points to the opportunity; fundamentals and technicals authorise the buy** — undervalued vs intrinsic value + at a support level + reversal pattern.\r\n5. **Screeners shortlist; they never qualify.** Finviz free (P/E deliberately \"Any\"), GuruFocus paid for exact thresholds and non-US regions. **Screen at least once a month.**\r\n6. **Follow super investors for ideas, never for orders.** Dataroma 13F data; the aggregate \"most owned / most bought\" lists are more useful than any one manager — and they can all be wrong (he sold Disney while they were buying it).\r\n7. **Watch list of 20–30 great companies, 5 minutes a day; portfolio review under 10 minutes a day.** Mark the chart with an intrinsic-value line and **3–4 support-based buy levels**; buy a quarter at a time.\r\n8. **Daily price moves are noise.** 9 of the 10 causes of a price drop are temporary and are buying opportunities. Only **permanent structural damage** matters — and it takes years to develop, so you will see it coming.\r\n9. **Read the quarterly report and the conference call transcript** (company IR page, Seeking Alpha, Google search). You're checking execution and management's explanation — not celebrating beats or mourning misses. Beats and misses are a coin toss.\r\n10. **Drawdowns are unavoidable and psychological preparation is 70% of the game.** His own: −25% (2020), −30% (2022), yet +141% over five years. Buffett: −30%, −27%. Lynch: −56%, −42% — while returning 29% a year, and yet **over 50% of his clients lost money** by buying high and selling low.\r\n11. **Only six things justify a sale.** Permanent fundamental deterioration; an analytical mistake; management acting against shareholders; gross overvaluation (>50–100% above intrinsic value); a strictly better opportunity when cash-constrained; a genuine personal cash need.\r\n12. **Sell in tranches, just as you buy in tranches** — you can no more pick the top than the bottom.\r\n13. **The technical confirmation of a sell is the parabolic move**: a healthy uptrend runs ~45° near the 20 EMA; a 90° vertical run on long green candles is panic buying and usually the end.\r\n14. **Cyclicals are the exception to buy-and-hold** — enter below the 10-year median P/B, exit at the midpoint of the median and the 10-year high (JPM: buy \u003c 1.26, sell ≈ 1.56). Unless, like his Singapore banks, you hold them purely for a locked-in 5–6% dividend yield.\r\n15. **The biggest destroyer of returns is being out of the market.** Missing the 10 best days in 20 years cuts +548% to +197%; missing 40 turns it negative — and **7 of the 10 best days happened inside bear markets**.\r\n16. **There is always something to worry about.** The bull climbs a wall of worry; the 2009–2019 500% bull market ran through jobs collapses, bankruptcies, downgrades, a debt crisis, Ebola, Brexit, shutdowns, a trade war and yield-curve inversion.\r\n17. **Never invest money you need within one to two years** — use short-term bonds, money-market funds or fixed deposits, so you are never forced to sell great companies at a 50–60% discount.\r\n18. **Don't cut the flowers to water the weeds.** Mechanical rebalancing out of a winner is why 90%+ of fund managers underperform. Buffett lets Apple sit at ~50% of his public portfolio.\r\n\r\n---\r\n\r\n### CHEAT SHEET A — SELL CHECKLIST (VALID TRIGGERS)\r\n\r\n| # | Trigger | Threshold / test | Action |\r\n|---|---|---|---|\r\n| 1 | **Permanent fundamental deterioration** — moat destroyed by technology, competition or changed consumer preferences | You and the people around you have **stopped buying** the product; profit margins declining **2–3 years straight** because of **forced discounting** (lost pricing power); margins squeezed by higher cost of sales; **market share falling 2 straight years**; customers switching to competitors | **Sell.** Rare — wide moats last 20+ yrs, narrow 10+ yrs — and it never happens overnight, so exit early |\r\n| 2 | **Accusation of financial fraud or financial irregularity** | Any credible accusation, regardless of company size or fame (Enron, WorldCom both went to zero) | **Sell immediately. Don't look back.** |\r\n| 3 | **You made a mistake in the original analysis** | Business isn't as great as you judged, or you were too optimistic in your valuation (Disney: content hit-or-miss, not predictable) | **Sell all, take the loss, immediately redeploy into a great undervalued business** |\r\n| 4 | **Management acts against shareholders** | Buybacks at all-time highs / while the business deteriorates; new share issuance despite a cash-rich balance sheet | **Sell** |\r\n| 5 | **Grossly overvalued** | **>50–100% above intrinsic value.** (10–30% overvalued = HOLD) | **Start reducing — sell in tranches** (e.g. 25 shares at a time, or 1/3 → 1/2 → rest); redeploy into an equally great, cheaper business |\r\n| 6 | **Parabolic price action** (confirming trigger 5) | Trend shifts from ~45° near the 20 EMA to a **90° vertical run with long green candles** = panic buying, usually the end of the uptrend | **Exit**, especially if already overvalued |\r\n| 7 | **Cyclical stock reaches the top of its cycle** (banks, insurers, industrials, property, shipping, commodities) | P/B reaches the **midpoint between the 10-yr median and the 10-yr high** — JPM: high 1.89, low 0.64, median 1.26, **sell ≈ 1.56** | **Sell the medium-term trade.** Exception: cyclicals held purely for locked-in 5–6% dividend yield are never sold |\r\n| 8 | **A strictly better opportunity and no spare cash** | The alternative is as great or better and more undervalued, and you have no cash to fund it | **Swap** — sell all or half and redeploy. If you *do* have cash, hold both |\r\n| 9 | **Genuine personal cash need** | College fees, a car, home renovation | **Sell** — ideally when the holding is overvalued / at an all-time high, never under forced conditions |\r\n\r\n---\r\n\r\n### CHEAT SHEET B — DO **NOT** SELL BECAUSE…\r\n\r\n| # | Invalid trigger | Why it's wrong |\r\n|---|---|---|\r\n| 1 | \"The price is too high\" / \"I want to lock in my unrealised gains\" | High can go higher; intrinsic value keeps rising. A 5x/10x/50x stock requires refusing to sell at +50%, +100%, +200%. Trader mentality, not investor |\r\n| 2 | \"I'll sell high and re-buy lower\" | Very high risk of mistiming. Amazon 2018–20: trading the crossovers gave **+24%** vs **+108%** for holding. He'd be **5–10x richer** had he held Apple/Meta/Microsoft/Amazon for 20+ years |\r\n| 3 | \"A crash / recession is coming\" (your prediction or an expert's) | Nobody can predict it. End-2022 consensus said recession was inevitable; 2023 gave **S&P +20%, NASDAQ +40%**. Sellers missed it; shorts got crushed |\r\n| 4 | Macro or geopolitical bad news (inverted yield curve, negative GDP, high rates, war, QT, virus) | The bull climbs a wall of worry. March 2009–Dec 2019 = **+495%** through jobs collapses, bankruptcies, the US downgrade, the euro debt crisis, Ebola, Brexit, shutdowns, trade war and yield-curve inversion |\r\n| 5 | Panic during a correction (−10–15%) or bear market (−20–25%) | Sellers at the March 2020 bottom missed a **~80%** one-year rebound; panic sellers of Sept/Oct 2022 missed **+20–40%** in 2023. And **7 of the 10 best days in 20 years happened inside bear markets** |\r\n| 6 | Earnings miss or lowered forward guidance | Beat/miss is a **50/50 coin toss**; great companies have bad quarters. Adobe beat and still fell 6% on guidance — a buying opportunity, not a sell |\r\n| 7 | Sector rotation, industry-wide news, market-maker/algo manipulation, a forced seller dumping stock | Nothing changed at the company. Money rotates back; discounts are opportunities (2023: healthcare sold off wholesale; Ozempic knocked 20–30% off food stocks whose revenues never fell) |\r\n| 8 | Cyclical slowdown in demand | Semiconductors and advertising dip and re-accelerate. 2022 ad-spend fear dented Alphabet and Meta revenue; it re-accelerated the next year |\r\n| 9 | Product recall, lawsuit, scandal | All temporary. (Fraud is the sole exception — see Cheat Sheet A #2) |\r\n| 10 | Rebalancing — trimming a winner just because its allocation grew | Buffett and Lynch both call it stupid; Buffett lets Apple sit at **~50%** of his public portfolio. Lynch: **cutting the flowers and watering the weeds**. It's part of why **90%+ of fund managers can't beat the market** |\r\n| 11 | The market / your portfolio is at an all-time high | Don't buy more, but don't sell either. **The risk of being out is worse than the risk of being in** — if you're in and it drops, it comes back; if you're out and it runs, you can only re-enter far higher |\r\n| 12 | A founder or CEO is selling shares | Bezos funds rockets; Zuckerberg funds charity. Founder selling is usually a personal cash need, not a bearish signal |\r\n| 13 | Daily volatility / a 10–20–30% drawdown in a great company | Volatility is normal; drawdowns are inevitable even for Buffett (−30%, −27%) and Lynch (−56%, −42%). The roller coaster only hurts those who jump off halfway |\r\n\r\n---\r\n\r\n# Part X — Investor Psychology (The Most Important Lesson)\r\n\r\n## Lesson 10: The Psychology of Winning Investors\r\n\r\n> Adam Khoo frames this as **the most important lesson in the entire course**: \"to achieve success in anything, it takes two factors\" — strategy and psychology. **Strategy makes up only 30% of success; psychology/mindset makes up 70%.** Most people focus only on strategy and leave psychology to chance, wrongly assuming they already have \"the right psychology.\"\r\n\r\n**Part breakdown (content-based, not file-order labels):**\r\n- **Part 1 (file 74):** Discipline as the foundation; sticking to rules under pressure; Warren Buffett & the dot-com bubble case study; 2020–2021 hype-stock parallel; circle of competence; never blindly follow experts/analysts — with three detailed case studies (Nobel Group failure, Meituan success, Goldman Sachs short call).\r\n- **Part 2 (file 75):** Patience and long-term thinking; the golf compounding exercise; \"buy slowly, sell even slower\"; the Fidelity dormant-accounts study; Adam's own Facebook mistake; judging investments by business performance not price; the Washington Post / Warren Buffett interview case study.\r\n- **Part 3 (file 76):** Thinking independently and contrarian psychology; the fear/greed cycle and Fear & Greed Index; \"worst day\" media pattern; John Templeton quote on bull market phases; why you should never predict the market (with a decade of failed doomsday headlines as evidence); ignoring macroeconomic/geopolitical noise; risk management and capital protection; taking responsibility for mistakes; final 10-rule summary.\r\n\r\n---\r\n\r\n### Opening Framework: Strategy (30%) vs. Psychology (70%)\r\n\r\n- To achieve success in **anything** requires two factors: the right strategy AND the right psychology (emotional discipline, focus, self-motivation to apply what you've learned and follow the rules).\r\n- **Analogy — weight loss:** The strategy for losing weight is simple and freely available (diets, exercise regimes), yet **fewer than 5% of people who attempt to lose weight succeed**, and of that 5%, **3% put the weight back on within a couple of years**. People know *what* to do but lack the discipline to *do* it. \"Again, it's all about psychology.\"\r\n- **Analogy — business:** If strategy alone were sufficient, everyone with an MBA would build a successful business and everyone with a PhD in finance would be a billionaire. Neither is true — many MBAs fail in business; many successful entrepreneurs are dropouts.\r\n- By this point in the course, students already have the strategy (fundamental analysis, technical analysis, identifying great businesses). This lesson covers the missing 70%.\r\n\r\n---\r\n\r\n### Psychology Rule #1: Absolute Discipline\r\n\r\n- **Discipline defined:** You only buy/sell a stock based on **predetermined, objective rules** in your investment plan — rules grounded in fundamental and technical analysis (e.g., buy only businesses with strong fundamentals: consistently increasing sales, earnings, cash flow, low debt, undervalued, on a clear uptrend).\r\n- **What most people actually do instead (the failure modes):**\r\n  - Buy/sell based on **rumors** (\"I heard this company's going to be taken over\").\r\n  - Buy/sell based on **emotions** — the two core emotions are **fear and greed**: people buy out of greed and sell based on fear.\r\n  - Buy/sell based on **the opinions of other people**.\r\n  - **FOMO (Fear Of Missing Out):** buying something you don't understand, outside your plan, because \"everyone's buying it\" — Adam compares this to **lemmings following each other off a cliff**, \"they get slaughtered like lemmings.\"\r\n  - **Panic selling:** selling because of media scare stories (market crash warnings, trade war headlines) — \"the moment you sell, the stock keeps going up.\"\r\n- Doing any of these guarantees you will never make money in the long run.\r\n\r\n#### Case Study: Warren Buffett and the Dot-Com Bubble (1999–2000)\r\n- Buffett is considered the greatest investor not because he's the most intelligent (by his own admission) but because he is **the most disciplined**. Adam's method mirrors his: only invest in profitable, undervalued businesses; avoid unprofitable, overpriced/hyped businesses.\r\n- During the dot-com bubble, unprofitable, overpriced \"speculative stocks\" (Netscape, AOL, Pets.com) kept rising, while profitable undervalued companies (McDonald's, Procter & Gamble, Coca-Cola) kept falling.\r\n- **1999:** S&P 500 up 18%; Buffett's Berkshire Hathaway **down 23%**. Most investors would have abandoned their plan and chased the hype (FOMO) — Buffett refused.\r\n- He was publicly ridiculed. *Barron's* ran a piece: *\"What's Wrong, Warren? After 30 years of unrivaled investment success, Warren Buffett may be losing his magic touch.\"* Called a dinosaur who didn't understand tech.\r\n- Berkshire fell from ~$80,000/share to ~$54,000/share (23% drop) — yet Buffett stayed unfazed, knowing that **short-term the market is irrational, but eventually prices reflect business fundamentals.**\r\n- **One year later**, the bubble burst: NASDAQ dropped **72%**, S&P 500 lost **28%**. Buffett ultimately outperformed for years. From the $54,000 low, the stock later reached **$443,000**.\r\n- **Lesson:** Stick to your investment plan even when the market temporarily punishes you for it. Short-term the market is irrational/manipulated; long-term it always reflects reality.\r\n\r\n#### Modern Parallel: 2020–2021\r\n- In 2020, unprofitable/overpriced companies (Roku, Zoom, Tesla, Peloton, Fastly) kept rising. Adam refused to buy them and was criticized (\"Ed, why aren't you buying these stocks? They're going up.\") His reply: \"It won't last.\"\r\n- **2021:** these stocks collapsed 50–60%, while Adam's holdings (Microsoft, Alphabet, McDonald's, Yum Brands) held their value and some kept rising through the correction.\r\n- Reinforces: always stick to the investment plan no matter what others are doing in the short term.\r\n\r\n---\r\n\r\n### Psychology Rule #2: Invest Only Within Your Circle of Competence; Never Blindly Follow Experts\r\n\r\n- **Circle of competence:** only invest in businesses you truly understand and have personally researched. \"No matter how smart you are, you can't be an expert in everything... you don't have to win at every game. You only have to win at the game which you understand.\"\r\n- **Adam's personal examples of businesses he avoids:**\r\n  - **Energy companies** — energy prices are too unpredictable.\r\n  - **Commodity companies** — commodity prices are too unpredictable.\r\n  - **Tesla** — considers it overpriced and the EV market too competitive; despite being told \"it's not just a car company, it's a software company, it's a battery company,\" he still doesn't understand the business well enough to invest, and refuses regardless of criticism.\r\n  - He instead focuses on businesses he understands with predictable, consistent cash flow (Facebook, Amazon, Alphabet, Microsoft).\r\n- **Never blindly rely on recommendations/tips from experts** — even from investors you admire.\r\n  - **Thought experiment:** if Adam had dinner with Warren Buffett, Carl Icahn, and Bill Ackman and all recommended a stock (e.g., \"Micron\"), would he buy it? **No** — he'd run it through his own **seven-step investment analysis** first. He only invests if it meets his own criteria, not because admired people invested in it.\r\n  - Example: Adam admires Buffett but would never have bought some of Buffett's own picks — General Motors, airlines, Occidental Petroleum, IBM — because they didn't meet his criteria, and these turned out to be some of Buffett's losing investments.\r\n- Always do your own research on every investment, **monitor stocks regularly**, and **keep investment records** — a portfolio tracker and an investment journal. \"There's no free lunch in this world... to create wealth, you got to put in the work.\"\r\n- Analyst reports (from brokers, private banks) can be **leveraged for research** but never blindly followed — always run them through your own checklist.\r\n\r\n#### Case Study: Nobel Group (November 2011) — a failed \"buy\" recommendation\r\n- A top Singapore broker recommended **buy Nobel Group at $1.56**, target price $2.05. Nobel was a large commodity company, blue chip, part of the Straits Times Index.\r\n- Adam's process: (1) he never buys commodity companies as a rule — automatic disqualifier; (2) still ran it through his seven-step check anyway, and it **failed most steps**:\r\n  - **Negative operating cash flow** despite reported increasing profits — a red flag (\"why are they generating profits on paper but the cash is not coming in?\").\r\n  - **Profit margin \u003c 0.5%** — razor thin, vulnerable to any cost increase.\r\n  - **Debt-to-EBITDA ratio > 12** (rule of thumb: should never exceed 3).\r\n  - **Debt-servicing ratio over 50%.**\r\n- He did not buy. **One week after the recommendation**, price dropped from $1.56 to $1.08 (−31%).\r\n- **Lesson on cutting losses:** if you realize you made a mistake, **cut loss immediately** — \"take your loss like a man or like a woman.\" Most people don't, because \"if I sell, I'm gonna lose money... maybe it comes back, I hope.\" **Quote: \"In the markets, hope is for the hopeless. Never have hope.\"**\r\n- Nobel Group continued: $1.08 → $0.45 → ~$0.05 → **delisted**, company collapsed. Investors \"complained they were cheated\" (referenced newspaper headline: *\"Tales from the collapse of commodity giant Nobel Group\"*).\r\n- **Lesson:** (1) if you realize a holding is a mistake, get out; (2) never blindly trust experts/analysts — always do your own research. Many burned investors blamed the broker, the company, or luck instead of taking responsibility — \"as long as you keep blaming other people... you will always lose money.\"\r\n\r\n#### Case Study: Meituan Dianping (September 2019) — ignoring a bearish \"avoid\" call\r\n- Adam found Meituan Dianping (China stock) as a great company with multi-bagger potential; shared research via YouTube and predicted the stock could double/triple within a year.\r\n- Told his community he was \"getting my dry powder ready\" as it approached his ideal buy price of $70.\r\n- **10 September:** price hit $70; Adam and students bought in together (students posted their entry prices: $70, $73, etc.).\r\n- Students flagged a **March 2019 CNBC article** where analysts said investors should **avoid** Meituan shares — asked Adam why he was buying against that advice.\r\n- Adam's reply: **\"You gotta ignore these analysts, because they may not know what the hell they're doing. You have to trust your own research.\"**\r\n- **Result: within 17 months, price went from $70 to $440 — up 528%.**\r\n- Sell discipline: started selling at $320 (overvalued vs. his intrinsic value estimate of $240), sold more progressively, sold the majority of the position at $440. (Referenced screenshot from his \"Ultimate Investors Playbook\" live-alerts channel, showing him near +400% and stating intent to sell half his balance as \"quite overvalued.\")\r\n\r\n#### Case Study: Goldman Sachs Short Call (21 June 2012)\r\n- Goldman Sachs recommended clients **build short positions on the S&P 500** citing a \"weakening domestic economy.\"\r\n- Adam's rule: **never listen to these recommendations — follow your own investment rules (chart trend).**\r\n- At the time, the chart showed a clear **uptrend** (50-day moving average above the 150-day moving average, and the 150 still sloping upward, even though the 50 had briefly dipped below it).\r\n- **Result:** market didn't fall — it rose **7% over the following months**. People who listened to the \"short\" call lost money or lost the opportunity for that 7% gain.\r\n- **Takeaway repeated across all three case studies:** never listen to opinions/advice of analysts, bankers, or experts. Follow your investment plan's rules based on fundamentals and chart patterns instead.\r\n\r\n---\r\n\r\n### Psychology Rule #3: Be Patient and Think Long-Term\r\n\r\n- Most people want to get rich quick — \"it just doesn't happen. It just doesn't exist.\" This drives people toward get-rich-quick schemes or speculative hype stocks. You *can* occasionally get lucky (like winning the lottery), \"but in the long run, whatever money you make, you will always lose it back.\"\r\n- Sustainable wealth requires a **long-term timeframe**, patience, and letting investments **compound**.\r\n- **Quotes:**\r\n  - \"The stock market is a wonderful mechanism that transfers wealth from the impatient to the patient.\"\r\n  - **Charlie Munger:** \"The big money is not in buying and selling stocks, the big money is in waiting.\" (repeated later: \"It's in inactivity.\")\r\n- Most investors abandon their strategy out of impatience when they don't get rich overnight, or when they see other stocks/crypto rising faster and get \"seduced by those quick profits\" — jumping into what's hot (which usually crashes) and abandoning good companies (which usually then rise).\r\n- **\"Get rich slow, but get rich sure\"** — not get rich quick.\r\n- Stock prices/portfolios **do not go up in a straight line** — they cycle through ups and downs even for great companies with strong long-run annualized returns (e.g., a company can compound at 26%/year on average while going flat or down for a full year at a time).\r\n- **Illustrative example:** buy at $100, stock doubles to $200 in 3 years = ~26% annualized return — a great outcome — but this often happens with two flat/sideways years followed by a big move in year three. Most people give up (\"lose faith... lose patience... sell the stock\") right before the move happens, then watch it double after they sell.\r\n\r\n#### The Golf Compounding Exercise\r\n- Thought exercise: bet 10 cents on hole 1 of golf, **double the bet every hole** for 18 holes. Guess the hole-18 bet before being told.\r\n- Progression shown: Hole 1: $0.10 → Hole 5: $1.60 → Hole 6: $3.20 → Hole 9 (halfway): $25.60 → Hole 10: $51 → Hole 12: $204 → Hole 13: $409 → Hole 15: $1,600 → **Hole 18: $13,000** (starting from just 10 cents).\r\n- **Point:** compounding grows *very slowly* at first (\"like watching the grass grow... you get impatient... you're barely say, forget it, I'm gonna do something more exciting\") before exploding exponentially later. Between hole 15 and hole 18 (only 4 holes), the value goes from $1,600 to $13,000.\r\n- **Lesson:** starting investing even 1–4 years later than someone else results in a hugely different end outcome over the long run — **start as early as possible** to give money runway to compound.\r\n\r\n---\r\n\r\n### Psychology Rule #4: Buy Slowly, Sell Even Slower\r\n\r\n- Unlike most areas of life where \"activity equates to performance,\" **in investing, less activity often produces more money.**\r\n- **Be very patient before buying.** Common student mistake: after finishing the course, getting \"trigger happy\" and buying prematurely out of fear of missing the move, before a stock is properly undervalued or at the right buy point.\r\n- **Rule: \"If there's no great business at this point of time at a great price, do nothing.\"** Hold cash rather than invest for the sake of investing.\r\n- **Baseball analogy:** \"You only swing when you have the perfect pitch. If there's no perfect pitch, you don't have to swing.\" Investing is a marathon, not a race.\r\n- Buy aggressively when the market is in fear/correction and great companies are on sale; do NOT buy when markets are high, expensive, and people are euphoric.\r\n- **Be even more patient in selling.** Common mistake: taking profits too fast (e.g., stock up 20%, \"let me grab those profits before I lose those profits\") — this caps you at small gains and prevents big wins. **\"The best stocks are the ones that you hold forever.\"**\r\n- Clarification on \"forever\": only sell if you need the cash for something specific (a house, a car). Otherwise let it compound.\r\n\r\n#### Fidelity Dormant Accounts Study\r\n- A study of Fidelity clients' accounts over 30 years found the **best-performing accounts were inactive ones** — accounts the owner forgot about, or where the owner had **died** and no one claimed the stock. Actively-traded accounts performed the worst.\r\n- **Lesson:** \"In investing, lower activity actually results in greater returns.\"\r\n\r\n#### Personal Anecdote: Adam's Facebook Mistake\r\n- Adam bought Facebook years ago at **$19/share** (later ~$350/share at time of filming). A great investment — but he did **not** hold it the whole way, because early in his career he used to jump in and out of stocks (buy, small gain, sell, buy something else).\r\n- Self-admission: \"I was an idiot.\" He estimates that if he had simply held great companies without trading in and out, he'd be **10 times richer** today. He keeps the original Facebook purchase screenshot on his phone as a permanent reminder never to sell a great company prematurely.\r\n\r\n#### The Marriage/Relationship Analogy\r\n- Finding a great company is like finding a great spouse — rare (top companies, like the \"top 1%\" of people). Once found, you hold on for life.\r\n- When a great spouse (or stock) is in \"a bad mood\" (temporarily down), you stay and support them — you even \"buy more shares at a discount so it compounds even faster.\" Adding shares during a temporary dip in a great company is the equivalent of being there for a spouse during a rough patch — it strengthens the position/relationship.\r\n- **Why not sell high and rebuy low?** In reality, it's **impossible to time selling at the top and rebuying at the bottom.** More often you sell a good stock and it runs away from you before you can buy it back. Analogy: \"your spouse is in a bad mood, so you run away to the pub... by the time you get back, she's run off with your best friend.\" **Never leave a great company. Never leave a great spouse.**\r\n\r\n---\r\n\r\n### Psychology Rule #5: Judge Investments by Business Performance, Not Short-Term Stock Price\r\n\r\n- Most people wrongly judge investment success by short-term price movement: \"stock went up this month = good investment; stock went down = bad investment.\" This is false.\r\n- **Example:** Alibaba, Tencent, and other fundamentally strong Chinese companies fell due to emotional reactions to bad news (the Chinese regulatory crackdown), leading people to wrongly conclude buying them was \"a mistake.\" It wasn't — if the underlying business is still growing and profitable, short-term price weakness does not equal an investment mistake.\r\n- **Judge success by the business itself**, not short-term price, because short-term price is driven by **emotions and manipulation, not logic or fundamentals** — and is therefore unpredictable.\r\n- If you buy a good company and price falls, **don't feel regret or beat yourself up** — you cannot control short-term price. Short-term weakness in price for a fundamentally sound company is **an opportunity to add shares**, not a reason to doubt yourself.\r\n- **\"Let the market serve you and take advantage of the market and not let the market instruct you of what is a good investment.\"**\r\n\r\n#### Case Study: Warren Buffett and the Washington Post ($10 million → $1.5 billion)\r\n- Buffett bought Washington Post shares in 1973 at ~$20/share when the company was worth ~$100/share — an **80% discount**.\r\n- From the interview footage: Buffett explains he had studied the prospectus in 1971 (meeting Katie Graham around the time of the Pentagon Papers); by 1973 the stock became cheap because its TV licenses were being challenged (tied to Nixon associate \"BeBe Rebozo\"). Price fell from ~$38 to ~$16–20; Buffett and Munger bought almost 10% (now ~18% after buybacks) when the whole company (4.8 million shares) was priced at only $100 million on the market — while the sum of its parts (Washington Post, Newsweek, four network TV stations including a CBS affiliate in DC and one in Jacksonville, FL) could have fetched roughly **$500 million** if sold piece by piece (\"people would have been swimming out in shark-infested waters\" to buy the pieces). Buffett: \"So what?\" the stock kept dropping after he bought it — he was focused on business value, not price.\r\n- Result: the ~$10 million investment became **worth roughly $1.5 billion.**\r\n- **The real lesson Adam draws:** it wasn't just that Buffett found an 80%-undervalued stock — it's that **other analysts and big institutional investors agreed the business was worth ~$100/share (~$500M)** and were still **selling** at $20 because they feared the price would keep falling short-term. Buffett bought because he focused on long-term business value, not short-term price fear.\r\n- **Modern parallel:** Alibaba — most analysts/investors agree it's worth roughly $300/share, but it trades around $100 and few people dare buy it \"except a few people like me,\" out of fear it will keep falling. No one can predict exactly when the price will rebound to reflect true value — could take a month, three months, six months, a year, or three years — but patience with an undervalued, fundamentally strong business pays off. (Buffett's WaPo position also fell further after his purchase, from $20 to $16, before eventually multiplying — reinforcing \"you can never catch the bottom, but you don't need to.\")\r\n\r\n---\r\n\r\n### Psychology Rule #6: Think Independently (Contrarian Psychology)\r\n\r\n- Many people fail because they are **\"creatures of conformity\"** — they get excited when others are excited and afraid when others are afraid, following the crowd. This causes buying high (when everyone's excited) and selling low (when everyone's scared) — a losing pattern even if you pick the right companies or buy the index.\r\n- **Rule: train yourself to think and feel opposite of everyone else / opposite of the masses** — \"be fearful when others are greedy, and be greedy when others are fearful.\"\r\n- **\"Only you control your emotions. No one can make you feel scared except yourself... You create your emotions based on what you choose to focus on and the meaning you give to the experience.\"**\r\n- Best way to train this ability: participate in a community/chat group to strengthen the habit of thinking against the crowd.\r\n\r\n#### The \"Worst Day\" Media Pattern\r\n- Adam's observed pattern: whenever the market has a big drop, the next day financial media runs articles featuring a sad-faced person and headlines using the word **\"worst\"** (e.g., \"Dow craters in worst day...\"). Whenever you see the word \"worst day\" paired with a fearful face, **that's usually the best time to start adding shares** — right before the market bounces back. (Illustrated with a specific example dated 28 October, and repeated pattern examples.)\r\n\r\n#### Fear & Greed Index\r\n- Referenced tool: **moneycnn.com** (CNN Fear & Greed Index) — measures market sentiment, swinging between extreme fear and extreme greed like a pendulum.\r\n- At time of filming (21 December 2021), the index was at **extreme fear** (~level 25); during the COVID crash it fell to as low as **10**. Adam states he had been actively adding shares during that period of fear.\r\n- The market can't be predicted with certainty even from this index, but **extreme fear signals good companies are on discount** — you can only buy a good company at a discount when people are scared.\r\n- Historically: every time people get scared, the market has rebounded.\r\n\r\n#### Market Cycle Emotions\r\n- The market is never a straight line — it moves in cycles (\"boom cycle and bust cycle\"), each phase carrying a characteristic set of investor emotions:\r\n  - **Near the top:** thrill, euphoria (\"I'm a genius, we're gonna be rich, I gotta tell everyone to buy\") — everyone around you is talking about and buying stocks. This is when you should NOT buy — start taking profits instead.\r\n  - **Near the bottom:** anger, panic, depression, disbelief — people telling you \"don't touch stocks... we're gonna die.\" This is when you should buy (good companies).\r\n- **John Templeton quote:** *\"Bull markets are born on pessimism, they grow on skepticism, they mature on optimism, and they die on euphoria.\"*\r\n  - Born on pessimism: general public expects the market to crash — that's usually when a bull market begins.\r\n  - Grow on skepticism: as the market rises, people doubt it will continue — and it keeps rising anyway.\r\n  - Mature on optimism: when people around you start saying \"we're gonna do well,\" the bull market is nearing its end.\r\n  - Die on euphoria: when people feel unstoppable/certain of riches, the bull market dies.\r\n- **Corollary: maximum pessimism = best time to buy; maximum optimism = best time to sell.**\r\n\r\n---\r\n\r\n### Psychology Rule #7: Never Attempt to Predict the Market\r\n\r\n- You can assess **probability** via trend (uptrend = higher probability prices rise; downtrend = higher probability prices fall) via chart patterns/moving averages, but you can **never predict short-term price movement with absolute certainty**, because prices are driven by demand/supply, which is driven by emotions, manipulation, and news — and no one can predict tomorrow's news or how millions of people will react to it.\r\n- **Buy/sell decisions should never be based on predictions — always base them on business fundamentals** (good business + undervalued + retraced to a support level → add shares). **Never buy all at once — buy in tranches to average your cost.**\r\n- **Warren Buffett quote:** \"We have long felt that the only value of stock forecasters is to make fortune tellers look good.\"\r\n- **Why predictive mindset is dangerous:** it causes you to abandon your predetermined rules. Example: if you predict a crash, you won't buy an undervalued great company out of fear — and then miss the gains when it rises anyway.\r\n- **Your job as an investor is NOT to predict short-term price direction — it's to buy great companies that thrive under all economic conditions**, building a \"bulletproof portfolio\" that grows collectively regardless of inflation, interest rates, or recession.\r\n- Your chance of any single prediction being right is essentially **50-50** — \"you might as well toss the coin.\" For every expert predicting up, another predicts down.\r\n\r\n#### Case Study: Dow Jones, October 2009 (contradictory predictions in one week)\r\n- Dow was at 9,800 points. On **6 October**, CNBC headline: \"Experts position themselves for Dow 10,000\" (bullish). The day before, **5 October**, the same outlet ran: \"Dow will fall to 6,300 by year end\" (survey of portfolio managers, bearish).\r\n- **\"So who the hell do you listen to? You listen to CNBC or CNBC?\"** — Answer: don't listen to anyone; follow the trend instead. On 6 October the chart showed an uptrend (50-day MA above 150-day MA).\r\n- **Actual result:** Dow rose to 10,000, then 11,000, then 20,000, eventually 23,000–24,000. Anyone following the bearish \"clowns\" prediction would have shorted and lost money, or missed the gains.\r\n\r\n#### A Decade of Failed Doomsday Predictions (2008/2010–2019, S&P 500 rose ~262–400%+)\r\nAdam walks through a chronological sequence of major media doomsday headlines that all preceded a ~10-year, ~400%+ bull run in the S&P 500 (SPY roughly 80 → 290+ points, later ~450):\r\n- **2010 (New York Times):** \"A market forecast that says, take cover\" — quoting forecaster **Robert Prechter**, predicting \"a market decline of staggering proportions, perhaps the biggest of the last 300 years.\"\r\n- **2011 (USA Today):** \"S&P lowers its outlook. Could US default on its debt?\"\r\n- **2012 (CNBC):** \"Europe debt defaults are poised to rattle stocks\" (Eurozone sovereign debt crisis fears).\r\n- **2013 (Bloomberg):** \"A US default seen as catastrophe, dwarfing Lehman's fall.\"\r\n- **2013 (unnamed forecaster):** \"87% risk of stock crash by year end.\" (Market rose 20% that year instead.)\r\n- **2015:** **David Stockman** — \"Stocks and bonds will crash soon.\" (Adam's joke: \"Kuh, Stockman, Kuh, Stockman... if you listen to Stockman, you would not have made money, 'cause stockmen say we're gonna die.\")\r\n- **2016:** \"Here comes the biggest crash in a generation.\"\r\n- **2018:** \"Why markets are still heading for a crash.\"\r\n- **Pattern/lesson:** financial media predicts a crash **every single year**, because \"bad news sells newspapers... sells articles... gets clicks... sells advertisements.\" Markets DO periodically correct (statistically: down 3–5% about once a year, down 10% about once every 2 years, down 20% about once every 6 years) — but **when it happens is unpredictable**, and when it does happen, \"you don't fear them, you take advantage of them.\" **Rule: stop reading predictions/forecasts; focus on building a watchlist of great companies and add shares during corrections.**\r\n- Reiterated **Peter Lynch quote:** \"If you spend more than 13 minutes analyzing economic and market forecasts, you've wasted 10 minutes of your time.\"\r\n\r\n---\r\n\r\n### Psychology Rule #8: Pay No Attention to Macroeconomic or Geopolitical Events\r\n\r\n- Counterintuitive to most people, who believe successful investing requires tracking GDP, interest rates, yield curves, inflation, etc. Adam calls this \"absolute crap and rubbish.\"\r\n- **Two reasons:**\r\n  1. No one can predict macroeconomic events (interest rate moves, inflation) — at best a 50-50 guess.\r\n  2. Even if you could predict the event, **you can't predict how the market will react to it.**\r\n- Same logic applies to geopolitical events (e.g., Omicron, government shutdowns) — the market reacts instantaneously and unpredictably; there's no way to profit from reading this news in advance.\r\n- Adam admits he *does* discuss interest rates, GDP, and inflation in his newsletter/YouTube videos — but purely for **intellectual and entertainment purposes**; he assigns **zero weight** to any of it in actual buy/sell decisions. All of it is \"market noise.\"\r\n- **Peter Lynch quote:** \"Your ultimate success or failure will depend on your ability to ignore the worries of the world long enough to allow your investments to succeed.\"\r\n- **The only valid reason to sell a stock is that the underlying business itself is no longer a great business** — never sell because of macro or geopolitical reasons.\r\n- Illustrative list of \"reasons to sell\" that scared people out of the 2009–2019 bull run and caused them to miss ~500% growth: 600,000 jobs lost in March; Chrysler/GM bankruptcy filings; BP oil spill; the Flash Crash; European sovereign debt crisis; a powerful earthquake; S&P downgrading US debt; fiscal cliff talks; US government shutdown; the \"taper tantrum\"; Ebola contagion fears; Brexit; Charlottesville; \"Dow falls to biggest point decline ever\"; another government shutdown; S&P entering a bear market; the trade war; the yield curve inverting; an Iranian bombing; an emergency Fed injection. **Every one of these was a reason people sold or avoided buying — and the market kept rising through all of them.**\r\n\r\n---\r\n\r\n### Psychology Rule #9: Risk Management and Capital Protection\r\n\r\n- Most people, before buying, only think about **how much they can make** — they never ask how much they'd lose if wrong. **Professional investors do the opposite: ask \"how much can I lose if I'm wrong?\" FIRST, then \"how much can I make?\"**\r\n- **\"Always protect your downside and the upside will take care of itself.\"**\r\n- **Rule #1 of successful investing: do not lose money. Rule #2: how much money can I make.** (Attributed framing, echoing Buffett's famous rules.)\r\n- **Never put all your eggs in one basket** — \"there's no such thing as a sure thing.\" Even a genuinely great business can be hit by unforeseeable news.\r\n- **Example: Boeing.** Adam owned Boeing shares for many years; a great, historically strong business — but the 737 MAX crashes/grounding plus the pandemic caused a **50% share price drop**. If your entire portfolio had been in Boeing, you'd have been down 50%. (It has since recovered.)\r\n- **Solution: diversify across many great companies** so temporary drawdowns in one or two names are buffered by gains in the rest, keeping the overall portfolio growing.\r\n- **Key principle:** \"If you buy a portfolio of great companies and you buy them for less than what they are worth, collectively, you cannot lose money.\"\r\n- **Concrete allocation guidance:** hold a **minimum of 8 companies, ideally 20–30**. Risk only a small % of capital per position — e.g., 10 companies → 10% allocation each; 20 companies → 5% allocation each.\r\n\r\n---\r\n\r\n### Psychology Rule #10: Take Responsibility and Learn From Mistakes\r\n\r\n- You will make mistakes investing — everyone does. **\"It's not what happens to us that determines our success or failure. But it is how we choose to respond to what happens that determines the outcome.\"** You can choose to learn, or make excuses, ignore mistakes, or blame someone else.\r\n- **How do you know if an investment is actually a mistake?**\r\n  - **NOT a mistake:** price drops 10/20/30/even 40% after purchase, while the underlying business is still growing and still passes all the fundamental steps. Short-term price is uncontrollable, manipulated, and emotion-driven. If you still have available cash, this can even be an opportunity to **average down** (add shares).\r\n  - **IS a mistake:** the underlying business fundamentals have deteriorated (lost competitive advantage / no longer a good business), OR you discover post-purchase that it actually failed one of your investment criteria.\r\n- **When you realize it's a genuine mistake: sell immediately** — regardless of whether the price is above or below your purchase price. \"Win, lose, or draw, get out, cut it, take the cash and reinvest it into a great company that can grow your money from there forth.\" Don't hold out hoping \"it's going to come back.\"\r\n- **The \"fire the employee\" analogy:** think of yourself as the boss of a company. If you hire a salesperson who brings in no sales and is rude to customers, you fire them immediately rather than paying them more and hoping they change. Treat a lousy stock holding the same way — cut it regardless of sunk cost (salary already paid = losses already taken).\r\n- **\"Think logically and not emotionally. Never get emotional about a stock and be emotionally attached to it because the stock doesn't know who you are. The stock doesn't care who you are.\"** You don't have to \"make the money back\" from the same stock — you can make it back from other great companies.\r\n- **Never blame anyone for losing money** — not the market, not God, not your broker, not your mother-in-law, your wife, or your kids. **Blaming = giving away control.** \"When you blame someone, it means they are controlling your results... As long as people are controlling your results, they are controlling your life, you can't change your life.\"\r\n- **Take ownership/responsibility** — believing \"I am creating my results, I'm creating my life\" gives you the power to change your life and your results.\r\n- Closing quote: **\"For things to change, I must change first.\"** Don't wait for the world to get better — focus on making yourself better through constant learning, skill growth, and strengthening your psychology.\r\n\r\n---\r\n\r\n### Full 10-Rule Summary (as recapped by Adam at the end)\r\n\r\n1. **Be disciplined** — follow the rules of your predetermined investment plan.\r\n2. **Invest only in what you understand** — stick to your circle of competence; don't blindly follow experts.\r\n3. **Be patient and think long-term** — wealth compounds slowly, then explosively.\r\n4. **Buy slowly and sell even slower** — patience on entry, extreme patience on exit; hold great companies \"forever.\"\r\n5. **Focus on business performance, not stock price**, to judge investment success.\r\n6. **Think independently** — go against the crowd; be greedy when others are fearful, fearful when others are greedy.\r\n7. **Never attempt to predict the market** — follow the trend and fundamentals instead of forecasts.\r\n8. **Pay no attention to macroeconomic or geopolitical events** — focus purely on the business itself.\r\n9. **Risk management and capital protection** — diversify (8–30 companies), protect downside first.\r\n10. **Take responsibility and learn from your mistakes** — cut real mistakes fast, never blame others.\r\n\r\n---\r\n\r\n### Key Takeaways\r\n\r\n- Investing success is **70% psychology, 30% strategy** — most people over-invest in learning strategy and neglect the psychological/behavioral side entirely.\r\n- The core emotional trap is **fear and greed**: buying out of greed (FOMO, chasing hype) and selling out of fear (panic on bad news) is the default human behavior pattern and the primary destroyer of investment returns.\r\n- Short-term stock prices are driven by **emotion, manipulation, and unpredictable news** — not by business fundamentals. Long-term prices always converge back to reflect business value. This single distinction underlies almost every rule in the lesson (rule #1, #5, #7, #8).\r\n- **Discipline = pre-committing to objective rules before emotion arrives**, then refusing to deviate even under social pressure (public ridicule, underperformance vs. the crowd) or market pressure (drawdowns).\r\n- **Contrarian positioning against crowd emotion** (buy fear, sell greed) is one of the only repeatable edges available to individual investors, because emotional extremes are visible in media tone, sentiment indices, and social conversation.\r\n- **Predictions — economic, geopolitical, or market-direction — are close to worthless** (~50/50 odds) and are actively harmful because they cause you to override your rules. Financial media predicts crashes constantly because fear sells; nearly all such predictions over the past decade were wrong.\r\n- **Inactivity is an edge.** Trading frequency is negatively correlated with returns (Fidelity dormant-account study); the biggest gains come from long, patient holding, not frequent buying/selling.\r\n- **Diversification (8–30 positions, 5–10% max allocation) plus buying only undervalued great businesses is presented as a near risk-free combination** for capital protection: \"You cannot lose money if you buy a group of great companies and you buy them for less than what they are worth.\"\r\n- **A real investment mistake is a change in business fundamentals or a failed criterion — not a price decline.** Confusing these two is one of the most damaging psychological errors an investor can make.\r\n- **Personal responsibility is the foundation that makes every other rule usable.** Blaming external causes (brokers, luck, \"the market\") removes your ability to learn and improve; only ownership of outcomes creates the power to change results.\r\n\r\n---\r\n\r\n### Psychology Rules Checklist (Practical)\r\n\r\nBefore buying:\r\n- [ ] Have I run this through my full seven-step investment analysis myself, regardless of who recommended it?\r\n- [ ] Is this inside my circle of competence — do I genuinely understand the business?\r\n- [ ] Does it meet ALL my predetermined fundamental + technical criteria (profitable, low debt, undervalued, uptrend)?\r\n- [ ] Am I buying because of FOMO, a rumor, or someone else's opinion? (If yes — stop.)\r\n- [ ] Is the crowd euphoric right now? (If yes, be cautious; don't chase.)\r\n- [ ] Is the crowd fearful/panicked right now with \"worst day\" headlines? (If yes, that's often a buying window.)\r\n- [ ] Am I buying in tranches, not all at once?\r\n- [ ] Have I sized this position so no single stock is more than ~5–10% of my portfolio, with at least 8 (ideally 20–30) holdings?\r\n- [ ] Have I asked \"how much can I lose?\" before asking \"how much can I make?\"\r\n\r\nWhile holding:\r\n- [ ] If the price has dropped, has the underlying BUSINESS changed — or is this just short-term price noise? (Only the former is a \"mistake.\")\r\n- [ ] Am I ignoring today's macroeconomic/geopolitical headlines when making buy/sell decisions?\r\n- [ ] Am I ignoring market forecasts and predictions from analysts, banks, and media?\r\n- [ ] Am I resisting the urge to sell a great company just because it's \"up 20%\" and I want to lock in quick profits?\r\n- [ ] If a great holding drops temporarily, am I treating it as a chance to add shares rather than a reason to panic?\r\n\r\nBefore selling:\r\n- [ ] Am I selling because the business fundamentals genuinely deteriorated / it failed a criterion — or because of price movement, macro news, or emotion?\r\n- [ ] If it IS a genuine mistake, am I selling immediately (win, lose, or draw) rather than \"hoping it comes back\"?\r\n- [ ] Am I emotionally attached to this stock in a way that's clouding judgment? (\"The stock doesn't know who you are.\")\r\n\r\nAfter a loss or mistake:\r\n- [ ] Am I taking full responsibility instead of blaming the market, broker, or anyone else?\r\n- [ ] Am I extracting the specific lesson (which rule/criterion did I skip or violate)?\r\n- [ ] Am I reinvesting the recovered capital into a great business rather than staying in a lousy one?\r\n\r\nGeneral discipline maintenance:\r\n- [ ] Am I thinking and feeling opposite of the crowd (fearful when greedy, greedy when fearful)?\r\n- [ ] Am I thinking in years/decades, not days/months?\r\n- [ ] Am I keeping an investment journal and portfolio tracker?\r\n- [ ] Am I limiting my \"activity\" — resisting the urge to trade frequently?\r\n- [ ] Am I re-reading these 10 rules regularly to keep them front of mind?\r\n\r\n---\r\n\r\n# Appendix — Source Video Index\r\n\r\nAll 55 videos in this folder, in course order (23h 7m total runtime). Every one was transcribed and incorporated into the notes above.\r\n\r\n| # | Lesson Video | Durat function sec(raw,cutoff){need(date(cutoff)&&raw&&Number.isInteger(raw.cik)&&raw.facts,'CompanyFacts and filing-date cutoff required');const tags={revenue:['RevenueFromContractWithCustomerExcludingAssessedTax','Revenues','SalesRevenueNet'],income:['NetIncomeLoss'],ocf:['NetCashProvidedByUsedInOperatingActivities'],capex:['PaymentsToAcquirePropertyPlantAndEquipment'],equity:['StockholdersEquity']};const out={cik:raw.cik,entity:String(raw.entityName||''),cutoff,facts:{},warnings:[]};for(const [name,alternatives] of Object.entries(tags)){let candidates=[];for(const tag of alternatives){for(const f of raw.facts['us-gaap']?.[tag]?.units?.USD||[]){const days=(Date.parse(f.end)-Date.parse(f.start))/86400000;if(finite(f.val)&&date(f.end)&&date(f.filed)&&f.end<=cutoff&&f.filed<=cutoff&&['10-K','10-K/A','20-F','20-F/A'].includes(f.form)&&/^\d{10}-\d{2}-\d{6}$/.test(f.accn||'')&&(name==='equity'?!f.start:date(f.start)&&days>=330&&days<=380))candidates.push({...f,tag,unit:'USD'});}}
