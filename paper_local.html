ing a lot of money**. The negative equity comes from **years of aggressive share buybacks creating a huge negative treasury stock line.**\r\n\r\n**Worked example — McDonald's (latest quarterly balance sheet on StockOracle):**\r\n- **Shareholders' equity = −790** (negative)\r\n- **Retained earnings = $70 billion** — they have made a lot of money\r\n- **Treasury stock = $79 billion** — shares bought back from the market\r\n- $70B retained earnings − $79B treasury stock → **negative equity**\r\n- Scrolling up confirms: **revenue increasing, net income increasing, free cash flow increasing. Very, very good business.**\r\n\r\n> **Rule:** negative shareholders' equity is **fine — even a good thing — as long as** (a) the company is making a lot of money, (b) **profits are increasing consistently**, (c) **free cash flow is increasing consistently**, and (d) the cause is **a large treasury stock balance**.\r\n\r\n#### 3.6 Worked example — Pepsi's balance sheet (StockOracle, latest quarterly, US$ millions)\r\n\r\n| Line | Figure |\r\n|---|---|\r\n| **Total assets** | **107,399** |\r\n| **Total liabilities** | **86,852** |\r\n| **= Total shareholders' equity** | 107,399 − 86,852 (transcript reads the figure as \"24,06\", partially garbled) |\r\n| Cash and short-term investments | **9,530** ( = **$9.53 billion**) |\r\n| Net accounts receivable | **9,035** |\r\n| **Total current assets** | **27,901** |\r\n| **Total current liabilities** | **32,764** |\r\n| Total non-current assets | **79,498** |\r\n| **Short-term debt** | **6,861** |\r\n| **Long-term debt** | **42,321** |\r\n| **Total debt** | 6,861 + 42,321 |\r\n| Common stock | **23** |\r\n| Additional paid-in capital | **4,451** |\r\n| Retained earnings | **72,788** |\r\n| Treasury stock | *(deducted — always negative)* |\r\n| Accumulated other comprehensive income | **−15…** |\r\n\r\n- Current ratio for Pepsi = **27,901 ÷ 32,764** (all pre-calculated on the websites).\r\n- Adam's repeated warning: **\"The figure by itself is meaningless. All these figures are meaningless unless you compare them with other figures. It's all relative.\"**\r\n\r\n#### 3.7 The THREE debt/safety ratios Adam uses\r\n\r\n> *\"There are of course many other debt ratios. You don't need to look at all of them. These are the three main ones that are sufficient.\"*\r\n\r\n**① Current Ratio**\r\n```\r\nCurrent Ratio = Current Assets ÷ Current Liabilities\r\n```\r\n- **Threshold: greater than 1 is safe.** You want more assets than liabilities — the top bigger than the bottom.\r\n- Pre-calculated on all financial websites.\r\n\r\n**② Debt to EBITDA Ratio**\r\n```\r\nDebt / EBITDA = Total Debt ÷ EBITDA\r\nwhere Total Debt = Short-term debt + Long-term debt\r\n```\r\n- **EBITDA** = **Earnings Before Interest, Taxes, Depreciation and Amortization** — another kind of earnings, before deducting interest expenses, taxes, depreciation and amortization.\r\n- **Threshold: less than 3 is safe.**\r\n- **Worked example:** total debt **$3 billion** ÷ EBITDA **$1.5 billion** = **1.5×** → the company could **repay all its debt within 1½ years** of profits.\r\n- If the ratio is **3**, it would take **three years** of annual profits to repay the debt.\r\n- **Why taxes are excluded:** *\"because if it's making losses, there's no taxes\"* — so taxation is not included in the measure.\r\n\r\n**③ Debt Servicing Ratio**\r\n```\r\nDebt Servicing Ratio = Net Interest Expense ÷ Cash Flow from Operations × 100%\r\n```\r\n- **Net interest expense** = interest paid on debt **net of** interest earned on investments.\r\n- **Threshold: less than 30% is safe. More than 30% would be very dangerous.**\r\n- **Worked example:** company pays **$1 million** of interest a year and generates **$10 million** of cash flow from operations → **10% → safe.**\r\n- **Personal analogy:** you earn **$5,000 a month take-home** (your \"cash flow from operations\") and pay **$1,000 a month interest** on bank loans → **20% → safe**. But if you paid **$4,000 in interest out of $5,000 earned → too high.** *\"Same thing for an individual, same thing for a company.\"*\r\n\r\n**Pass requirement:** *\"Must all three pass for it to be a safe investment? Ideally, yes. But if the company can pass **two out of three**, I'm also okay in investing in that kind of company.\"*\r\n\r\n#### 3.8 ⚠️ When a current ratio below 1 is FINE\r\n\r\n**Reason A — deliberate supplier squeeze (Pepsi)**\r\n- Pepsi's current ratio is **below 1 — about 0.85**. **They do it intentionally.**\r\n- Because Pepsi is so big it has **enormous leverage over its suppliers**, so it **deliberately drags out payments** — instead of paying suppliers in **30 days**, it pays in **60 to 90 days**.\r\n- This **reduces the working capital Pepsi needs (a good thing)** but **inflates accounts payable → inflates current liabilities → pushes the current ratio below 1.**\r\n- Check the rest of the picture and Pepsi is clearly safe:\r\n  - **Debt servicing ratio 9.79%** (way below 30%)\r\n  - **Interest coverage ratio 12.52** (way above 3)\r\n  - **Debt/EBITDA 2.59** (below 3)\r\n  - Revenue growing strongly; free cash flow very consistent and positive; net profits very positive\r\n  - **Cash conversion cycle very low** (a good thing) and **accounts receivables grow slower than revenue growth**\r\n\r\n**Reason B — subscription businesses and deferred revenue (ServiceNow)**\r\n- Software/subscription companies (**ServiceNow, Adobe, Salesforce**) collect **one year of service upfront**. Because the service has not yet been provided, this is booked as **deferred revenue**, which is recorded as a **current liability**.\r\n- Lots of deferred revenue **expands current liabilities → pushes the current ratio below 1**.\r\n- **ServiceNow:** **current ratio 0.95**, but **debt servicing ratio 0**, **interest coverage 90**, **debt/EBITDA 0.55**. Very profitable, very high quality.\r\n\r\n> **Conclusion: you can't look at one ratio in isolation. You have to compare it with the other ratios and look at everything in totality.** *\"Current ratio is important, but if it's below one, it doesn't matter if the other ratios are very, very strong.\"*\r\n\r\n#### 3.9 Two optional ratios Adam does NOT personally use\r\n\r\n**Interest Coverage Ratio** *(Adam: \"I don't use it myself because it is an overlap\")*\r\n```\r\nInterest Coverage = EBITDA ÷ Net Interest Expense\r\n```\r\n- **Worked example:** EBIT/EBITDA of **$100 million**, interest expense of **$10 million** → **10×** → the company can cover its interest expense **10 times over from one year of profits — very, very safe.**\r\n- **Thresholds:** **3 or more = safe. 5 or more = very, very safe. Below 3 = getting risky, especially below 2.**\r\n- Meta Platforms example: **71** — very, very, very safe.\r\n\r\n**Cash Ratio** *(Adam: \"I think it's not necessary\")*\r\n```\r\nCash Ratio = Cash and Cash Equivalents ÷ Current Liabilities\r\n```\r\n- Same as the current ratio except the numerator **excludes accounts receivable and inventory** — cash and equivalents only.\r\n- **Thresholds:** **0.5 and above = very, very safe. Below 0.3 = getting risky.**\r\n- Meta Platforms example: **1.97** — very, very safe.\r\n\r\n#### 3.10 Worked example — Meta Platforms debt ratios (StockOracle → Company Metrics → scroll down)\r\n\r\n| Ratio | Latest | 5-year average | Threshold | Verdict |\r\n|---|---|---|---|---|\r\n| Current ratio | **2.6** (last quarter) | **2.72** | > 1 | Way above 1 |\r\n| Debt servicing ratio | **0** | — | \u003c 30% | *\"Very, very conservative\"* |\r\n| Debt / EBITDA | **0.59** | **0.3** | ≤ 3 | Pass |\r\n| Interest coverage | **71** | — | ≥ 3 (≥5 very safe) | Very, very safe |\r\n| Cash ratio | **1.97** | — | ≥ 0.5 | Very safe |\r\n\r\n#### 3.11 ⚠️ Where the three debt ratios DO NOT APPLY\r\n\r\nThe current ratio / debt-to-EBITDA / debt servicing trio **applies to all companies EXCEPT**:\r\n- **Banks**\r\n- **Financial companies, e.g. insurance companies**\r\n- **Property developers**\r\n- **REITs**\r\n- **Commodity companies**\r\n\r\n**Why:** *\"by the nature of their business, they are highly leveraged — they take on a lot of debt as compared to their equity. So if you use these three ratios, they will all fail.\"*\r\n\r\n**Adam's own position:**\r\n- **He personally avoids property developers and commodity companies** because of their high leverage.\r\n- **He does invest in banks, insurance companies and REITs** — using **different measures of debt** (below).\r\n\r\n#### 3.12 Bank-specific ratios\r\n\r\n**① Common Equity Tier 1 Ratio (CET1)**\r\n```\r\nCET1 Ratio = Common Equity Tier 1 ÷ Risk-Weighted Assets\r\nwhere Common Equity Tier 1 = cash + common stock + retained earnings\r\n```\r\n- Part of the **Basel III requirements** — the **international standard for banks**.\r\n- **International standard minimum: at least 4.5%.**\r\n- **Adam's own more conservative minimum: more than 10%.**\r\n- The calculation is *\"actually very complicated\"* — **don't calculate it yourself; just search it online** (e.g. Google \"DBS Bank common equity tier one ratio\").\r\n\r\n| Bank | CET1 ratio | Verdict |\r\n|---|---|---|\r\n| **DBS Bank** (biggest and most profitable bank in Singapore) | **14.1%** | Above Adam's 10% minimum, way above the 4.5% international standard. *\"Singapore banks are the safest in the world, based on this ratio.\"* |\r\n| **JP Morgan** (US) | **12.4%** | Very safe, above 10% |\r\n| **Bank of China** | **11.28%** | Above 10% |\r\n\r\n**② NPL Ratio (Non-Performing Loan Ratio)**\r\n```\r\nNPL Ratio = Non-Performing Loans ÷ Total Loans\r\n```\r\n- A **non-performing loan** is a loan not repaid within a certain period of time, which **could eventually become a bad debt**.\r\n- **Threshold: less than 5% is safe.**\r\n- **DBS Bank NPL ratio = 1.5%** — *\"which is great\"* — only 1.5% of DBS's loans are non-performing.\r\n\r\n#### 3.13 REIT-specific ratio\r\n\r\n**Gearing Ratio (a.k.a. Aggregate Leverage)**\r\n```\r\nGearing Ratio = Total Debt ÷ Total Assets\r\n```\r\n- A **REIT (real estate investment trust)** means **buying a portfolio of real estate properties**. REITs **take bank loans to finance the properties**; too much loan is risky, especially since they pay a lot of interest and **if interest rates rise they could be in trouble.**\r\n- **Threshold: less than 45%.** Meaning **less than 45% of the properties are financed by debt**, the rest financed by equity.\r\n- **Where to find it:** go to the **REIT's own website → download the annual report / investor presentations →** the gearing ratio is stated.\r\n- Example: **Ascendas REIT — aggregate leverage 37.6%**, less than 45% → **safe**.\r\n\r\n---\r\n\r\n### 4. The Statement of Cash Flows — the MOST IMPORTANT statement\r\n\r\n> *\"Out of these three parts, which do you think is the most important one? If we could only look at one, which would it be? The answer is the statement of cash flows. This is the most important of all.\"*\r\n\r\n#### 4.1 Why cash beats profit\r\n\r\nCash flow tells you how much cash is **actually** coming into and going out of the business. **A company can report high profits without the cash ever arriving.**\r\n\r\n**Illustration:** a company reports **$5 million in profits** but its **cash flow from operations is only $2 million.** How?\r\n\r\n1. **Uncollected sales / bad debt** — the company sells products to customers and **records the profit, but the customer never pays.** It becomes a **bad debt**. The profit was recorded; the cash never came in.\r\n2. **Asset revaluation gains** — Adam's real example: a **palm oil company** owned palm trees worth about **$50 million**. The next year the palm trees grew bigger, the company **re-valued the assets at $100 million**, declared a **$50 million gain on assets**, and **added it into other income** — **inflating net profit by $50 million with zero cash actually coming in**, because nothing was sold.\r\n\r\n> **\"Many times companies could creatively inflate their profits, where the company looks profitable but they are not really generating cash. And this is what causes a lot of companies that look profitable to go bankrupt.\"**\r\n> **\"Which is more important, recording the profit or actually collecting cash? It's the cash.\"**\r\n\r\n#### 4.2 The three sections\r\n\r\n**① Cash Flow from Operations (net operating cash flow, OCF)** — ⭐ **the important one**\r\n- How much cash came in or went out **as a result of the company's operations**. For McDonald's: **selling burgers and fries**. For Google: **selling advertisement through search and YouTube**.\r\n- **This is the section used later to calculate the intrinsic value of the business and of the shares.**\r\n- **RULE: OCF must be POSITIVE and INCREASING CONSISTENTLY over the last 5 years.**\r\n- If OCF is **negative**, *\"something's wrong — the company, while doing business, is losing more cash than earning cash.\"*\r\n- **Low-quality business signature:** OCF that is **not consistently positive** (positive, negative, negative, positive, negative) **or** that **goes up, down, up, down, up, down**. *\"Those are businesses I don't like to invest in.\"*\r\n- **⚠️ Exception:** by the nature of their business, **banks, commodity companies and property developers** tend to have **inconsistent operating cash flows**. **For these three types of company this rule doesn't apply.** For all other companies it does.\r\n\r\n**② Cash Flow from Investing (net investing cash flow)**\r\n- Cash in/out as a result of the company's **investment activities**.\r\n- **Cash OUTFLOW (negative):** the company **buys equipment, buys land, builds a plant** — this is **capex (capital expenditures)**.\r\n- **Cash INFLOW (positive):** the company **sells a machine, sells equipment, sells an asset, sells shares it owns of other companies**.\r\n- **Positive does NOT mean good and negative does NOT mean bad. It just tells you the company's investment activities.**\r\n\r\n**③ Cash Flow from Financing (net financing cash flow)**\r\n- Cash in/out as a result of the company's **financing activities** — i.e. **raising money**. A company can raise money two ways: **borrowing** or **selling equity**.\r\n- **Cash INFLOW (positive):** borrowing money from the bank, **selling bonds**, or **selling new shares through a rights issue**. *\"Generally, positive means the company's raising money, either through debt or through equity — and that normally happens for new companies.\"*\r\n- **Cash OUTFLOW (negative):** **paying back bank loans**, **buying back shares**, **paying dividends**.\r\n- **Again, positive is not good and negative is not bad.** Mature, big, profitable companies (**Microsoft, Google, Nvidia**) don't need to raise money — so their financing line is **negative because they are buying back shares and paying dividends**, which **is good for us as shareholders.**\r\n\r\n> **Summary of signs:** *\"For the second and third section, positive and negative is not good or bad — it just tells you how money's moving. But the first one has to be positive, and it has to be increasing over the last five years.\"*\r\n\r\n#### 4.3 Free Cash Flow\r\n\r\n```\r\nFree Cash Flow (FCF) = Net Operating Cash Flow (OCF) − Capital Expenditures (Capex)\r\n```\r\n- Capex sits inside the **cash flow from investing** section. FCF is already **pre-calculated at the bottom of the cash flow statement** on StockOracle.\r\n- **RULE: free cash flow must be CONSISTENTLY POSITIVE.** Ideally **also increasing consistently.**\r\n- **When FCF is positive, the company can:**\r\n  1. **Pay dividends** (which we like as shareholders)\r\n  2. **Buy back shares** (which we like as shareholders)\r\n  3. **Keep the money as retained earnings**\r\n  4. **Pay off debt**\r\n- **Negative FCF for one year or two years, once in a while, is OK.**\r\n- **But consistently negative FCF for two or three years in a row is very dangerous:** more cash is going out than coming in, **the company will eventually run out of cash**, and it is then **forced to raise cash — sell more shares (diluting shareholders), take more bank loans, or sell more bonds (increasing debt).** *\"That's a lousy business.\"*\r\n\r\n#### 4.4 ⚠️ The AI capex exception (recorded 2026)\r\n\r\n- **Microsoft, Google, Meta Platforms and Nvidia** have been **investing very heavily into AI data centers**, spending **billions and billions** to build AI capability.\r\n- Since **FCF = OCF − capex**, the **capex spike has caused their free cash flow to fall.** **Their FCF is still positive**, just lower.\r\n- **Adam is not concerned, for two reasons:**\r\n  1. **The increased capex will lead to higher future growth and will further strengthen their economic moat.**\r\n  2. **The increase in capex is temporary** — it is a burst of massive AI investment that **will take maybe two, three, four years**, after which **capex drops and free cash flow goes back up.**\r\n- **The diagnostic rule:**\r\n  - **FCF fell because OPERATING cash flow fell → that IS a cause for concern.**\r\n  - **FCF fell because CAPEX rose temporarily while operating cash flow is still going up (investing for future growth) → that is fine.**\r\n\r\n#### 4.5 Worked examples\r\n\r\n**Alphabet / Google — HIGH QUALITY (StockOracle → Financials → cash flow statement, annual)**\r\n- Last financial year ended **31 December 2025**; TTM happened to coincide exactly with the last financial year.\r\n- **Net operating cash flow (TTM): 164,713 million.**\r\n- OCF series: **$54 billion → $65B → $91B → $91B (slight drop) → $101B → $125B → $164B.** *\"Do you generally see an uptrend? … The answer is yes. That's a high quality business.\"*\r\n- **Net cash flow from investing:** negative every year; last 12 months **−120,000 million (−$120 billion)** — simply means the company **is making investments**, not bad.\r\n- **Net cash flow from financing:** negative every year — **Google is buying back shares and paying dividends.** Good for shareholders.\r\n- **Free cash flow:** positive, positive, positive — and rising. On the Pro-account chart: **operating cash flow (orange) rising consistently; free cash flow (dark green) rising consistently and positive.** *\"That is what we want to see. That is a high quality business.\"*\r\n\r\n**Intel (INTC) — NOT high quality**\r\n- Semiconductor company. *\"Not all semiconductor companies are high quality.\"*\r\n- **Operating cash flow increased from 2017 to 2020, then dropped and went sideways after 2020.** *\"This is not what I like to see.\"*\r\n- **Free cash flow rose, then decreased, then turned negative — five years of negative free cash flow.** *\"For me, I won't touch this kind of business.\"*\r\n\r\n**Singapore Airlines — NOT investable (despite being a great airline)**\r\n- *\"Singapore Airlines to me is one of the best airlines in the world. But would I buy the shares? No.\"*\r\n- **Why all airlines are avoided:**\r\n  - Very, very **cyclical** — depends heavily on **tourism and the economy**\r\n  - **Very high maintenance capex** — refurbishing and repairing planes, buying new planes\r\n  - **High fuel costs**\r\n  - **Very tough and very competitive business**\r\n  - Result: **all airlines have very inconsistent operating cash flow and very inconsistent free cash flow.**\r\n- *\"It's not the fault of the management. It's the nature of the industry.\"*\r\n- Chart reading: OCF **flat, going down, turned negative during COVID, positive, up, then down again** = **inconsistent cash operations**. FCF **negative for five straight years**; then after **2022** very high FCF, but **declining ever since**.\r\n- Consequence of persistent cash losses: **keep issuing bonds, keep raising debt, keep selling shares → dilutes shareholders and loads the company with debt.**\r\n\r\n**MasterCard — the contrast**\r\n- A **payment technology** business Adam has invested in: **operating cash flow very, very consistent; free cash flow very, very consistent.**\r\n- *\"There are many ways to make money, and to me I'd rather make money in an easy way by buying businesses where the cash flow generation is very, very consistent, very, very predictable.\"*\r\n\r\n---\r\n\r\n### 5. Financial Metrics — Profitability, Fraud Screens and Efficiency\r\n\r\n#### 5.1 ROE — Return on Equity\r\n\r\n```\r\nROE = Net Profit After Tax (Net Income) ÷ Shareholders' Equity × 100%\r\n```\r\n- *\"This is one of **Warren Buffett's favorite criteria** in investing in a company.\"*\r\n- **What it measures:** how good the company is at making money **based on the shareholders' stake in the business**.\r\n- **Worked example:** net income **$126 million** ÷ shareholders' equity **$420 million** = **30% ROE**.\r\n- **Thresholds:**\r\n  - **ROE of 12% → a good business**\r\n  - **ROE above 15% → an excellent investment**\r\n  - *\"The majority of companies that I'm investing in, you find that the ROE is often above 15%.\"*\r\n- **Look at ROE over the last 5 years** to ensure it is **consistently above 12–15%**.\r\n\r\n**⚠️ ROE when shareholders' equity is negative (McDonald's, Yum Brands):**\r\n- When equity is negative because of large treasury stock, **ROE becomes undefined.**\r\n- **Some websites report McDonald's ROE as negative — \"that is actually not accurate,\"** because profit generated from negative equity is **effectively infinity**. **ROE is infinite, which is very good.**\r\n- *\"It basically means that company makes profit without having any equity.\"*\r\n\r\n#### 5.2 ROIC — Return on Invested Capital\r\n\r\n```\r\nSimplified:  ROIC = Profit ÷ (Equity + Debt)\r\n\r\nFull formula:\r\nROIC = [ EBIT × (1 − tax rate) ] ÷ ( Shareholders' Equity + Total Debt − Cash and Equivalents )\r\nwhere EBIT = Earnings Before Interest and Taxes\r\n```\r\n- **Why it exists:** ROE alone only tells you **one part of the story**. **Some companies artificially inflate their ROE by taking on a lot of debt and using the debt to buy back shares.** **ROIC penalizes companies that do that.**\r\n- **What it measures:** how efficient a company is at using its **total capital (equity AND debt)** to generate a profit.\r\n- **Thresholds (same as ROE):**\r\n  - **Over 12% → good**\r\n  - **Over 15% → excellent**\r\n- **⚠️ ROIC does NOT apply to banks** — banks are **highly leveraged by the nature of their business**, which makes **ROIC artificially very low**. **For banks, look at ROE only and ignore ROIC.**\r\n- **⚠️ ROIC also does NOT apply to insurance companies.** (Ping An Insurance is both an insurance company and a bank → **use ROE only**.)\r\n- You never calculate this by hand — it is pre-calculated on the websites.\r\n\r\n**Where to find ROE and ROIC:**\r\n- **StockOracle → Company Metrics → scroll down → Profitability Ratios.** Shows the **latest / last 12 months**, the **5-year average** and the **10-year average**. Pro account also gives multi-year numbers and **trending charts** (line or bar).\r\n- **Fallback for non-US stocks: Morningstar.com free section → Key Metrics → Profit and Efficiency Ratios.**\r\n\r\n**Worked example — MasterCard (StockOracle):**\r\n- **ROE (last 12 months) = 210%** — *\"really, really good\"*\r\n- **ROIC (last 12 months) = 58.4% (58.41%)** — *\"really, really high\"*\r\n- On the trend chart: ROE increasing, ROIC pretty consistent. *\"We don't need it to increase. As long as it is fairly consistent, it's 12 and above, that's a pretty good business — but of course if it's increasing that's even more powerful.\"*\r\n\r\n#### 5.3 Revenue growth vs Accounts Receivable growth — the fraud screen\r\n\r\n**RULE: Sales revenue must grow FASTER than accounts receivable. Accounts receivable must NOT grow faster than revenue.**\r\n\r\n- **Accounts receivable** = the company sold a product (usually to another company) and **has not been paid yet** — revenue that has **not been converted to cash**.\r\n- **Too much accounts receivable is not good** — it means **the company is not collecting its debt quickly.**\r\n- **If accounts receivable grow FASTER than revenue, that is very dangerous.** It means one of three things:\r\n  1. **The customers are in trouble** (can't pay)\r\n  2. **The company is bad at collecting payments**\r\n  3. **The revenue is fictitious** — *\"Over the years, I've seen companies that have generated fictitious revenue, fake revenue. And when they record fake revenue, there's no money coming in. So to fool the public, they actually show it under accounts receivables.\"*\r\n- **\"A higher/increasing accounts receivable is a major red flag.\"**\r\n\r\n**Where to check:**\r\n- **StockOracle → Financials →** one of the **preset default charts** plots sales revenue against accounts receivable. Example shown: **MasterCard** — *\"the sales revenue is growing a lot faster than the accounts receivables. That's what I'm looking for.\"*\r\n- **TradingView (manual):** ticker → choose the **5-year timeframe** → **Indicators** → add **Revenue** and plot it against **Accounts Receivable**.\r\n- **TradingView (Piranha Profits custom indicator — recommended):**\r\n  1. Go to the **Piranha Profits lesson page → Lesson 4 → \"Course Notes and Resources\"** at the end of the lesson.\r\n  2. Below the course notes, find **\"Total Revenue vs Accounts Receivables\" custom indicator for TradingView** and click the link.\r\n  3. Scroll down and click **\"Add to Favorites\"**. (You need a **TradingView account — a free account is fine**; register and log in first.)\r\n  4. In TradingView (web charts or the desktop app) → **Indicators → Favorites → \"Revenue vs Accounts Receivables\"**.\r\n  5. It auto-plots **revenue in green** vs **accounts receivable in red**.\r\n- Example shown: **Alphabet** — revenue growing faster than accounts receivable. *\"So that's great.\"*\r\n\r\n#### 5.4 CCC — Cash Conversion Cycle (management effectiveness)\r\n\r\n```\r\nCCC = DIO + DSO − DPO\r\n\r\nDIO (Days Inventory Outstanding)  = Average Inventory ÷ Cost of Goods Sold × 365\r\nDSO (Days Sales Outstanding)      = Accounts Receivable ÷ Net Credit Sales\r\nDPO (Days Payable Outstanding)\r\n```\r\n- **What it measures:** *\"the length of time in days that it takes for a company to convert its investments in inventory and other resources into cash flows from sales.\"*\r\n- **⚠️ APPLIES ONLY to retail companies that sell physical goods** — e.g. **Nike, Apple, Walmart, Costco, Pepsi**. **Does NOT apply** to companies that do not sell a physical product — e.g. **Google, YouTube, Microsoft**.\r\n\r\n**Intuition examples:**\r\n- **A restaurant:** take out cash → buy ingredients → cook → sell → customer pays. **CCC ≈ 1 to 3 days.**\r\n- **A real estate company:** take out cash → buy land → spend on marketing and materials → buyers pay progressively as construction proceeds. **CCC ≈ 3 to 5 years / \"two or three years.\"**\r\n\r\n**The rule:**\r\n- **It does not matter how long or short the CCC is — what matters is that it is CONSISTENT.**\r\n- **Consistent or getting shorter = good** — the company is getting its money back faster and is **very efficient at turning around its inventory.**\r\n- **Getting longer and longer = RED FLAG** — the company **could be in trouble because it's not able to sell the inventory fast enough to get back the cash.**\r\n- **A NEGATIVE cash conversion cycle is the best** — it means **the business collects cash upfront BEFORE it pays its suppliers.** **Pepsi's CCC is negative all the way** — *\"that's very, very good.\"*\r\n\r\n**Where to find it:**\r\n- **TradingView:** ticker → 5-year timeframe → **Financials → type \"cash conversion cycle\"** → choose **quarterly** (more data points) or annual. Example: **Nike** — trend is flat, one bump up then coming down again → *\"it looks fine.\"*\r\n- **StockOracle:** **Financials → scroll down → cash conversion cycle chart** (hover for numbers); **or Company Metrics → Efficiency Ratios** → shows current, **5-year average** and **10-year average** (history depth depends on your package).\r\n\r\n---\r\n\r\n### 6. The 12-Point Fundamental Checklist (Adam's Full Summary)\r\n\r\n> *\"If you can ensure that the company you invest in checks all the 12 points, you know it's a great company: it's very profitable, it's very safe, and it's well managed.\"*\r\n\r\n#### Group A — Is the company PROFITABLE? (metrics 1–6)\r\n\r\n| # | Check | Threshold / rule |\r\n|---|---|---|\r\n| 1 | **Sales revenue AND net income increasing consistently** | Over the **last 5 years** (10 better). If net income is not consistent, **operating income** must be growing consistently. |\r\n| 2 | **Cash flow from operations increasing consistently** | Over the **last 5 years** |\r\n| 3 | **Free cash flow consistently positive** | FCF = OCF − capex |\r\n| 4 | **Gross profit margin and net profit margin consistent or increasing** | Not decreasing; compare vs closest competitors too |\r\n| 5 | **ROE** | **12–15% or higher** |\r\n| 6 | **ROIC** | **12–15% or higher** |\r\n\r\n#### Group B — Is the company FINANCIALLY STRONG? (metrics 7–10)\r\n\r\n> *\"It's not going to go bankrupt easily. In fact, it's something you can buy and you can sleep soundly at night.\"*\r\n\r\n| # | Check | Threshold |\r\n|---|---|---|\r\n| 7 | **Current ratio** | **1 or more** |\r\n| 8 | **Debt to EBITDA ratio** | **3 or less** |\r\n| 9 | **Debt servicing ratio** | **Less than 30%** |\r\n| 10 | **Special cases** | **Banks: Common Equity Tier 1 ratio > 10%.** **REITs: gearing ratio \u003c 45%.** |\r\n\r\n#### Group C — Is MANAGEMENT EFFECTIVE? (metrics 11–12)\r\n\r\n| # | Check | Threshold |\r\n|---|---|---|\r\n| 11 | **Cash conversion cycle** | **Consistent or declining, NOT increasing.** *Applies only to retail companies selling physical goods.* |\r\n| 12 | **Accounts receivable vs sales revenue** | **Accounts receivable must NOT be growing faster than sales revenue.** |\r\n\r\n---\r\n\r\n### 7. Case Study — HYFLUX (how the 12 metrics would have saved you)\r\n\r\n#### 7.1 What Hyflux was\r\n\r\n- A **water treatment company**, a **blue chip in Singapore**, and *\"once upon a time the darling of the Singapore Stock Exchange.\"*\r\n- **Widely promoted by analysts and stockbrokers.**\r\n- On the surface it looked good: **profits were going up, revenue was going up.**\r\n- **Temasek Holdings** — the **Singapore government sovereign wealth fund** — was a big backer of the stock, which gave people a lot of confidence.\r\n\r\n#### 7.2 What happened\r\n\r\n- Share price collapsed from **about $2 / $2.50 a share → 4 cents → eventually zero.**\r\n- **Not only stock investors lost everything — bond investors lost hope of recovering any money at all.**\r\n- Adam **never bought it and told his students to stay away** because **the fundamentals failed many of the metrics.**\r\n\r\n#### 7.3 The warning signs, in the financial statements, years in advance\r\n\r\n> *\"It didn't go bust overnight. Over the years, a lot of warning signs could be seen in the financial statements.\"*\r\n> *\"On the surface, revenue was growing, profit was growing — but if you dig deeper into the statement of cash flows, that's where you find problems. That's why I keep saying the statement of cash flows is the most important statement of all.\"*\r\n\r\n**🚩 Red flag 1 — Negative and inconsistent operating cash flow (as far back as 2006)**\r\n- **2006 through 2011** operating cash flow figures cited: **−26.8 million, 74 million, 29 million, 60 million, −49.5 million** — *\"extremely inconsistent, negative, negative, negative.\"*\r\n- The rule is that operating cash flow must be **increasing consistently** — Hyflux's was neither consistent nor reliably positive.\r\n\r\n**🚩 Red flag 2 — Negative free cash flow**\r\n- FCF = operating cash flow − **purchase of PPE (property, plant and equipment) = capex**.\r\n- **−26 million OCF − 19 million capex → negative free cash flow.**\r\n- **29 million − 18 million → still positive**, but **it turns negative again** in following years.\r\n\r\n**🚩 Red flag 3 — Paying dividends while free cash flow was negative**\r\n- *\"If your company has negative free cash flow, should you be paying out dividends? No. You should be conserving cash… You should only pay out dividends if your free cash flow is positive and you have got excess cash.\"*\r\n\r\n**🚩 Red flag 4 — Accounts receivable exploding vs revenue**\r\n\r\n| Year sequence | Revenue | Trade / accounts receivable |\r\n|---|---|---|\r\n| | **142 million** | **30 million** |\r\n| | **192 million** | **46 million** |\r\n| | **554 million** | **41 million** |\r\n| | **524 million** | **27 million** |\r\n| | **569 million** | **182 million** |\r\n\r\n- **In 2010, revenue grew 8% while accounts receivable grew 575%.**\r\n- *\"When accounts receivables suddenly jumps a lot higher than revenue, something's wrong with the business.\"*\r\n\r\n**🚩 Red flag 5 — Unsustainable debt levels (Debt/EBITDA fail)**\r\n- Short-term debt: **\"loans and borrowings\" of 95 million in 2010** (under current liabilities) **+ long-term debt**\r\n- **Total debt = $599 million**\r\n- **EBITDA = 106 million**\r\n- **Debt / EBITDA = 5.64** vs the threshold of **3 or less** → **\"a big fail.\"**\r\n\r\n#### 7.4 Why so many investors still bought it\r\n\r\n> *\"The trouble is most investors are lazy, or they're incompetent — they don't do a deep-dive research into the fundamentals of the business. They buy simply because of what they read in the media, because of what they are told by their bankers or their analysts or their brokers.\"*\r\n\r\n1. **\"Temasek Holdings is a major investor, so it must be safe.\"** — *\"a very, very wrong belief system.\"*\r\n   - **What people didn't realize: Temasek invested in Hyflux very early on and had already sold most of its shares for a big profit. They were already out of the stock by the time retail investors were buying.**\r\n2. **The celebrity status of the CEO, Olivia Lum** — featured in **Forbes Magazine**, **Entrepreneur of the Year**, a **Nominated Member of Parliament**. *\"I'm not saying she's not a good businesswoman — in fact I think she's a very good businesswoman. But no matter how great you are, you make mistakes as well, so do I. Don't just be seduced by how good someone is.\"*\r\n3. **Blindly following analyst and bank recommendations** — e.g. **Daiwa Capital Markets** said it believed Hyflux's share price had **reached an inflection point on 7 March**, expected the share price **to continue to rise as sentiment improves**, issued a **BUY rating with a target price of $2.40.** The stock then collapsed to **4 cents and then zero.**\r\n4. **\"It's a water treatment business, so it must be a strategic investment — everyone needs water.\"**\r\n\r\n> **Lesson:** *\"Do not be fooled by all these surface reasons for investing. You can always dig deep into the financial metrics of any investment.\"*\r\n\r\n---\r\n\r\n### 8. Great Business Models — The Pillars of a Great Business\r\n\r\n> *\"We only want to invest in the best businesses in the world — businesses with great business models that can survive and thrive through all economic conditions.\"*\r\n\r\nAdam opens by listing **six pillars** and then walks through them (the walkthrough order differs slightly from the opening list, and at the very end he says \"seven pillars\" — the substance is the six below):\r\n\r\n**Opening list:** ① reduce input costs over time ② increase output of products and services ③ self-finance its growth ④ weak suppliers ⑤ growing customers / huge customer base ⑥ weak competition.\r\n\r\n**Walkthrough order:** ① input costs ② output & pricing power ③ customers ④ weak suppliers ⑤ protection from competition / economic moat *(described as \"the most important one\")* ⑥ self-financing.\r\n\r\n#### PILLAR 1 — Ability to REDUCE INPUT COSTS over time\r\n\r\nThere are **three main input costs**:\r\n\r\n**1a. Infrastructure and capital equipment**\r\n- You want a business that can **grow without constantly spending more and more on new infrastructure and new equipment** — **spend one time, then scale on that same infrastructure.**\r\n- **❌ Businesses Adam avoids on this test:**\r\n  - **Airlines** — to grow they must **constantly buy new planes**, causing large cash outflow, **constant new capex to replace old planes**, plus **continuous maintenance and repair spending** → **reduces profitability over time**.\r\n  - **Shipping companies** — must **buy new ships to replace old ships and repair the ships**.\r\n  - **Auto manufacturers** — must **constantly invest in new factories and new equipment** to build cars more efficiently. *\"All this sucks up their cash flow and creates a very low free cash flow in the business.\"*\r\n- **✅ Businesses Adam likes — invest once, then scale without adding cost:**\r\n  - **Credit card / payment technology companies — Visa, MasterCard.** They invested heavily in payment infrastructure once; now they **dominate the industry and can expand to all countries and many platforms without incurring additional cost.**\r\n  - **Software companies** — once the software is made, they can **scale production without investing a lot more in capital equipment.**\r\n- **The general principle: \"I like companies that have very little physical assets, physical equipment. I like companies with more INTELLECTUAL assets.\"**\r\n  - **Nike** — doesn't make its own shoes. It **designs the shoes, owns the intellectual property, and outsources manufacturing to China or Vietnam**, where **the manufacturers** carry the capital equipment burden, not Nike.\r\n  - **Apple** — doesn't make its own iPhones or laptops. It **designs them, creates the software, owns the IP and the brand**; manufacturing is outsourced.\r\n  - **Coca-Cola** — doesn't bottle its own drinks. It **owns the syrup and the brand \"Coke\"** and **outsources the bottling and production to its suppliers**.\r\n  - **McDonald's and Yum Brands (owner of KFC and Pizza Hut)** — a **franchise model**. They don't really own their own restaurants or invest in capital equipment; they **own the brand and the recipes and sell the franchise.**\r\n- **Inflation benefit:** these companies **are not affected by inflation because they don't have to keep spending more and more money on input cost.**\r\n\r\n**1b. Raw materials**\r\n- Ask: **could raw material costs go up?**\r\n- **Starbucks** — raw materials are **coffee and sugar**. If **sugar prices** or **cocoa bean prices** go up, **input costs rise and profits could drop.**\r\n- **The test:** if raw material costs rise and the company **can raise the price of its drinks and pass the cost to customers, that's OK — they are hedged against inflation.** But if the company **cannot pass on the cost and has to absorb it, that really screws up profitability and profit margins.**\r\n\r\n**1c. Labour costs**\r\n- **Key man risk** — *\"I tend to avoid investing in companies where the success of the company is based on the brilliance of one man.\"*\r\n  - Example: **Elon Musk.** *\"One reason why I'm very nervous to invest in Tesla or SpaceX, because a lot is driven by his personality, his vision. Now what if he dies? What if he gets hit by a truck?\"*\r\n  - **Old saying (Adam attributes it to Warren Buffett): \"It's best to invest in a company where any idiot can run the business — because one day an idiot may run the business.\"** You want a business to be great **because of the business model itself**, not because of one man, so **anyone can run it**.\r\n- **Unique talent requirement** — *\"Is unique talent required to maintain the competitive advantage?\"* If special talent is needed to maintain the company's advantage, **that's dangerous — once you lose the talent, the whole business is gone.**\r\n- **Strong unions** — Adam **avoids companies with very strong unions**. Another reason he avoids **airline companies, especially in the US and European countries**: if the **pilots strike, the cabin crew strike, it brings the entire company to its knees.**\r\n\r\n#### PILLAR 2 — Ability to INCREASE OUTPUT (products and services)\r\n\r\nMore output → **more revenue, more profits.** Four sub-tests:\r\n\r\n1. **Pricing power** — *\"the business must be unique enough to command pricing power.\"* You want companies **able to raise their price every year**, because then **revenue rises even if the quantity sold stays the same**, and the company is **hedged against inflation** — if labour and raw material costs rise, they simply raise prices.\r\n2. **High switching costs** — once a customer buys, it must be **very expensive or very difficult to change to another brand**, so customers are **stuck to that brand for the rest of their life**.\r\n   - **Microsoft** — once people are familiar with **Office, PowerPoint and Word**, it's very difficult to change to another word processor or spreadsheet app. **It locks in the customers.**\r\n3. **Recurring income** — *\"once customers buy one time, they keep paying year after year after year. I don't like businesses where they sell the product once and that's it.\"*\r\n   - Adam invests in **Adobe, Microsoft, Salesforce** because of recurring subscription revenue.\r\n4. **Multiple product revenue streams**\r\n   - **❌ Zoom** — *\"a one trick pony\"* with only the Zoom video-sharing software. If users get sick of it or jump to **Microsoft Teams** or a competitor, **they're done.** This is why Adam doesn't invest in Zoom.\r\n   - **✅ Alphabet** — multiple product lines: **YouTube, Google Search, Google Maps** — diversified revenue streams.\r\n   - **✅ Disney** — **Disney Parks / Recreation / Experiences, Disney+, ESPN, Hulu, Network TV.** *\"Very diversified in their revenue streams — that's a lot safer.\"*\r\n\r\n> **How to verify Pillars 1 and 2 quantitatively:** *\"Very simple, look at the profit margins.\"* **As long as gross profit margins and net profit margins are consistent or increasing over the last five years, that's a reflection of the first two pillars.**\r\n\r\n#### PILLAR 3 — Growing, strengthening CUSTOMERS\r\n\r\nWe want the customer base to be **growing** and also **able to buy more products and services over time** (rising purchasing power). Four questions:\r\n\r\n1. **Is the customer base sizable and growing?**\r\n2. **Are the customers' wages rising?** If customers earn more, they can **buy more from your business** or **pay more as you raise prices.**\r\n3. **Is there customer concentration risk?**\r\n   - Adam avoids companies with very few customers.\r\n   - **Example: Upstart (ticker UPST, given in the transcript as \"UPSD\")** — a **fintech company providing credit-rating software services to banks and property developers**, rating the credit of customers so a bank knows whether to give a loan. The business model is interesting, **but 80% of Upstart's revenue comes from just three customers.** *\"That's what I call customer concentration risk. If they lose one customer, or lose all three, they're done.\"*\r\n   - **What you want instead:** *\"a business that has got thousands or hundreds of customers — so if they lose one or two or three or four, it doesn't matter.\"*\r\n4. **Can customers switch to substitutes or competitors easily? Are they loyal to the brand?**\r\n   - Easy switching + no brand loyalty = **a lousy business.**\r\n   - **✅ Apple** — even though **Samsung or Huawei** offer cheaper phones with more features, people still buy iPhone because they are **in the ecosystem where everything works seamlessly** — **locked into the Apple ecosystem** = **high switching cost + brand loyalty**. Apple customers also **tend to have higher disposable income**, are **willing to pay more for a premium product**, and **the customer base is growing all around the world.**\r\n   - **✅ Costco** — people **pay membership fees every year in the US**, so **they keep coming back**; strong brand loyalty.\r\n\r\n#### PILLAR 4 — WEAK SUPPLIERS\r\n\r\n- The opposite of Pillar 3: while you want **customers strong and growing**, you want the **suppliers to your business to be WEAK relative to the business.**\r\n- You want your business to have **stronger bargaining power than its suppliers**, so it can **squeeze the suppliers for lower input costs.**\r\n- **If suppliers are stronger than your business, they can easily raise their price and increase your business's costs.**\r\n- **Test: does the business have many alternative suppliers?** If one supplier raises price, the company can go to another, and another. **You want suppliers to have weak bargaining power.**\r\n\r\n#### PILLAR 5 — PROTECTION FROM COMPETITION / STRONG ECONOMIC MOAT (\"the most important one\")\r\n\r\n- *\"The one thing that can kill your business or reduce its revenue and profits would be competition wanting to take away your customers.\"*\r\n- **A great business is one that's able to protect itself against potential competition so competitors cannot take away its customers and market share.** This only happens if the business has a **strong economic moat.** (Introduced in the previous lesson under the three steps of investing; covered in detail in **Lesson 7 — the seven-step Value Momentum Investing formula.**)\r\n- **Sources of a strong moat / competitive advantage:**\r\n  1. **Brand monopoly** — e.g. **Google** in search; **Facebook / Instagram** in social media.\r\n  2. **High switching costs** that lock in the customer for life.\r\n  3. **Huge economies of scale** that competitors cannot compete with.\r\n  4. **High barriers to entry** — difficult for new players to enter the industry because of **regulations** or **high cost of entry**.\r\n- **What makes competition WEAK:**\r\n  - **Few competitors** (many competitors is bad)\r\n  - Competitors with **very small market share**\r\n  - Competitors with a **weaker competitive position**\r\n- **Adam's practice:** *\"Before investing in a business I always look at all the closest competitors, to ensure the closest competitors are always weaker than the business I want to invest in. If the competitor is stronger, then I'd rather invest in the competitor.\"*\r\n- **\"You always want to invest in the top dog — the strongest business within the industry. And if there's no one strong business, forget it, don't even invest in that. You want to invest in an industry where there's clearly one leader, and you want to be with that leader.\"**\r\n- **How this shows up in the numbers:** when a company has a strong competitive advantage and weak competition, it is **able to increase revenue and income consistently, has consistently growing cash flow from operations, and its free cash flow is positive.** *\"All this is reflected in those financial metrics you have learned — but now you understand what goes behind creating those metrics.\"*\r\n\r\n#### PILLAR 6 — Ability to SELF-FINANCE growth\r\n\r\n- As a business grows it needs money to grow. **We want businesses that grow ORGANICALLY — generating enough cash to grow themselves, without borrowing more money and without selling more shares.**\r\n- **Questions to ask:**\r\n  1. **Is the company able to grow without issuing new shares or new debt?** If yes, **that's a great business.**\r\n  2. **Does the company have a conservative debt structure?**\r\n  3. **Is the company buying back shares?**\r\n- **\"Conservative debt structure\" = exactly the metrics already taught:**\r\n  - **Current ratio more than 1**\r\n  - **Debt/EBITDA ratio 3 or less**\r\n  - **Debt servicing ratio less than 30%**\r\n  - **ROE and ROIC above 12% or above 15%**\r\n- **On buybacks:** *\"In general, we like companies to buy back their own shares — provided they are profitable and provided the shares are undervalued in the first place.\"*\r\n\r\n> **Closing:** *\"If it is able to meet these pillars and it is reflected in all the financial metrics, then I know I've got the confidence to invest in this business, and over time it will grow under all economic conditions and thrive.\"*\r\n\r\n---\r\n\r\n### 9. Key Takeaways\r\n\r\n1. **You are buying a business, not a ticker.** 70% of the investment decision rests on fundamentals. If the business does well, the stock does well over time.\r\n2. **The purpose of fundamental analysis is defensive first.** Finding great companies matters, but **avoiding lousy businesses is what saves you** — investors lose money mainly by owning bad businesses whose prices crash and never recover.\r\n3. **\"Blue chip\" is not a safety label.** Noble Group, Hyflux and China Evergrande were all blue chips. **\"Blue chip can get blue black.\"**\r\n4. **The statement of cash flows is the most important of the three statements.** Profits can be manufactured (uncollected sales booked as revenue; asset revaluation gains). **Cash cannot be faked.**\r\n5. **Income statement: only three numbers matter** — revenue, operating income, net income after tax. All three should trend up over 5 (ideally 10) years. If net income is lumpy because of one-off items, **operating income is the clean read.**\r\n6. **Balance sheet: only two numbers matter for Adam's work** — **cash + short-term investments** and **total debt (short-term + long-term)**. Both feed the intrinsic value calculation later.\r\n7. **Balance sheet uses the LATEST QUARTERLY report** (a point in time). **Income statement and cash flow statement use ANNUAL figures** (a period of time).\r\n8. **Negative shareholders' equity is not automatically bad** — check whether it is caused by large treasury stock from years of buybacks (McDonald's, Domino's, Yum Brands). In that case ROE is effectively infinite, not negative.\r\n9. **A current ratio below 1 is not automatically bad** — Pepsi does it deliberately by stretching supplier payments; subscription companies like ServiceNow do it because deferred revenue inflates current liabilities. **Never read one ratio in isolation.**\r\n10. **Operating cash flow must be positive and rising; free cash flow must be consistently positive.** Two-to-three consecutive years of negative FCF is dangerous — it forces dilution or more debt.\r\n11. **A falling FCF is only alarming if operating cash flow is falling.** If FCF fell because of a temporary capex surge (the AI data-center build-out at Microsoft, Google, Meta, Nvidia) while OCF keeps rising, that is fine and even strengthens the future moat.\r\n12. **Certain industries are structurally excluded from the standard debt tests** — banks, insurers, property developers, REITs, commodity companies (all naturally highly leveraged). Banks use **CET1 > 10%** and **NPL \u003c 5%**; REITs use **gearing \u003c 45%**. Adam avoids property developers and commodity companies entirely.\r\n13. **Avoid structurally hard industries** — airlines (cyclical, huge maintenance capex, fuel costs, strong unions, brutal competition), shipping, auto manufacturing. Singapore Airlines is a great airline and still not investable. *\"It's not the fault of the management. It's the nature of the industry.\"*\r\n14. **Accounts receivable growing faster than revenue is a major red flag** — it means customers in trouble, poor collection, or **fake revenue**.\r\n15. **Hyflux showed every warning sign for over a decade** — negative/inconsistent OCF from 2006, negative FCF, dividends paid despite negative FCF, receivables +575% against revenue +8% in 2010, and Debt/EBITDA of 5.64 versus the threshold of 3. **None of it required insider knowledge — just reading the cash flow statement.**\r\n16. **Never outsource conviction.** Not to a sovereign wealth fund's presence (Temasek had already sold most of its Hyflux stake at a profit), not to a celebrated CEO, and not to an analyst's buy rating with a $2.40 target on a stock heading to zero.\r\n17. **Great business models share six traits:** falling/low input costs (asset-light, IP-heavy, outsourced manufacturing), the ability to increase output with pricing power / high switching costs / recurring income / multiple revenue streams, a large and growing customer base with no concentration risk, weak suppliers, a strong economic moat against weak competition, and the ability to self-finance growth without issuing shares or debt.\r\n18. **\"It's best to invest in a company where any idiot can run the business — because one day an idiot may run the business.\"** Avoid key-man risk.\r\n19. **All ratios are pre-calculated for you.** You never need to compute ROIC, CCC, debt/EBITDA or CET1 by hand — you only need to know **what they mean, where to find them, and what the threshold is.**\r\n20. **Pass 12 of 12 and you own a great company. Two out of three on the debt ratios is acceptable to Adam.**\r\n\r\n---\r\n\r\n### 10. Quick Reference — All Metrics and Thresholds\r\n\r\n#### Profitability\r\n\r\n| Metric | Formula | Threshold / Rule | Exceptions & notes |\r\n|---|---|---|---|\r\n| **Sales revenue** | — | **Increasing consistently** over 5 yrs (10 better) | One or two down years fine if the trend is up |\r\n| **Net income (net profit after tax)** | Revenue − all costs & taxes | **Increasing consistently** over 5 yrs | If distorted by one-off items → use **operating income** instead |\r\n| **Operating income** | Gross profit − OPEX | **Increasing consistently** | Excludes tax, interest, lawsuits, restructuring, write-offs, dividend/capital-gain/interest/forex income |\r\n| **Gross profit margin** | Gross profit ÷ Sales revenue | **Consistent or increasing** over 5 yrs; **≥ closest competitors** | Falling gross margin = rising production cost = bad sign |\r\n| **Net profit margin** | Net profit after tax ÷ Sales revenue | **Consistent or increasing**; **≥ closest competitors** | If lumpy, use **operating profit margin** |\r\n| **Operating profit margin** | Operating income ÷ Sales revenue | **Consistent or increasing** | Backup for a distorted net margin |\r\n| **ROE (Return on Equity)** | Net profit after tax ÷ Shareholders' equity | **≥ 12% good; > 15% excellent**; consistent over 5 yrs | Warren Buffett's favourite. **Undefined/infinite (good) when equity is negative from treasury stock** |\r\n| **ROIC (Return on Invested Capital)** | EBIT × (1 − tax rate) ÷ (Equity + Total debt − Cash & equivalents) | **≥ 12% good; > 15% excellent** | **Does NOT apply to banks or insurance companies** (leverage makes it artificially low) |\r\n\r\n#### Cash Flow\r\n\r\n| Metric | Formula | Threshold / Rule | Exceptions & notes |\r\n|---|---|---|---|\r\n| **Cash flow from operations (OCF)** | — | **Positive AND increasing consistently over 5 yrs** | **Does NOT apply to banks, commodity companies, property developers** (naturally inconsistent) |\r\n| **Free cash flow (FCF)** | **OCF − Capex** | **Consistently positive** (ideally increasing) | 1–2 negative years OK; **2–3 consecutive negative years = dangerous** → dilution/debt. Falling FCF is fine if caused by temporary capex while OCF rises |\r\n| **Cash flow from investing** | — | **No good/bad sign.** Negative = buying assets (capex); positive = selling assets | — |\r\n| **Cash flow from financing** | — | **No good/bad sign.** Positive = raising money (loans, bonds, new shares); negative = repaying debt, buybacks, dividends | Negative is typical of mature, cash-rich companies — good for shareholders |\r\n\r\n#### Financial Strength / Debt\r\n\r\n| Metric | Formula | Threshold | Exceptions & notes |\r\n|---|---|---|---|\r\n| **Current ratio** | Current assets ÷ Current liabilities | **> 1** | Below 1 OK if other ratios strong — e.g. **Pepsi 0.85** (supplier payment drag), **ServiceNow 0.95** (deferred revenue) |\r\n| **Debt / EBITDA** | (Short-term debt + Long-term debt) ÷ EBITDA | **\u003c 3** | = years of pre-interest/tax/D&A profit needed to repay all debt. **Hyflux was 5.64 = big fail** |\r\n| **Debt servicing ratio** | Net interest expense ÷ Cash flow from operations × 100% | **\u003c 30%** | > 30% = very dangerous |\r\n| **Interest coverage ratio** *(optional)* | EBITDA ÷ Net interest expense | **≥ 3 safe; ≥ 5 very safe; \u003c 3 risky; \u003c 2 dangerous** | Adam doesn't use it — overlaps with the others |\r\n| **Cash ratio** *(optional)* | Cash & equivalents ÷ Current liabilities | **≥ 0.5 very safe; \u003c 0.3 risky** | Excludes receivables and inventory. Adam doesn't use it |\r\n| **CET1 ratio — BANKS ONLY** | Common Equity Tier 1 (cash + common stock + retained earnings) ÷ Risk-weighted assets | **Basel III minimum 4.5%; Adam requires > 10%** | DBS **14.1%**, JP Morgan **12.4%**, Bank of China **11.28%**. Just Google it |\r\n| **NPL ratio — BANKS ONLY** | Non-performing loans ÷ Total loans | **\u003c 5%** | DBS **1.5%** |\r\n| **Gearing ratio / Aggregate leverage — REITS ONLY** | Total debt ÷ Total assets | **\u003c 45%** | Ascendas REIT **37.6%**. Find it in the REIT's own annual report / presentations |\r\n\r\n*The three core debt ratios (current, debt/EBITDA, debt servicing) do **not** apply to: banks, insurance/financial companies, property developers, REITs, commodity companies. **Passing 2 out of 3 is acceptable.***\r\n\r\n#### Management Effectiveness\r\n\r\n| Metric | Formula | Threshold | Exceptions & notes |\r\n|---|---|---|---|\r\n| **Cash conversion cycle (CCC)** | DIO + DSO − DPO — where DIO = Avg inventory ÷ COGS × 365; DSO = Accounts receivable ÷ Net credit sales; DPO = Days payable outstanding | **Consistent or DECLINING. Increasing = red flag.** **Negative CCC is best** (collects cash before paying suppliers, e.g. Pepsi) | **Only for retail companies selling physical goods** (Nike, Apple, Walmart, Costco, Pepsi). **Not** for Google, YouTube, Microsoft |\r\n| **Revenue growth vs Accounts receivable growth** | Compare the two growth rates | **Revenue must grow faster.** Receivables growing faster = **major red flag** | Signals customers in trouble, poor collection, or **fictitious revenue**. Hyflux 2010: revenue +8%, receivables +575% |\r\n\r\n#### Data Sources Cheat Sheet\r\n\r\n| Need | Go to |\r\n|---|---|\r\n| US financial statements, ratios, visual charts | **StockOracle** → Financials / Company Metrics (free = 5 yrs, paid = 10 yrs) |\r\n| Non-US financial statements (Singapore, HK, etc.) | **Yahoo Finance** → ticker (e.g. DBS = **D05**) → Financials (data right-to-left, **in thousands**) |\r\n| ROE / ROIC for foreign stocks | **Morningstar.com** free section → Key Metrics → Profit and Efficiency Ratios |\r\n| Next earnings date | **TradingView** \"E\" icon, or **finance.yahoo.com/calendar/earnings**, or the StockOracle company page |\r\n| Revenue vs accounts receivable chart | **StockOracle** preset chart, or **TradingView** with the **Piranha Profits custom indicator** (Lesson 4 → Course Notes and Resources → Add to Favorites) |\r\n| Cash conversion cycle | **TradingView** → Financials → search \"cash conversion cycle\", or **StockOracle** → Financials chart / Company Metrics → Efficiency Ratios |\r\n| Bank CET1 and NPL ratios | **Google search** the bank name + ratio name |\r\n| REIT gearing ratio | The **REIT's own website** → annual report / investor presentations |\r\n| Raw source documents | Company website: **quarterly reports, annual reports**; also read the **CEO conference call transcript** after results |\r\n\r\n---\r\n\r\n# Part IV — Stock Valuation: Calculating Intrinsic Value\r\n\r\n## Lesson 5 — Stock Valuation\r\n\r\n*Source videos: 36 (Introduction & PEG Ratio), 37 (DCF Part 1), 38 (DCF Part 2), 39 (Discounted Net Income), 40 (Price/Book & Banks), 41 (REITs & Price/Sales)*\r\n\r\n---\r\n\r\n### 1. Why Valuation Matters\r\n\r\n#### 1.1 The core premise\r\n- Previous lessons taught how to identify a **great business**. This lesson teaches how to know whether the **shares** of that business are expensive or cheap.\r\n- A great business can be a lousy investment if you pay too high a price. A great business becomes an **excellent investment only when bought below intrinsic value**.\r\n- **Property analogy:**\r\n  - Great apartment, bank values it at $1,000,000, seller asks $2,000,000. If you pay $2M for a $1M asset, it is very hard to make money on resale unless you wait many years.\r\n  - If the seller is desperate and you buy at $800,000 — 20% below valuation — that is a big deal.\r\n  - In the stock market **no bank does the valuation for you**. You must do your own.\r\n\r\n#### 1.2 Buffett's priority ordering\r\n- Buffett: it is far better to buy a wonderful company at a fair price than a fair company at a wonderful price.\r\n- Adam's restatement: **\"cheap crap is still crap.\"** Only buy an excellent business when it is cheap.\r\n- **Priority: great business FIRST, valuation SECOND.** But valuation is still essential.\r\n- Better to buy an excellent business that is slightly cheap than a mediocre business that is very, very cheap.\r\n\r\n#### 1.3 Two things that tell you NOTHING about value\r\n1. **Absolute share price.**\r\n   - A $1,000 stock is cheap if intrinsic value > $1,000.\r\n   - A $5 stock is expensive if intrinsic value is only $1.\r\n2. **How far the price has moved recently.**\r\n   - NVIDIA: up **120%** over the last year, yet on calculation it is **still not expensive — fairly priced**.\r\n   - AMD (NVIDIA's competitor): **fell 50%** over the last year and is **still expensive — still above intrinsic value**.\r\n   - What matters is only: intrinsic value today vs. share price today.\r\n\r\n#### 1.4 What drives value\r\n- When you buy shares you buy a piece of a business. A business is a **money-making machine**. The more money it makes, the more it is worth.\r\n- How much a company makes is measured by:\r\n  - Cash flow from operations (CFO)\r\n  - Free cash flow (FCF)\r\n  - Net income\r\n\r\n---\r\n\r\n### 2. The Five Valuation Methods — Overview\r\n\r\n| # | Method | When used | Key precondition |\r\n|---|--------|-----------|------------------|\r\n| 1 | **PEG ratio** | Quick check / stock screening only | Earnings positive and consistently increasing |\r\n| 2 | **Discounted Cash Flow (DCF)** — Adam's default, used **90% of the time** | Most companies; most comprehensive & accurate | CFO consistently increasing; FCF positive |\r\n| 3 | **Discounted Net Income** | Companies whose business model makes cash flow inconsistent/negative (finance, insurance, brokers, asset managers) | Net income consistently increasing |\r\n| 4 | **Price to Book (P/B)** | Banks; REITs; property developers; loss-making / distressed / near-bankrupt companies | Meaningful balance sheet / book value |\r\n| 5 | **Price to Sales (P/S)** and **Price to Sales Growth (PSG)** | Revenue growing but not yet profitable; highly cyclical companies with inconsistent profits | Revenue is measurable and meaningful |\r\n\r\n- Why DCF is the default: a business is a money-making machine, and the best measure of how much it makes is the **cash it generates for shareholders**. Value of a business = **present value of all expected future cash flows**. Adam projects **20 years** and discounts to present value.\r\n- Why net income is second-best: net income is an **accounting entry that can be manipulated/distorted** by non-operating income and expenses. Cash is more real than accounting profits.\r\n\r\n#### 2.1 Tools mentioned\r\n- **Intrinsic Value Calculator (Excel template)** — download under **Lesson 5 → Course Notes and Resources**, scroll to the bottom. Once opened, the **tabs at the bottom** hold a separate calculator for each method (discounted FCF, discounted CFO, discounted net income, price-to-book, etc.).\r\n  - **Only key into the WHITE boxes.** Coloured boxes contain the formulas — editing them breaks the calculator.\r\n  - The discount-rate table inside the calculator is **updated every year** and re-sent to students; a link inside the calculator points to the source where you can compute the risk-free rate and average market risk premium yourself.\r\n- **StockOracle (Pro subscription)** — auto-calculates intrinsic value under the **Intrinsic Value** tab, showing each method side by side, then an algorithm picks the most appropriate one and displays it as the **\"Oracle Value.\"** Pro also has a **built-in intrinsic value calculator** with all inputs pre-pulled from the balance sheet and cash-flow statement, which you can override with your own assumptions.\r\n  - Data provider for growth estimates: **FactSet**.\r\n  - Currently **US-listed stocks only**; Singapore and Hong Kong listings expected **by end of 2026**.\r\n  - Free StockOracle account is enough to read the financial statements.\r\n- **FinViz** — PE, PEG, EPS growth next 5 years, plus a **stock screener** (~9,900 stocks in the database).\r\n- **Zacks (zacks.com)** — third opinion on projected growth rate.\r\n- **GuruFocus** and **SimplyWallStreet** — also carry PEG.\r\n- **Yahoo Finance** — required for **non-US listed stocks** (financials, analyst growth estimates, statistics, book value per share, dividend yield).\r\n- **TradingView** — charting; add the **\"Price to Book Ratio\" indicator** to read historical P/B for any market (Singapore, Hong Kong, India, Malaysia, US).\r\n- **Ultimate Investors Playbook** (subscription) — Adam's monthly workings, buy levels and fair values.\r\n\r\n#### 2.2 StockOracle worked illustration (NVIDIA)\r\n- Current share price: **$184**\r\n- Discounted cash flow (latest FCF): intrinsic value **$258**\r\n- Discounted net income (latest net income): **$370**\r\n- Price to sales ratio method: **$226**\r\n- **Oracle Value (algorithm blend): $208** → at $184 the stock is **slightly undervalued**\r\n- Lesson: different methods give different numbers. **Intrinsic value is a range, never one number.**\r\n\r\n---\r\n\r\n### 3. Method 1 — PEG Ratio\r\n\r\n#### 3.1 Purpose and limits\r\n- Use as a **very quick check** on value and, mainly, as a **screening criterion** to shortlist stocks for deeper research (there are >10,000 stocks; you cannot examine them all). Screening covered fully in Lesson 9.\r\n- Adam does **not** use PEG to actually value a stock — it is not comprehensive.\r\n- **Precondition:** earnings must be **positive AND increasing consistently**. Otherwise PEG is not accurate at all.\r\n- **Limitation:** based on reported net income, which can be distorted by non-operating expenses and non-operating income. That is why a full DCF is needed.\r\n\r\n#### 3.2 Formula and thresholds\r\n```\r\nPEG ratio = PE ratio ÷ projected earnings growth rate (%)\r\n```\r\n- Higher PEG = more expensive. Lower PEG = cheaper.\r\n- **Textbook / CFA theory:** PEG > 1 → overvalued (PE above growth rate); PEG \u003c 1 → undervalued.\r\n- **Problem with the textbook rule in practice:** if you only buy PEG \u003c 1 you get lots of cheap stocks, but many of them are not great companies — and **many great companies trade above PEG 1**, so you miss them.\r\n- **Adam's rule of thumb: look for PEG ≤ 1.5.**\r\n  - Way above 1.5 → probably expensive.\r\n  - 1.5 or less → worth a further look.\r\n\r\n#### 3.3 Worked examples (from FinViz)\r\n**NVIDIA**\r\n1. PE ratio = **54.69** (~54×)\r\n2. Projected earnings growth, next 5 years = **61.17%**\r\n3. PEG = 54.69 ÷ 61.17 = **0.89**\r\n4. Below 1.0 and below 1.5 → **looks cheap**\r\n\r\n**AMD** (share price down >50% over the year)\r\n1. PE ratio = **112** (despite the 50% fall)\r\n2. Projected earnings growth, next 5 years = **33%**\r\n3. PEG = 112 ÷ 33 = **3.4**\r\n4. Way above 1.5 → **expensive**\r\n\r\n**Conclusion:** NVIDIA is the cheaper stock, even though it rose 120% and AMD fell 50%.\r\n\r\n#### 3.4 Screening use (FinViz)\r\n- FinViz screener database: **9,900 stocks** — impossible to review individually.\r\n- FinViz does not offer a 1.5 cut-off, so Adam sets **PEG \u003c 2**, which narrows ~10,000 stocks down to about **700**.\r\n- Other criteria are then layered on to narrow further (Lesson 9).\r\n\r\n---\r\n\r\n### 4. Method 2 — Discounted Cash Flow (DCF)\r\n\r\n**Adam's primary method — used ~90% of the time.**\r\n\r\n#### 4.1 The concept\r\n- A business is a machine that will print cash for the next 10, 20, 30 years. To value the machine, **project the future cash it will generate and discount it to present value**. Divide by shares outstanding → **intrinsic value per share**.\r\n- Formal definition: *the intrinsic value of a stock is the present value of its future expected cash flows* (Adam prefers cash flow over earnings because cash is more tangible than accounting profits).\r\n- **Default projection horizon: 20 years.**\r\n\r\n#### 4.2 The magic-machine teaching sequence (discount rate = 5%)\r\n\r\n| Scenario | Cash timing | Present value calculation | Value today |\r\n|---|---|---|---|\r\n| 1 | $100 today (t=0) | none needed | **$100** |\r\n| 2 | $100 in 1 year | 100 ÷ 1.05 | **$95** |\r\n| 3 | $100 in 2 years | 100 ÷ 1.05² | **$91** |\r\n| 4 | $100 today + $100 in yr 1 + $100 in yr 2 | 100 + 95 + 91 | **$286** |\r\n\r\n- **Discount rate = the opportunity cost of your money** — what you could earn elsewhere at the same risk (5% in the example).\r\n- Reverse check: $95 invested at 5% for 1 year → $100. $91 invested at 5% for 2 years → $100. This is the **time value of money**.\r\n- Valuing a business is identical, except the machine prints cash for **20 years**, not 3. In addition, the calculator brings in the company's **total debt** and its **cash and equivalents** to arrive at the value of the business today.\r\n\r\n#### 4.3 Preconditions for using DCF\r\n- The company must generate **positive cash flow**.\r\n- **Cash flow from operations must be increasing consistently.**\r\n- You must be able to confidently expect that consistent increase to continue for the next 20 years.\r\n- \"Consistently increasing\" does **not** mean up every single year — one or two down years are fine as long as the general trend is up. (MasterCard's free cash flow chart is the illustration of what a clean uptrend looks like.)\r\n\r\n#### 4.4 Which cash flow to use\r\n- **Default: Free Cash Flow (FCF).**\r\n  - `FCF = Cash flow from operations − Capital expenditure`\r\n  - It shows how much cash the business generates from operations after capex — what is actually **left for shareholders** (to pay dividends, buy back shares, or retain). This is the **true earning power** of the business.\r\n- Alternatives when FCF is distorted — see §5.\r\n\r\n#### 4.5 Input-by-input procedure (Intrinsic Value Calculator)\r\n\r\n| Step | Input | Where to get it |\r\n|---|---|---|\r\n| 1 | Stock name | — |\r\n| 2 | Ticker symbol | Any financial site (StockOracle, Yahoo Finance) |\r\n| 3 | **Valuation method** = Discounted Free Cash Flow | Dropdown in the calculator |\r\n| 4 | **Latest free cash flow (last 12 months)** | Financials → **Cash Flow Statement → Annual → first column = last 12 months** |\r\n| 5 | **Total debt** = short-term debt + long-term debt (**NOT total liabilities**) | **Balance Sheet → Quarterly (latest point in time) → Liabilities** |\r\n| 6 | **Cash and short-term investments** | **Balance Sheet → Quarterly → Assets** |\r\n| 7 | **Growth rate years 1–5** | Consensus analyst estimates (see §4.6) |\r\n| 8 | **Growth rate years 6–10** | Base case = same as years 1–5, **capped at a maximum of 15%** |\r\n| 9 | **Growth rate years 11–20** | **Default 4%** |\r\n| 10 | **Shares outstanding** | Overview → shares outstanding → use the **diluted average** |\r\n| 11 | **Discount rate** | From the beta table in the calculator (see §4.7) |\r\n| 12 | Currency of financial statements / currency of share price / exchange rate | Needed for non-US stocks (§6.1) |\r\n\r\n- **Denomination warning:** StockOracle reports in **millions**; Yahoo Finance reports in **thousands**. Always check and convert before keying in — the calculator expects millions.\r\n\r\n#### 4.6 Growth rate — sourcing and rules\r\n- Use **consensus analyst estimates**. Hundreds of analysts study the company, and most US companies give forward guidance.\r\n- Three sources, take an **average of the three** (Adam's illustration: \"like going to different doctors, you get different opinions\"):\r\n  1. **StockOracle → Company Metrics → scroll to Growth Rates → Projected** (data from FactSet)\r\n     - Use the **projected 3–5 year EPS growth rate** as the proxy for the cash-flow growth rate, because **over the long run earnings and cash flow grow in line**.\r\n     - A **projected long-term growth rate** (beyond 5 years) is also shown — useful for conservative cases.\r\n  2. **FinViz** → \"EPS next 5Y\" / earnings growth next 5 years\r\n  3. **Zacks** → projected growth rate\r\n- **Years 6–10 rule (Adam's own rule): cap at a maximum of 15%.**\r\n  - If years 1–5 = 15.53% → years 6–10 = **15%**\r\n  - If years 1–5 = 8% → years 6–10 = **8%**\r\n  - If years 1–5 = 20% → years 6–10 = **15%**\r\n- **Years 11–20 rule: 4% by default**, on the assumption the business then grows at roughly **nominal GDP + 2%**. You may use a lower figure (e.g. 2%) if you are more conservative — this is a style choice.\r\n\r\n#### 4.7 Discount rate — why Adam's number\r\n- **Not WACC.** Weighted average cost of capital is what CFA/finance-degree curricula use, and it is on StockOracle, but WACC belongs to a **perpetuity (DCF Terminal)** valuation. Adam is not assuming the company lasts forever, so he uses a **modified discount rate**.\r\n- **Buffett's approach (mentioned, not used):** simply the **10-year Treasury bond yield / 10-year Treasury rate** — quoted in the lesson as **3.6%**.\r\n- **Adam's formula:**\r\n  ```\r\n  Discount rate = risk-free rate + (beta × market risk premium)\r\n  ```\r\n  - Uses the **5-year average risk-free rate** and the **5-year average market risk premium**.\r\n  - You do **not** compute this yourself — the calculator contains a **pre-built lookup table keyed to the stock's beta**, updated annually.\r\n- **What beta means (volatility measure):**\r\n  - Beta 1.0 (e.g. Apple): S&P 500 up 1% → stock up 1%; S&P down 1% → stock down 1%.\r\n  - Beta 3.0 (e.g. Tesla): S&P up 1% → stock up 3%; S&P down 1% → stock down 3%.\r\n  - Beta 0.5 (e.g. Coca-Cola): S&P up 1% → stock up 0.5%; down 1% → down 0.5%.\r\n  - **Higher beta → higher discount rate**, i.e. the stock is \"punished\" for volatility (financial theory). Buffett rejects this and just uses the risk-free rate.\r\n- **Beta → discount rate pairs observed in the worked examples:**\r\n\r\n| Beta | Discount rate used | Example |\r\n|---|---|---|\r\n| 0.28 | **5.8%** (the lowest rate in the table) | Singapore Exchange (S68) |\r\n| 0.83 | **6.1%** | MasterCard (MA) |\r\n| 1.1 | **6.6%** | Apple (AAPL) |\r\n| 1.4 | **7.4%** | Amazon (AMZN) |\r\n| 1.49 | **7.7%** | BlackRock (BLK) |\r\n\r\n  - Where beta falls between table rows, pick the **closest** rate.\r\n  - Adam applies the same (US-derived) table to Singapore stocks \"to keep it simple.\"\r\n\r\n#### 4.8 Why 20 years and not perpetuity\r\n- Finance theory / CFA assumes the company lasts **forever** (to perpetuity) and applies a **terminal value**. Adam considers that unrealistic and **more aggressive than he is comfortable with**.\r\n- He values the business on **20 years of cash generation only** — anything beyond 20 years is a **bonus**.\r\n- Reality check that 20 years is conservative — company ages cited:\r\n  - **Coca-Cola: 106 years**\r\n  - **Walmart: 55 years**\r\n  - **Apple: 45 years**\r\n  - **Microsoft: 39 years**\r\n- A **\"DCF Terminal\"** (perpetuity) valuation does exist and is auto-calculated on StockOracle, but Adam does not use or teach it.\r\n\r\n---\r\n\r\n#### 4.9 WORKED EXAMPLE — MasterCard (MA), Discounted Free Cash Flow\r\n\r\n**Precondition check:** MasterCard's free cash flow chart (dark green) shows a **consistent uptrend** → DCF valid.\r\n\r\n| Step | Input | Value |\r\n|---|---|---|\r\n| 1 | Stock / ticker | MasterCard / **MA** |\r\n| 2 | Method | Discounted **free cash flow** |\r\n| 3 | Latest FCF (last 12 months, cash flow statement, annual) | **16,186** (millions USD — StockOracle is already in millions) |\r\n| 4 | Total debt = short-term **749** + long-term **18,251** | **19,000** million ($19B) |\r\n| 5 | Cash & short-term investments (latest quarter, assets) | **11,459** million |\r\n| 6a | Growth yrs 1–5, StockOracle/FactSet (3–5 yr EPS) | 14.94% |\r\n| 6b | Growth yrs 1–5, FinViz | 15.68% |\r\n| 6c | Growth yrs 1–5, Zacks | 15.98% |\r\n| 6d | **Average of three** = (14.94 + 15.68 + 15.98) ÷ 3 | **15.53%** |\r\n| 7 | Growth yrs 6–10 — base case = same rate, but capped at 15% | **15%** |\r\n| 8 | Growth yrs 11–20 | **4%** |\r\n| 9 | Shares outstanding (diluted average) | **898** million |\r\n| 10 | Beta **0.83** → discount rate | **6.1%** |\r\n\r\n**Results:**\r\n- **Base case intrinsic value = $655.97**\r\n- Current share price = **$514.72**\r\n- → **21.5% undervalued**\r\n\r\n**Sensitivity / conservatism ladder for MasterCard:**\r\n\r\n| Scenario | Yrs 1–5 growth | Yrs 6–10 growth | Yrs 11–20 | Intrinsic value | Discount at $514.72 |\r\n|---|---|---|---|---|---|\r\n| **Base case** | 15.53% (avg of 3 sites) | 15% (capped) | 4% | **$655.97** | 21.5% undervalued |\r\n| **Conservative** | 14.94% (lowest of the 3) | 13.02% (StockOracle **long-term** growth rate) | 4% | **$600** | ~14% discount |\r\n| **Doomsday** | 14.94% | 9.97% (= 14.94 ÷ 2, growth halves after yr 5) | 4% | **$545.50** | ~5% below IV |\r\n\r\n- Interpretation: even under the doomsday case the stock is below intrinsic value → *\"these are the kind of stocks I like to buy because it's pretty safe even if things don't work out as I planned.\"*\r\n\r\n#### 4.10 Intrinsic value is a range — margin of safety\r\n- **Buffett & Munger on American Express:** Buffett's calculation → **$60**; Munger (more pessimistic, lower growth rate) → **$50**; the market price was **$35**. The disagreement did not matter because the price was far below both.\r\n- Lesson: **buy when the price is way below intrinsic value so there is a margin of safety** — so that even if your growth assumptions were too optimistic, you are still safe.\r\n- Practical margin-of-safety behaviour shown in the lesson:\r\n  - MasterCard at 21.5% below base-case IV and still below the doomsday IV → attractive.\r\n  - Apple at $260.83 vs base-case IV $256 → **not bought**; would add \"below $190\" (well under both the conservative $199.98 and StockOracle's $190).\r\n  - Singapore Exchange at $18.37 vs IV $17.67 → **not bought**; interested at $17, $16, $15 or $12.\r\n  - BlackRock at $967 vs IV $795 → **not bought**; interested at \"$700-plus or even below $700.\"\r\n  - Distressed companies: buy at **P/B ≤ 0.5**, i.e. 50 cents on the dollar of liquidation value.\r\n\r\n---\r\n\r\n### 5. DCF Part 2 — Handling Inconsistent Cash Flow\r\n\r\n#### 5.1 The diagnostic\r\n```\r\nFree cash flow = Cash flow from operations − Capital expenditure\r\n```\r\nTwo different causes of inconsistent FCF, with two different answers:\r\n\r\n| Cause | Verdict |\r\n|---|---|\r\n| **CFO itself is inconsistent** | **Cannot use DCF at all.** Use a different method, or forget the stock and find one with consistent cash flow growth. |\r\n| **CFO is consistent but CAPEX is lumpy** | **Fine.** Normalize the capex (§5.2). |\r\n\r\n- **Capex** = money invested in new plants, machinery, equipment. Some companies spend evenly every year; others spend in bursts (data centres, heavy R&D), which crushes FCF in those years and inflates it in quiet years.\r\n- **Hyperscaler illustration:** Microsoft, Meta, Google and Amazon recently spent enormously on **AI data centres** to strengthen their economic moat and future growth. That capex spike knocked their FCF down — **not a concern**, because the underlying business is generating plenty of operating cash.\r\n\r\n#### 5.2 Capex normalization rule\r\n```\r\n5-year average capex = (capex yr1 + yr2 + yr3 + yr4 + yr5) ÷ 5\r\n\r\nNormalized FCF = latest 12-month cash flow from operations − 5-year average capex\r\n```\r\nUse this normalized FCF as the starting cash flow in the DCF calculator.\r\n\r\n#### 5.3 WORKED EXAMPLE — Amazon (AMZN), normalized FCF\r\n\r\n**Why normalization is required:** Amazon's CFO (orange) rises fairly consistently, but reported FCF (dark green) swings wildly — **−$14B, −$16B, +$32B, +$32B, then down to $7B** — because capex tripled (fr
