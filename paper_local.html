y?\"*\r\n\r\n| Step | Question | Evidence used |\r\n|---|---|---|\r\n| 1 | Consistently increasing sales revenue, net income, cash flow from operations (5–10 yrs)? Plus stable/rising gross & net (or operating) margins | Income statement, cash flow statement, margin history |\r\n| 2 | Positive projected growth rate + identifiable growth catalysts? | 2–3 independent growth projections + qualitative growth drivers |\r\n| 3 | **Sustainable competitive advantage (economic moat)?** — Adam repeatedly calls this \"the most important step of all\" | Brand monopoly, switching costs, barriers to entry, economies of scale, network effect |\r\n| 4 | Profitable and operationally efficient? | ROE, ROIC, revenue growth vs accounts-receivable growth, cash conversion cycle |\r\n| 5 | Conservative debt? | Current ratio, debt/EBITDA, debt servicing ratio (and interest coverage) |\r\n| 6 | Is the price below intrinsic value (margin of safety)? | DCF (cash from operations) or discounted **free** cash flow; a valuation *range*, not one number |\r\n| 7 | Is it a great point of entry? | Charts: 10-yr monthly → 5-yr weekly → 1-yr daily; identify 3–5 support levels **below** intrinsic value; add in tranches |\r\n\r\n**Standing rules Adam repeats across all three:**\r\n- Only invest in businesses whose products/services you personally use — it is the only way to genuinely judge the moat (Step 3 has no number attached to it).\r\n- Passing steps 1–5 ⇒ the stock goes on the **watch list**, not into the portfolio. You then \"watch it, watch it, watch it\" for price.\r\n- Valuation is always a **range** (optimistic / base / pessimistic), never a single point.\r\n- Do the full 5-step business analysis **once a year at most** — \"once you realise a business is a great business, it doesn't change that easily… it would remain a great business for many, many years, for the next five, six, seven years.\"\r\n- Buying a stock = buying a business. Compare the diligence to buying a car, a TV, a fridge — or dating someone before you marry them.\r\n\r\n---\r\n\r\n## 1. ALPHABET (GOOGL) — Lesson 54\r\n\r\n### 1.0 Idea sourcing and share class\r\n\r\nAdam's origination logic: start from products you use daily. He lists YouTube (he creates videos), Google Search, **Gemini**, Google Maps, Gmail — therefore analyse Alphabet.\r\n\r\n**Two tickers, one company:**\r\n\r\n| Ticker | Class | Voting rights |\r\n|---|---|---|\r\n| GOOGL | Class A | Yes |\r\n| GOOG | Class C | No |\r\n\r\n\"For most of us, we don't really bother voting, so it really doesn't matter which one you really buy… their share prices are very close anyway.\" Case study uses the **Class A (GOOGL)** shares.\r\n\r\nPrimary tool for this case: **StockOracle** (data provider: **FactSet**), plus FinViz, Zacks, and **TradingView** for charts.\r\n\r\n### 1.1 Step 1 — Consistent revenue / net income / operating cash flow\r\n\r\nAnnual figures, in USD billions, oldest → newest (5 years):\r\n\r\n| Metric | Yr1 | Yr2 | Yr3 | Yr4 | Yr5 | Verdict |\r\n|---|---|---|---|---|---|---|\r\n| Revenue | 257 | 280 | 307 | 349 | 402 | Consistently increasing ✔ |\r\n| Net income | 76 | 59 | 73 | 100 | 132 | General uptrend (one down year) ✔ |\r\n| Net operating cash flow | 65 | 91 | 91 | 101 | 125 → 164* | Generally uptrending ✔ |\r\n\r\n\\* Adam reads the operating cash-flow line as \"$65B, $91B, $91B — flat this year — $101, increasing $125, $164.\" The latest annual operating cash flow used later in the DCF is **$164,713M**.\r\n\r\nKey teaching point: **net income does not have to rise every single year.** \"There's a general uptrend, although there was a year it dropped, doesn't have to go up every single year.\" Fallback rule: if net income isn't consistent, check that **operating income** is consistent (it is).\r\n\r\n**Margins (Step 1, part 2):** checked under StockOracle → *Company Metrics*. Over the last 5 years, **gross margins have been more or less quite stable** and **operating margins have also been pretty stable**. ✔\r\n\r\n→ **Step 1 PASSED.**\r\n\r\n### 1.2 Step 2 — Growth rate and growth catalysts\r\n\r\nQuantitative — three independent projections gathered:\r\n\r\n| Source | Projected growth |\r\n|---|---|\r\n| StockOracle / FactSet — 3-to-5-year earnings growth | **15.3%** |\r\n| StockOracle / FactSet — long-term growth (beyond 5 yrs) | **10.13%** |\r\n| StockOracle / FactSet — cash flow growth rate | 17% (noted but *not used* — Adam takes the two above \"to be more conservative\") |\r\n| FinViz — next 5 years | **12.88%** |\r\n| Zacks — projected growth | **14.72%** |\r\n\r\nAverage of the three 5-yr figures (15.3 + 12.88 + 14.72) ÷ 3 = **14.3%** — used later as the conservative case.\r\n\r\nNavigation note: StockOracle → *Company Metrics* → scroll to *Projected Growth*. Adam keeps these in his 10 \"favorites\" (customisable via three-dots → Edit Favorites; **479 metrics** available).\r\n\r\nQualitative — growth drivers pulled from StockOracle's **AI Insights**:\r\n1. Explosive **AI and cloud infrastructure** expansion\r\n2. Dominance in **digital advertising and search**, with AI monetisation\r\n3. **Enterprise AI adoption** via the Google Cloud backlog\r\n4. **Subscription and YouTube ecosystem** expansion\r\n5. Strong **free cash flow and financial firepower**\r\n6. Global reach and **ecosystem integration**\r\n7. **Waymo** (autonomous-driving market leader) and \"other bets\" — long-term optionality\r\n\r\nRule stated: \"As long as it has got a positive growth rate, it passes this step.\" All figures are positive and double-digit.\r\n\r\n→ **Step 2 PASSED.**\r\n\r\n### 1.3 Step 3 — Economic moat (the most important step)\r\n\r\nTool: StockOracle → **Oracle IQ** → *AI Moat Analysis*. Standard: invest in **wide moat** or **narrow moat**; **avoid no moat**. Adam's caveat: \"You may or may not agree with it, you can always do your own research, but this kind of summarizes and brings together all the research that you can find on your own.\"\r\n\r\n**Alphabet moat score: 9 / 10**\r\n\r\n| Moat source | Score |\r\n|---|---|\r\n| Brand power & pricing power | 9 / 10 |\r\n| Barriers to entry | 10 / 10 |\r\n| Switching costs | 8 / 10 |\r\n| Network effect | 10 / 10 |\r\n| Economies of scale | 9 / 10 |\r\n\r\nReasoning quoted from the analysis and Adam's commentary:\r\n- **Search**: Google holds >90% global market share, \"dwarfing rivals like Microsoft Bing at 4%\" and Yandex / DuckDuckGo at roughly 1%.\r\n- **Brand loyalty**: \"Google this, Google that\" — Google *is* the verb for search.\r\n- **Pricing power**: advertisers \"have to pay top dollar\" to advertise on Google and YouTube.\r\n- **Barriers to entry**: \"It's not easy that anyone else can start a website and compete with Google search, with their kind of history and their data.\"\r\n- **Cloud**: Google Cloud is a **fast-growing but distant third** behind AWS and Microsoft Azure.\r\n- **AI**: Gemini competes with OpenAI's ChatGPT and others, \"supported by massive R&D and infrastructure investments.\"\r\n- Moat root cause: a dominant global advertising platform anchored by Search + YouTube, which together generate unparalleled **user intent data** and advertiser reach.\r\n\r\n→ **Step 3 PASSED.**\r\n\r\n### 1.4 Step 4 — Profitability and operational efficiency\r\n\r\nBenchmarks restated: ROE/ROIC ≥ **12% = great business**; **>15% = excellent business**; want them stable or increasing.\r\n\r\n| Metric | Latest | 5-year average |\r\n|---|---|---|\r\n| Return on equity (ROE) | **35.7%** | 30% |\r\n| Return on invested capital (ROIC) | **32%** | 27% |\r\n\r\nBoth are latest > 5-yr average → improving. \"High ROE, high ROIC.\"\r\n\r\n**Revenue vs accounts receivable** (StockOracle → Financials chart): revenue (blue) growing **much faster** than accounts receivable ✔. Red-flag rule stated explicitly: \"If it was the other way around, where accounts receivables are growing faster than revenue, that's a red flag.\"\r\n\r\n**Cash conversion cycle**: Adam flags this as **not applicable** to Alphabet — \"Alphabet doesn't sell a physical product.\" He looks at it anyway; it has been \"more or less pretty consistent over the last five to ten years.\"\r\n\r\n→ **Step 4 PASSED.**\r\n\r\n### 1.5 Step 5 — Conservative debt\r\n\r\nStockOracle → *Company Metrics* → *Debt and Liquidity Ratios*.\r\n\r\n| Ratio | Alphabet | Threshold |\r\n|---|---|---|\r\n| Current ratio | **2.0** | > 1 |\r\n| Debt servicing ratio | **0%** | \u003c 30% |\r\n| Debt / EBITDA | **0.33** | ≤ 3 |\r\n| Interest coverage | **112×** | at least 3–5× |\r\n\r\n\"On all metrics, Alphabet is a very, very financially strong business.\"\r\n\r\n→ **Step 5 PASSED.** Conclusion: great business, high-quality company → goes on the watch list.\r\n\r\n### 1.6 Step 6 — Intrinsic value (Discounted Free Cash Flow, with normalised capex)\r\n\r\n**Method choice.** Default method = **DCF**. Precondition: cash from operations must be increasing consistently — it is, so DCF is permitted. Adam runs the **discounted free cash flow** variant using StockOracle's automated calculator (StockOracle → *Intrinsic Value* → scroll to automated calculator), which auto-pulls latest FCF, total debt, cash & investments, discount rate, shares outstanding, and projected growth rates.\r\n\r\n**Raw output first:** the calculator's untouched answer is **$190.89** intrinsic value.\r\n\r\n**Why Adam refuses the raw number — the capex normalisation adjustment (the key lesson of this case study):**\r\n\r\n- Free cash flow = **cash flow from operations − capex**.\r\n- The calculator uses the *latest* free cash flow with no adjustment.\r\n- The hyperscalers — \"Meta, Microsoft, Amazon, and Google\" — have recently poured money into **AI infrastructure**, so capex spiked and free cash flow collapsed.\r\n- \"But will this last forever? No, it's temporary.\" Taking the depressed latest FCF \"will underestimate the intrinsic value.\"\r\n- Fix: **take the average capex of the last five years** to normalise.\r\n\r\nLatest-year derivation (StockOracle → Financials → Cash Flow Statement → Annual):\r\n\r\n| Item | USD millions |\r\n|---|---|\r\n| Cash from operations (latest) | 164,713 |\r\n| Capex (latest) | 91,447 |\r\n| **Latest free cash flow** | **73,266** ← what the calculator used |\r\n\r\nFive-year capex, oldest → newest (USD millions): **24,640 → 31,485 → 32,251 → 52,535 → 91,447**. Adam highlights \"a big jump over here\" between years 4 and 5, plus the earlier step-up at 52,535.\r\n\r\nAverage capex = (24,640 + 31,485 + 32,251 + 52,535 + 91,447) ÷ 5 = **46,471.6**\r\n\r\n**Normalised free cash flow** = 164,713 − 46,471.6 = **118,241.4** (USD millions)\r\n\r\n**Base case result.** Plugging 118,241.4 into the calculator and recalculating:\r\n\r\n> **Base case intrinsic value = $304.13**\r\n\r\nGrowth inputs behind the base case: **15.3%** (first 5 yrs) / **10.13%** (next period) / **4%** (terminal).\r\n\r\n**Conservative case.** Replace the 15.3% FactSet figure with the **14.3%** three-source average (FactSet 15.3, FinViz 12.88, Zacks 14.72), leaving everything else identical:\r\n\r\n> **Conservative intrinsic value = $292.41**\r\n\r\n**Valuation range: $292 – $304.**\r\n\r\n**The lazy alternative.** \"If you're very lazy, then just look at the Oracle Value.\" StockOracle's own **Oracle Value = $294**, which Adam notes falls as \"kind of like a median between this range that I just did for you.\" So a user can either do the manual capex normalisation or simply accept the Oracle Value.\r\n\r\n| Scenario | 5-yr growth input | Intrinsic value |\r\n|---|---|---|\r\n| Calculator raw (unadjusted FCF of 73,266) | 15.3% | $190.89 |\r\n| **Base case** (normalised FCF 118,241.4) | 15.3% | **$304.13** |\r\n| **Conservative** (normalised FCF 118,241.4) | 14.3% | **$292.41** |\r\n| StockOracle \"Oracle Value\" shortcut | — | $294 |\r\n\r\n### 1.7 Step 7 — Technical analysis and entry plan\r\n\r\nCharting software: **TradingView**. Workflow is always **10-yr monthly → 5-yr weekly → 1-yr daily**.\r\n\r\n**Chart hygiene notes:**\r\n- Click **L** for logarithmic scale; **A** to auto-readjust.\r\n- **Do NOT enable ADJ (adjust for dividends)** when drawing support levels. \"I only adjust for dividends when I'm comparing the performance of a few stocks, but if I'm looking at just one stock, I do not adjust for dividends.\"\r\n\r\n**(a) 10-year monthly.** Requirement: \"If it's a great company, you should see a long-term up trend. If you see a long-term down trend, then think twice.\" Alphabet shows a clear long-term uptrend of wave-up/wave-down. The big drawdowns identified on the chart: the **COVID crash**, the **2022 bear market**, and \"the trade war unleashed by Trump,\" each followed by a wave up.\r\n\r\nFirst action: draw the intrinsic value as a **horizontal ray, dotted, green** at the conservative figure **292**. Rule: \"I want to make sure that I only buy when the price goes below this green line.\"\r\n\r\nSupports identified on the monthly:\r\n- **50 MA (blue line) = $163.94** — historically a very strong support during bear markets/crashes. Caveat stated plainly: \"Am I predicting that the price is gonna drop to 163.94? Of course not… In fact, the price may never drop to that level.\" The reason to draw it is probability, not prediction.\r\n- **20 EMA (red line)** — acts as support during *normal* wave-downs (\"toing, toing, toing\").\r\n\r\n**(b) 5-year weekly.** Structure read: uptrend → downtrend (2022 bear market) → uptrend → sharp correction → uptrend again.\r\n- The **50 MA on weekly** provides support and **coincides with the 20 EMA on monthly** — \"the 50 moving average on the weekly candles is equivalent to the 20 EMA on the monthly candles. They actually coincide.\" Double confirmation of that level.\r\n- The **100 MA on weekly (orange line) ≈ $207** has previously acted as support **and** coincides with a previous swing high → two points of confirmation. Support drawn at **207**.\r\n\r\nCaveat: \"Support levels can be subjective. You can have two different investors looking at the charts and they identify different support levels.\"\r\n\r\n**(c) 1-year daily.** The stock had been in a sustained uptrend, but \"recently you can see that it waved down and then waved up and waved down and waved up. So it looks like it's at the **early stages of a short-term downtrend**.\" No one can predict how long a downtrend lasts.\r\n\r\n**Adam's own position and behaviour:** he is already invested in Alphabet, has been \"for quite a number of years.\" Is the short-term downtrend a reason to sell? \"No, of course not… It's a great company. In the long run, it will always go higher… In the short term, it can go on a short-term downtrend, but eventually the trend will reverse back up.\" He doesn't sell — he adds.\r\n\r\n**The nearest support that he rejects.** There is a visible support level on the daily chart where price has bounced repeatedly, but it sits **above** the $292 intrinsic value. He will not buy there: \"while it's a support level and it could bounce off, this support level is **not below the intrinsic value**. So I'm not buying when it's undervalued with a margin of safety, I'm paying the fair price… there's nothing wrong with that, but for me, I'm very conservative. I like to buy at least below the intrinsic value.\" He therefore pulls the level down to the next swing low.\r\n\r\n#### GOOGL final verdict and entry ladder\r\n\r\n- **Business verdict:** great business, passes all 5 quality steps.\r\n- **Value verdict:** worth **$292 – $304**; only buy **below the green $292 line**.\r\n- **Entry plan:** ~**$270** (next swing low below intrinsic value), then the mentioned **$237** level, then the weekly-100MA/swing-high level at **$207**, then the monthly-50MA level at **$163.94**.\r\n- **Doctrine:** \"For every stock that I think is a great company, I identify the intrinsic value, and then below that, I will add at least **four to five support levels**. And this is where I will add shares if the price drops to that level. And I'll keep adding until I have got a **full position**. Once I've got a full position, I won't add more. But I'll let the position grow organically.\"\r\n- Full-position sizing / portfolio allocation is deferred to the portfolio-construction lesson.\r\n\r\n---\r\n\r\n## 2. MICROSOFT (MSFT) — Lessons 55 & 56\r\n\r\nListed: **NASDAQ**. Sector: **Technology**. Industry: **Software**.\r\n\r\n### 2.0 Investment thesis first\r\n\r\nBefore analysing anything, define **why** you are buying: growth, predictability, defensiveness, dividends, etc. (There are eight investment categories, covered in a later lesson.)\r\n\r\n> **MSFT thesis: growth AND predictability.** \"It is both a growth stock, it grows at high double digits, at the same time it is a very predictable company. It's **recession-proof and pandemic-proof**.\"\r\n\r\nUnderstand the business by being a customer: Adam uses Microsoft Office for home and office computing, LinkedIn, Microsoft Teams (\"a more sophisticated version of Skype\") at his office, and plays Xbox with his kids. Supplement with the annual report, the company website, and an online business description.\r\n\r\n### 2.1 Business overview and segments\r\n\r\nMicrosoft \"develops, licenses, and supports software, services and solutions worldwide\" — productivity software, cloud computing, advertising campaigns.\r\n\r\n**Three reporting segments:**\r\n\r\n| Segment | Contents | Competitive position |\r\n|---|---|---|\r\n| **Intelligent Cloud** | Azure, Visual Studio, Windows Server | **#2** in enterprise cloud behind Amazon; \"Azure is fast catching up\" |\r\n| **Productivity & Business Processes** | Office 365 (Excel, PowerPoint, Word), LinkedIn, Microsoft Teams | Dominant; enterprises use Teams over Zoom |\r\n| **More Personal Computing** | Windows, Xbox, HoloLens (VR/AR — \"huge potential in the upcoming metaverse\") | Windows ~86% desktop OS share |\r\n\r\n**Revenue breakdown:**\r\n\r\n| Segment | Share of revenue |\r\n|---|---|\r\n| Personal computing | ~34% |\r\n| Cloud (enterprise) | ~30% |\r\n| Enterprise productivity & business processes | ~35% |\r\n\r\n### 2.2 Step 1 — Consistent revenue / net income / operating cash flow\r\n\r\nTools: **Yahoo Finance** (4 years + TTM), then **GuruFocus** for the longer history, then **Morningstar** for margins.\r\n\r\nYahoo Finance annual figures (FY2018, 2019, 2020, 2021, plus TTM), USD billions:\r\n\r\n| Metric | 2018 | 2019 | 2020 | 2021 | TTM |\r\n|---|---|---|---|---|---|\r\n| Revenue | 110 | 125 | 143 | 168 | 176 |\r\n| Net income | 16 | 39 | 44 | 61 | 67 |\r\n| Cash flow from operations | 43 | 52 | 60 | 76 | **81** (81,945 M) |\r\n| Free cash flow | positive | positive | positive | positive | positive ✔ |\r\n\r\nAll three lines increase consistently. Free cash flow is \"positive all the way.\"\r\n\r\n**GuruFocus long-history check.** Revenue grows nicely long-run; net income also grows long-run with one dip ~7 years back. Adam's method for a dip: **go to the annual report and read the income statement to find the cause.** In this case the drop was due to **changes in taxation** — \"which is fine because it is not a core business expense that caused the drop, it is a non-core operating expense. So the actual business itself was still growing.\" Operating cash flow (grey) rises consistently; free cash flow (green) positive.\r\n\r\n**Margins (Morningstar → Operating Performance):**\r\n\r\n| Margin | 5-yr average | Recent years |\r\n|---|---|---|\r\n| Gross profit margin | **65%** | 65 → 67 → 68 → 68 (recent > 5-yr avg ✔) |\r\n| Net profit margin | **26%** | 30 → 36 → 38 (rising ✔) |\r\n\r\nRule restated: \"As long as it's consistent or rising, that's great. As long as it's not falling.\"\r\n\r\n→ **Step 1 PASSED.**\r\n\r\n### 2.3 Step 2 — Growth projections\r\n\r\n| Source | Projection |\r\n|---|---|\r\n| FinViz — past 5 years actual | **25.7% p.a.** |\r\n| FinViz — next 5 years | **16.53%** |\r\n| Zacks — next 3–5 years | **12.04%** |\r\n| Simply Wall St | **10.8%** |\r\n| **Average of the three forward figures** | **13.12%** (\"13%\") |\r\n\r\nAdam notes FinViz also confirms the sector (Technology) and industry (Software).\r\n\r\n**Outlier rule:** \"Sometimes if one website gives a very different figure — for example 16% and 14% and 3%, and 3% is like way out there — then I would ignore it. So either it's ridiculously low or ridiculously high, I'll ignore that. It's an outlier. I'll take the average of the different websites [that] have more or less the same growth projections.\"\r\n\r\nPass criterion is simply that growth is **positive**. Optimistic → take the highest; pessimistic → take the lowest; unsure → average.\r\n\r\n→ **Step 2 PASSED.**\r\n\r\n### 2.4 Step 3 — Economic moat (qualitative only)\r\n\r\n\"Step three is more qualitative. In other words, there's no number to look at.\" The problem with owning stocks whose products you don't use: \"it's really hard to understand the company's competitive advantage.\"\r\n\r\nChecklist of moat sources run against Microsoft:\r\n\r\n| Moat source | Microsoft? | Evidence |\r\n|---|---|---|\r\n| **Brand monopoly** | ✔ Yes | Top-of-mind recall: word processing → Word; spreadsheets → Excel; presentations → PowerPoint; operating system → Windows |\r\n| **High switching costs** | ✔ Yes | *Individuals*: \"I'm so used to using PowerPoint, Excel, and Microsoft Word… I've learned it all my life since I was a kid.\" *Companies*: switching off Azure to another cloud is \"costly and expensive and frustrating… once you're locked in\" |\r\n| **Network effect** | ✔ Yes | Adam works in Keynote on a Mac but \"still have to convert to PowerPoint to share with my colleagues… because everyone is using it, you gotta use it.\" Also **LinkedIn** |\r\n| Barriers to entry | (listed as a source; not separately scored) | — |\r\n| Economies of scale | (listed as a source; not separately scored) | — |\r\n\r\nVerdict: \"Microsoft definitely has three of the economic moat sources… it definitely has a sustainable competitive advantage.\"\r\n\r\n**The chart-as-moat-proxy shortcut:** \"Usually a company with a wide economic moat has a long-term uptrend in the stock price… if you see that the price goes up like that in 10 years, it usually has a wide economic moat because **only companies that have got no close competition are able to perform so well**. So that's a clue.\" Microsoft's 10-year monthly chart is a clear uptrend.\r\n\r\n**Competitor mapping** (search \"Microsoft's competitors\" online — and note that published lists can be stale; the article Adam opens omits Amazon and still lists IBM):\r\n\r\n| Segment | Competitors |\r\n|---|---|\r\n| Cloud | Amazon (AWS), Alphabet (Google Cloud) |\r\n| Enterprise IT solutions | Oracle, SAP |\r\n| Personal / application software, desktop OS | Apple — but **Apple has 14% desktop OS share vs Windows 86%** |\r\n\r\n**Relative-strength test on TradingView** (5-year comparison overlay):\r\n- vs **Oracle and SAP** — \"Microsoft of course performs a lot better.\" Principle: \"obviously you want to invest in the strongest performer.\"\r\n- vs **Amazon and Alphabet** — not a clean comparison (Amazon also does e-commerce; Alphabet also does search advertising and YouTube), \"they compete in only one part of the business, but not in all parts.\" Even so, **Microsoft outperformed both over the last 5 years.** Adam adds: \"I own all three companies anyway. So I don't care which one wins, because I own all three.\"\r\n- vs **Apple** — \"pretty much neck to neck, very, very close, with Apple slightly above Microsoft.\" Not a direct competitor across most segments since \"Microsoft doesn't really make much hardware.\"\r\n\r\n→ **Step 3 PASSED.**\r\n\r\n### 2.5 Step 4 — Profitability and operational efficiency\r\n\r\nFour metrics: ROE, ROIC, revenue vs accounts receivable, cash conversion cycle. ROE/ROIC source: **Morningstar → Operating Performance**. Threshold: **above 12%**.\r\n\r\n| Metric | Last 12 months | 5-year average |\r\n|---|---|---|\r\n| ROE | **49%** (\"wow\") | 34% |\r\n| ROIC | **33%** (\"double wow\") | 20% |\r\n\r\n**Revenue vs accounts receivable — TradingView build instructions (given step by step):**\r\n1. Financials → Revenue → **Total Revenue, Annual**\r\n2. Indicators → search **Accounts Receivables** → **Annual**\r\n3. On one pane, click the three dots (*More*) → **Move to existing pane above** (merges the two panes)\r\n4. Right-click the price axis (or two-finger click on a Mac trackpad) → **Merge all scales into one on the right**\r\n\r\nResult: revenue (blue) rising strongly, accounts receivable (magenta) rising more slowly ✔.\r\n\r\n**Cash conversion cycle:** \"mainly applies to retail companies that sell physical goods, that have physical inventory. So it doesn't really apply to Microsoft that much, because Microsoft sells software and services\" — checked anyway \"for practice purposes.\" It is **declining** ✔. Rule: want it declining or consistent; \"the shorter the cash conversion cycle, the faster the company makes its money back. But if it is rising, then that's a bad sign.\"\r\n\r\n→ **Step 4 PASSED.**\r\n\r\n### 2.6 Step 5 — Conservative debt\r\n\r\n| Ratio | Microsoft | Threshold | Source |\r\n|---|---|---|---|\r\n| Current ratio | **2.16** | > 1 | GuruFocus |\r\n| Debt / EBITDA | **0.7** | ≤ 3 | GuruFocus |\r\n| Debt servicing ratio | **2.8%** | \u003c 30% | calculated manually |\r\n\r\n**Debt servicing ratio — worked by hand** (Adam: \"something which you have to calculate yourself because I don't find it on any website\"):\r\n\r\n```\r\nDebt servicing ratio = (Net interest expenses ÷ Cash flow from operations) × 100%\r\n```\r\n\r\n- Net interest expense (income statement, annual/TTM): **$2,296 million** (displayed as 2,296,000 in thousands)\r\n- Cash from operations (cash flow statement, TTM): **$81,945 million**\r\n- 2,296 ÷ 81,945 × 100 = **2.8%** → far below the 30% ceiling ✔\r\n\r\n→ **Step 5 PASSED.** Great business → watch list.\r\n\r\n### 2.7 Step 6 — Intrinsic value (Discounted Cash Flow from operations)\r\n\r\n**Method choice:** primary method = **discounted cash flow** using **cash flow from operations**. Precondition — operating cash flow must be increasing consistently: 43 → 52 → 60 → 76 → 81 billion. Yes. Method permitted.\r\n\r\n**Calculator hygiene:** key in only the **white boxes**; shaded/coloured boxes contain built-in formulas — \"if you change the coloured boxes, it will change the formula.\"\r\n\r\n#### Full input set\r\n\r\n| Input | Value | Where it comes from |\r\n|---|---|---|\r\n| Name / symbol | Microsoft / MSFT | — |\r\n| Valuation method | **Discounted cash flow** (from operations) | — |\r\n| Statement currency | USD | Financial statements |\r\n| Stock listing currency | USD | Exchange listing |\r\n| Exchange rate | 1.00 | USD:USD |\r\n| Most recent cash flow from operations | **$81,945 million** | Cash flow statement, TTM |\r\n| Total debt (short-term + long-term) | **$53,288 million** | Balance sheet, **latest quarter**: current debt 3,249 + long-term debt 50,039 |\r\n| Cash and short-term investments | **$130,584 million** | Balance sheet, latest quarter: cash & equivalents + short-term investments |\r\n| Growth rate, first 5 years | **13.12%** | Average of FinViz 16.53 / Zacks 12.04 / Simply Wall St 10.8 |\r\n| Growth rate, next 5 years | **13.12%** | Same as first 5 years, **subject to a maximum of 15%** |\r\n| Growth rate, final 10 years (terminal) | **4%** | US average GDP growth + 1% (\"last I checked it's 4.18%… just fix it at 4%, it's fine\") |\r\n| Shares outstanding | **7,510 million** (7.51 billion) | FinViz — note the calculator wants **millions**, so 7.51 bn × 1,000 |\r\n| Beta | **0.88** | FinViz |\r\n| Discount rate | **5%** | Discount-rate table keyed off beta (see below) |\r\n\r\n**Currency discipline (a general lesson taught inside the MSFT case):** the statement currency and the stock listing currency can differ. For **Alibaba**, statements are in **RMB**; the listing currency is **USD** if bought on the US exchange or **HKD** if bought in Hong Kong — you must then enter the correct exchange rate. Covered further in an Alibaba/Tencent case study.\r\n\r\n**Cash-flow normalisation rules taught here (applied later to AMZN and GOOGL):**\r\n- Check that the latest figure \"is similar or higher than previous years\" — you want a gradual increase to project forward.\r\n- **Sudden big jump** in the last 12 months → do **not** use it; it may not be sustainable. Use the prior year, or an average of the last 3–4 years.\r\n- **Sudden big plunge** (e.g. pandemic-driven) → do **not** use it either; it won't last. Use a 3–4-year average for a \"more normal cash flow.\"\r\n- Microsoft grows \"very, very consistently,\" so the latest figure is used as-is.\r\n\r\n**Debt definition:** \"Total debt is **not** total liabilities. It is short-term debt plus long-term debt.\" Current debt = short-term debt (same thing). Balance-sheet items are always taken from the **latest quarter**, never annual.\r\n\r\n**Discount rate table:** driven by **beta**; separate tables exist for US stocks and China stocks. Beta 0.88 sits between the \"\u003c0.8 → 4.6%\" and \"1.0 → 5.6%\" rows. Adam first says 5.6%, then reasons \"0.88 is closer to 0.8, so why don't you use 5\" and settles on **5%** — \"Doesn't have to be exact.\"\r\n\r\n#### Results\r\n\r\n> **Base case intrinsic value = $398** (growth 13.12%)\r\n\r\nCurrent share price as of **15 January 2022 = $310** → the stock is **undervalued by 22%**.\r\n\r\n**Pessimistic scenario 1 — use the lowest growth projection.** Replace 13.12% with Simply Wall St's **10.8%**:\r\n\r\n> **Pessimistic value = $337** → at $310, still an **8% discount** (\"which is still not bad\")\r\n\r\n**Pessimistic scenario 2 — halve the growth after year 5.** Keep the first 5 years at 13.12% but set the next-5-year rate to **6.56%** (13.12 ÷ 2):\r\n\r\n> **Pessimistic value = $324.99 ≈ $325** → still undervalued\r\n\r\n| Scenario | 1st-5-yr growth | Next-5-yr growth | Intrinsic value |\r\n|---|---|---|---|\r\n| **Base case** | 13.12% | 13.12% | **$398** |\r\n| Pessimistic 1 (lowest projection) | 10.8% | 10.8% | **$337** |\r\n| Pessimistic 2 (growth halves after yr 5) | 13.12% | 6.56% | **$325** |\r\n\r\n**Valuation range: $325 – $398**, against a share price of **$310**.\r\n\r\n> \"Do you feel pretty safe buying at this price knowing that the company's worth anywhere between $325 to $398? Yeah, I am.\"\r\n\r\nPrinciple: \"If the current share price is below **even the pessimistic one**, that gives you a great margin of safety.\"\r\n\r\n### 2.8 Step 7 — Technical analysis and entry plan\r\n\r\nEntry triggers (stated as the three valid setups): buy on **a dip within an uptrend**, at the **support level of a consolidation**, or when price **reverses into a new uptrend**.\r\n\r\nThe **green intrinsic-value line is drawn at $325** — i.e. deliberately at the *most pessimistic* value, \"but of course you can put the more optimistic one as well.\"\r\n\r\n**(a) 10-year monthly.** \"I want to see a clear uptrend like that. If I don't get a clear uptrend, I'm not interested in the stock in the first place.\" ✔ Then: where does price land whenever there's a crash? Repeatedly at the **20 MA (red dotted line)** — multiple historical touches.\r\n→ Support drawn at **$262**. \"If Microsoft crashes because of whatever reason — bear market or nuclear war or whatever it is — then you can be sure that it's going to hit this support level and you want to be a buy at 262.\"\r\n\r\nImportant qualifier: this does **not** mean waiting only for 262. \"We can start buying now because it's already undervalued… you never know when it's going to hit that. It may hit that this year, next year, three years from now… So if you want to wait only when it reaches there, then you may buy maybe once every few years.\"\r\n\r\n**(b) 5-year weekly.** Price hit the **50 MA (blue line)** — a strong historical support that also coincides with a **previous swing low**.\r\n→ Support drawn at **$283**. Also, the **20 MA on weekly** is a strong support.\r\n→ Support drawn at **$305**.\r\n\r\n**(c) 1-year daily.** Clear wave pattern; price is currently waving down and has found support at the **green line = 150 MA**, which coincides with **previous resistance turning into support**.\r\n→ Support drawn at **$316**. \"Resistance becomes a support. Beautiful, right?\"\r\n\r\n#### MSFT final verdict and entry ladder\r\n\r\n| Support level | Where it comes from |\r\n|---|---|\r\n| **$316** | Daily 150 MA + previous resistance turned support |\r\n| **$305** | Weekly 20 MA |\r\n| **$283** | Weekly 50 MA + previous swing low |\r\n| **$262** | Monthly 20 MA (crash-level support) |\r\n\r\nGreen intrinsic-value line: **$325**. Price: **$310** (already below the pessimistic value).\r\n\r\n**Tranche execution as described:** \"After this wave up, it's now wave down, it hit the first level, and it's undervalued — I could have bought **one quarter of my planned allocation** here. Now it hit the second level, I buy another one quarter, so I could have bought **half** of the intended Microsoft shares I want to buy in my portfolio… and of course if it drops even further, then I would add even more until I have a **full position**.\" If it never reaches the lower levels and instead waves back up and down again, you simply buy the next time it returns to a level.\r\n\r\n**Verdict: great business, undervalued, and at a valid entry point — buy in quarters at $316 / $305 / $283 / $262.**\r\n\r\n---\r\n\r\n## 3. AMAZON (AMZN) — Lessons 57 & 58\r\n\r\nListed: **NASDAQ**.\r\n\r\n### 3.0 Thesis and classification\r\n\r\n> **Thesis: large-cap GROWTH.** \"When a company grows more than 20%, we classify it as a growth company.\"\r\n\r\n**Sector correction Adam insists on:** \"Some people think that Amazon's a technology stock. **No it's not.** It is a **retail company** that is within the **consumer discretionary sector**,\" in the **retail industry**.\r\n\r\nUnderstand the business as a customer — Adam is an Amazon Prime member.\r\n\r\n### 3.1 Business overview, segments and competitors\r\n\r\n| Business | Description | Competitors |\r\n|---|---|---|\r\n| **Retail / e-commerce** (Amazon, Amazon Go) | \"One of the highest-grossing e-commerce retailers in the world\" — deliberately *not* \"the highest\": **Alibaba is the biggest by gross merchandise value.** Amazon is \"smaller than Alibaba in terms of GMV\" but \"a lot more profitable… much higher margins because of its cloud business\" | Alibaba, Walmart, Target, eBay |\r\n| **Whole Foods** | Supermarket, healthy foods | (grocery) |\r\n| **Cloud — AWS** | **The most profitable business, not retail.** \"In cloud, Amazon is the market leader\" — **33% market share of the cloud market as of Q2 2020** | Microsoft Azure, Alibaba Cloud, Google Cloud |\r\n| **Game streaming — Twitch** | | YouTube Gaming, Mixer |\r\n| **Amazon Prime Music** | | Spotify, Apple Music |\r\n| **Amazon Alexa** | | Google Home |\r\n| Amazon Logistics (smaller) | | FedEx |\r\n| Amazon Pay (smaller) | | Stripe, Apple Pay, PayPal, Google Pay |\r\n| Kindle, Audible, Amazon Prime video (smaller) | | Netflix |\r\n\r\nKey structural insight: **retail is not the profit engine — cloud is.**\r\n\r\n### 3.2 Step 1 — Consistent revenue / net income / operating cash flow (and the negative FCF investigation)\r\n\r\nYahoo Finance, annual + TTM, USD billions (only ~3 years + TTM available on Yahoo):\r\n\r\n| Metric | Yr1 | Yr2 | Yr3 | TTM |\r\n|---|---|---|---|---|\r\n| Revenue | 232 | 280 | 386 | **457** |\r\n| Net income | 10 | 11 | 21 | **26** |\r\n| Cash flow from operations | 30 | 38 | 66 | **54** (a drop) |\r\n| Free cash flow | 17 | 21 | **25.924** | **NEGATIVE** |\r\n\r\nRevenue ✔ consistently up. Net income ✔ consistently up. Operating cash flow: \"generally we have an uptrend\" despite the TTM dip.\r\n\r\n#### The negative free cash flow investigation (the signature lesson of this case)\r\n\r\nFree cash flow turned **negative** in the last 12 months. Adam's diagnostic logic:\r\n\r\n```\r\nFree cash flow = Cash from operations − Capital expenditure (PP&E)\r\n```\r\n\r\n\"If free cash flow turns negative, it's because of two reasons: either the operational cash flow is negative, or the capex is very big. But in this case, the operational cash flow is still very healthy… So the only reason free cash flow turned negative is because of **huge amounts of capital expenditure**.\"\r\n\r\nWhere to look: capex sits **under investing cash flow** on the cash flow statement, as **PP&E**. It shows \"a huge jump from previous years.\"\r\n\r\n**Research finding (Adam's own answer posted to his student chat groups):** In the last 12 months Amazon spent **a whopping $45 billion on capital expenditures — more than twice** what it normally spends. Reasons:\r\n- New **Amazon Fresh** supermarkets\r\n- **Cloud infrastructure**\r\n- **Voice-activated technology**\r\n- **Logistics — \"the biggest driver of this growth in CapEx\"**\r\n\r\n**Is it good or bad?** \"To me, the answer is **good**. Why? Because they're making a lot of investments that may cause the free cash flow to turn negative temporarily for one year, but by investing heavily in all these new businesses like cloud infrastructure, logistics, it will lead to higher growth and higher profits in the future.\"\r\n\r\n**Boundary condition:** \"It is fine for **one year** of negative free cash flow, but of course if this persists for **more than one year — like two or three years — then you gotta be careful.**\"\r\n\r\nMethod note: \"When you have got something out of the ordinary, you need to do more research. You need to go online and research… read their annual reports to find out is it a good thing.\"\r\n\r\n**GuruFocus long-run view:** net income (blue) increasing consistently over five years; operating cash flow (grey) increasing consistently; free cash flow (green) consistently positive except the last 12 months. Net income looks tiny beside revenue on the same axis — use the separate chart to see it clearly.\r\n\r\n**The anomaly flagged for later:** \"Their operating cash flow is much higher than their net profits and net income… I'll talk more about this later on in the intrinsic value calculation.\" (This is what changes the valuation method — see §3.7.)\r\n\r\n**Margins (Morningstar → Operating Performance):**\r\n\r\n| Margin | 2018 | 2019 | 2020 | TTM | vs 5-yr average |\r\n|---|---|---|---|---|---|\r\n| Gross margin | 26% | 25% | 22%* | **25%** | **above** 5-yr avg ✔ |\r\n| Net profit margin | 4% | 4% | 5% (from 1% earlier) | **5.7%** | **above** 5-yr avg ✔ |\r\n\r\n\\* Adam reads the gross margin row as \"22%, 25%, 26%, 24% — so it's more or less consistent, it's pretty okay,\" and net margins as \"1%, ooh, that's really low, 4%, 4%, 5% — so that's growing and that's consistent as well,\" with TTM at gross 25% / net 5.7%. Both TTM figures exceed the 5-year averages → \"profit margins look healthy.\"\r\n\r\n→ **Step 1 PASSED.**\r\n\r\n### 3.3 Step 2 — Growth projections and catalysts\r\n\r\n**Qualitative catalysts:** the business is primarily **e-commerce + cloud computing**, \"and they are both in huge growth industries.\" E-commerce is a **long-term secular growth industry** (\"more and more people are spending online\") and cloud computing \"is also a secular growth industry.\"\r\n\r\n| Source | Projection |\r\n|---|---|\r\n| FinViz — past 5 years actual | **101% p.a.** — \"this 101% is on average **per year** growth, not total five years\" |\r\n| FinViz — next 5 years | **36%** (\"expected to moderate\") |\r\n| Zacks — next 3–5 years | **24.68%** |\r\n| Simply Wall St | **29.8%** |\r\n| **Average of the three forward figures** | **≈30%** |\r\n\r\n\"They are all pretty similar.\" (36 + 24.68 + 29.8) ÷ 3 ≈ **30%**.\r\n\r\n→ **Step 2 PASSED.**\r\n\r\n### 3.4 Step 3 — Economic moat\r\n\r\nMoat questions run against Amazon:\r\n\r\n| Moat source | Amazon? | Reasoning |\r\n|---|---|---|\r\n| **Brand monopoly** | ✔ Yes | Top-of-mind for e-commerce; also for cloud infrastructure |\r\n| **High barriers to entry** | ✔ Yes | Amazon Prime same-day free delivery — \"because of their scale, their size, they can do it faster and cheaper than anyone else\" |\r\n| **Huge economies of scale** | ✔ Yes (\"you bet\") | Scale of fulfilment network |\r\n| **Network effect** | ✘ \"Maybe not\" | Adam explicitly declines to claim it |\r\n| **High switching costs** | ⚠️ **Split by segment** | *E-commerce/individual:* **No** — \"if you want to buy on Amazon today, you can always buy on Alibaba tomorrow, you can buy on eBay the next day, so you could switch easily as an individual.\" *Cloud/enterprise:* **Yes** — \"once a company hosts their stuff on Amazon Web Services, it's gonna be expensive and difficult to switch to Microsoft Azure\" |\r\n\r\nMarket-share anchor: **AWS holds 33% of the cloud market as of Q2 2020 — clear market leader.**\r\n\r\nVerdict: \"Amazon definitely does have at least **two or three** of these sources of a wide moat.\"\r\n\r\n→ **Step 3 PASSED.** (Note this is a *weaker* moat verdict than GOOGL's 9/10 or MSFT's clean three-source pass — Adam is explicit that two of the five sources fail or are segment-limited.)\r\n\r\n### 3.5 Step 4 — Profitability and operational efficiency\r\n\r\nMorningstar → Operating Performance:\r\n\r\n| Year | ROE | ROIC |\r\n|---|---|---|\r\n| 2017 | 12% | 14% |\r\n| 2018 | 28% | 11% |\r\n| 2019 | 21% | 14% |\r\n| 2020 | 27% | 13% |\r\n| **TTM** | **25%** | **above 12%** |\r\n\r\nBoth TTM figures are **above 12%** and **above their 5-year averages**. Adam acknowledges ROIC \"has been below 12% in 2017 and 2019 slightly, but last 12 months it's way above 12% and above the five-year average, **so that's fine for me.**\" (A tolerance ruling: occasional dips below threshold are acceptable if the latest reading and trend are strong.)\r\n\r\n**Revenue vs accounts receivable** — same TradingView merge procedure as MSFT (annual revenue + annual accounts receivables → *Move to existing pane above* → right-click axis → *Merge all scales into one on the right*). Over 5 years, revenue grows \"a lot more than accounts receivables\" ✔.\r\n\r\n**Cash conversion cycle** — TradingView → Indicators → Financials → Cash Conversion (viewable quarterly), last 5 years: **declining** ✔. \"The shorter the cash conversion cycle, the more efficient the company is at turning around its cash.\" Note: unlike MSFT and GOOGL, this metric is genuinely applicable to Amazon because it is a physical-goods retailer.\r\n\r\n→ **Step 4 PASSED.**\r\n\r\n### 3.6 Step 5 — Conservative debt\r\n\r\n| Ratio | Amazon | Threshold | Source |\r\n|---|---|---|---|\r\n| Current ratio | **1.12** | > 1 | GuruFocus |\r\n| Debt / EBITDA | **1.76** | ≤ 3 | GuruFocus |\r\n| Debt servicing ratio | **2.4%** | \u003c 30% | calculated manually |\r\n\r\n**Debt servicing ratio worked by hand — note the *net* interest treatment:**\r\n\r\nFrom the income statement (quarterly view):\r\n- Interest **income**: **$430 million**\r\n- Interest **expense**: **$1.7 billion**\r\n- **Net interest expense = $1,311 million**\r\n\r\nCash from operations (TTM): **$54,672 million**\r\n\r\n1,311 ÷ 54,672 × 100 = **2.4%** → \"only 2.4% of the company's cash from operations is used to pay its interest expenses, which is very, very low.\" ✔\r\n\r\n(Contrast with MSFT, where Adam used the gross interest-expense line directly. Here he explicitly nets interest income against interest expense.)\r\n\r\n→ **Step 5 PASSED.** Great business → watch list.\r\n\r\n### 3.7 Step 6 — Intrinsic value: WHY AMAZON GETS A DIFFERENT METHOD\r\n\r\n**This is the most important methodological difference across the three case studies.**\r\n\r\nAdam's default is **discounted cash flow from operations**. He does **not** use it for Amazon. The rule:\r\n\r\n> **When cash from operations is more than ~1.5× net income, switch to the discounted FREE cash flow method — it is more conservative.**\r\n\r\nEvidence for Amazon:\r\n\r\n| Year | Net income (USD bn) | Cash from operations (USD bn) | Ratio |\r\n|---|---|---|---|\r\n| 2018 | 10 | 30 | 3.0× |\r\n| 2019 | 11 | 38 | 3.5× |\r\n| 2020 | 21 | 66 | 3.1× |\r\n| TTM | 26 | 54 | 2.1× |\r\n\r\n**Why the gap exists — the accounting explanation Adam gives:**\r\n- **Depreciation and amortisation is a non-cash expense.**\r\n- Net income is calculated **after deducting** D&A.\r\n- Cash from operations **adds D&A back**.\r\n- Amazon's D&A is enormous — \"you can see that depreciation over here, **31 billion, 24 billion**, makes up a huge chunk of the expenses.\"\r\n- Therefore operating cash flow balloons relative to net income.\r\n- Conclusion: \"This tells us that this company has **high capital expenditures or high depreciation costs**. So for these kinds of companies it makes sense to use free cash flow instead, because free cash flow would be the cash from operations after deducting capital expenditure.\"\r\n\r\n**Which free cash flow figure to use — normalisation, in the opposite direction from GOOGL.**\r\n\r\nAmazon's FCF history: 17bn → 21bn → **25.924bn** → **negative (TTM)**.\r\n\r\n\"Does it make sense to take this number? It doesn't make sense, right? Because this is exceptionally low because of a one-time increase in capex… **whenever you see a big change in the last year or so, you can ignore that and take the year before that, before this skew happened** — that it's more of a normalized free cash flow.\"\r\n\r\n> **FCF input used = $25,924 million** (the FY2020 figure, i.e. the year *before* the capex spike).\r\n\r\n*(Compare: for GOOGL, faced with the same hyperscaler-capex problem, Adam instead averaged five years of capex and subtracted that from the latest operating cash flow. Two different normalisation techniques for the same underlying distortion.)*\r\n\r\n#### Full input set\r\n\r\n| Input | Value | Source / note |\r\n|---|---|---|\r\n| Name / symbol | Amazon / AMZN | — |\r\n| Valuation method | **Discounted FREE cash flow** | Because CFO > 1.5× net income |\r\n| Normalised free cash flow | **$25,924 million** | FY2020 (pre-capex-spike) |\r\n| Total debt | **$50,055 million** | Balance sheet, **latest quarter**. Adam expands the liabilities tree and finds **no short-term debt line at all** — \"you don't see any short-term debt, do you? Nope, so there isn't any.\" Long-term debt only |\r\n| Cash and short-term investments | **$78,988 million** | Balance sheet, latest quarter: cash & equivalents **+** short-term investments added together |\r\n| Growth, first 5 years | **30%** | Average of FinViz 36 / Zacks 24.68 / Simply Wall St 29.8 |\r\n| Growth, next 5 years | **15%** | Same-as-first-5-years rule, **capped at the 15% maximum** — 30% exceeds the cap |\r\n| Growth, final 10 years | **4%** | US GDP growth + 1% |\r\n| Shares outstanding | **507 million** | FinViz |\r\n| Beta | **1.1** | FinViz |\r\n| Discount rate | **6.3%** | From the (updated) beta table |\r\n| Statement currency / listing currency | USD / USD, rate 1:1 | Final currency check |\r\n\r\n**Discount-rate table update — explained here:** the table Adam uses for Amazon \"is slightly different from the table which I used in calculating Microsoft… there's been a recent update on this table.\" The underlying formula:\r\n\r\n```\r\nDiscount rate = Risk-free rate + (Beta × Market risk premium)\r\n```\r\nwhere the **risk-free rate is the 5-year average of the 10-year Treasury bond rate** and the **market risk premium is also a 5-year average**. Because those averages move, the table is periodically refreshed and posted to the chat groups and course website. \"Always ensure that you're using the latest calculator.\" He explicitly tells MSFT-case viewers to redo their number with the newer table.\r\n\r\n#### Results\r\n\r\n> **Base case intrinsic value = $3,312** (growth 30%)\r\n\r\nCurrent share price (Friday's close): **$3,242.76** → Amazon is **undervalued by 2.1%**.\r\n\r\n**Optimistic scenario** — use FinViz's 36% growth, all else unchanged:\r\n\r\n> **Optimistic intrinsic value ≈ $4,071**\r\n\r\n| Scenario | 1st-5-yr growth | Intrinsic value |\r\n|---|---|---|\r\n| **Base / conservative** | 30% (3-source average) | **$3,312** |\r\n| **Optimistic** | 36% (FinViz) | **$4,071** |\r\n\r\n**Valuation range: ~$3,312 – $4,071**, against a price of **$3,242.76** — below even the low end of the range.\r\n\r\n> \"Notice that intrinsic value is never one number. It's always kind of like a range. Why? Because we can't be absolutely sure about what the growth of the company is going to be. We can only do projections.\"\r\n\r\n**Third-party cross-check.** Morningstar Premium (paid) publishes its own **fair value ≈ $4,001**. Adam's comparison logic: \"For Morningstar, their valuation most of the time tends to be higher than my valuation, because they tend to be more optimistic — or rather, **I tend to be more pessimistic**. But I like to look at their valuation as well to kind of get a sense of where my valuation is relative to theirs.\" He concludes he is \"really, really comfortable\" adding shares at the current price given the independent confirmation.\r\n\r\n*(Transcript note: the spoken sentence \"way above even my optimistic valuation of 4,070\" is internally inconsistent with a $4,001 Morningstar figure — the ASR is unreliable on these two numbers; the intent is clearly that Morningstar's fair value sits at or above Adam's optimistic case and far above the market price.)*\r\n\r\n### 3.8 Step 7 — Technical analysis and entry plan\r\n\r\nEntry doctrine restated: \"Prices move in wave patterns. Wave up, wave down… we always want to wait for a wave down to a support level. We buy either at **the dip of an uptrend**, at **the support level of a consolidation**, or when **price reverses into a new uptrend**.\" Timeframes: daily, weekly and monthly, adding **in tranches**.\r\n\r\n**(a) 10-year monthly.** Clear long-term uptrend ✔. Historical wave-downs repeatedly find support at the **20 EMA (red dotted line)**.\r\n→ Support drawn at **$3,116**. Adam notes this level also lines up with the **100 MA on weekly** — \"that's a pretty significant level.\"\r\n\r\n**(b) 5-year weekly.** Strong support at the **50 MA (blue line)**.\r\n→ Support drawn at **$3,351**.\r\nAlso: **100 MA (orange line)** has acted as strong support, coinciding with the $3,116 level.\r\nAn additional previously-tested level from repeated swing lows → support at **$2,881** (\"swing low, swing low, swing low… this is a pretty strong support\").\r\n\r\n**(c) 1-year daily.** Price is in a **sideways consolidation**, not a trend. Rule for consolidations: \"When it's moving sideways, you want to buy **near the support of the consolidation**.\" The consolidation support is visible with three touches (\"support, support, support\"), and price \"just waved down to this support level here at **$3,198**.\"\r\n\r\n#### AMZN support ladder\r\n\r\n| Support level | Basis |\r\n|---|---|\r\n| **$3,351** | Weekly 50 MA |\r\n| **$3,198** | Daily consolidation support (current touch) |\r\n| **$3,116** | Monthly 20 EMA + weekly 100 MA (double confirmation) |\r\n| **$2,881** | Repeated weekly swing lows |\r\n\r\n#### AMZN verdict\r\n\r\n> \"So right now it just waved down to this support level here at 3,198. So yeah, **I think this is a reasonable point to add shares of Amazon**.\"\r\n\r\nGreat business ✔ · below the pessimistic end of the valuation range ✔ · sitting on consolidation support ✔ → **BUY, in tranches.**\r\n\r\n**Position-sizing note unique to AMZN (a ~$3,242 share price):**\r\n- Four support levels → buy the planned allocation in **four tranches**.\r\n- For small accounts, one share costs $3,242. **Fractional shares** solve this — \"with certain brokers, like Interactive Brokers, you can buy fractional shares… you could actually buy **0.25 shares at a time**,\" i.e. roughly **$800 per tranche**, accumulating to one full share across the four levels.\r\n- Larger accounts simply scale the same ladder — \"one share here, one share here… or three shares, three shares. It's up to you how you want to divide it.\"\r\n- Since price is already below the first identified support, an investor with **no existing position** could enter in **thirds** across the three remaining levels.\r\n\r\n---\r\n\r\n## Cross-Case Lessons\r\n\r\n### A. The formula is invariant; the *inputs and adjustments* are judgement calls\r\n\r\nAll three names run the identical seven steps in the identical order, and in all three, steps 1–5 only earn a place on the **watch list**. What differs is never the framework — it's how Adam handles anomalies inside it. The skill being taught is not the checklist; it's knowing when a reported number is lying to you.\r\n\r\n### B. Three ways the same distortion was handled\r\n\r\nThe hyperscaler AI-capex problem hit both GOOGL and AMZN, and Adam used **two different fixes**, which tells you the principle matters more than the recipe:\r\n\r\n| Company | Distortion | Fix |\r\n|---|---|---|\r\n| **GOOGL** | Latest capex spiked to $91.4bn (vs $24.6bn five years earlier), crushing FCF to $73.3bn | **Average the last 5 years of capex** ($46,471.6M) and subtract from the latest operating cash flow → normalised FCF $118,241.4M. Raw calculator value $190.89 → adjusted **$304.13** (a **59% understatement** if left unadjusted) |\r\n| **AMZN** | $45bn capex year drove FCF **negative** | **Skip the distorted year entirely**; use the prior year's clean FCF of $25,924M |\r\n| **MSFT** | None — \"growing very, very consistently\" | Use the latest figure as reported |\r\n\r\nGeneralised rule stated in the MSFT lesson and applied in both others: **a sudden spike or a sudden plunge in the last 12 months is never the number you project from.** Use the prior year, or a multi-year average.\r\n\r\n### C. Valuation method is chosen by the *shape of the financials*, not by preference\r\n\r\n| Company | Method | Trigger |\r\n|---|---|---|\r\n| MSFT | Discounted cash flow **from operations** (the default) | Operating cash flow rising consistently; no CFO/NI distortion |\r\n| GOOGL | Discounted **free** cash flow (with normalised capex) | Operating cash flow rising consistently; capex temporarily inflated |\r\n| AMZN | Discounted **free** cash flow (prior-year figure) | **Cash from operations > 1.5× net income** → the D&A-driven gap means CFO flatters the business; FCF is the conservative choice |\r\n\r\nThe AMZN case is the explicit teaching moment: a huge CFO-to-net-income gap is a *signal about the business model* (capital-intensive, high depreciation), and the valuation method must respond to it.\r\n\r\n### D. Intrinsic value is always a range — and the range is built by flexing growth\r\n\r\nEvery case produces at least two numbers, produced by changing the growth assumption and nothing else:\r\n\r\n| Company | Low end | High end | Price at time | Position vs range |\r\n|---|---|---|---|---|\r\n| **GOOGL** | $292.41 (14.3% avg growth) | $304.13 (15.3% FactSet) | not stated; supports drawn at 270 / 237 / 207 / 163.94 | Trading **above** the range — wait |\r\n| **MSFT** | $325 (growth halves after yr 5) / $337 (10.8% growth) | $398 (13.12% growth) | **$310** | **Below** even the pessimistic value → 22% undervalued vs base case |\r\n| **AMZN** | $3,312 (30% growth) | $4,071 (36% growth) | **$3,242.76** | **Below** the low end → 2.1% undervalued |\r\n\r\n\"The main thing that can affect your valuation is your growth projections.\" Three ways to build the pessimistic case are demonstrated: (1) take the **lowest** of the three source projections; (2) **halve** the growth rate after year 5; (3) take the **average** of all sources rather than the highest.\r\n\r\n### E. Growth rates are triangulated from independent sources, never taken from one\r\n\r\nEvery case pulls 2–3 forward growth projections and reconciles them:\r\n\r\n| Company | Sources | Spread | Average used |\r\n|---|---|---|---|\r\n| GOOGL | FactSet 15.3 / FinViz 12.88 / Zacks 14.72 | 2.4 pts | 14.3% |\r\n| MSFT | FinViz 16.53 / Zacks 12.04 / Simply Wall St 10.8 | 5.7 pts | 13.12% |\r\n| AMZN | FinViz 36 / Zacks 24.68 / Simply Wall St 29.8 | 11.3 pts | ~30% |\r\n\r\n**Outlier discipline:** discard any source that is \"way out there\" (Adam's example: 16%, 14%, 3% → drop the 3%). Optimist → highest; pessimist → lowest; unsure → average.\r\n\r\n**Standing DCF conventions across all three:**\r\n- Next-5-year growth = first-5-year growth, **capped at 15%** (binding for AMZN at 30% → 15%; non-binding for MSFT at 13.12% and GOOGL at 15.3%).\r\n- Terminal 10-year growth = **US GDP growth + 1% ≈ 4%**.\r\n- Discount rate = risk-free rate + (beta × market risk premium), read off a beta table that is periodically updated; precision is unnecessary — \"doesn't have to be exact.\"\r\n- Balance sheet items (total debt, cash & short-term investments) always from the **latest quarter**; total debt = short-term + long-term debt, **not** total liabilities.\r\n- Always verify **statement currency vs listing currency** and the exchange rate.\r\n\r\n### F. Step 3 (moat) is the one step with no number — and the verdicts genuinely differ\r\n\r\n| Company | Moat verdict | Weak spots Adam concedes |\r\n|---|---|---|\r\n| GOOGL | **9/10** — near-perfect across all five sources (network effect and barriers to entry both 10/10) | Google Cloud is a \"distant third\" behind AWS and Azure |\r\n| MSFT | Clean pass — **three** of the five sources demonstrated (brand monopoly, switching costs, network effect) | Barriers to entry and economies of scale not separately argued; Apple neck-and-neck on total return |\r\n| AMZN | Weakest of the three — \"at least **two or three**\" sources | **Network effect: \"maybe not.\"** **Switching costs: none for individual e-commerce shoppers** (you can switch to Alibaba or eBay tomorrow); only present in the cloud/enterprise segment |\r\n\r\nTwo proxies for moat are taught: (i) **a 10-year uptrend on monthly candles is a clue to a wide moat**, \"because only companies that have got no close competition are able to perform so well\"; (ii) **relative-strength comparison against named competitors on TradingView** — \"obviously you want to invest in the strongest performer.\"\r\n\r\nThe prerequisite for judging a moat at all is being a customer: the case studies all open with Adam listing the products he personally uses. \"When you invest in a stock where you don't use the product or the service, it's really hard to understand the company's competitive advantage.\"\r\n\r\n### G. Metrics get waived when the business model doesn't support them\r\n\r\n- **Cash conversion cycle** is checked for all three but is only *meaningful* for Amazon. For GOOGL (\"doesn't sell a physical product\") and MSFT (\"sells software and services\") Adam runs it \"for practice purposes\" and gives it no weight.\r\n- **ROE/ROIC dips are tolerated** if the latest reading and trend are strong — Amazon's ROIC fell below 12% in 2017 and 2019, \"but last 12 months it's way above 12% and above the five-year average, so that's fine for me.\"\r\n- **A down year in net income is not disqualifying.** GOOGL: net income fell from 76 to 59 mid-window — \"doesn't have to go up every single year.\" MSFT: a net income dip ~7 years back was traced to **taxation changes**, \"not a core business expense… the actual business itself was still growing.\" The lesson is to **go read the annual report and find the cause** rather than react to the shape of the chart.\r\n\r\n### H. Step 7 is identical in structure every time\r\n\r\nThe chart routine never varies: **10-year monthly → 5-year weekly → 1-year daily**, log scale on, dividend adjustment off (that's only for comparing multiple stocks).\r\n\r\n1. Draw the **intrinsic value as a green horizontal line** — usually the *conservative* end of the range (GOOGL at 292, MSFT at 325).\r\n2. Identify supports where price has **historically** bounced: moving averages (monthly 20 EMA / 50 MA; weekly 20 / 50 / 100 MA; daily 150 MA), previous swing lows, and previous resistance turned support. Confluence of two signals = a stronger level.\r\n3. Keep only supports that sit **below the green line**. This is the hard rule and it is what makes GOOGL a *wait* rather than a *buy*: there was a perfectly valid daily support level, but it was above intrinsic value, so Adam refused it — \"I'm not buying when it's undervalued with a margin of safety, I'm paying the fair price… I like to buy at least below the intrinsic value.\"\r\n4. Target **4–5 support levels** per name and **add in tranches** (quarters for MSFT, quarters or thirds for AMZN) until a **full position** is reached, then stop adding and \"let the position grow organically.\"\r\n\r\nSupports found across the three:\r\n\r\n| Company | Support ladder |\r\n|---|---|\r\n| GOOGL | 270 (swing low) · 237 · 207 (weekly 100 MA + swing high) · 163.94 (monthly 50 MA) |\r\n| MSFT | 316 (daily 150 MA + old resistance) · 305 (weekly 20 MA) · 283 (weekly 50 MA + swing low) · 262 (monthly 20 MA) |\r\n| AMZN | 3,351 (weekly 50 MA) · 3,198 (consolidation support) · 3,116 (monthly 20 EMA + weekly 100 MA) · 2,881 (swing lows) |\r\n\r\n### I. Supports are probabilities, not predictions — and are subjective\r\n\r\nStated twice, in near-identical language:\r\n- On GOOGL's $163.94 monthly-50MA level: \"Am I predicting that the price is gonna drop to 163.94? Of course not. I can't predict where the price will go in the short term. In fact, the price may never drop to that level.\" The reason to draw it is that \"there's a **high probability** that it would tend to bounce off,\" because that has been the stock's technical pattern.\r\n- On MSFT's $262 level: waiting *only* for the deepest support \"may [mean you] buy maybe once every few years.\" Since the stock was already undervalued at $310, \"we can start buying now.\"\r\n- And explicitly: \"**Support levels can be subjective.** You can have two different investors looking at the charts and they identify different support levels.\"\r\n\r\n### J. A short-term downtrend in a great company is not a sell signal\r\n\r\nThe GOOGL case ends with the stock entering \"the early stages of a short-term downtrend\" while Adam holds a multi-year position. \"Is this a reason for me to sell Alphabet? No, of course not. Why? It's a great company. In the long run, it will always go higher, because it doesn't go up in a straight line.\" The response to weakness in a business that still passes steps 1–5 is to **add at the next support below intrinsic value**, not to exit.\r\n\r\n### K. Effort calibration\r\n\r\n- The 5-step business analysis is a **once-a-year** job at most — quality does not decay quickly.\r\n- Tooling can substitute for effort at a cost in precision: StockOracle's **Oracle Value ($294 for GOOGL)** lands close to the midpoint of the manually-derived $292–$304 range. \"If you're very lazy, then just look at the Oracle Value.\"\r\n- Third-party valuations (Morningstar's fair value) are worth consulting as a **sanity check on your own conservatism**, not as a substitute — Adam's read is that Morningstar runs optimistic relative to him, so agreement from them on a cheap price increases his comfort.\r\n- The justification for the whole exercise: \"You are buying a piece of the business… Because once you buy a great business, you have no more worries. In the short term, the price may go up, it may go down. You don't care, because over time the business will keep growing in value, and the share price will be a lot higher over time.\"\r\n\r\n---\r\n\r\n# Part VIII — Portfolio Construction\r\n\r\n## Lesson 8 — Portfolio Construction (Building a Winning Portfolio)\r\n\r\n**Source videos:** 60 (How to Diversify), 61 (Favourite Sectors), 62 (Dividend & Predictable Stocks), 63 (Growth Stocks & More), 64 (Maximizing Portfolio Returns)\r\n\r\n---\r\n\r\n### 1. Where This Lesson Sits in the VMI Process\r\n\r\nThe three decisions of investing, in order:\r\n\r\n1. **What to buy** — only stocks of great companies (5 steps of a great business).\r\n2. **When to buy** — buy when price is below intrinsic value AND price has retraced to a level of support.\r\n3. **How many shares to buy for each stock** — position sizing / portfolio construction. Described as \"even more important at times\" than the first two.\r\n\r\nThis lesson is entirely about #3.\r\n\r\n---\r\n\r\n### 2. Why Diversify — The Core Argument\r\n\r\n#### 2.1 The \"shit can happen\" principle\r\n- No matter how great the business or how confident you are, **never put all your eggs in one basket**. Events occur that cannot be anticipated or predicted.\r\n- **Never go 100% into one stock**, no matter how good the analysis.\r\n\r\n#### 2.2 Case study — Boeing\r\n- Boeing was a high-quality company passing all criteria of a great business.\r\n- For years: revenue up, profits up, free cash flow up; effectively a **duopoly with Airbus**.\r\n- 2020 broke it:\r\n  - Two air crashes → the 787 fleet grounded.\r\n  - Global pandemic → borders closed, airlines couldn't fly, orders postponed/cancelled.\r\n- Result: Boeing's profits went **negative for the first time in its history**; share price dropped **80%**.\r\n- Adam owned Boeing before the pandemic and could not predict it. His Boeing position fell 80%.\r\n\r\n#### 2.3 The payoff of diversification — actual portfolio results\r\n| Year | Damaged holdings owned | Portfolio 1 return | Portfolio 2 return |\r\n|---|---|---|---|\r\n| 2020 | Boeing (−80%) | **+44%** | **+41%** |\r\n| 2023 | Estee Lauder, Boston Beer, Disney, Alibaba (all \"whacked\") | **+48%** | **+43%** |\r\n\r\n- 2023 total gain across the two portfolios: **US$2 million in profit**, despite owning Estee Lauder, Disney, Boston Beer and Alibaba, all of which dropped hard.\r\n- Contrast: people who bought Alibaba, Disney or PayPal **all-in** lost heavily on the exact same stocks. The difference was diversification, not stock selection.\r\n- 2023 also cited in Lesson 61 as **+45% portfolio vs. ~+24% S&P 500**; last 5 years **+145% portfolio vs. +83% S&P 500**.\r\n\r\n#### 2.4 The eight-engine aircraft analogy\r\n- Would you fly on a plane with **one** engine? No — even the highest quality Rolls-Royce engine can be knocked out by an unpredictable event (bird strike).\r\n- A plane with **eight Rolls-Royce engines**: the probability of all eight failing simultaneously is \"almost zero.\" Lose one or two, six remain to keep the plane flying.\r\n- Portfolio equivalent: hold several great companies so one or two malfunctioning temporarily doesn't ground the portfolio.\r\n\r\n#### 2.5 The objective is capital preservation, not maximum gain\r\n- The most important thing is **not** making the greatest gains — it is **never losing money** in the portfolio.\r\n- Short term the portfolio will go up and down; over 2, 3, 4 years you never want to be down.\r\n- Buffett-sourced principle stated in the lesson: if you buy a **group of great companies** and buy them **for less than what they are worth**, it is **impossible to lose money** over a period of time.\r\n- Goal restated: double-digit returns achieved in a **very low risk** way — described as effectively \"zero risk\" when done collectively over time.\r\n- Formal aim of diversification: **low volatility AND high returns**.\r\n\r\n#### 2.6 There is no sure-win stock\r\n- Even Warren Buffett, running Berkshire Hathaway for 58 years, made bad investments:\r\n  - **Airline stocks** — lost money.\r\n  - **Occidental Petroleum** — still losing money.\r\n  - **IBM** — lost money.\r\n- But he also owned **Apple, MasterCard, McDonald's, Coca-Cola**, which more than made up for the mistakes.\r\n- **The key to a winning portfolio is not being right all the time** — it is to **win 80–90% of the time** and minimise the losses from the **10–20%** of investments that turn bad.\r\n\r\n---\r\n\r\n### 3. Diversification Rules (Hard Numbers)\r\n\r\n#### 3.1 Number of stocks\r\n| Rule | Number |\r\n|---|---|\r\n| Absolute minimum stocks in portfolio | **8** |\r\n| Comfortable working range (\"concentrated diversification\") | **8 to 30** |\r\n| Recommended cap for non-full-time investors | **30** |\r\n| Adam's own portfolio (full-time investor) | **~40 stocks** |\r\n| Absolute rule-of-thumb ceiling | **60** |\r\n\r\n- The 8-stock minimum applies **regardless of capital size**: $1,000, $10,000, $100,000 or $10 million — all get split across at least 8 stocks.\r\n- **Why not more than 60?** There are roughly **6,000 stocks in the US market**. VMI only invests in the **top 1%** of highest-quality companies. 1% × 6,000 = **60**. Going beyond 60 means you have left the top 1% quality band.\r\n- **Broad diversification** (100 or 1,000 stocks) is not \"wrong\", but has two problems:\r\n  1. You cannot monitor or keep track of them → you won't do as well.\r\n  2. Too many stocks inevitably forces **lower-quality stocks** into the portfolio.\r\n- Adam can hold 40 only because he is a full-time investor whose only daily job is watching his stocks.\r\n\r\n#### 3.2 Diversify across sectors, industries and markets\r\n- The 8–30 stocks **must not all be from the same industry or sector**.\r\n- Also diversify across **different markets** where appropriate.\r\n\r\n**Adam's actual sector allocation (capital-gain portfolio):**\r\n| Sector | Allocation |\r\n|---|---|\r\n| Technology | **27%** |\r\n| Consumer Discretionary | **22%** |\r\n| Healthcare | **15%** |\r\n| Financials | **13%** |\r\n| Communication Services | **12%** |\r\n| Consumer Staples | **7%** |\r\n| Industrials | **2%** |\r\n| (China ETFs, stated separately in Lesson 61) | **3%** |\r\n\r\n**Geographic allocation (capital-gain portfolio):**\r\n| Market | Allocation |\r\n|---|---|\r\n| US-listed | **~90%** |\r\n| China / Hong Kong | **3%** |\r\n| Europe | balance (remainder) |\r\n\r\n- **Separate dividend portfolio**: 100% **Singapore-listed** — only the banks and core REITs — for the sole purpose of collecting dividends.\r\n\r\n#### 3.3 Correlation / clustering considerations (as taught)\r\n- Own stocks from **different sectors and industries** so a sector-specific shock (e.g. China regulation on Alibaba and other China stocks) can't take out the portfolio.\r\n- **Defensive stocks** are deliberately held as ballast: they hold up or rise during recessions/bear markets when growth and cyclical stocks fall — i.e. deliberately holding negatively/less-correlated buckets.\r\n- **Cyclical stocks** rise first in a boom and \"drop the most like flies\" when a recession is expected.\r\n- Owning both defensive and growth exposure is the mechanism for \"low volatility with high returns.\"\r\n\r\n---\r\n\r\n### 4. Position Sizing — The Equal-Weight Framework\r\n\r\n#### 4.1 Core rule\r\n> Divide capital **as equally as possible** among core long-term investments.\r\n\r\n**Full allocation per stock = 100% ÷ (number of stocks you plan to own)**\r\n\r\n| Planned portfolio size | Full allocation per stock |\r\n|---|---|\r\n| 10 stocks | **10%** |\r\n| 20 stocks | **5%** |\r\n| 30 stocks | **3.33%** |\r\n| 40 stocks (Adam's) | **2.5%** |\r\n\r\n- This per-stock % is called a **\"full allocation\"** or **\"full position.\"**\r\n- Worked example: $10,000 capital ÷ 10 stocks = **$1,000 per stock = 10% each**.\r\n- Each year new capital added (e.g. another $10,000) is divided again across the same target number of stocks and topped up accordingly.\r\n\r\n#### 4.2 Reduced size for higher-risk categories\r\n- For **speculative growth companies** and **turnaround companies**: invest only **half or one-third of the normal position**.\r\n  - If normal allocation is 10% → buy **5%**.\r\n  - If normal allocation is 5% → buy **2.5%**.\r\n  - If normal allocation is 2% → buy **1%**.\r\n- Rationale (worked through in Lesson 63): if a 1% speculative position goes to zero you lose 1% of the portfolio. In practice failures usually lose about half, so realistic damage is **~0.5%**. Winners in this category can go up **5–10×**.\r\n\r\n#### 4.3 Fractional share math example ($10,000 / 10 stocks / $1,000 per stock)\r\n| Stock | Share price | Shares bought | Approx. value |\r\n|---|---|---|---|\r\n| Amazon | $150 | **6** | ~$900 (7 shares would be ~$1,050) |\r\n| Alphabet | — | **7** | ~$1,000 |\r\n| Meta | — | **3** | ~$1,000 |\r\n| NVIDIA | $350 | **3** | ~$1,050 |\r\n\r\n- You can't hit exactly $1,000 — slightly under or slightly over is fine; it is \"roughly a 10% allocation.\"\r\n\r\n#### 4.4 The three conditions for ADDING shares\r\nAdd shares only if **all three** are true:\r\n1. The stock is **undervalued** — share price below calculated intrinsic value.\r\n2. The share price has **waved down / retraced to a level of support**.\r\n3. You **do not yet have a full position** in that stock.\r\n\r\n> \"Once a particular stock has a full allocation, I will not add more shares... Never go more than your full allocation.\" — the discipline rule.\r\n\r\n#### 4.5 Buying in tranches\r\n- Never buy a full position in one go. Buy in **3 to 4 tranches** (typically **quarter positions**).\r\n- Mechanic: price becomes undervalued and hits **support level 1** → buy ¼. Drops to **support level 2** → buy another ¼. Continue until the full allocation is reached.\r\n- Applied to the 6-share Amazon example: buy 1–2 shares at the first support level, another 2 at the second, etc., until 6 shares are held.\r\n- **Apple worked example (real buy levels from his chart):**\r\n  - Intrinsic value line ≈ **$170**\r\n  - Buy levels: **$165, $157, $150, $141**\r\n  - Apple only reached the **first** buy level → only **one quarter** bought → it then flew up, so the position stayed under-filled.\r\n\r\n#### 4.6 The portfolio is NEVER perfectly balanced — and that's correct\r\n- At any point in time you will **not** have exactly the target weight in every stock, because not all stocks are at a buy point simultaneously.\r\n- Illustration: NVIDIA overvalued → **0% allocation** held; Amazon dropped all the way → **full allocation**; Apple dropped to only the 1st/2nd buy level → **half allocation (5% instead of 10%)**, the rest bought only if it falls further.\r\n- Real snapshot from Adam's ~40-stock portfolio (full allocation = 2.5%):\r\n  | Holding | Actual weight | Reason |\r\n  |---|---|---|\r\n  | Apple | **1.7%** (also stated as 1.77%) | Only hit the 1st buy level; bought ¼ then it rallied away |\r\n  | ServiceNow | **~2.5%** | Full allocation achieved |\r\n  | Meta | **6.9%** | Grew **organically** from 2.5% as the share price rose |\r\n  | (new position, recently bought) | **0.96%** | Bought a quarter position; slightly above ¼ because it rose after purchase |\r\n\r\n---\r\n\r\n### 5. Rebalancing Rules (Both Directions = NO)\r\n\r\n| Situation | Action | Reasoning |\r\n|---|---|---|\r\n| Position **grows** above full allocation (e.g. Meta 2.5% → 6.9%; NVIDIA 5% → 10%) | **Do NOT sell to rebalance down** | As long as the company is still great, still growing, and **not crazily overvalued**, let it run. \"Let it grow to its fullest potential. **Do not cut your flowers.**\" This is what Buffett and Peter Lynch do. |\r\n| Position **falls** below full allocation (e.g. 2.5% → 1.25%, or 5% → 2.5%) purely from price decline | **Do NOT top up to restore the weight** | Once the full allocation has been bought, that's it — the position \"either grows organically or drops organically.\" |\r\n| Buying more before full allocation is reached | **Allowed**, but only if undervalued + at support + not yet full | The tranche-building rule (§4.4) |\r\n| Adding new annual capital | Divide the new money across the target stock count again and top up per the buy rules | |\r\n\r\n- The classic mistake called out explicitly: selling the stocks that went up a lot and using the money to buy the ones that went down — **\"cutting your flowers and watering the weeds in your garden.\"**\r\n- Fund managers do this. VMI investors do not.\r\n\r\n---\r\n\r\n### 6. The Three Broad Stock TYPES (by economic behaviour)\r\n\r\n| Type | Product/service | Growth profile | Volatility | Outperforms when | Underperforms when |\r\n|---|---|---|---|---|---|\r\n| **Defensive** | Low-priced necessities (detergent, toothpaste, sanitary pads, batteries, shaving cream/razors, potato chips) | Low to moderate, **single digits 5–10%**, very consistent | Low, even in recessions | Recessions, recession fears, bear markets | Booming economy (money rotates out into cyclicals/growth) |\r\n| **Cyclical** (\"moody\" stocks) | Higher-priced / luxury / economy-dependent (cars, houses, construction & renovation, industrial equipment, bank borrowing) | High profits in expansions, lower profits or **losses** in recessions | High | Economic boom — first to fly up | Expected recession / bear market — \"drop the most like flies\" |\r\n| **Growth (moderately cyclical)** | Tech, digital, secular growth industries | **High growth**, revenues/profits more consistent through cycles | Moderate–high | Most of the time; core engine of the portfolio | Sharp risk-off periods |\r\n\r\n- Defensive stocks are also called **\"boring businesses.\"** Boring ≠ bad: **Warren Buffett loves boring companies** because boring = **predictable**, consistent sales and profits, and few new competitors want to enter a boring industry.\r\n- Tactic: **buy defensive stocks when they are down, cheap and unwanted** — then they protect the portfolio in the next recession/bear market.\r\n\r\n---\r\n\r\n### 7. The 11 Sectors — Full Sector-by-Sector Breakdown\r\n\r\n**Classification:** 3 defensive + 5 cyclical + 3 growth/moderately-cyclical.\r\n\r\n#### 7.1 DEFENSIVE SECTORS (3)\r\n\r\n##### Healthcare — ETF **XLV** — *one of his favourite sectors*\r\n- **Why:** it is **both defensive AND has good growth potential**; sits in a long-term **mega-trend: the global aging population**.\r\n- Performance: **on par with the S&P 500** over the long run.\r\n- Sub-industries:\r\n  | Sub-industry | Verdict | Names given |\r\n  |---|---|---|\r\n  | **Biotechnology** | **Avoid for long-term investing.** Most don't make money or lack consistent profits; one or two make a lot. Super high risk / super high return — \"great for speculation\" only | — |\r\n  | **Pharmaceuticals** | **Normally avoid.** Most lack consistent profits. Patents last only ~**20 years**; once expired they need new drugs in the pipeline → **limited economic moat** | Only two with consistent profits: **Eli Lilly** and **Novo Nordisk**. He admits breaking his own rule buying Novo Nordisk cheap last year — still below his average cost, \"punished by the market gods\" |\r\n  | **Hospitals** | **Loves them** — very, very predictable | **HCA Healthcare** — \"has done very well for me\" |\r\n  | **Medical equipment / supplies** | **Likes** — more predictable, no 20-year patent cliff | **IDEXX Laboratories**, **Thermo Fisher** |\r\n  | **Health insurance / managed care** | Positive long term; recent regulatory hits judged short-term | Market leader **UnitedHealth Group** |\r\n  | (Other healthcare names in his portfolio) | | **Abbott Laboratories** |\r\n- Industry ETF he owns: **IHI** (healthcare medical devices).\r\n\r\n##### Consumer Staples — ETF **XLP**\r\n- **Definition:** manufacturing of food, beverages, household and personal products; also includes education and training services companies.\r\n- Essentials bought regularly at the grocery store / supermarket; **low-priced items** — toiletries, soft drinks, energy drinks, snack foods.\r\n- **Growth: very, very slow.** **Underperforms the S&P 500** over the long run.\r\n- **How he trades them (different from growth stocks):** buy when **very, very undervalued**; **sell when overvalued**; buy back when undervalued again. He does **not** hold consumer staples long term. (Growth stocks, by contrast, he holds through ups and downs and does not trade in/out.)\r\n- **Why hold them at all:** in a recession staples **hold their price** and protect
