first.)\r\n5. At that point there is a **very high probability** price reverses back up and starts an uptrend.\r\n6. **CONSERVATIVE CONFIRMATION (optional but recommended):** after the big red candles, **wait for a big GREEN bullish candle OR a BULLISH PIN BAR** to appear before entering.\r\n7. **Position sizing:** this is a **potential** bottom, not the bottom — it may still go a bit lower. **Buy in tranches. Never all in at one go.**\r\n8. **What it is worth:** getting in here is \"a lot better than buying when the price has already moved up 50%.\"\r\n\r\n#### 10.4 SIGN #2 — THE DOUBLE BOTTOM PATTERN\r\n*(Adam notes: Alson Chu, who teaches the Price Action Manipulation course, calls this a **BEAR TRAP** pattern. \"It's a very, very powerful pattern.\")*\r\n\r\n**RULES (exact sequence):**\r\n1. Stock is in a **downtrend**, falling at ~45 degrees.\r\n2. Price makes a drop to a low → this is the **FIRST SWING LOW**. Mark it with a dotted line. *(Teaching example: $50.)*\r\n3. Price **rallies up** off that first swing low.\r\n4. Price makes a **SECOND sharp drop**. **This second drop must be a 90-DEGREE (parabolic) drop.**\r\n   - Both drops can be 90 degrees, but **at minimum the SECOND one must be 90 degrees.**\r\n5. **The second low MUST go BELOW the first swing low.** (If first low was $50, the second must break under it — $49.90, $49.50, $49, whatever.)\r\n6. **WITHIN ABOUT THREE CANDLES of breaking below, price must CLOSE BACK ABOVE the first swing low** (back above $50) **with a BULLISH candle.**\r\n7. That completes the double bottom. **That bullish close back above the first swing low is the BUY trigger** — \"that is exactly when I'll get in. I'll buy it right there, and I'll get in right near the bottom before the uptrend.\"\r\n8. **Caveats:** the pattern does **not always occur** (\"sometimes a double bottom doesn't happen\"). No guarantee — it could still go lower. **Always buy in tranches.**\r\n\r\n#### 10.5 Choosing Between the Two Signs\r\n- If you don't want to buy at the **first** parabolic drop, **wait for the double bottom** — but be aware it **may or may not form**.\r\n- The two signs can also **appear together** on the same chart (see MELI below).\r\n\r\n#### 10.6 Worked \"Catching Bottoms\" Examples\r\n\r\n**Mercado Libre (MELI), 2022 bear market — BOTH signs present**\r\n- Context: nothing wrong with the company — the **whole market was bearish** in the 2022 bear market. Downtrend confirmed: 50 below 150, 150 below 200, all sloping down.\r\n- **Sign #1 (parabolic drop to support):** price falling at 45 degrees → then a **90-degree drop with big red candles** → **hit a strong support level previously identified on the charts.** Conservative entry: wait for the first green candle → buy.\r\n- **Sign #2 (double bottom):** first swing low at **~$640** (estimated) → rally → second drop **below $640** → then back **above $640** within about three candles with a **bullish candle** → **buy right there, near the bottom, before the uptrend.**\r\n- **Cost of the alternative:** waiting for uptrend confirmation would have meant entering at **~$920** when the bottom was **$600** — i.e. **~50% off the low**.\r\n- **Uptrend-confirmation invalidation note on this same chart:** blue 50 crossing above green 150 was **NOT valid** while the green 150 was still sloping down — both lines must flatten and slope up.\r\n\r\n**Apple (AAPL)**\r\n- Uptrend → a **short-lived downtrend** → back into uptrend.\r\n- **Waiting for the uptrend:** you'd buy at **$209** when the bottom was **$164** → **27% late** (\"209 minus 164… you would have gotten in only after the price had reversed 27% up\").\r\n- **The better path — Apple made a DOUBLE BOTTOM:**\r\n  1. First bottom = the **first swing low**\r\n  2. Price rallied\r\n  3. **Parabolic 90-degree drop with big red candles** that went **below the first swing low**\r\n  4. **Within 1–2–3 candles it formed the first bullish candle**\r\n  5. **Wait for that first bullish candle, then buy** — catching the stock near the bottom.\r\n\r\n**Monster Beverage (MNST)**\r\n- Downtrend → uptrend.\r\n- **Waiting for uptrend confirmation** (50 crossing above 150) meant buying **only after price had already moved 37% up from the bottom.**\r\n- **The chart printed a textbook double bottom:** 90-degree drop, a **double dip**, entry right at the second-bottom reversal → \"you caught it very early.\"\r\n\r\n**Google (GOOGL), 2022 bear market — PURE PARABOLIC DROP TO SUPPORT**\r\n- Daily chart: downtrend → **90-degree parabolic drop with long red candles**.\r\n- The drop terminated exactly at a support level of **$83**.\r\n- **The low: $83.34, hit on 3 NOVEMBER.**\r\n- **Where the $83 support came from:** it was **identified on a HIGHER timeframe — the MONTHLY chart**, where it sat on **the 50 SMA (blue line) of the monthly candles**. Historically Google hit that blue line and bounced.\r\n- Adam: \"I bought in there and caught near the bottom.\"\r\n- **Lesson stated explicitly:** \"That's why it's important on the monthly and weekly to draw your support levels that you've identified.\" Start with the **monthly** timeframe, draw all support levels; go down to the **weekly**, draw the support levels; then finally go to the **daily**.\r\n\r\n**Mercado Libre (MELI) — second example, pure parabolic drop to support**\r\n- Daily: downtrend, moving averages all sloping down → **parabolic 90-degree drop with big red candles**.\r\n- Drop terminated at a strong support at **$666 on 12 MAY**.\r\n- **Where the $666 support came from:** identified on the **MONTHLY** chart, where **$666 had been a swing-high RESISTANCE**. Per the polarity rule — **resistance once broken becomes support**. The line was drawn **in advance**.\r\n- \"When it hit my 666 with a 90-degree [drop], I thought: okay, that's the bottom, baby. Got it. And it was beautiful.\"\r\n- Caveat repeated: \"It doesn't always turn out 100%, but **the probabilities are pretty high**.\"\r\n\r\n---\r\n\r\n### 11. BUYING IN A CONSOLIDATION / CHANNEL\r\n\r\n#### 11.1 Rules\r\n1. Identify the consolidation: **same highs, same lows** (sideways).\r\n2. **Three same highs → confirms the RESISTANCE.** Draw the line.\r\n3. **Three same lows → confirms the SUPPORT.** Draw the line.\r\n4. Price is now **sandwiched between resistance and support = a CHANNEL / range.**\r\n5. **IGNORE the moving averages entirely** — in a consolidation they go sideways, crisscross each other, and **do not act as support.**\r\n6. Look **only** at your drawn support and resistance lines.\r\n7. **BUY WHEN PRICE DROPS NEAR THE SUPPORT LEVEL** — provided it's a good company and it's undervalued.\r\n8. **Keep adding at support** to **build the position until you have a full position.**\r\n9. **Then let it run** — eventually a good company **breaks out of the range and begins a new uptrend.**\r\n\r\n#### 11.2 Worked Consolidation Examples\r\n- **Generic channel example:** highs repeatedly at **292** (three same highs → resistance), lows repeatedly at **272** (three same lows → support). **Rule: when price waves down near 272, add.**\r\n- **Bank of America (BAC):** stuck between **resistance $30.84** and **support $26.61**, bouncing within the channel. Moving averages visibly sideways and crisscrossing → ignored.\r\n- **Microsoft daily (from §8.6):** short-term choppy sideways consolidation with support at **$407.80**.\r\n\r\n---\r\n\r\n### 12. Summary of Trend → Action Mapping\r\n\r\n| Trend state | Structure | Moving averages | ACTION |\r\n|---|---|---|---|\r\n| **Uptrend** | Higher highs + higher lows | All sloping **up**; **50 > 100 > 150 > 200** | **BUY THE DIP** — buy after a wave down, at drawn support or at the stock's preferred MA |\r\n| **Downtrend** | Lower highs + lower lows | All sloping **down**; **200 > 150 > 50** | **Either** wait for uptrend confirmation, **OR** buy at signs of a bottom (parabolic drop to support / double bottom). **NEVER buy after a wave up.** If already holding a great company — **do not sell.** |\r\n| **Consolidation** | Same highs + same lows | Sideways, crisscrossing → **useless, ignore** | **BUY NEAR THE SUPPORT** of the channel; build full position; let it break out |\r\n| **Parabolic (90°) move up** | Vertical, extended-range green candles, price stretched far from MAs | Price far above MAs — rubber band | **WORST time to buy.** Best time to sell **if** you have already decided to sell (overvalued / need cash / covered calls) |\r\n\r\n---\r\n\r\n### Key Takeaways\r\n\r\n1. **Short-term prices are driven by emotion, not logic.** Charts are the record of that emotion — Adam calls TA \"the study of emotional patterns captured on price charts.\"\r\n2. **TA gives probabilities, never certainties.** You look for **high-probability reversal points** and **potential bottoms**, never *the* bottom.\r\n3. **Because you can't pick the exact bottom, you ALWAYS buy in tranches — three to four — never all in at once.**\r\n4. **TA is layered on top of fundamentals and valuation, not instead of them.** The mandatory precondition for every buy: it is a **great company** AND the **price is below your calculated intrinsic value**.\r\n5. **The 10-year monthly chart is a hard screening filter.** If it isn't rising over 10 years, Adam won't even look at the business (RIG, SIA rejected on that basis alone).\r\n6. **Always work top-down: 10-year monthly → 5-year weekly → 1-year daily.** Draw support levels on the higher timeframes first — those are the levels that catch parabolic drops on the daily.\r\n7. **Never analyse an unclosed candle.**\r\n8. **Two swing lows at a similar level = potential support; a third touch confirms it.** Same logic with swing highs for resistance.\r\n9. **The polarity rule is central: broken resistance becomes support; broken support becomes resistance.** Previous swing highs are your future add-on levels.\r\n10. **Support/resistance is a ZONE, not a line** — allow a buffer above and below. Draw the line at the **point of best fit** (touching the most swing points).\r\n11. **Adam's six moving averages: SMA 50 (blue), 100 (orange), 150 (green), 200 (red) — all thick; EMA 20 (red) and 40 (blue) — both thin.**\r\n12. **Timeframe rule for MAs: on the DAILY use only 50/100/150/200 SMA and ignore the 20/40 EMA. The 20 and 40 EMA only work on the WEEKLY and MONTHLY.**\r\n13. **Moving averages are dynamic support.** Every stock has a \"personality\" — study which MA it historically bounced off, and buy there.\r\n14. **Uptrend = higher highs + higher lows, MAs sloping up, 50>100>150>200.** Downtrend is the exact mirror (200>150>50, all sloping down). Consolidation = same highs, same lows, MAs sideways and crisscrossing.\r\n15. **Trend change (daily) needs BOTH conditions: the 50 and 150 must both stop sloping the old way (flatten or reverse) AND the 50 must cross the 150.** One line still sloping the old way = signal invalid.\r\n16. **On an uptrend, buy the dip — never chase a wave up.** Pullback = \u003c10%, correction = >10%; expect at least 3 pullbacks and 1 correction per year.\r\n17. **A parabolic 90-degree move is the worst possible time to buy** — extended-range candles, price stretched far above the MAs, rubber-band snapback due. It is the *best* time to sell **only if** you had already decided to sell.\r\n18. **Do NOT sell a great company just because it entered a downtrend.** Adam abandoned that approach — whipsaw costs more than it saves (Amazon: sold $74/bought back $92; sold $15/bought back $19 = −27%). Bear markets, where the trade actually works, come only about once every six years.\r\n19. **Waiting for uptrend confirmation costs you 30–50% of the move** (MELI ~50%, AAPL 27%, MNST 37%). That's why bottom-catching exists.\r\n20. **There are exactly two bottom signals: (a) parabolic 90-degree drop with oversized red candles into a pre-drawn support, and (b) a double bottom / bear trap where the second low breaks the first and closes back above it within ~3 candles on a bullish candle.**\r\n21. **Conservative confirmation on any bottom entry: wait for the first big green candle or a bullish pin bar.**\r\n22. **Ignore news for entries and exits.** Retail investors buy on good news at parabolic tops and sell on bad news at bottoms — buy high, sell low, lose money in the right stock. Trade the price action, after the fundamentals are settled.\r\n23. **Draw about 4–5 support levels per stock** — they are your ladder of add-on prices.\r\n24. **Confluence matters.** Adam's strongest levels are where several things intersect at once — e.g. Microsoft $324 = previous swing-high resistance + monthly 50 SMA + weekly 200 SMA.\r\n25. **In a consolidation, the moving averages are useless — trade only the drawn channel support.**\r\n\r\n---\r\n\r\n### Entry & Exit Rules Cheat Sheet\r\n\r\n#### A. UNIVERSAL PRECONDITIONS (all setups)\r\n1. **10-year monthly chart is in a clear long-term uptrend.** If not → reject the stock outright.\r\n2. **It is a great company** (fundamentals verified in the fundamental-analysis lessons).\r\n3. **Current price is BELOW your calculated intrinsic value** (drawn on the chart as a **green dotted horizontal ray** labelled \"intrinsic value\").\r\n4. **Support levels are already drawn** on **monthly, then weekly, then daily** — about **4–5 levels per stock**, sourced from swing lows, broken resistances (polarity), and the stock's preferred moving averages.\r\n5. **Never go all in.** Plan for **3–4 tranches**. Tranche size scales with the depth of undervaluation (slightly undervalued → nibble; significantly undervalued → buy more).\r\n\r\n---\r\n\r\n#### B. SETUP 1 — BUY THE DIP ON AN UPTREND\r\n**Trigger conditions**\r\n1. Higher swing highs **and** higher swing lows.\r\n2. All MAs sloping **up**; **50 > 100 > 150 > 200**.\r\n3. Price has just made a **wave DOWN** (pullback \u003c10% or correction >10%).\r\n\r\n**Where to buy**\r\n4. At the **drawn horizontal support**, **or** at the **moving average this stock historically bounces off** (daily → 50/100/150/200 SMA; weekly/monthly → 20/40 EMA also valid).\r\n\r\n**Confirmation (optional, conservative)**\r\n5. Wait for price to touch the level **and print a GREEN bullish candle** (or a bullish pin bar at that support) before entering.\r\n\r\n**Scale-in ladder**\r\n6. First touch (e.g. 50 SMA) → **buy a small first tranche**.\r\n7. If that level **breaks** → **do not exit**; watch the **next MA / next drawn support below** (e.g. 100 SMA).\r\n8. Bounce at the next level → **add the next tranche**. Repeat down the ladder to about **four tranches**.\r\n\r\n**What invalidates / what does NOT invalidate**\r\n9. Breaking one support level does **not** invalidate the thesis — it simply moves you to the next rung of the ladder.\r\n10. The thesis is invalidated only by **the company ceasing to be a great company** (fundamentals) — **not** by a chart downtrend.\r\n\r\n**Do NOT buy**\r\n11. **Never buy after a wave up.**\r\n12. **Never buy into a parabolic 90-degree move.**\r\n13. Never buy mid-fall between support levels when a clear support sits below.\r\n\r\n---\r\n\r\n#### C. SETUP 2 — BUY IN A CONSOLIDATION / CHANNEL\r\n1. Confirm sideways structure: **same highs, same lows**.\r\n2. **Three same highs** → draw the **resistance**. **Three same lows** → draw the **support**.\r\n3. **Ignore all moving averages** (sideways + crisscrossing = no support value).\r\n4. **Buy when price waves down NEAR the support line.**\r\n5. Keep adding at support until you hold a **full position**.\r\n6. **Hold** and let it eventually break out into a new uptrend.\r\n\r\n*(Example: support 272 / resistance 292. Bank of America: support $26.61 / resistance $30.84.)*\r\n\r\n---\r\n\r\n#### D. SETUP 3 — DOWNTREND, OPTION A: WAIT FOR UPTREND CONFIRMATION\r\n**Trigger (daily timeframe, BOTH required)**\r\n1. The **50 SMA flattens and slopes UP** *and* the **150 SMA flattens and slopes UP**.\r\n   - **Invalid if either line is still sloping down**, even if the crossover has occurred.\r\n2. The **50 SMA crosses back ABOVE the 150 SMA**.\r\n\r\n**Where to buy**\r\n3. On confirmation of both conditions.\r\n\r\n**Known cost of this method**\r\n4. You will typically enter **30–50% above the actual low** (MELI ~50%, MNST 37%, AAPL 27%).\r\n\r\n---\r\n\r\n#### E. SETUP 4 — DOWNTREND, OPTION B1: PARABOLIC DROP TO SUPPORT (catching a bottom)\r\n1. Stock is in a confirmed **downtrend** (lower highs + lower lows; MAs sloping down; **200 > 150 > 50**).\r\n2. Price transitions from a ~45-degree decline to a **90-DEGREE PARABOLIC DROP**.\r\n3. **Red candles are visibly LONGER than usual** (capitulation / panic selling / everyone who wants to sell has sold).\r\n4. **The drop must land ON a support level you had ALREADY drawn** — sourced from the **monthly or weekly** chart (broken resistance, monthly 50 SMA, etc.).\r\n5. **Confirmation (conservative):** wait for the **first big GREEN candle** or a **bullish PIN BAR** at that support.\r\n6. **BUY** — a first tranche.\r\n7. **Accept:** it may still go lower. This is a *potential* bottom. **Keep tranches in reserve** for the next support level down.\r\n\r\n*(Worked: **GOOGL** — 90-degree drop into **$83** support taken from the **monthly 50 SMA**; low **$83.34 on 3 November**. **MELI** — 90-degree drop into **$666 on 12 May**, a level drawn earlier as a **monthly swing-high resistance that had been broken → became support**.)*\r\n\r\n---\r\n\r\n#### F. SETUP 5 — DOWNTREND, OPTION B2: DOUBLE BOTTOM / \"BEAR TRAP\" (catching a bottom)\r\n1. Stock is in a confirmed **downtrend** falling at ~45 degrees.\r\n2. Price makes a low = **FIRST SWING LOW**. **Mark it with a dotted line** (e.g. $50).\r\n3. Price **rallies** off that low.\r\n4. Price makes a **SECOND drop — this one MUST be a 90-degree parabolic drop** with oversized red candles. (Both drops may be 90°, but the second must be.)\r\n5. **The second low MUST break BELOW the first swing low** (e.g. below $50).\r\n6. **Within about THREE candles, price must CLOSE BACK ABOVE the first swing low on a BULLISH candle.**\r\n7. **That bullish close back above the first swing low = the BUY TRIGGER.** Enter there.\r\n8. **Invalidation:** if price breaks below the first swing low and **fails to reclaim it within ~3 candles**, the pattern has not formed — no entry.\r\n9. **Note:** the double bottom **may never form** on a given chart. It is optional confirmation for those unwilling to buy the first parabolic drop.\r\n\r\n*(Worked: **AAPL** — first swing low, rally, 90-degree drop below it with big red candles, first bullish candle within 1–2–3 candles → buy, vs. $209 if you waited (bottom $164 = 27% late). **MELI** — first swing low ~$640, break below, reclaim above $640 within ~3 candles on a bullish candle. **MNST** — textbook double dip; waiting for the uptrend cost 37%.)*\r\n\r\n---\r\n\r\n#### G. EXIT RULES\r\n1. **Default: do NOT sell a great company because the chart turned down.** A daily/weekly downtrend in a fundamentally sound company is not a sell signal. Adam abandoned trend-based exits because of **whipsaw** (8–9 out of 10 attempts lose money; you buy back 20–30% higher).\r\n2. **A parabolic 90-degree move is NOT by itself a sell signal.** If the company is still great, still growing, and not badly overvalued → **hold**.\r\n3. **SELL ONLY IF** you have an independent reason:\r\n   - You judge it **significantly overvalued**, or\r\n   - You **need the cash** (personal reasons), or\r\n   - You want the cash to **buy another stock**.\r\n4. **IF you have decided to sell, the OPTIMAL EXIT TIMING is into a PARABOLIC 90-DEGREE MOVE UP**, identified by:\r\n   - Near-vertical advance (vs. the normal 45-degree uptrend)\r\n   - **Extended-range candles** — exceptionally big green candles\r\n   - Price stretched **far above the moving averages** (rubber band / pendulum → snapback to the MA is due)\r\n5. **Accept imperfect timing:** you cannot sell exactly at the top; it may run further after you sell. Better to sell near the top than near the bottom.\r\n6. **Covered calls:** the **best time to sell covered call options is at a parabolic 90-degree move** — and Adam writes them on **defensive and moderately cyclical stocks**, *not* on growth stocks.\r\n7. **Never sell because of bad news, and never buy because of good news.** That is exactly the retail buy-high/sell-low loop.\r\n\r\n---\r\n\r\n#### H. QUICK REFERENCE — INDICATOR SETTINGS\r\n\r\n| Item | Exact setting |\r\n|---|---|\r\n| Platform | **TradingView** (tradingview.com → Products → **Supercharts**); web or desktop app; any charting software acceptable |\r\n| Timeframe 1 | **\"All\"** button → monthly candles → drag back to **~10 years**; enable **log scale** |\r\n| Timeframe 2 | **\"5Y\"** → weekly candles |\r\n| Timeframe 3 | **\"1Y\"** (sometimes 6 months) → daily candles |\r\n| Background | Solid **white**; text black; lines black |\r\n| Candles | Body / borders / wicks: **green (bullish), red (bearish)** |\r\n| Events shown | **Dividends, splits, earnings, latest news** |\r\n| Dividend adjust | **OFF** for single-stock analysis; **ON** when comparing stocks |\r\n| SMA 50 | **Blue**, thick |\r\n| SMA 100 | **Orange**, thick |\r\n| SMA 150 | **Green**, thick |\r\n| SMA 200 | **Red**, thick |\r\n| EMA 20 | **Red**, **thin** |\r\n| EMA 40 | **Blue**, **thin** |\r\n| Default trap | TradingView defaults every MA to **9 period** — always change it in **gear icon → Inputs** |\r\n| MAs on daily | **50/100/150/200 SMA only** — ignore 20/40 EMA |\r\n| MAs on weekly/monthly | **20 and 40 EMA also act as support** |\r\n| Template | Save via **Indicator Templates (four boxes) → Save** as **\"all moving averages\"** |\r\n| Free-plan workaround | **PP Multi MA** (Piranha Profits, Lesson 6 course notes & resources) → **Add to favorites** → Indicators → Favorites. Drawback: cannot hide individual MAs |\r\n| Support/resistance tool | **Horizontal Line** (drawing tools, left panel) |\r\n| Intrinsic value tool | **Horizontal Ray**, styled **green**, **dotted**, labelled \"intrinsic value\" |\r\n| Levels per stock | **4–5 support levels** |\r\n\r\n---\r\n\r\n# Part VI — The 7-Step VMI Formula (Core Methodology)\r\n\r\n## Section 6 — The VMI 7-Step Formula (Lesson 7)\r\n\r\n**Source lessons:** 50 – VMI Formula Part 1 (30:01) · 51 – VMI Formula Part 2 (30:34) · 52 – VMI Formula Part 3 (21:00) · 53 – VMI Formula Part 4 (28:16)\r\n\r\n> This is the core lesson of the course. Everything taught previously — fundamental analysis, financial ratios, technical analysis, stock valuation — is assembled here into a single, ordered checklist.\r\n\r\n---\r\n\r\n### 0. The Master Framework\r\n\r\n#### The rule\r\n\r\n> \"Before you make any investment into a stock, you have to put it through the seven steps. If it passes the seven steps, you invest. If it doesn't pass the seven steps, you don't invest. It's as simple as that.\"\r\n\r\nThe 7 steps are grouped under **three questions**:\r\n\r\n| Question | Steps | What it establishes |\r\n|---|---|---|\r\n| **Q1. Is this a GREAT BUSINESS?** | Steps 1–5 | Quality filter. Pass → goes on the **watch list** (NOT a buy yet). |\r\n| **Q2. Is this a GREAT PRICE?** | Step 6 | Share price must be **below intrinsic value** (margin of safety). |\r\n| **Q3. Is this a GREAT POINT OF ENTRY?** | Step 7 | Chart timing — buy on a wave-down into support, in tranches. |\r\n\r\n#### The funnel (Adam's stated pass rates)\r\n\r\n| Filter | % of all companies in the world that survive |\r\n|---|---|\r\n| After **Step 1 alone** | **less than 5%** (\"just with the first step you eliminate 95% of the companies in the world\") |\r\n| After **Steps 1–5** | **less than 1%** (\"it would eliminate 99% of the businesses in the world, and you only invest in the best of the best\") |\r\n\r\n#### The core logic of the sequence\r\n\r\n- **Step 1** proves the business *has* grown consistently (historical record).\r\n- **Step 2** proves the industry/company *is projected to* keep growing (forward catalysts).\r\n- **Step 3** proves nothing can *stop* it growing — competition is the only thing that can, so it must have a moat. **Adam calls Step 3 \"the most important step of all.\"**\r\n- **Steps 4–5** prove it is profitable/efficient and financially unbreakable.\r\n- **Step 6** ensures you don't overpay: *\"A great business can be a lousy investment if you pay too high a price for the shares. But a great business becomes a great investment if you're buying the shares at less than what it is worth.\"*\r\n- **Step 7** optimises the entry price within the undervalued zone.\r\n\r\n---\r\n\r\n### STEP 1 — Consistent, Predictable Historical Track Record\r\n\r\n#### What it checks\r\nThat the company can grow **sales, profits and cash flow in a predictable, consistent manner**, and is **resilient** — \"rain or shine, pandemic or no pandemic, recession or economic growth.\"\r\n\r\n#### Exact criteria\r\n\r\n- [ ] **Sales revenue** increasing consistently for **at least the last 5 years, better 10 years**\r\n- [ ] **Net income** increasing consistently over the same 5–10 year window\r\n- [ ] **Cash flow from operations (CFO)** increasing consistently over the same 5–10 year window\r\n- [ ] **Gross profit margin** consistent for the last 5 years, or increasing\r\n- [ ] **Net profit margin** consistent for the last 5 years, or increasing\r\n- [ ] Current margins ≈ **at or above the 5-year average** margin\r\n\r\n#### Priority ranking of the three metrics (Adam's own words)\r\n\r\n1. **Sales revenue — most important.** Rising revenue = the company is getting more and more customers, selling more goods and services.\r\n2. **Cash flow from operations — second most important.** The actual cash generated by the business operation.\r\n3. **Net income — also important**, but see the substitution rule below.\r\n\r\n#### Key interpretation rules\r\n\r\n- **\"Consistent\" ≠ up every single year.** *\"There could be years that it drops temporarily, but overall if you take a look at the last five years or 10 years, there must be an uptrend.\"* **One or two years of decline is fine.**\r\n- **Net income substitution rule:** If net income is NOT increasing consistently → **look at operating income instead**, and operating income must be increasing consistently. Rationale: net income can be distorted by items that are not the core business —\r\n  - Non-operating **expenses** excluded from operating income: interest costs, taxation, lawsuits, merger & acquisition costs\r\n  - Non-operating **income** excluded: forex gains, gains on investment income\r\n  - So operating income shows *\"the actual income from the business operations.\"*\r\n- **Recession test:** *\"especially during past recessions, during past crisis, I want to see that the revenue continues to grow and the cash flow continues to increase. This tells me the company is resilient, is predictable and it is consistent.\"*\r\n- **The whole point:** *\"When historical earnings and historical sales and cash flow is consistent, then future sales, earnings and cash flows are more predictable.\"* If the history is choppy, there is no way to project next year or the next five years → avoid.\r\n\r\n#### RED FLAGS / automatic rejections\r\n\r\n- ❌ **Profit margins falling for five straight years** → *\"that's a warning sign to avoid that company.\"*\r\n- ❌ Revenue/profit/cash-flow pattern that goes **up, down, up, down** (cyclical roller-coaster) → unpredictable → avoid.\r\n- ❌ Whole industries Adam avoids for failing Step 1: **oil & gas** (profits depend on oil price), **airlines** (affected by oil prices, tourism, \"too many things\"). *\"They are more for short-term trading, not really for long-term compounding of wealth investing.\"*\r\n\r\n#### EXCEPTIONS to Step 1\r\n\r\n| Business type | Exception |\r\n|---|---|\r\n| **Banks** | Cash flow from operations is naturally inconsistent, sometimes negative. **Look at sales revenue and net income only — ignore CFO.** |\r\n| **Property developers** | Same — very inconsistent CFO, ignore it. |\r\n| **Commodity companies** | Same — very inconsistent CFO, ignore it. |\r\n| **Speculative / early-stage growth companies** | See below. |\r\n\r\n##### Speculative growth company exception (the ~5% carve-out)\r\n\r\n- Definition: fairly new companies where **revenue is growing 50–100%** (double-digit/triple-digit), but they are **not yet profitable**.\r\n- Requirement: **revenue growing consistently**, AND **net income and cash flow from operations must have turned positive** — Adam states the rule two ways in the lesson:\r\n  - overview version: *\"turned positive in at least the last two quarters\"*\r\n  - Palantir case version: *\"I only started to invest when they showed at least their first one quarter of positive cash flow\"* (checked on the **quarterly** view, not the full-year view)\r\n- Additional gate: he only does it *\"if I'm very convinced that they'll be very profitable in the future because they've got a very unique business model and they've got an economic moat that can protect them from potential competition.\"*\r\n- **Position sizing penalty: half of his normal investment allocation.** *\"because they are more risky I don't invest that much — I invest half of my normal investment allocation.\"*\r\n- Frequency: *\"95% of the time I only invest in companies that pass step one, but there will be a 5% of the time where I make an exception.\"*\r\n- Upgrade rule: once the company has **at least 5 years of consistency**, it is upgraded from \"speculative growth\" to a normal investment.\r\n\r\n#### Worked examples\r\n\r\n| Company | Verdict | Numbers / observation |\r\n|---|---|---|\r\n| **Visa (V)** — owned in portfolio | ✅ PASS | Revenue, operating income and net income all growing very consistently 5–10 yrs; operating cash flow rising consistently. **Gross margin 78%, operating margin 67%, net profit margin 49%** — \"very, very strong.\" |\r\n| **Microsoft (MSFT)** — owned in portfolio | ✅ PASS | Sales, net income and operating cash flow all very consistent. **Gross margin 68%, operating margin 46%, net profit margin 39%.** |\r\n| **Johnson & Johnson (JNJ)** | ✅ PASS (illustrative) | Net income \"increasing year after year after year\" over the same period as GM. |\r\n| **General Motors (GM)** | ❌ FAIL | Over a 6-year window: high profits → break-even → profits → more profits → less profits → loss. \"Inconsistent… unpredictable.\" |\r\n| **ExxonMobil (XOM)** | ❌ FAIL | Revenue up/down like a roller coaster; operating and net income choppy including a loss year; operating cash flow up/down. Profit driven by oil price (2016 war → big profits; COVID → big losses). \"Good for speculation, short-term trading, but not for long-term investing.\" |\r\n| **Singapore Airlines** | ❌ FAIL | Revenue cyclical; profits choppy with loss years; net operating cash flow up/down/negative. **Gross profit margin only 16%, net profit margin only 9.6%** — low margins from labour, fuel and maintenance costs. \"Although I fly on Singapore Airlines, I won't invest in the business.\" |\r\n| **Palantir (PLTR)** | ⚠️ Speculative exception | First invested **2022**. At the time revenue growing very strongly, net income still negative, but **cash flow from operations turned positive on the quarterly view in December 2022** — that quarter triggered the buy. Thesis: only company then using AI inside enterprise software (pre-ChatGPT). ~4 years later revenue still growing, profits rising for 4 years — *\"has not yet reached a five-year track record so I still classify it as a speculative growth company.\"* |\r\n| **Meituan (China)** | ⚠️ Speculative exception | Bought ~2 years prior, when profit and cash flow had just turned positive. |\r\n\r\n#### Where to find the data (tools)\r\n\r\n- **StockOracle → Financials → \"Financial Trends\" chart** — visual of revenue / operating income / net income + operating cash flow.\r\n- **StockOracle → Financials → Income Statement** — revenue growth, operating income growth.\r\n- **StockOracle → Statement of Cash Flows** — cash flow from operations growth.\r\n- **StockOracle → Company Metrics** — margin trend chart plus a table of **current vs 5-year average** gross / operating / net margin.\r\n- **Quarterly toggle** on StockOracle financials — required for the speculative-growth check (full-year may still be negative while quarterly has turned positive).\r\n\r\n---\r\n\r\n### STEP 2 — Positive Projected Growth Rate (Growth Catalysts)\r\n\r\n#### What it checks\r\nThat the business *\"is projected to grow in the next 10 to 20 years\"* — a **positive growth rate** — driven by real growth catalysts (being in a growth industry, opening more outlets, creating more products, expanding the addressable customer base).\r\n\r\n#### Exact criteria\r\n\r\n- [ ] Projected earnings growth rate is **positive** → PASS\r\n- [ ] *\"Obviously the higher the growth rate, the better\"* (no numeric minimum is given — positive is the bar)\r\n- [ ] **Ideal (not mandatory):** the company sits inside one of the six high-growth secular trends listed below\r\n\r\n**PASS = positive projected growth. FAIL = zero/negative projected growth.** This is the loosest of the seven gates.\r\n\r\n#### Where to find the projected growth rate (tools)\r\n\r\n1. **StockOracle → Company Metrics → scroll to the bottom → \"Projected Growth\"** — gives the **next 3–5 year** projected earnings growth rate AND a **long-term** growth rate.\r\n2. **finviz.com**\r\n3. **Yahoo Finance**\r\n4. **zacks.com**\r\n\r\n#### Where to find the *reasons* for growth (best sources)\r\n\r\n- The company's **quarterly reports**\r\n- The company's **annual reports**\r\n- The company's **earnings call transcript** — *\"where the entire management team will talk about what are their growth plans in the future… what new products, what new services, what new markets are they growing into.\"*\r\n- **StockOracle → Earnings tab** — download the quarterly press release and open the earnings call transcript.\r\n- **Shortcut: StockOracle → \"AI Insights\" → scroll to Growth Drivers.**\r\n\r\n#### Worked example — Microsoft\r\n\r\n- Projected earnings growth **19.62% for the next 3–5 years**\r\n- Projected earnings growth **8.9% beyond that (long-term)**\r\n- Verdict: positive → **PASS Step 2.** (\"Is that positive? Yes. Is that good? Not bad.\")\r\n- **AI Insights growth drivers listed for MSFT:** AI-driven cloud expansion · enterprise SaaS and Copilot monetization · proprietary AI infrastructure · commercial bookings and contract backlog · global cloud market share gains · Windows 11 adoption and OEM growth.\r\n- Bonus: Microsoft sits inside **two** of the six preferred high-growth industries (AI & robotics; cybersecurity).\r\n\r\n#### The six high-growth industries Adam focuses on\r\n\r\n1. **AI and robotics**\r\n2. **AI energy infrastructure**\r\n3. **Healthcare** — driven by the world's **aging population**\r\n4. **Digital payments** — shift from physical cash to digital (Mastercard, Visa)\r\n5. **Cybersecurity** — more companies using AI and being online → more hacking and cybercrime\r\n6. **The new space economy** — ⚠️ *\"I have not yet invested in it, but it's something I'm watching… because many of the companies involved are not yet profitable.\"* Applications beyond space tourism: **data centers in space, missile defense shield, low-earth-orbit satellite communications.**\r\n\r\n---\r\n\r\n### STEP 3 — Sustainable Competitive Advantage (Economic Moat) ⭐ MOST IMPORTANT\r\n\r\n#### What it checks\r\nThat the company has a **sustainable competitive advantage that protects it from competition**, so competitors cannot easily take away its customers or market share. Warren Buffett's term: an **economic moat**.\r\n\r\n**Why it is the most important step:** Step 1 shows it *has* grown; Step 2 shows the industry *will* grow. *\"But can the business continue to grow its revenue, profits and cash flow in the next 10, 20 years? The only thing that can stop it is competition.\"*\r\n\r\n**The consequence of a moat:** the company keeps its **pricing power** — *\"it's able to raise prices consistently and not lose customers and not lose market share\"* — and therefore generates consistent growth in sales, net income and cash flow for the next 10–20 years, which grows intrinsic value.\r\n\r\nAdam's preference: *\"I like to invest in monopolistic businesses that have got ideally little or no competition.\"*\r\n\r\n#### The three moat grades\r\n\r\n| Grade | Definition | Competitors | Pricing power | Financial signature | Adam's action |\r\n|---|---|---|---|---|---|\r\n| **WIDE** | Very strong, sustainable advantage; *\"we are pretty certain it can't easily be disrupted for the next 20 years.\"* Monopolistic. | None or insignificant | Can raise prices without materially affecting demand | Very high profit margins; consistent increase in sales & profits; predictable long-term outlook | ✅ **70–80% of all stocks he buys** |\r\n| **NARROW** | Some competitive advantage, *\"probably sustainable for the next 10 years. But beyond 10 years, we are not so sure.\"* | Several significant competitors | Limited — raise price too much and customers defect | Average profit margins (\"pretty good, but not super normal\"); increasing sales & profits over next 10 yrs | ✅ Buys some (\"I would still invest in it\") |\r\n| **NO MOAT** | No clear competitive advantage; can be killed by a stronger competitor *\"in the next one or two or three years.\"* | Many competitors selling near-identical / commodity products | None — **price is the ultimate buying decision**; customers just buy the cheapest | Low profit margins; inconsistent sales & profits; unpredictable growth beyond 5 years | ❌ **\"Avoided at all costs.\"** Only usable for short-term speculation, never buy-and-close-your-eyes. |\r\n\r\n⚠️ **Important nuance:** a no-moat stock can still rise in the short term and still grow revenue and be profitable. That is not the point — *\"it can be easily disrupted by bigger competitors.\"*\r\n\r\n#### The FIVE sources of moat\r\n\r\n| # | Moat source | What it means | Examples given |\r\n|---|---|---|---|\r\n| **1** | **Strong brand / brand monopoly** | People are loyal enough to keep buying even if the company raises price and competitors are cheaper. A **brand monopoly** = **top-of-mind recall** — the first name people think of for that product category. | Apple, McDonald's, Coca-Cola, Nike, Microsoft. Brand-monopoly test cases: office software → **Microsoft**; search → **Google** (\"we say *Google this, Google that*, not *Bing this*\"); free online video → **YouTube** (owned by Google); paid online video → **Netflix**; food anywhere/anytime when everything is closed → **McDonald's**; social media → **Meta** (WhatsApp, Instagram, Facebook) |\r\n| **2** | **High customer switching costs** | Once a customer uses the product it becomes very expensive or very inconvenient to switch; normally subscription-based; locks in the customer for years. | **Apple ecosystem/iCloud** (\"Hotel California — you can check out but you can never leave\"; Watch + iPhone + MacBook + iPad + home camera/lighting all synced; a better, cheaper Samsung phone still wouldn't be bought because it can't sync). **Enterprise software:** ServiceNow, Salesforce (embedded into all workflows). **Cybersecurity vendors:** Palo Alto, CrowdStrike, Fortinet (integrated into the entire company; switching is risky and difficult). **Amazon Web Services** (hard to migrate to another cloud). |\r\n| **3** | **Network effect** | The more customers use the product, the better it gets and the more others want to use it — a flywheel. | WhatsApp / Instagram / Facebook (Asia & Europe — \"you're left out of the loop\"); **iMessage** in the US; **WeChat** (Tencent) in China; **Amazon** (sellers and buyers must be there); **Alibaba** and **Pinduoduo** in China; **MercadoLibre** in Latin America; **Google search / Gemini** (more usage → smarter searches → more powerful AI) |\r\n| **4** | **High barriers to entry** | Regulatory restrictions, intellectual property, patents, trademarks. | **Pharmaceutical patents — protected for 20 years** (⚠️ but *\"it doesn't last forever\"*). **Regulatory moats:** Palantir, Lockheed Martin — need very high-level security clearance with the US military/Pentagon, so new competitors can't enter. Airbus. |\r\n| **5** | **Economies of scale** | So big that competing is almost impossible: buy in bulk, run more efficiently, spread fixed costs over a larger base → can temporarily cut price and kill competitors, or keep price and earn far higher margins and out-spend on R&D. | Amazon, Walmart, Costco, Airbus |\r\n\r\n#### 🔑 THE SCORING RULE\r\n\r\n> **\"If a company has got at least THREE out of these FIVE moat sources, then I would want to invest in the company. It tells me the company has a strong moat.\"**\r\n\r\n#### The pricing-power test (the fast qualitative check)\r\n\r\n*\"Can [the company] raise their price every year and not lose market share?\"*\r\n- **Yes** → wide moat.\r\n- **No / must discount** → narrow moat at best.\r\n- Worked example — **Tesla:** cannot raise car prices annually without losing share; facing heavy EV competition from China; *\"not only can they not raise their price, they have to keep cutting their price, they have to keep discounting.\"* → **narrow moat, not wide.**\r\n\r\n#### The 10-year chart shortcut (visual moat proxy)\r\n\r\n- Look at the **long-term chart of the last 10 years**.\r\n- **Clear 10-year uptrend** → *\"usually a sign of a strong economic moat.\"*\r\n- **Generally on a downtrend over the long run** → *\"then it doesn't have a competitive advantage.\"*\r\n- Brand monopolies illustrated this way: Microsoft, Google, Netflix, McDonald's all *\"in the long run, it always goes up.\"*\r\n\r\n#### Tool: StockOracle Pro moat analysis\r\n\r\n- Enter the ticker → a moat grade (Wide / Narrow / None) is displayed immediately.\r\n- Click **\"Oracle IQ\"** → **three perspectives on the moat**:\r\n  1. **Oracle Moat** — assigned by the StockOracle research team based on an algorithm.\r\n  2. **Community Moat** — crowd vote (users vote wide/narrow).\r\n  3. **AI Moat** — AI-generated, scored **out of 10**, with a written explanation and a **breakdown by the five moat sources**, each scored /10.\r\n\r\n##### AI Moat score thresholds (Adam's stated preference)\r\n\r\n- **9/10** = \"a very, very wide moat.\"\r\n- **7, 8 or 9 out of 10** = *\"that gives me more confidence.\"*\r\n- **6/10** → *\"I don't often invest in 6 out of 10. It's not strong enough.\"*\r\n- **2/10** = no moat = *\"the most dangerous.\"*\r\n\r\n#### Worked examples — moat scoring\r\n\r\n**Meta Platforms (META) — WIDE MOAT, AI moat score 9/10**\r\n\r\n| Moat source | Score |\r\n|---|---|\r\n| Brand loyalty & pricing power | 9/10 |\r\n| Barriers to entry | 9/10 |\r\n| Switching costs | 8/10 |\r\n| **Network effect** | **10/10** |\r\n| Economies of scale | 9/10 |\r\n\r\nRationale summarised by the tool: operates the largest global social media and digital advertising ecosystem via Facebook, Instagram, WhatsApp, Messenger and Threads; competes with Alphabet, ByteDance, Amazon and emerging platforms; dominant share of global social media usage and advertising revenue; scale and network effects smaller competitors struggle to match.\r\n**Adam's fun fact:** ~**6 billion people** worldwide have internet access; **3.5 billion** use one of Meta's products ≈ **60% of everyone on the internet.** No competitor (Twitter/X, Snapchat, Reddit) comes close.\r\n\r\n**Zoom Communications (ZM) — NARROW MOAT, AI moat score 6/10 → NOT BOUGHT**\r\n\r\n| Moat source | Score |\r\n|---|---|\r\n| Brand loyalty & pricing power | 6/10 |\r\n| Barriers to entry | 5/10 (*\"bigger competitors can always replicate a similar platform\"*) |\r\n| Switching costs | 6/10 (*\"you can easily switch to another platform\"*) |\r\n| Network effect | 6/10 |\r\n| Economies of scale | 5/10 |\r\n\r\nAdam's reasoning at the time: Zoom was growing well, especially during the pandemic, *\"but I felt that although Zoom was growing, it didn't have a very strong moat. It could easily be disrupted by bigger competitors like Microsoft and Google.\"*\r\n\r\n**Beyond Meat — NO MOAT, AI moat score 2/10 → AVOIDED, subsequently collapsed**\r\nNo pricing power, no brand loyalty, no barriers to entry, no switching costs, no network effect, low economies of scale. *\"No moat is the most dangerous.\"*\r\n\r\n**PayPal — AVOIDED.** *\"Although PayPal was gaining traction, it was getting popular, it was growing, but I felt that the business itself could be easily disrupted and replaced by much stronger competitors. And good thing I didn't buy it, because after going up initially, these shares have collapsed and I still wouldn't buy it.\"*\r\n\r\n#### Reference lists given\r\n\r\n- **Wide moat examples:** Meta Platforms, Amazon, S&P Global, Alphabet (Google), Netflix, Nvidia, Mastercard, Visa, Apple (\"and there are many, many more\").\r\n- **Narrow moat examples:** Cisco Systems, FedEx, Expedia, Dow Chemical, Alcoa, Chevron, Schlumberger, Tesla, ExxonMobil, Royal Dutch Shell.\r\n- **No-moat industries (mostly, not all):** commodity companies, **airlines, auto manufacturers, property developers, construction companies, shipping companies, oil & gas companies.** *\"It's like a bloody red ocean of competition. So I stay away from those industries.\"*\r\n\r\n#### Step 3 summary questions to ask before buying\r\n\r\n1. Does it have a **strong brand / brand monopoly**? (McDonald's, Visa, Mastercard, Microsoft, Google, Coca-Cola, Pepsi)\r\n2. Does it have **high barriers to entry** — regulatory barriers, IP or patents? (Lockheed Martin, Airbus, Palantir)\r\n3. Does it have **huge economies of scale**? (Amazon, Walmart, Airbus)\r\n4. Does it have a **network effect**? (Google, Meta, Apple, Alibaba, Tencent)\r\n5. Does it have **high switching costs**? (Microsoft, Palo Alto, CrowdStrike, Amazon Web Services)\r\n→ **≥3 of 5 = invest.**\r\n\r\n---\r\n\r\n### STEP 4 — Highly Profitable and Operationally Efficient\r\n\r\n#### What it checks\r\nThat the company is genuinely profitable and runs efficiently — and that its profitability is **not being manufactured by leverage**.\r\n\r\n#### The FOUR metrics and exact thresholds\r\n\r\n| # | Metric | Threshold | Notes |\r\n|---|---|---|---|\r\n| **1** | **Return on Equity (ROE)** | **≥ 12% = \"a very profitable business\"**\u003cbr>**> 15% = \"a super exceptional business\"** | Measures how well the company makes money from shareholders' stake in the business |\r\n| **2** | **Return on Invested Capital (ROIC)** | **≥ 12% = a good business**\u003cbr>**≥ 15% = an excellent business** | **Why both?** Companies that finance with a lot of **debt** need less equity, which **inflates ROE artificially** — but heavy debt **drags ROIC down**. Requiring high ROE *and* high ROIC ensures *\"its profitability is not being pushed up by too much debt.\"* |\r\n| **3** | **Sales revenue vs Accounts Receivable** | **Sales revenue must be growing FASTER than accounts receivable** | Working-capital efficiency check |\r\n| **4** | **Cash Conversion Cycle (CCC)** | **Consistent or declining** — must not be increasing too much | *\"how many days it takes for every $1 the company spends… to get the money back. The faster the better.\"* **A NEGATIVE CCC is fantastic** — the company collects cash upfront from customers before it even pays its suppliers. Applies mainly to companies selling **physical goods** (Apple, Nike). |\r\n\r\n#### Trend rules\r\n\r\n- ROE and ROIC **trend charts**: *\"as long as it is consistent or rising, that's a good thing. But if it's consistently declining, then it's something to watch out for.\"*\r\n- Always compare the **current** figure to the **5-year average** — current at or above the 5-yr average is what you want.\r\n\r\n#### ⚠️ ROIC EXCEPTIONS — do NOT apply ROIC to:\r\n\r\n- **Banks**\r\n- **Insurance companies**\r\n- **Regulated utilities**\r\n\r\nReason: these are highly leveraged by nature, or have very high fixed capex requiring debt financing. *\"We just look at ROE, because if you use ROIC, they will all fail.\"*\r\n\r\n#### Worked example — NVIDIA (NVDA)\r\n\r\n| Metric | Value | Verdict |\r\n|---|---|---|\r\n| ROE | **101%** | ✅ Way over 15%, and above the 5-year average |\r\n| ROIC | **93%** | ✅ Way above 15% and above the 5-year average |\r\n| Revenue vs Accounts Receivable | Revenue growing faster than AR | ✅ Pass |\r\n| Cash Conversion Cycle | \"Generally moderately rising, but nothing to be concerned about\" | ✅ Acceptable |\r\n\r\n**Singapore Telecom (SingTel)** — CCC on TradingView is **negative** and mostly sideways over 5 years. *\"Negative cash conversion cycle is a very good thing. That means SingTel collects cash upfront before paying its suppliers. So that is of course the best scenario.\"*\r\n\r\n#### Where to find the data (tools)\r\n\r\n- **StockOracle → Company Metrics → ROE/ROIC trend chart**, then scroll down to **\"Profitability Ratios\"** for the exact figures and 5-year averages. *Works on the FREE basic account.*\r\n- **StockOracle → Financials → scroll down** for revenue growth vs accounts receivable. *Also on the free site.*\r\n- **Morningstar.com → [ticker] → Key Metrics → Profitability and Efficiency** — alternative source, **shows ROE and ROIC for the last 6 years**; works for **foreign (non-US) stocks not covered by StockOracle**.\r\n- **TradingView → Indicators → search \"Cash Conversion Cycle\"** — plot CCC over the last 5 years.\r\n- **TradingView custom script — \"Total Revenue vs Accounts Receivables\"** (labelled **Piranha Profit**): download from the **Whale Investor course resources**, under **Lesson 4 (Fundamental Analysis) → Course Notes and Resources**, then load via TradingView → Indicators. Revenue plots **green**, accounts receivable plots **red**.\r\n\r\n---\r\n\r\n### STEP 5 — Conservative Debt Structure (Strong Balance Sheet)\r\n\r\n#### What it checks\r\nThat the company will not be crippled or bankrupted by debt. *\"If you invest in companies with little or no debt, it can't go bankrupt. You can only go bankrupt with high debt.\"*\r\n\r\n**Why it matters:** companies that can make a lot of money by taking on high debt are risky — *\"if interest rates rise too much, these companies would suddenly pay a lot of interest expense… that would lower their profits and the share price would suffer.\"*\r\n**Bankruptcy examples cited:** **Evergrande** (China property) and **Hyflux** (Singapore). *\"What did all these companies have in common? They had very high debt.\"*\r\n\r\n#### The THREE main ratios and exact thresholds\r\n\r\n| # | Ratio | Threshold | Meaning |\r\n|---|---|---|---|\r\n| **1** | **Current Ratio** | **> 1** | Company has more current assets than current liabilities |\r\n| **2** | **Debt / EBITDA** | **≤ 3** | *\"the company can pay back all their debt in three years using their profits\"* (EBITDA = earnings before interest, taxes, depreciation and amortization) |\r\n| **3** | **Debt Servicing Ratio** | **\u003c 30%** | **Formula: Interest expense ÷ Cash flow from operations × 100%** |\r\n\r\n#### Supplementary ratio\r\n\r\n| Ratio | Threshold |\r\n|---|---|\r\n| **Interest Coverage Ratio** | **> 3 = OK; > 5 = very safe** |\r\n\r\n#### ⚠️ Current-ratio exception\r\n\r\nSome companies **intentionally** run a current ratio **below 1** because they **collect sales upfront** — e.g. **subscription companies like ServiceNow**, or **Apple**. Cash collected before the service is delivered is booked as **deferred revenue**, which sits in **current liabilities**, enlarging the denominator. *\"In cases where the current ratio is less than one, don't be too alarmed, it's because of this reason.\"*\r\n\r\n#### ⚠️ Sector exceptions — these three ratios do NOT apply to banks or REITs\r\n\r\n| Sector | Use instead | Threshold |\r\n|---|---|---|\r\n| **Banks** | **Common Equity Tier 1 (CET1) ratio** | **> 10% = pretty safe** |\r\n| **REITs** | **Gearing ratio = Total debt ÷ Total assets** | **≤ 45% is the minimum requirement; below 40% is the safest** |\r\n\r\n- CET1 location: **StockOracle → [bank ticker] → Overview → scroll to the bottom → \"Financial Strength.\"**\r\n- Gearing ratio location: the REIT's **quarterly and annual report**, or the REIT's own **website → Investor Presentation** (Singapore-listed REITs explicitly disclose \"gearing ratio\").\r\n\r\n#### Worked examples\r\n\r\n**NVIDIA (NVDA) — \"solid balance sheet\"**\r\n\r\n| Ratio | Value | Threshold | Verdict |\r\n|---|---|---|---|\r\n| Current ratio | **3.91** | > 1 | ✅ \"way above 1\" |\r\n| Debt servicing ratio | **0** | \u003c 30% | ✅ \"fantastic\" |\r\n| Debt / EBITDA | **0.06** | ≤ 3 | ✅ |\r\n| Interest coverage | **503** | > 5 | ✅ |\r\n\r\n**Banks — CET1**\r\n\r\n| Bank | CET1 | Verdict |\r\n|---|---|---|\r\n| **JPMorgan (JPM)** | **14.1%** | ✅ \"way above 10%\" |\r\n| **DBS Group Holdings** | **17%** | ✅ *\"Singapore banks are very, very, very conservative and very safe.\"* |\r\n\r\n#### Where to find the data (tools)\r\n\r\n- **StockOracle → Company Metrics → scroll down → \"Debt and Liquidity Ratios\"** — current ratio, debt servicing ratio, debt/EBITDA, each shown **current vs 5-year average**. *Available on the free basic account.*\r\n- **StockOracle → Overview → Financial Strength** — CET1 for banks.\r\n\r\n---\r\n\r\n### ✅ CHECKPOINT — After Steps 1–5\r\n\r\n> *\"If the company passes the first five steps, it's a great business.\"*\r\n> *\"Once it passes the first five steps, does it mean it's a buy? NO — because it may be at the wrong price.\"*\r\n\r\n**Action:** put it on the **WATCH LIST** and be patient. *\"You watch it until the price is right.\"*\r\n\r\n---\r\n\r\n### STEP 6 — Great Price: Buy Below Intrinsic Value (Margin of Safety)\r\n\r\n#### What it checks\r\nThat the **share price is below the intrinsic / fair value** of the business.\r\n\r\n#### The rule\r\n\r\n- [ ] **Share price \u003c intrinsic value** → undervalued → eligible to buy\r\n- [ ] *\"The lower the share price is versus the true value, the greater the margin of safety.\"*\r\n- ❌ **Overvalued great business = a bad investment**: *\"even though it's a great business, it may take you a long time to break even on your investment if the share price happens to drop way below the intrinsic value after you bought it.\"*\r\n\r\n#### Valuation method by business type\r\n\r\n| Business type | Method | Requirement / formula |\r\n|---|---|---|\r\n| **Normal companies (primary method)** | **Discounted Cash Flow (DCF)** | Project how much cash the business generates for the **next 20 years** and discount to present value. **Assumption: cash flow from operations must be increasing consistently.** |\r\n| **Companies with inconsistent CFO but consistent earnings** | **Discounted Net Income method** | Requires **net income increasing consistently for at least the last 5 years** |\r\n| **Both CFO and net income inconsistent** | ❌ **Do not buy** — *\"then it won't pass the first five steps in the first place\"* | For a high-quality business, **at least one of cash flow or earnings must be increasing consistently** |\r\n| **Banks** (JPMorgan, Bank of America, DBS, OCBC) | **Price-to-Book (P/B) method** | **Fair value = 5-year average P/B ratio × current book value per share** |\r\n| **REITs** | **Price-to-NAV method** | **Fair value = average P/NAV ratio over the last 5 or 10 years × current NAV per share.** Buy when price is below fair value. |\r\n| **Speculative / early-stage growth companies** (no consistent profits or cash flow) | **Price-to-Sales (P/S) method**, or **Price-to-Sales-Growth ratio** | (a) **Intrinsic value = 5-year average P/S ratio × current revenue per share**\u003cbr>(b) **P/S-Growth = P/S ratio ÷ projected revenue growth rate** |\r\n\r\n#### Price-to-Sales-Growth ratio thresholds (speculative growth stocks)\r\n\r\n| Value | Verdict |\r\n|---|---|\r\n| **Below 0.2** | **Undervalued** |\r\n| **0.2 – 0.3** | **Fair value** |\r\n| **Above 0.3** | **Overvalued** |\r\n\r\n#### REIT extra requirement\r\n\r\n- When buying a REIT, Adam is buying it **for the dividend yield**. For **Singapore-listed REITs he wants a minimum 5% dividend yield.**\r\n\r\n#### Tools\r\n\r\n- **StockOracle → \"Intrinsic Value\" tab** — computes intrinsic value automatically using several different methods.\r\n- **StockOracle Pro → \"Oracle Value\"** — Adam's preferred output because it **normalizes capex** and **adjusts when recent free cash flow is inconsistent**, giving *\"the most appropriate intrinsic value.\"*\r\n- **Intrinsic value calculators** taught in the previous lesson, for manual calculation.\r\n\r\n#### Worked example — Alphabet / Google\r\n\r\n- **Plain discounted free cash flow method: intrinsic value $190.** ⚠️ Caveat: this method **does not normalize capex** — Google's capex recently spiked and free cash flow dropped a lot, *\"that's why the number is lower.\"*\r\n- **Oracle Value (normalizes capex): $302.**\r\n- Verdict at the time of recording: **Google is selling slightly ABOVE intrinsic value** → not a buy yet.\r\n\r\n*(Note: in the Step 7 chart walkthrough of the same lesson, Alphabet's intrinsic value is quoted as ~\"3,008\" against support levels of 2,833 / 2,670 / 2,479 / 2,261 — the same relationship, undervalued, but on a different quoted scale in the transcript. The relationship taught is what matters: price below intrinsic value.)*\r\n\r\n#### Speculative growth positions Adam has taken under this rule\r\n\r\n- **Palantir** and **Celsius** (the energy drink) — bought with a **small allocation** because *\"the moat is very strong and there's a huge opportunity.\"*\r\n\r\n---\r\n\r\n### STEP 7 — Great Point of Entry: Buy the Wave Down into Support\r\n\r\n#### What it checks\r\nThat you enter at an **optimal chart level**, using support structure and tranching, once Steps 1–6 already pass.\r\n\r\n#### The core principle\r\n\r\n- Great businesses go up over the long run, **but never in a straight line** — price moves in **wave up / wave down** patterns driven by **greed and fear**.\r\n- **THE GOLDEN RULE: \"Never buy during a wave up. Never chase the stock. Wait for the stock to come to you.\"**\r\n- *\"Whenever the price gets too far from the moving average, like a rubber band, it will snap back eventually. So don't get in when it's waving up.\"*\r\n- You cannot catch the exact bottom: *\"As long as we can buy near the bottom, we've done our job. And as long as we don't buy near the top, we're doing the right thing.\"*\r\n\r\n#### The three chart scenarios\r\n\r\n##### Scenario A — Buy the DIP on an UPTREND\r\n\r\n- **Uptrend definition:** **higher highs and higher lows**; the **50 MA is above the 150 MA** and both **sloping up**; **price above the 200 MA**, which is also sloping up.\r\n- **Buy trigger:** wait for the **wave down** to a support level, then add.\r\n- **Valid support levels = any of the moving averages: 50 MA, 100 MA, 150 MA, 200 MA.** *\"Any one of these moving averages are fine, because they act as natural support levels.\"*\r\n- **Every stock has its own character** — some bounce off the 50, some off the 100, some off the 200. Identify which MA *that specific stock* historically respects.\r\n- **Worked example — Apple:** clear uptrend on daily candles (50 MA above 150 MA, both sloping up, 200 MA sloping up). Entries taken on each wave down into a moving average; when it broke the 50 MA and fell to the 200 MA, that was the second tranche.\r\n\r\n##### Scenario B — Buy at the SUPPORT of a CONSOLIDATION (sideways)\r\n\r\n- ⚠️ **\"In a consolidation, the moving averages are USELESS. Ignore the moving averages, they tend to be criss-crossing.\"** MAs only work in a clear uptrend (sloping up = support) or clear downtrend (sloping down = resistance).\r\n- **Instead: draw horizontal support and resistance levels yourself** from the price pattern.\r\n- Every time price drops near the drawn support → add a tranche.\r\n- *\"Whenever it goes into consolidation, eventually it will break out into a new uptrend. So you want to accumulate during this period of consolidation.\"*\r\n- **Worked example — Boeing:** sideways consolidation with clear resistance at **375** and support at **326** (as spoken in the transcript: \"$3.75\" / \"$3.26\"). Buy each time price drops near the support.\r\n- **Worked example — TSM (TSMC):** consolidated sideways for about a year after a strong uptrend. Adam identified the support and **added shares every time price came near ~108**, repeatedly through the year; the stock has since broken out of the consolidation resistance into a new uptrend.\r\n- **Worked example — Amazon:** noted as currently in a sideways consolidation pattern.\r\n\r\n##### Scenario C — Buy the REVERSAL of a DOWNTREND into a new uptrend\r\n\r\n- **Downtrend definition:** **lower highs and lower lows**; **50 MA below the 150 MA** and sloping down; **price below the 200 MA**, sloping down.\r\n- **Standard trigger — wait for confirmed trend change:**\r\n  - **50 MA (blue) crosses above the 150 MA (green)** and both slope up, **OR**\r\n  - **Price goes above the 200 MA (red)** and the 200 MA slopes up, **OR**\r\n  - **Price action alone**: a **higher high AND a higher low** appear.\r\n- **Trade-off:** waiting for confirmation means **you buy higher** than if you had bought during the downtrend. In one example, waiting for the 50/150 cross meant buying around **46** versus a much lower current price.\r\n- **Pre-emptive entry (optional, allowed for fundamentally good businesses):** you may enter **before** the confirmed trend change as soon as you see **higher highs and higher lows in the price action**, *\"especially the moment it crosses above the 50 moving average, the blue line, and the blue line is kind of flattening — that could warrant an entry.\"*\r\n- Justification for entering early: *\"when you're buying good companies they will go up eventually… if you take a one year, three or five year view they will be a lot higher.\"*\r\n\r\n#### Buying INTO a downtrend — the special-circumstances rule\r\n\r\nAdam will add shares while the **daily** timeframe is still in a downtrend **only if BOTH conditions are met**:\r\n\r\n1. [ ] **Price is at the LOW of the downtrend, after a sharp ~90-degree drop.** *\"When I see a sharp drop, usually after a sharp drop it tends to reverse back up. Not always, but pretty high probability.\"*\r\n2. [ ] **Price is at a STRONG SUPPORT on a HIGHER timeframe** — i.e. the **weekly** or **monthly** chart.\r\n\r\n**Worked example — FICO (Fair Isaac):** daily candles clearly in a downtrend (wave up / wave down, lower highs and lows) with a **sharp drop to the low of the downtrend**. Zooming out to **weekly candles** showed a **strong historical support at the 200 MA (red line)** — price had previously plunged into that line and bounced. That combination triggered the buy, and the stock bounced.\r\n\r\n**Worked example — MercadoLibre (MELI):** daily timeframe in a clear downtrend with moving averages sloping down, plus a **sharp drop**. Zooming out to **monthly candles** showed the **40 EMA (blue line)** had **historically been a strong support** — wave up, wave down, hit the blue line and bounce, repeatedly. That gave the confidence to add shares before the bounce.\r\n\r\n#### Multi-timeframe support mapping — use ALL THREE timeframes\r\n\r\n> *\"Which time frame should I look at? The answer is: I look at all three time frames. Because on each time frame, you will see different levels of support.\"*\r\n\r\n**Worked example — Alphabet (GOOGL): building four buy levels**\r\n\r\n| # | Timeframe | Support identified | Level (as quoted) |\r\n|---|---|---|---|\r\n| 1 | **Daily** | **100 MA (orange line)** — recent retracements repeatedly bounced off it | **2833** |\r\n| 2 | **Daily** | **Drawn horizontal support** from two previous swing lows | **2670** |\r\n| 3 | **Weekly** | **50 MA (blue line)** — historically bounced off it | **2479** |\r\n| 4 | **Monthly** | **20 EMA (red dotted line)** — price hits it and bounces during normal corrections | **2261** |\r\n\r\nIntrinsic value quoted as ~**3008** → price is undervalued at all four levels, so all four are valid buy zones.\r\n\r\n- **Support can come from either a moving average OR a level you draw yourself from previous swing-low patterns.**\r\n- *\"This is a bit subjective… it really depends on you identifying what makes sense. It doesn't have to be perfect.\"*\r\n- **How many levels? \"Usually I draw like three or four buy levels and that's enough.\"**\r\n\r\n#### Tranching — the position-building method\r\n\r\n> *\"When investing in a stock, I never buy a full position all at once. I spread out my purchase over three to four tranches.\"*\r\n\r\n- Decide the **full intended allocation** first (e.g. 100 shares this year).\r\n- Divide into **3 or 4 tranches** (e.g. **25 shares per level**, or 33 shares if using thirds).\r\n- **Buy one tranche each time price hits a support level.** If it breaks that level and hits the next one down, buy the next tranche. *\"The lower it goes, the more you buy.\"*\r\n- **STOP when the full allocation is bought.** *\"You buy until you have bought your entire allocation and that's it, leave it, don't add anymore.\"*\r\n- If price hits only level 1 and then runs up, you simply hold a quarter position — *\"don't worry, eventually it will come back down again and then you take your next quarter position.\"*\r\n- Result: *\"You may not pay the exact bottom price, but you get a very good average.\"*\r\n\r\n#### Averaging DOWN vs averaging UP\r\n\r\n| | Definition | Adam's verdict |\r\n|---|---|---|\r\n| **Averaging down** | Buying more and more as price goes lower and breaks more support levels | **Better** — *\"you get to buy more shares at a lower price, your average cost is much lower, you make a lot more money over time.\"* But psychologically hard: *\"they see red, red, red, red, and then they freak out.\"* **Adam's preference.** |\r\n| **Averaging up** | Price hits support 1, you buy, it rallies, comes back to support later, you buy the next quarter at a higher price | **Also fine** *(\"although it's still undervalued, it's still fine\")* — feels better psychologically but you pay more. |\r\n\r\n*\"So you could either average up or average down, depending on how it plays out. To me, I'm fine either way, but I prefer averaging down.\"*\r\n\r\n---\r\n\r\n### Key Takeaways\r\n\r\n1. **The formula is a pass/fail gate, not a scorecard.** All seven steps must pass before you invest. No step can be skipped or traded off against another.\r\n2. **The seven steps answer three questions in order:** (1) Is this a great business? [Steps 1–5] (2) Is this a great price? [Step 6] (3) Is this a great entry? [Step 7].\r\n3. **The formula is brutally exclusionary by design.** Step 1 alone eliminates ~95% of the world's companies; Steps 1–5 together eliminate ~99%. *\"Why settle for anything less than the best?\"*\r\n4. **Predictability is the whole point of Step 1.** Consistent historical revenue, cash flow and profits are what make future revenue, cash flow and profits *projectable* — and everything in valuation depends on being able to project. Cyclical roller-coaster businesses (oil & gas, airlines) are rejected not because they can't make money but because they are unpredictable.\r\n5. **Revenue > cash flow from operations > net income** in importance; and if net income is lumpy, substitute **operating income**, which strips out interest, taxes, lawsuits, M&A costs, forex gains and investment gains.\r\n6. **Step 3 (moat) is the most important step.** Steps 1 and 2 establish that a business has grown and its market is growing; only competition can stop that, so a sustainable moat is what converts past growth into future growth. **≥3 of the 5 moat sources = invest.**\r\n7. **The single fastest moat test is pricing power:** can the company raise prices every year without losing customers or market share? Tesla fails this test (must discount), hence narrow moat, not wide.\r\n8. **Never buy a no-moat company as an investment.** It may be growing and profitable today and can still be killed within 1–3 years by a bigger competitor. Zoom (6/10) was passed on; Beyond Meat (2/10) collapsed; PayPal was passed on and collapsed.\r\n9. **ROE and ROIC must BOTH be high.** High ROE alone can be a debt illusion — leverage shrinks the equity base and inflates ROE while crushing ROIC. Exception: banks, insurers and regulated utilities are judged on ROE only.\r\n10. **Debt is the only thing that makes a company go bankrupt.** *\"If you invest in companies with little or no debt, it can't go bankrupt.\"* Evergrande and Hyflux are the cautionary cases.\r\n11. **Passing Steps 1–5 buys you a watch-list slot, not a trade.** A great business bought at an overvalued price can take years to break even.\r\n12. **Valuation method must match the business type:** DCF for normal companies, Discounted Net Income if cash flow is lumpy, P/B for banks, P/NAV for REITs, P/S or P/S-Growth for speculative growth names.\r\n13. **Never chase a wave up.** Wait for the wave down into support. If price is far from its moving average it snaps back like a rubber band.\r\n14. **Moving averages are useless in a consolidation** — draw your own horizontal support/resistance instead. They only function as support/resistance in a clear trend.\r\n15. **Map supports across daily, weekly AND monthly charts** — each timeframe reveals different support levels. Three or four buy levels is enough.\r\n16. **Always buy in 3–4 tranches, never a full position at once.** This produces a good average cost without requiring you to call the exact bottom, and lets you exploit deeper corrections rather than fear them.\r\n17. **Speculative growth names are a deliberate, sized-down 5% exception** — revenue growing 50–100%, profit/cash flow only just turned positive, strong moat required, and **half the normal position size**. Upgraded to a normal holding only after 5 years of consistency.\r\n\r\n---\r\n\r\n### 📋 THE VMI 7-STEP CHECKLIST (One Page — Apply to Any Stock)\r\n\r\n#### Q1 — IS THIS A GREAT BUSINESS? (Steps 1–5)\r\n\r\n**STEP 1 — Consistent Track Record** *(StockOracle → Financials → Financial Trends; Income Statement; Statement of Cash Flows; Company Metrics)*\r\n- [ ] Sales revenue rising consistently for **5–10 years** (most important metric)\r\n- [ ] Cash flow from operations rising consistently for **5–10 years** (second most important)\r\n- [ ] Net income rising consistently — **OR**, if not, **operating income** rising consistently\r\n- [ ] 1–2 down years acceptable; overall **uptrend** required\r\n- [ ] Revenue and cash flow kept growing **through past recessions/crises** (resilience test)\r\n- [ ] Gross margin **consistent or increasing** over 5 years\r\n- [ ] Net margin **consistent or increasing** over 5 years\r\n- [ ] Current margins **≥ close to the 5-year average**\r\n- [ ] ❌ **REJECT if margins have fallen for 5 straight years**\r\n- [ ] ❌ **REJECT if revenue/profit/cash flow is cyclical up-down-up-down** (oil & gas, airlines, commodities)\r\n- **Exceptions:** Banks / property developers / commodity companies → **ignore cash flow from operations**, use revenue + net income only.\r\n- **Speculative growth exception:** revenue growing **50–100%**, not yet profitable → require **net income and CFO turned positive in the last 1–2 quarters** (quarterly view) + strong moat → buy at **HALF the normal allocation**; upgrade to normal after 5 years of consistency.\r\n\r\n**STEP 2 — Positive Projected Growth Rate** *(StockOracle → Company Metrics → Projected Growth; also finviz.com, Yahoo Finance, zacks.com; StockOracle → Earnings → transcripts; StockOracle → AI Insights → Growth Drivers)*\r\n- [ ] Projected earnings growth rate for the next **3–5 years is POSITIVE** → PASS (higher is better)\r\n- [ ] Long-term projected growth rate is **POSITIVE**\r\n- [ ] Identify the actual **growth catalysts** (new products, new markets, new outlets, more customers) from annual/quarterly reports and earnings-call transcripts\r\n- [ ] ⭐ **Bonus:** the company sits in one of the **6 high-growth industries** — AI & robotics · AI energy infrastructure · healthcare (aging population) · digital payments · cybersecurity · new space economy\r\n\r\n**STEP 3 — Sustainable Competitive Advantage / Economic Moat** ⭐ MOST IMPORTANT *(StockOracle → Oracle IQ → Oracle Moat / Community Moat / AI Moat; plus 10-year price chart)*\r\n- [ ] **≥ 3 of the 5 moat sources present:**\r\n  - [ ] 1. Strong **brand / brand monopoly** (top-of-mind recall)\r\n  - [ ] 2. High **customer switching costs** (expensive/inconvenient to leave; usually subscription)\r\n  - [ ] 3. **Network effect** (more users → better product → more users)\r\n  - [ ] 4. High **barriers to entry** (patents [20 yrs], regulatory, IP, trademarks)\r\n  - [ ] 5. **Economies of scale**\r\n- [ ] **Pricing-power test:** can it raise prices every year without losing customers/market share? *(Yes = wide moat; No/must discount = narrow at best)*\r\n- [ ] Moat grade = **WIDE** (preferred — 70–80% of buys) or **NARROW** (acceptable)\r\n- [ ] ❌ **NEVER BUY A NO-MOAT COMPANY** — many competitors, commodity product, customers buy on price alone\r\n- [ ] **StockOracle AI Moat score ≥ 7/10** (9/10 = very wide; **6/10 = \"not strong enough,\" usually skip**; 2/10 = no moat, most dangerous)\r\n- [ ] **10-year chart shortcut:** clear 10-year uptrend = moat present; 10-year downtrend = no competitive advantage\r\n- [ ] ❌ Avoid the structurally no-moat industries: commodities, airlines, auto manufacturers, property developers, construction, shipping, oil & gas\r\n\r\n**STEP 4 — Profitable and Operationally Efficient** *(StockOracle → Company Metrics → Profitability Ratios [free]; Morningstar → Key Metrics → Profitability & Efficiency; TradingView → CCC indicator + \"Total Revenue vs Accounts Receivables\" Piranha Profit script)*\r\n- [ ] **ROE ≥ 12%** (very profitable) — **> 15% = super exceptional**\r\n- [ ] **ROIC ≥ 12%** (good) — **≥ 15% = excellent**\r\n- [ ] ROE/ROIC trend **consistent or rising**, and **current ≥ 5-year average** (consistently declining = warning)\r\n- [ ] **Sales revenue growing FASTER than accounts receivable**\r\n- [ ] **Cash conversion cycle consistent or declining** (not sharply rising); **negative CCC = fantastic**\r\n- **Exception:** **banks, insurance companies, regulated utilities → use ROE only, skip ROIC** (they would all fail it)\r\n\r\n**STEP 5 — Conservative Debt Structure** *(StockOracle → Company Metrics → Debt & Liquidity Ratios [free]; StockOracle → Overview → Financial Strength for CET1)*\r\n- [ ] **Current ratio > 1** *(exception: upfront-collecting subscription models — ServiceNow, Apple — where deferred revenue inflates current liabilities; \u003c1 is OK there)*\r\n- [ ] **Debt / EBITDA ≤ 3** (all debt repayable from profits within 3 years)\r\n- [ ] **Debt servicing ratio \u003c 30%** = interest expense ÷ cash flow from operations × 100%\r\n- [ ] **Interest coverage ratio > 3 (OK) / > 5 (very safe)**\r\n- **Exceptions:** **Banks → CET1 ratio > 10%.** **REITs → gearing ratio (total debt ÷ total assets) ≤ 45%, ideally \u003c 40%.**\r\n\r\n> ✅ **Passed Steps 1–5?** → It's a great business → **ADD TO WATCH LIST. DO NOT BUY YET.**\r\n\r\n---\r\n\r\n#### Q2 — IS THIS A GREAT PRICE? (Step 6)\r\n\r\n**STEP 6 — Undervalued vs Intrinsic Value** *(StockOracle → Intrinsic Value tab; StockOracle Pro → Oracle Value [normalizes capex]; manual intrinsic value calculators)*\r\n- [ ] **Share price \u003c intrinsic value** → the bigger the gap, the bigger the margin of safety\r\n- [ ] Use the **right method for the business type**:\r\n  - [ ] **Normal company → DCF** (project 20 years of cash, discount to present value). *Requires consistently rising CFO.*\r\n  - [ ] **CFO inconsistent, earnings consistent → Discounted Net Income.* Requires net income rising consistently for ≥5 years.*\r\n  - [ ] **Both inconsistent → DO NOT BUY** (it should already have failed Step 1)\r\n  - [ ] **Bank → 5-year average P/B × current book value per share**\r\n  - [ ] **REIT → 5- or 10-year average P/NAV × current NAV per share**; plus **≥5% dividend yield** for Singapore-listed REITs\r\n  - [ ] **Speculative growth → 5-year average P/S × current revenue per share**, or **P/S ÷ projected revenue growth: \u003c0.2 undervalued · 0.2–0.3 fair · >0.3 overvalued**\r\n- [ ] ❌ **Do not buy a great business at an overvalued price** — break-even can take years\r\n\r\n---\r\n\r\n#### Q3 — IS THIS A GREAT POINT OF ENTRY? (Step 7)\r\n\r\n**STEP 7 — Buy the Wave Down into Support, in Tranches** *(TradingView charts — daily, weekly, monthly)*\r\n- [ ] ❌ **NEVER buy during a wave up. Never chase.** Wait for the stock to come to you.\r\n- [ ] Identify which scenario the stock is in and use the matching trigger:\r\n  - [ ] **A. Dip on an uptrend** — uptrend = higher highs & higher lows, 50 MA > 150 MA both sloping up, price above rising 200 MA. **Buy on the wave down into the 50 / 100 / 150 / 200 MA** (whichever MA that specific stock historically respects).\r\n  - [ ] **B. Support of a consolidation** — **ignore moving averages, they are useless sideways.** Draw horizontal support/resistance from the pattern and **buy each time price returns to support.**\r\n  - [ ] **C. Reversal of a downtrend** — buy when **50 MA crosses above 150 MA** and both slope up, **OR** price rises above a rising **200 MA**, **OR** price action makes a **higher high AND higher low**. *(Pre-emptive entry allowed once higher highs/lows appear and price crosses a flattening 50 MA.)*\r\n- [ ] **Buying into a still-falling downtrend is allowed ONLY IF BOTH:** (1) price is at the **low of the downtrend after a sharp ~90-degree drop**, AND (2) price is at a **strong support on the weekly or monthly chart**\r\n- [ ] **Map supports on ALL THREE timeframes — daily, weekly, monthly.** Support = a moving average **or** a line you draw from previous swing lows.\r\n- [ ] **Set 3–4 buy levels** (that's enough)\r\n- [ ] **Buy in 3–4 tranches** — e.g. planned 100 shares → **25 shares at each level**; the lower it goes, the more you buy; **stop once the full allocation is filled**\r\n- [ ] Accept **averaging down** (preferred: lower average cost) **or averaging up** (also fine while still undervalued)\r\n- [ ] Goal is **near the bottom, not the exact bottom** — and above all, **not near the top**\r\n\r\n---\r\n\r\n*Related follow-on lessons: 54 – VMI Case Study (GOOGL); 55/56 – VMI Case Study (MSFT); 57/58 – VMI Case Study (AMZN). Adam also notes that subscribers to the **UIP (Ultimate Investors Playbook)** receive a monthly deep-dive applying the seven steps to two great companies.*\r\n\r\n---\r\n\r\n# Part VII — Worked Case Studies: GOOGL, MSFT, AMZN\r\n\r\n## 07 — VMI Case Studies (Full Worked Applications of the 7-Step Formula)\r\n\r\nSource lessons:\r\n- Lesson 54 — VMI Case Study (GOOGL) — 37:54\r\n- Lesson 55 — VMI Case Study Part 1 (MSFT) — 23:24\r\n- Lesson 56 — VMI Case Study Part 2 (MSFT) — 33:16\r\n- Lesson 57 — VMI Case Study Part 1 (AMZN) — 21:34\r\n- Lesson 58 — VMI Case Study Part 2 (AMZN) — 24:46\r\n\r\n> **Vintage warning.** The three case studies were recorded at different times with different toolsets. The GOOGL study is the newest (StockOracle-era, AI Insights / Oracle IQ, revenue base ~$402B, post-Trump-trade-war chart). The MSFT and AMZN studies are older (Yahoo Finance / GuruFocus / Morningstar / FinViz / Zacks / Simply Wall St era; MSFT priced as of **15 January 2022**). Numbers are quoted exactly as spoken in each lesson and are not reconciled across lessons.\r\n\r\n---\r\n\r\n### The 7-Step Framework Being Applied\r\n\r\nEvery case study runs the same checklist. Steps 1–5 answer *\"is it a great business?\"*; step 6 answers *\"is it at a great price?\"*; step 7 answers *\"is this a great point of entr
